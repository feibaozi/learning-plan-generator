<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>%PAGE_TITLE%</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
%TEMPLATE_CSS%
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Noto Sans SC',-apple-system,sans-serif;background:var(--bg-base);color:var(--text-primary);line-height:1.7;overflow-x:hidden}
body.loading{opacity:0}body.loaded{opacity:1;transition:opacity 0.4s ease}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg-base)}::-webkit-scrollbar-thumb{background:var(--border-glow);border-radius:3px}

.sidebar{position:fixed;left:0;top:0;height:100vh;width:260px;background:var(--bg-card);border-right:1px solid var(--border-subtle);padding:20px 16px;overflow-y:auto;z-index:100}
.sidebar h3{font-size:.82rem;font-weight:700;color:var(--text-secondary);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border-subtle)}
.sidebar-back{display:block;padding:8px 12px;margin-bottom:12px;border-radius:var(--radius-sm);background:var(--bg-elevated);color:var(--accent-color);text-decoration:none;font-size:.78rem;font-weight:600;transition:all var(--transition)}
.sidebar-back:hover{color:var(--accent-cyan)}
.sidebar-nav{list-style:none;padding:0}
.sidebar-nav li{margin-bottom:2px}
.sidebar-nav a{display:block;padding:8px 12px;border-radius:var(--radius-sm);text-decoration:none;font-size:.75rem;color:var(--text-secondary);transition:all var(--transition);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-nav a:hover{background:rgba(var(--accent-color-rgb),.08);color:var(--accent-cyan)}
.sidebar-nav a.active{background:rgba(var(--accent-color-rgb),.12);color:var(--accent-color);font-weight:600}

.integration-navbar{display:flex;align-items:center;gap:12px;padding:10px 24px;background:var(--bg-card);border-bottom:1px solid var(--border-subtle);font-size:.82rem;position:sticky;top:0;z-index:50;backdrop-filter:blur(12px)}
.integration-navbar a{color:var(--accent-color);text-decoration:none;font-weight:600}
.integration-navbar a:hover{color:var(--accent-cyan)}

.content-area{margin-left:280px;padding:32px 28px;max-width:calc(100% - 300px)}
@media(max-width:1024px){.sidebar{display:none}.content-area{margin-left:0;max-width:100%}}

.theme-toggle{position:fixed;right:20px;top:20px;z-index:200;background:var(--bg-card);border:1px solid var(--border-subtle);padding:10px;border-radius:50%;cursor:pointer;color:var(--text-muted);transition:all var(--transition);font-size:1rem}
.theme-toggle:hover{border-color:var(--border-glow);color:var(--accent-cyan)}

.meta-card{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:20px 24px;margin-bottom:24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;position:relative;overflow:hidden}
.meta-card::before{content:'';position:absolute;top:-50%;right:-20%;width:80%;height:200%;background:radial-gradient(ellipse at center,var(--accent-color) 0%,transparent 60%);opacity:.06}
.meta-card>*{position:relative;z-index:1}
.meta-title{font-size:1.4rem;font-weight:800;color:var(--accent-color)}
.meta-tags{display:flex;gap:8px;flex-wrap:wrap}
.meta-tag{padding:4px 14px;border-radius:50px;font-size:.72rem;font-weight:600}
.meta-tag.domain{background:rgba(var(--accent-color-rgb),.1);color:var(--accent-color);border:1px solid rgba(var(--accent-color-rgb),.2)}
.meta-tag.level{background:rgba(var(--accent-color-rgb),.06);color:var(--accent-gold);border:1px solid rgba(var(--accent-color-rgb),.15)}
.meta-stats{display:flex;gap:20px;margin-left:auto}
.meta-stat{text-align:center}
.meta-stat .num{font-size:1.3rem;font-weight:700;color:var(--accent-cyan)}
.meta-stat .lbl{font-size:.68rem;color:var(--text-muted)}

.module{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:32px;margin-bottom:24px;transition:all var(--transition-smooth)}
.module:hover{border-color:var(--border-glow)}
.module-header{margin-bottom:20px}
.module-tag{display:inline-block;padding:4px 12px;border-radius:50px;font-size:.68rem;font-weight:700;margin-bottom:8px;background:rgba(var(--accent-color-rgb),.1);color:var(--accent-color)}
.module-title{font-size:1.25rem;font-weight:800;margin-bottom:6px}
.module-hook{font-size:.9rem;color:var(--accent-cyan);font-weight:500;margin-bottom:14px;padding-left:12px;border-left:3px solid var(--accent-purple)}
.module-content{font-size:.9rem;color:var(--text-secondary);line-height:1.8}
.module-content p{margin-bottom:14px}
.module-content ul,.module-content ol{margin:14px 0;padding-left:24px}
.module-content li{margin-bottom:8px}
.module-content strong{color:var(--text-primary);font-weight:600}
.module-content h3{font-size:1.05rem;color:var(--accent-color);margin:22px 0 10px}
.module-content pre{background:var(--bg-elevated);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:14px 18px;overflow-x:auto;margin:14px 0;font-size:.8rem;font-family:var(--font-mono);color:var(--accent-cyan);line-height:1.6}

.formula-box{background:var(--bg-elevated);border:1px solid var(--border-glow);border-radius:var(--radius-md);padding:18px;margin:18px 0;overflow-x:auto}
.formula-caption{font-size:.75rem;color:var(--text-muted);margin-bottom:8px;text-align:center}
.formula-content{font-size:.95rem;text-align:center;color:var(--accent-color)}
.formula-derivation{margin-top:10px;padding-top:10px;border-top:1px solid var(--border-subtle);font-size:.8rem;color:var(--text-secondary)}
.derivation-toggle{font-size:.72rem;color:var(--accent-gold);cursor:pointer;background:none;border:none;font-family:inherit;margin-top:6px}
.derivation-toggle:hover{text-decoration:underline}

.chart-wrap{background:rgba(var(--accent-color-rgb),.03);border-radius:var(--radius-sm);padding:8px;margin:16px 0;text-align:center}
.chart-wrap svg{max-width:100%}
.ch-cap{font-size:.72rem;color:var(--text-muted);margin-top:6px}
.data-table{width:100%;border-collapse:collapse;margin:14px 0;font-size:.82rem}
.data-table th{text-align:left;padding:10px 14px;background:rgba(var(--accent-color-rgb),.08);color:var(--accent-cyan);font-weight:700;border-bottom:2px solid var(--border-glow)}
.data-table td{padding:10px 14px;border-bottom:1px solid var(--border-subtle);color:var(--text-secondary)}
.data-table tr:hover td{background:rgba(var(--accent-color-rgb),.03)}

.key-takeaway{background:linear-gradient(135deg,rgba(var(--accent-color-rgb),.08),rgba(var(--accent-color-rgb),.02));border-left:4px solid var(--accent-gold);padding:14px 18px;border-radius:0 var(--radius-md) var(--radius-md) 0;margin-top:18px}
.key-takeaway strong{color:var(--accent-gold);font-weight:700}
.key-takeaway p{color:var(--text-secondary);font-size:.85rem;margin:0}

.ref-list{list-style:none;padding:0;margin-top:8px;font-size:.78rem}
.ref-list li{padding:4px 0;color:var(--text-muted)}
.ref-list li::before{content:'📄 '}

.back-btn{position:fixed;right:20px;bottom:20px;z-index:200}
.back-btn button{background:linear-gradient(135deg,var(--accent-color),var(--accent-purple));color:white;border:none;border-radius:24px;padding:12px 24px;font-size:.85rem;font-weight:600;cursor:pointer;box-shadow:0 4px 12px rgba(var(--accent-color-rgb),.3);transition:all var(--transition)}
.back-btn button:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(var(--accent-color-rgb),.4)}

@media(max-width:768px){
.content-area{padding:20px 16px}.module{padding:20px}.module-title{font-size:1.1rem}
.meta-card{flex-direction:column;align-items:flex-start}.meta-stats{margin-left:0}
.back-btn{right:12px;bottom:12px}.back-btn button{padding:10px 16px;font-size:.8rem}
}
</style>
</head>
<body class="loading dark">

<!-- CONDITIONAL: HAS_CONTEXT_PLAN -->
<div class="integration-navbar">
  <a href="#" onclick="goBack();return false;">← 返回 %PLAN_NAME%</a>
  <span style="color:var(--text-muted)">|</span>
  <span style="color:var(--text-secondary)">%PHASE_NAME% · %POSITION%</span>
</div>
<!-- /CONDITIONAL -->

<button class="theme-toggle" onclick="toggleTheme()" title="切换主题 (Ctrl+D)">🌓</button>

<div class="sidebar" id="sidebar">
  <!-- CONDITIONAL: HAS_CONTEXT_PLAN -->
  <a href="#" onclick="goBack();return false;" class="sidebar-back">← 返回主方案</a>
  <!-- /CONDITIONAL -->
  <h3>📖 目录导航</h3>
  <ul class="sidebar-nav" id="sidebarNav"></ul>
</div>

<div class="content-area">
  <div class="meta-card">
    <div>
      <div class="meta-title">%HERO_TITLE%</div>
      <div class="meta-tags">
        %HERO_TAGS_HTML%
      </div>
    </div>
    <div class="meta-stats">
      %META_STATS_HTML%
    </div>
  </div>

  %MODULES_HTML%
</div>

<div class="back-btn"><button onclick="goBack()">← 返回学习方案</button></div>

<script>
var MODULE_IDS = %MODULE_IDS_JSON%;
var SEARCH_INDEX = %SEARCH_INDEX_JSON%;
var TOAST_TIMEOUT;

(function(){
  var sidebarNav=document.getElementById('sidebarNav');
  var mods=document.querySelectorAll('.module');
  var linksHTML='';
  mods.forEach(function(m){
    var h2=m.querySelector('.module-title');
    var title=h2?h2.textContent:m.id;
    linksHTML+='<li><a href="#'+m.id+'">'+title+'</a></li>';
  });
  sidebarNav.innerHTML=linksHTML;

  var links=sidebarNav.querySelectorAll('a');
  var obs=new IntersectionObserver(function(e){e.forEach(function(x){if(x.isIntersecting){
    links.forEach(function(a){a.classList.remove('active')});
    var act=sidebarNav.querySelector('a[href="#'+x.target.id+'"]');if(act)act.classList.add('active');
  }})},{threshold:.3});
  mods.forEach(function(m){obs.observe(m)});

  document.querySelectorAll('.derivation-toggle').forEach(function(btn){
    btn.addEventListener('click',function(){
      var content=this.nextElementSibling;
      if(content&&content.classList.contains('formula-derivation')){
        content.style.display=content.style.display==='block'?'none':'block';
        this.textContent=content.style.display==='block'?'▾ 收起推导':'▸ 展开推导';
      }
    });
  });
})();

function toggleTheme(){
  var b=document.body,isD=b.classList.contains('light');
  if(isD){b.classList.remove('light')}else{b.classList.add('light')}
  try{localStorage.setItem('slm-theme',isD?'dark':'light')}catch(e){}
}

function goBack(){
  var w=window.open('%PLAN_FILE%#kc-%KP_ID%','plan_main');if(w)w.focus();
}

(function(){
  document.body.classList.remove('loading');document.body.classList.add('loaded');
  var t;try{t=localStorage.getItem('slm-theme')}catch(e){}
  if(t==='light')document.body.classList.add('light');
})();
</script>
</body>
</html>
