<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>%PAGE_TITLE%</title>
<style>
%TEMPLATE_CSS%
</style>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body data-theme="dark">

<div class="progress-bar" id="progressBar" style="width:0%"></div>

<nav class="navbar">
  <div class="nav-left">📖 %NAV_TITLE%</div>
  <div class="nav-right">
    <button onclick="toggleTheme()" title="切换主题 (Ctrl+D)">🌓 主题</button>
    <button onclick="openSearch()" title="搜索 (Ctrl+K)">🔍 搜索</button>
  </div>
</nav>

<div class="sidebar">
  <a href="#" class="sidebar-back-link" onclick="event.preventDefault();var w=window.open('%PLAN_FILE%#kc-%KP_ID%','plan_main');if(w)w.focus()">← 返回主方案</a>
  <h3>📖 目录导航</h3>
  <ul class="sidebar-nav">
    %SIDEBAR_NAV_HTML%
  </ul>
</div>

<div class="content-area">
<div class="search-overlay" id="searchOverlay">
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="搜索模块内容..." oninput="doSearch()" onkeydown="if(event.key==='Escape')closeSearch()">
    <div class="search-results" id="searchResults"></div>
  </div>
</div>

<div class="container">
  <div class="hero">
    <h1>%HERO_TITLE%</h1>
    <div class="tags">
      %HERO_TAGS_HTML%
    </div>
  </div>

  <div class="meta-card">
    %META_STATS_HTML%
  </div>

  <!-- CONDITIONAL: HAS_CONTEXT_PLAN -->
  <div class="journey-bar" id="journeyBar">
    <div class="journey-path">
      <span class="journey-icon">📍</span>
      <span class="journey-plan" onclick="var w=window.open('%PLAN_FILE%#kc-%KP_ID%','plan_main');if(w)w.focus()">%PLAN_NAME%</span>
      <span class="journey-sep">〉</span>
      <span class="journey-phase">%PHASE_NAME%</span>
      <span class="journey-sep">〉</span>
      <span class="journey-kp">%KP_NAME%</span>
      <span class="journey-pos">(%POSITION%)</span>
    </div>
    <div class="journey-nav">
      <span class="journey-prev" title="前置: %PREREQUISITES%">← 前置</span>
      <span class="journey-divider">|</span>
      <span class="journey-next" title="后续: %NEXT_KPS%">后续 →</span>
    </div>
  </div>
  <!-- /CONDITIONAL -->

  %MODULES_HTML%
</div>

<!-- CONDITIONAL: HAS_CONTEXT_PLAN -->
<footer class="journey-footer">
  <a href="#" class="back-to-plan" onclick="event.preventDefault();var w=window.open('%PLAN_FILE%#kc-%KP_ID%','plan_main');if(w)w.focus()">🔗 返回学习路线: %PLAN_NAME% → %PHASE_NAME%</a>
  <p style="margin-top:12px;font-size:.72rem;color:var(--text-muted)">
    本资料是 <strong>%PLAN_NAME%</strong> %PHASE_NAME% 阶段的深度研读材料
  </p>
</footer>
<!-- /CONDITIONAL -->

<!-- CONDITIONAL: HAS_CONTEXT_PLAN -->
<div class="deep-floating-back">
  <button onmouseover="this.style.transform='translateY(-2px)';this.style.boxShadow='0 6px 16px rgba(0,0,0,.2)'"
    onmouseout="this.style.transform='translateY(0)';this.style.boxShadow='0 4px 12px rgba(0,0,0,.15)'"
    onclick="event.preventDefault();var w=window.open('%PLAN_FILE%#kc-%KP_ID%','plan_main');if(w)w.focus()">
    ← 返回学习方案
  </button>
</div>
<!-- /CONDITIONAL -->
</div>

<div class="dd-toast" id="toastEl"><span id="toastMsg"></span></div>

<script>
var MODULE_IDS = %MODULE_IDS_JSON%;
var SEARCH_INDEX = %SEARCH_INDEX_JSON%;
var TOAST_TIMEOUT;

(function(){
var progressBar=document.getElementById('progressBar');
var modules=document.querySelectorAll('.module');

var observer=new IntersectionObserver(function(entries){entries.forEach(function(e){if(e.isIntersecting)e.target.classList.add('visible')})},{threshold:.15});
modules.forEach(function(m){observer.observe(m)});

var navLinks=document.querySelectorAll('.sidebar-nav a');
var navObserver=new IntersectionObserver(function(entries){
entries.forEach(function(e){
if(e.isIntersecting){
navLinks.forEach(function(a){a.classList.remove('active')});
var act=document.querySelector('.sidebar-nav a[href="#'+e.target.id+'"]');
if(act)act.classList.add('active');
}
})},{threshold:.3});
modules.forEach(function(m){navObserver.observe(m)});

window.addEventListener('scroll',function(){
var st=document.documentElement.scrollTop,dh=document.documentElement.scrollHeight-window.innerHeight;
var pct=dh>0?Math.min(100,(st/dh)*100):0;progressBar.style.width=pct+'%';
});

window.addEventListener('keydown',function(e){
if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();openSearch()}
if((e.ctrlKey||e.metaKey)&&e.key==='d'){e.preventDefault();toggleTheme()}
if(e.key==='Escape')closeSearch()
});
})();

function toggleTheme(){
var b=document.body,isD=b.getAttribute('data-theme')==='dark';
b.setAttribute('data-theme',isD?'light':'dark');
try{localStorage.setItem('slm-theme',isD?'light':'dark')}catch(e){}
showToast('已切换至'+(isD?'浅色':'深色')+'主题')
}

function openSearch(){document.getElementById('searchOverlay').classList.add('open');setTimeout(function(){document.getElementById('searchInput').focus()},100)}
function closeSearch(){document.getElementById('searchOverlay').classList.remove('open');document.getElementById('searchResults').innerHTML=''}

function doSearch(){
var q=document.getElementById('searchInput').value.toLowerCase(),res=document.getElementById('searchResults');
if(q.length<2){res.innerHTML='';return}
var h='';SEARCH_INDEX.forEach(function(item){
if(item.t.toLowerCase().indexOf(q)>=0||(item.c||'').toLowerCase().indexOf(q)>=0){
h+='<div onclick="closeSearch();document.getElementById(\''+item.id+'\').scrollIntoView({behavior:\'smooth\'})">'+
'<strong>'+item.t+'</strong><br><small style="color:var(--text-muted)">'+(item.c||'').substring(0,80)+'</small></div>';
}
});
res.innerHTML=h||'<div style="padding:12px;color:var(--text-muted)">未找到匹配模块</div>'
}

function showToast(msg){
var el=document.getElementById('toastEl'),mg=document.getElementById('toastMsg');
if(!el||!mg)return;mg.textContent=msg;el.style.display='block';el.classList.add('toast-in');
if(TOAST_TIMEOUT)clearTimeout(TOAST_TIMEOUT);
TOAST_TIMEOUT=setTimeout(function(){el.style.display='none'},3000);
}

(function(){
var t;try{t=localStorage.getItem('slm-theme')}catch(e){}
if(t==='light')document.body.setAttribute('data-theme','light');
})();

(function(){
document.querySelectorAll('.derivation-toggle').forEach(function(btn){
btn.addEventListener('click',function(){
var content=this.nextElementSibling;
if(content){content.classList.toggle('open');this.textContent=content.classList.contains('open')?'▾ 收起推导':'▸ 展开推导'}
});
});
})();

/* ===== ECharts 初始化模板 ===== */
(function initCharts(){
if(typeof echarts==='undefined')return;
var charts=[];
function makeChart(elId,option){
var el=document.getElementById(elId);
if(!el)return null;
var chart=echarts.init(el);
chart.setOption(option);
return chart;
}
%ECHARTS_INIT_CODE%
window.addEventListener('resize',function(){charts.forEach(function(c){c.resize()})});
})();
</script>
</body>
</html>
