const PAGE_DATA = {
  topic: "矩阵代数速览",
  domain: "finance",
  domain_name: "金融与经济",
  level: "intermediate",
  level_name: "进阶 · 理解",
  reading_time: "23",
  module_count: "21",
  texture: "G1",
  texture_name: "公式推导驱动型",
  depth: "理解",
  breadth: "标准",
  modules: [
    {
      module_id: "background",
      module_title: "背景与缘起",
      module_tag: "核心概念",
      hook: "为什么计量经济学用矩阵而不是标量？一个简单的答案：当你需要同时处理100个观测值、10个解释变量和1个方程——矩阵是唯一不被记法复杂度压垮的工具。",
      content: "矩阵代数在计量经济学中扮演着'语言'的角色——它不是可有可无的数学装饰，而是使得大规模推导和计算成为可能的**核心工具**。\n\n在早期的计量经济学中，研究者用求和符号(Σ)来表示OLS：`β̂ = Σxᵢyᵢ / Σxᵢ²`。这对于单变量回归完全足够。但当回归包含10个解释变量和50,000个观测值时，标量记法下的每一个公式都会变成'指数级的混乱'。\n\n矩阵记法的历史转变发生在1960-1970年代。随着计算机使得大型矩阵运算成为可能（LINPACK/EISPACK数值库），矩阵代数全面接管了计量教材的编写方式。今天，几乎所有计量方法论——OLS推导、IV-2SLS、GMM、面板固定效应、MLE——都是以**矩阵形式**表达的。\n\n在计量中，矩阵不仅仅是一个数学压缩工具——它将**几何直觉**（投影、正交分解）带入推断的核心。理解`P = X(X'X)⁻¹X'`是'投影矩阵'的人，比只知道β̂=(X'X)⁻¹X'Y的人能多看出5层含义。",
      key_takeaway: "矩阵=计量的通用语言。从Σ到矩阵的转变不仅简化了记法，更将几何直觉注入了推断核心。"
    },
    {
      module_id: "concept",
      module_title: "核心概念：向量、矩阵与基本运算",
      module_tag: "核心概念",
      hook: "矩阵不过是一个'数字表格'——但加上乘法运算规则后，它变成了能够同时进行数百次运算的超级计算引擎。",
      content: "**矩阵的定义**：一个`n×k`的矩阵是一个包含`n`行和`k`列的矩形数组。在计量中，`n`通常是观测值数量（行），`k`是参数数量（列）。\n\n**关键运算规则**：\n\n**转置 (Transpose)**：`A'`将A的行变列、列变行。核心性质：`(AB)' = B'A'`（顺序反转）、`(A')' = A`。\n\n**矩阵乘法**：`(n×k)×(k×m) → (n×m)`。`Cᵢⱼ = Σₖ Aᵢₖ·Bₖⱼ`。在OLS中，`(X'X)⁻¹X'Y` = (k×n)(n×k)→(k×k)求逆→(k×n)(n×1)→(k×1)点估计向量。\n\n**逆矩阵 (Inverse)**：方阵A的逆A⁻¹满足`AA⁻¹ = A⁻¹A = I`。只有满秩方阵可逆（所有列/行线性独立）。OLS要求X'X可逆——当某些X变量完美线性相关（多重共线性），X'X奇异→逆不存在→OLS公式崩溃。\n\n**矩阵的迹 (Trace)**：tr(A) = Σᵢ Aᵢᵢ（对角线元素之和）。性质：`tr(AB) = tr(BA)`在循环下不变。计量中tr(·)出现在多个关键公式中：RSS = e'e = tr(ee')、估计量的MSE、投影矩阵维度。\n\n**矩阵的秩 (Rank)**：rank(A) = 线性独立的行/列数。X的秩必须等于k（参数数量）→满列秩条件→'没有完全多重共线性'。",
      formulas: [
        { latex: "$$(AB)' = B'A'$$", caption: "积的转置=转置的逆序积——这个性质在OLS推导中反复使用" },
        { latex: "$$\\text{rank}(X) = k \\quad \\Leftrightarrow \\quad X'X \\text{ 可逆}$$", caption: "满列秩条件：X'X可逆的等价条件是X的所有列线性独立" }
      ],
      key_takeaway: "转置(′)、乘法(×)、逆(⁻¹)、迹(tr)、秩(rank)——五大矩阵核心运算，OLS推导中每步都用到。"
    },
    {
      module_id: "principle",
      module_title: "核心原理：OLS的矩阵推导——从数据到参数",
      module_tag: "核心概念",
      hook: "下面这个10字符的公式`β̂=(X'X)⁻¹X'Y`浓缩了OLS的全部计算逻辑——但真正理解这条公式需要看懂背后的矩阵几何。",
      content: "**OLS在矩阵形式下的完整推导**：\n\n模型：`Y = Xβ + ε`，其中`Y`为(n×1)，`X`为(n×k)，`β`为(k×1)，`ε`为(n×1)。\n\n**第1步：最小化残差平方和**\n`RSS(β) = e'e = (Y - Xβ)'(Y - Xβ) = Y'Y - 2Y'Xβ + β'X'Xβ`\n\n**第2步：对β求导设为零**\n`∂RSS/∂β = -2X'Y + 2X'Xβ = 0`\n→ `X'Xβ = X'Y`（正规方程/Normal Equations）\n\n**第3步：解正规方程**\n如果X'X可逆：`β̂ = (X'X)⁻¹X'Y`\n\n**关键中间结果的含义**：\n- `X'Y` = X的每一列与Y的协方差向量（k×1）\n- `X'X` = 解释变量之间的叉积矩阵（k×k）——其逆衡量了'信息含量'\n- `(X'X)⁻¹` = 参数估计的精度矩阵\n\n**残差制造者矩阵（Residual Maker）**：\n`M = I - X(X'X)⁻¹X'` → `M`是(n×n)矩阵，满足`MX = 0`和`MY = ê`。这是一个**投影矩阵**：它将任何向量投影到X的列空间的**正交补**上。残差`ê = MY`——这解释了为什么ê与X的每一列都正交（即`X'ê = 0`）。\n\n**投影矩阵**：`P = X(X'X)⁻¹X'` → 将任何向量投影到X的列空间。`Ŷ = PY`（拟合值）。`P + M = I`。",
      formulas: [
        { latex: "$$\\frac{\\partial (\\beta'X'X\\beta)}{\\partial \\beta} = 2X'X\\beta$$", caption: "二次型的向量导数——OLS推导中的关键一步", expandable: true, derivation: "对于二次型β'Aβ，若A对称，则∂(β'Aβ)/∂β = 2Aβ。在OLS中，∂(β'X'Xβ)/∂β = 2X'Xβ（因为X'X对称）。而线性项Y'Xβ的导数为(Y'X)' = X'Y。合并得：∂RSS/∂β = -2X'Y + 2X'Xβ = 0 ⇒ X'Xβ̂ = X'Y。这是OLS正规方程的矩阵推导——没有矩阵，这个推导将需要写满2-3页的求和符号展开。" }
      ],
      key_takeaway: "β̂=(X'X)⁻¹X'Y，P=X(X'X)⁻¹X'（投影），M=I-P（残差制造者）——三条矩阵公式概括OLS的全部几何与代数性质。"
    },
    {
      module_id: "development",
      module_title: "发展迭代：矩阵计算从手算到GPU",
      module_tag: "发展演进",
      hook: "1940年代：求一个10×10矩阵的逆需要几天；2025年：一个GPU可以在1秒内求10000×10000的矩阵逆。",
      content: "**手算时代（1950年前）**：\n- 高斯消元法是唯一的工具——n³/3次运算\n- 10×10矩阵已近人类极限（一个求逆需约半天）\n- 计量模型被限制在5-10个参数以内\n\n**FORTRAN与LINPACK时代（1960-1980）**：\n- LINPACK提供了标准化的矩阵运算子程序（SGEFA求逆、SGESL解方程）\n- 大型机可以在几分钟内求100×100矩阵的逆\n- **Householder变换**和**Givens旋转**提供了数值更稳定的正交化方法（替代Gram-Schmidt）\n\n**LAPACK与MATLAB时代（1990-2010）**：\n- LAPACK（1992）继承了LINPACK并优化了缓存使用\n- MATLAB的`\\`反除运算符使用快速QR分解解方程（非显式求逆）——**数值稳定性远超直接求逆**\n- 矩阵的`cond(X'X)`成为日常诊断工具——条件数高→求逆数值不稳定\n\n**GPU与分布式矩阵时代（2015-至今）**：\n- **cuBLAS**和**MAGMA**将矩阵乘法/MSVD/Cholesky分解移到了GPU\n- Google TPU专门为矩阵运算（深度学习框架中的Tensor运算）做硬件优化\n- **随机化算法（Randomized SVD）**：用随机投影将大矩阵压缩到低秩近似——100,000×100,000的矩阵分解在几分钟内可能",
      charts: [
        { echarts_option: {
          xAxis: {type: 'category', data: ['1950','1970','1990','2010','2025']}, yAxis: {type: 'log', name: '可处理矩阵大小(n)'},
          series: [{type: 'line', smooth: true, data: [10,100,1000,10000,100000], areaStyle: {color: {type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(99,102,241,0.3)'},{offset:1,color:'rgba(99,102,241,0)'}]}}}]
        }, caption: "图：矩阵计算能力的历史性爆炸增长（对数尺度）", data_source: "基于TOP500超级计算机计算能力与算法效率综合估计" }
      ],
      key_takeaway: "从手算到GPU：矩阵计算能力50年间膨胀了10,000倍——使得现代计量的大规模矩阵运算成为可能。"
