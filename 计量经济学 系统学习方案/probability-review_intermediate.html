      content: "现代概率论建立在**Kolmogorov (1933)**的公理化体系之上。三个核心组件：\n\n**1. 样本空间 (Sample Space Ω)**：所有可能结果的集合。掷一枚硬币：Ω = {正面, 反面}；掷骰子：Ω = {1,2,3,4,5,6}。\n\n**2. 事件域 (σ-代数 ℱ)**：我们关心的事件的集合。注意：集合的取反、可数并集也必须在ℱ中。例如：'掷出偶数' = {2,4,6} ⊆ ℱ。\n\n**3. 概率测度 (Probability Measure P)**：将每个事件映射到[0,1]的函数，满足P(Ω)=1和可数可加性。\n\n**随机变量 (Random Variable)** 是连接概率空间与数值世界的桥梁：它是一个从样本空间到实数的函数`X: Ω → ℝ`。每个人虽然都有一个真实的'universe outcome'，但我们只能观测X的值。对于计量经济学来说，关键概念是：\n\n- **累积分布函数 (CDF)**：`F(x) = P(X ≤ x)`，完整描述了随机变量的分布\n- **概率密度函数 (PDF)**：对于连续变量，`f(x) = dF(x)/dx`\n- **概率质量函数 (PMF)**：对于离散变量，`p(x) = P(X = x)`",

      content: "**1. 金融：资产定价**\nBlack-Scholes-Merton期权定价**本质上是在风险中性概率测度下计算折现的期望收益**。CAPM（资本资产定价模型）将资产的预期收益表达为：`E[Rᵢ] = R_f + βᵢ·(E[R_m] - R_f)`——这是一个纯期望运算的单方程模型。\n\n**2. 保险：精算风险池**\n保险的本质是大数定律的应用：当风险池样本n足够大，理赔总额的方差/均值→0——这使得保险公司可以通过聚集大量独立保单来'消除'个别保单的理赔不确定性。\n\n**3. 信贷：违约概率PD**\n巴塞尔III协议要求银行用**内部评级法（IRB）**估计每个借款人的1年期违约概率（PD），方法是Logistic回归——`P(default|X) = 1/(1 + exp(-Xβ))`——然后用PD计算资本占用。\n\n**4. 政策：随机模拟**\n财政政策的'乘数效应'估计严重依赖计量模型中的随机项：扰动项'εs'的大小直接影响了'政策变动1单位→GDP变动多少'的置信区间宽度——被高估的政策效果可能导致灾难性的预算错误。",
      key_takeaway: "BS定价='概率之美'、保险='LLN之美'、信贷='条件概率之美'、政策='随机模拟之美'——四个领域的核心决策都以概率运算为基础。"
    }
  ]

// ============ RUNTIME ENGINE ============
function applyTheme(theme){document.documentElement.setAttribute('data-theme',theme);localStorage.setItem('slm-theme',theme);var t=document.getElementById('theme-toggle');t.textContent=theme==='dark'?'☀️':'🌓';if(typeof activeCharts!=='undefined'&&activeCharts){Object.values(activeCharts).forEach(function(c){c.resize()})}}
function toggleTheme(){var cur=document.documentElement.getAttribute('data-theme')||'light';applyTheme(cur==='dark'?'light':'dark')}
var savedTheme=localStorage.getItem('slm-theme')||'dark';applyTheme(savedTheme);

window.addEventListener('scroll',function(){var st=window.scrollY;var dh=document.documentElement.scrollHeight-window.innerHeight;var p=dh>0?(st/dh)*100:0;document.getElementById('progress-bar').style.width=p+'%'});

var activeCharts={};
var sidebarLinks=[];

function buildSidebar(){var c=document.getElementById('sidebar-links');PAGE_DATA.modules.forEach(function(m){var a=document.createElement('a');a.href='#'+m.module_id;a.className='sidebar-link';a.textContent=m.module_title||m.module_id;a.addEventListener('click',function(e){e.preventDefault();document.getElementById(m.module_id).scrollIntoView({behavior:'smooth'});if(window.innerWidth<=768)document.getElementById('sidebar').classList.remove('open')});c.appendChild(a);sidebarLinks.push({el:a,id:m.module_id})})}
var observer=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){sidebarLinks.forEach(function(l){l.el.classList.toggle('active',l.id===e.target.id)})}})},{rootMargin:'-80px 0px -60% 0px'});

function buildMetaCard(){var md=PAGE_DATA;document.getElementById('meta-card-container').innerHTML='<div class="meta-card"><div class="meta-item" style="font-size:12px;color:var(--text-tertiary);width:100%;margin-bottom:-16px;">🔗 📚 计量经济学 系统学习方案 · 计量基础与统计准备（1/5）</div><div class="meta-item"><span class="icon">📖</span><strong>'+md.topic+'</strong></div><div class="meta-item"><span class="meta-badge domain-finance">'+md.domain_name+'</span></div><div class="meta-item"><span class="meta-badge level-intermediate">'+md.level_name+'</span></div><div class="meta-item"><span class="icon">⏱️</span>约'+md.reading_time+'分钟阅读</div><div class="meta-item"><span class="icon">📦</span>'+md.module_count+'个模块</div></div>'}

function renderFormulas(ct){if(typeof renderMathInElement!=='undefined'){renderMathInElement(ct,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})}}

function renderChart(mId,cc,i){var cid='chart_'+mId+'_'+i;var w=document.getElementById(cid);if(!w)return;if(typeof echarts==='undefined'){w.innerHTML='<div style="text-align:center;padding:20px;color:var(--text-tertiary)">📊 图表(需要网络加载CDN)</div>';return}try{var ch=echarts.init(w);var opt=cc.echarts_option||{};ch.setOption(opt);activeCharts[cid]=ch;new ResizeObserver(function(){ch.resize()}).observe(w)}catch(e){w.textContent='图表渲染失败'}}

function getTagClass(tag){var m={'核心概念':'tag-core','前置知识':'tag-core','核心工具':'tag-tools','发展演进':'tag-evolution','实践应用':'tag-application','风险与挑战':'tag-risk','前沿探索':'tag-frontier'};return m[tag]||'tag-core'}
function parseMD(c){if(!c)return'';var h=c;h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');h=h.replace(/\*(.+?)\*/g,'<em>$1</em>');h=h.replace(/`([^`]+)`/g,'<code style="background:var(--bg-tertiary);padding:2px 6px;border-radius:4px;font-size:13px;">$1</code>');h=h.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');h=h.replace(/^### (.+)$/gm,'<h3 style="font-size:17px;font-weight:600;margin:20px 0 8px;">$1</h3>');h=h.replace(/^## (.+)$/gm,'<h3 style="font-size:18px;font-weight:600;margin:24px 0 10px;">$1</h3>');h=h.replace(/\n\n/g,'</p><p>');h='<p>'+h+'</p>';h=h.replace(/<p>\s*<\/p>/g,'');return h}

function buildModuleHTML(mod){var tg=getTagClass(mod.module_tag||'');var isExp=mod.formulas&&mod.formulas.some(function(f){return f.expandable});var h='<section class="module-section" id="'+mod.module_id+'"><div class="module-header"><span class="module-tag '+tg+'">'+(mod.module_tag||'')+'</span><h2 class="module-title">'+(mod.module_title||mod.module_id)+'</h2></div>';
if(mod.hook)h+='<div class="module-hook">'+mod.hook+'</div>';
h+='<div class="module-content">'+parseMD(mod.content||'')+'</div>';
if(mod.formulas&&mod.formulas.length>0){mod.formulas.forEach(function(f,fi){var hasD=f.expandable&&f.derivation;h+='<div class="formula-block'+(hasD?'':' not-expandable')+'" onclick="'+(hasD?'toggleDerivation(this)':'')+'"><div>'+f.latex+'</div>';if(f.caption)h+='<div class="formula-caption">'+f.caption+'</div>';if(hasD){h+='<div class="formula-expand-hint">💡 点击展开推导过程</div><div class="formula-derivation">'+f.derivation+'</div>'}h+='</div>'})}
if(mod.charts&&mod.charts.length>0){mod.charts.forEach(function(cc,ci){var cid='chart_'+mod.module_id+'_'+ci;h+='<div class="chart-container"><div class="chart-wrapper" id="'+cid+'"></div>';if(cc.caption)h+='<div class="chart-caption">'+cc.caption+'</div>';if(cc.data_source)h+='<div class="chart-source">'+cc.data_source+'</div>';h+='</div>'})}
if(mod.tables&&mod.tables.length>0){mod.tables.forEach(function(tb){h+='<div style="overflow-x:auto"><table class="module-table"><thead><tr>'+(tb.headers||[]).map(function(th){return'<th>'+th+'</th>'}).join('')+'</tr></thead><tbody>'+(tb.rows||[]).map(function(r){return'<tr>'+r.map(function(c){return'<td>'+c+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table>';if(tb.caption)h+='<div class="table-caption">'+tb.caption+'</div>';if(tb.data_source)h+='<div class="chart-source">'+tb.data_source+'</div>';h+='</div>'})}
if(mod.references&&mod.references.length>0){h+='<div class="module-references"><h4>📚 参考文献</h4><ol>';mod.references.forEach(function(ref){var lk='';if(ref.doi)lk+=' <a href="https://doi.org/'+ref.doi+'" target="_blank">DOI</a>';if(ref.url)lk+=' <a href="'+ref.url+'" target="_blank">链接</a>';h+='<li>'+(ref.authors||'')+' ('+(ref.year||'')+'). <strong>'+(ref.title||'')+'</strong>.'+lk+'</li>'});h+='</ol></div>'}
if(mod.key_takeaway)h+='<div class="key-takeaway">💡 '+mod.key_takeaway+'</div>';
h+='</section>';return h}

function toggleDerivation(el){el.classList.toggle('expanded')}

function initPage(){
  document.body.classList.remove('loading');document.body.classList.add('loaded');
  buildMetaCard();buildSidebar();
  var mc=document.getElementById('modules-container');
  PAGE_DATA.modules.forEach(function(m){mc.innerHTML+=buildModuleHTML(m)});
  var ses=mc.querySelectorAll('.module-section');ses.forEach(function(s){observer.observe(s)});
  renderFormulas(mc);
  setTimeout(function(){PAGE_DATA.modules.forEach(function(m){if(m.charts){m.charts.forEach(function(cc,ci){renderChart(m.module_id,cc,ci)})}})},100);
  var fo=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)e.target.classList.add('visible')})},{threshold:0.08});
  ses.forEach(function(s){fo.observe(s)})
}

document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='d'){e.preventDefault();toggleTheme()}});

(function bg(){
  var cv=document.getElementById('bg-canvas');var ctx=cv.getContext('2d');var pts=[];
  function rs(){cv.width=window.innerWidth;cv.height=window.innerHeight}window.addEventListener('resize',rs);rs();
  var n=Math.min(40,Math.floor((cv.width*cv.height)/30000));
  for(var i=0;i<n;i++)pts.push({x:Math.random()*cv.width,y:Math.random()*cv.height,vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,r:Math.random()*1.2+0.3,a:Math.random()*0.3+0.05});
  function an(){ctx.clearRect(0,0,cv.width,cv.height);var c='129,140,248';
    pts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=cv.width;if(p.x>cv.width)p.x=0;if(p.y<0)p.y=cv.height;if(p.y>cv.height)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fillStyle='rgba('+c+','+p.a+')';ctx.fill()});
    requestAnimationFrame(an)}an()
})();

document.addEventListener('DOMContentLoaded',initPage);
</script>
