const PAGE_DATA = {
  topic: "统计推断核心概念",
  domain: "finance",
  domain_name: "金融与经济",
  level: "intermediate",
  level_name: "进阶 · 理解",
  reading_time: "26",
  module_count: "21",
  texture: "G1",
  texture_name: "公式推导驱动型",
  depth: "理解",
  breadth: "标准",
  modules: [
    {
      module_id: "background",
      module_title: "背景与缘起",
      module_tag: "核心概念",
      hook: "19世纪末，一位啤酒厂的统计学家（William Gosset）用小样本实验数据推导出了t分布——这个故事完美诠释了统计推断的核心矛盾：如何从有限的样本中窥见无限总体的真相？",
      content: "统计推断（Statistical Inference）的正式诞生可追溯到20世纪初期三位统计学巨人的贡献：**R.A. Fisher**（极大似然估计、方差分析、实验设计）、**Jerzy Neyman**与**Egon Pearson**（假设检验的Neyman-Pearson框架）和**William Gosset**（t分布，以'Student'的化名发表）。\n\nFisher在1922年的里程碑论文'On the Mathematical Foundations of Theoretical Statistics'中首次系统提出了**三个核心统计问题**：估计（Estimation）、推断（Inference）和预测（Prediction）。他定义的'统计量'——'从样本中计算、不含未知参数的函数'——至今仍然是所有计量分析的操作单元。\n\nNeyman和Pearson在1930年代发展了一套完整的**假设检验框架**：定义两类错误（第I类=拒绝真假设，第II类=接受假假设），在控制第I类错误概率的前提下最大化检验力度。这一框架的直接继承者就是计量经济学中无处不在的**t检验和F检验**。\n\n在计量经济学中，**Haavelmo (1944)**将Neyman-Pearson的统计推断框架完整引入经济学——他提出了一个划时代的命题：经济数据应被视为从一个联合概率分布中抽取的样本，因此所有的计量推断都必须以统计推断的严格逻辑（而非'目测数据'的直觉）为基础进行。",
      key_takeaway: "Fisher（估计理论）+ Neyman-Pearson（假设检验）+ Haavelmo（经济学引入）= 计量推断的三大思想支柱。"
    },
    {
      module_id: "concept",
      module_title: "核心概念：估计、推断与预测的三角框架",
      module_tag: "核心概念",
      hook: "统计推断只有三个核心问题——但每个问题都有一整套复杂的方法体系，外加大约50种容易犯的错误。",
      content: "**1. 点估计 (Point Estimation)** — 用样本构造一个'最佳猜测'：\n给定来自总体`f(x|θ)`的样本`X₁,...,Xₙ`，构造统计量`T(X₁,...,Xₙ)`作为θ的估计。OLS中`β̂ = (X'X)⁻¹X'Y`就是一个点估计。评价标准：**无偏性**（`E[T]=θ`）、**一致性**（`plim(T)=θ`）、**有效性**（方差最小）、**均方误差MSE** = `Var(T) + [Bias(T)]²`。\n\n**2. 区间估计 (Interval Estimation)** — 给出参数的一个'可能范围'：\n构造`[L, U]`使得`P(L ≤ θ ≤ U) ≥ 1-α`。在计量中输出`β̂ ± 1.96 × SE`给出了95%置信区间。须注意频率学派解释：不是'θ有95%概率在区间内'，而是'重复构造这样的区间，95%会覆盖θ'——细微但关键的区别。\n\n**3. 假设检验 (Hypothesis Testing)** — 用数据判断一个关于参数的陈述是否成立：\n设定`H₀: θ = θ₀` vs `H₁: θ ≠ θ₀`。构造检验统计量（如t统计量），若其在H₀为真的假设下落入极端区域（概率<α），则拒绝H₀。计量中最常见的检验：\n- 单参数：t检验\n- 多参数联合：F检验\n- 非线性：Wald检验、LR（似然比）检验、LM（拉格朗日乘子）检验",
      formulas: [
        { latex: "$$\\text{MSE}(T) = \\mathbb{E}[(T-\\theta)^2] = \\text{Var}(T) + [\\text{Bias}(T)]^2$$", caption: "均方误差 = 方差 + 偏误²——点估计质量的核心度量", expandable: true,
          derivation: "展开：E[(T-θ)²] = E[(T-E[T]+E[T]-θ)²] = E[(T-E[T])²] + E[(E[T]-θ)²] + 2E[(T-E[T])(E[T]-θ)]。由于E[T-E[T]]=0，交叉项消失，得Var(T)+[Bias(T)]²。这个分解揭示了偏误-方差权衡的本质：有时接受一个小偏误可以大幅降低方差，从而降低MSE——Ridge回归就是利用这个原理。"
        }
      ],
      references: [{ title: "On the Mathematical Foundations of Theoretical Statistics", authors: "Fisher, R.A.", year: 1922, doi: "10.1098/rsta.1922.0009" }],
      key_takeaway: "点估计(最佳猜测)→区间估计(可能范围)→假设检验(参数判断)：构成了统计推断的完整三角框架。"
    },
    {
      module_id: "principle",
      module_title: "核心原理：假设检验的双重逻辑框架",
      module_tag: "核心概念",
      hook: "Neyman-Pearson框架说'我们先决定要控制第I类错误还是第II类错误'；Fisher框架说'让数据自己说话'——两个框架至今共存且各自被误解。",
      content: "**Fisher的显著性检验框架**：\n1. 设立零假设`H₀`（如'β₁=0，教育对工资无影响'）\n2. 选择检验统计量并计算其在样本中的值\n3. 计算**p值**：在H₀为真的假设下，观察到比当前样本更极端的检验统计量的概率\n4. p值越小=数据与H₀越不一致\n5. **没有预先设定的α**：Fisher认为p值是连续的证据强度度量——'p=0.049≠显著，p=0.051≠不显著'\n\n**Neyman-Pearson (N-P) 决策框架**：\n1. 在收集数据**之前**设定两个假设`H₀`和`H₁`\n2. 设定显著性水平α（通常0.05）——这是'容忍的第I类错误概率上限'\n3. 选择检验使得在α约束下最大化检验力度（power）= `P(reject H₀ | H₁ is true)`\n4. 根据检验统计量是否落入拒绝域做出'接受H₀'或'拒绝H₀'的二选一**决策**\n5. N-P的α是长期操作特性：'如果重复使用这个决策规则100次，最多容忍5次错误拒绝'\n\n**两框架在计量中的融合**：现代计量实证几乎都是两者的混合体——报告p值（Fisher风格）但以p<0.05为门槛做二选一结论（N-P风格）。但注意：Fisher本人强烈反对这种机械化的p值门槛使用，ASA 2016声明也明确警告了'p<0.05阈值崇拜'的危害。",
      tables: [
        { headers: ["维度", "Fisher显著性检验", "Neyman-Pearson决策论", "现代计量实践"], rows: [
          ["目标", "衡量证据强度", "做出明确决策", "两者都做"],
          ["α的角色", "无预设α", "事前设定(0.05)", "事后以0.05为门槛"],
          ["p值解释", "连续证据强度", "不报告p值(仅报告拒绝/不拒绝)", "报告p值+以0.05判断"],
          ["检验力度", "不关注", "核心优化目标", "经常被忽略(应报告)"],
          ["哲学立场", "归纳逻辑", "行为决策论", "实用主义"]
        ], caption: "表：Fisher vs Neyman-Pearson 两个推断框架的系统对比" }
      ],
      references: [{ title: "The ASA Statement on p-Values: Context, Process, and Purpose", authors: "Wasserstein, R.L. & Lazar, N.A.", year: 2016, doi: "10.1080/00031305.2016.1154108" }],
      key_takeaway: "Fisher的p值是连续证据度量；N-P的α是决策门槛。现代计量混用两者，但要注意p<0.05的机械使用被严肃警告。"
    },
    {
      module_id: "development",
      module_title: "发展迭代：从经典到稳健到高维",

function buildModuleHTML(mod){var tg=getTagClass(mod.module_tag||'');var h='<section class="module-section" id="'+mod.module_id+'"><div class="module-header"><span class="module-tag '+tg+'">'+(mod.module_tag||'')+'</span><h2 class="module-title">'+(mod.module_title||mod.module_id)+'</h2></div>';if(mod.hook)h+='<div class="module-hook">'+mod.hook+'</div>';h+='<div class="module-content">'+parseMD(mod.content||'')+'</div>';if(mod.formulas&&mod.formulas.length>0){mod.formulas.forEach(function(f){var hasD=f.expandable&&f.derivation;h+='<div class="formula-block'+(hasD?'':' not-expandable')+'" onclick="'+(hasD?'toggleDerivation(this)':'')+'"><div>'+f.latex+'</div>';if(f.caption)h+='<div class="formula-caption">'+f.caption+'</div>';if(hasD){h+='<div class="formula-expand-hint">💡 点击展开推导过程</div><div class="formula-derivation">'+f.derivation+'</div>'}h+='</div>'})}if(mod.charts&&mod.charts.length>0){mod.charts.forEach(function(cc,ci){var cid='chart_'+mod.module_id+'_'+ci;h+='<div class="chart-container"><div class="chart-wrapper" id="'+cid+'"></div>';if(cc.caption)h+='<div class="chart-caption">'+cc.caption+'</div>';if(cc.data_source)h+='<div class="chart-source">'+cc.data_source+'</div>';h+='</div>'})}if(mod.tables&&mod.tables.length>0){mod.tables.forEach(function(tb){h+='<div style="overflow-x:auto"><table class="module-table"><thead><tr>'+(tb.headers||[]).map(function(th){return'<th>'+th+'</th>'}).join('')+'</tr></thead><tbody>'+(tb.rows||[]).map(function(r){return'<tr>'+r.map(function(c){return'<td>'+c+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table>';if(tb.caption)h+='<div class="table-caption">'+tb.caption+'</div>';if(tb.data_source)h+='<div class="chart-source">'+tb.data_source+'</div>';h+='</div>'})}if(mod.references&&mod.references.length>0){h+='<div class="module-references"><h4>📚 参考文献</h4><ol>';mod.references.forEach(function(ref){var lk='';if(ref.doi)lk+=' <a href="https://doi.org/'+ref.doi+'" target="_blank">DOI</a>';if(ref.url)lk+=' <a href="'+ref.url+'" target="_blank">链接</a>';h+='<li>'+(ref.authors||'')+' ('+(ref.year||'')+'). <strong>'+(ref.title||'')+'</strong>.'+lk+'</li>'});h+='</ol></div>'}if(mod.key_takeaway)h+='<div class="key-takeaway">💡 '+mod.key_takeaway+'</div>';h+='</section>';return h}
function toggleDerivation(el){el.classList.toggle('expanded')}
function initPage(){
  document.body.classList.remove('loading');document.body.classList.add('loaded');
  buildMetaCard();buildSidebar();
  var mc=document.getElementById('modules-container');
  PAGE_DATA.modules.forEach(function(m){mc.innerHTML+=buildModuleHTML(m)});
  var ses=mc.querySelectorAll('.module-section');ses.forEach(function(s){observer.observe(s)});
  renderFormulas(mc);
  setTimeout(function(){PAGE_DATA.modules.forEach(function(m){if(m.charts){m.charts.forEach(function(cc,ci){renderChart(m.module_id,cc,ci)})}})},100);
  var fo=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)e.target.classList.add('visible')})},{threshold:0.08});
  ses.forEach(function(s){fo.observe(s)})
}
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='d'){e.preventDefault();toggleTheme()}});
(function bg(){var cv=document.getElementById('bg-canvas');var ctx=cv.getContext('2d');var pts=[];function rs(){cv.width=window.innerWidth;cv.height=window.innerHeight}window.addEventListener('resize',rs);rs();var n=Math.min(40,Math.floor((cv.width*cv.height)/30000));for(var i=0;i<n;i++)pts.push({x:Math.random()*cv.width,y:Math.random()*cv.height,vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,r:Math.random()*1.2+0.3,a:Math.random()*0.3+0.05});function an(){ctx.clearRect(0,0,cv.width,cv.height);var c='129,140,248';pts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=cv.width;if(p.x>cv.width)p.x=0;if(p.y<0)p.y=cv.height;if(p.y>cv.height)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fillStyle='rgba('+c+','+p.a+')';ctx.fill()});requestAnimationFrame(an)}an()})();
document.addEventListener('DOMContentLoaded',initPage);
</script>
