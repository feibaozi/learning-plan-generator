const PAGE_DATA = {
  topic: "从数据到模型：回归思想入门",
  domain: "finance",
  domain_name: "金融与经济",
  level: "intermediate",
  level_name: "进阶 · 理解",
  reading_time: "24",
  module_count: "21",
  texture: "G1",
  texture_name: "公式推导驱动型",
  depth: "理解",
  breadth: "标准",
  modules: [
    {
      module_id: "background",
      module_title: "背景与缘起",
      module_tag: "核心概念",
      hook: "1885年，Francis Galton在研究豌豆种子大小时，注意到一个奇特的模式：极大粒种子的后代往往变小，极小粒种子的后代往往变大——他将这一现象命名为'向均值回归（Regression to the Mean）'，'回归'一词由此诞生。",
      content: "**回归（Regression）**这个词的起源比OLS技术早了整整一代。**Francis Galton**在1885年观察到：高个子父亲的儿子平均身高虽高于总平均，但**低于**父亲身高——这被称为'向平均水平回归'（regression toward mediocrity）。Galton的同事**Karl Pearson**随后为这一现象建立了数学基础，推导出了相关系数`r`和'回归线'的方程式。\n\n现代计量经济学意义上的回归分析——用最小化残差平方和来估计一条穿过数据的最佳直线——是由**Adrien-Marie Legendre (1805)**和**Carl Friedrich Gauss (1809)**独立提出和发展的。Gauss进一步证明了：如果在所有线性无偏估计量中寻找方差最小的那一个，OLS就是答案（Gauss-Markov定理）。\n\n在经济学中，**Ragnar Frisch**和**Jan Tinbergen**（首届诺贝尔经济学奖得主）在1930年代首次将回归分析系统应用于经济数据——Frisch创立了'计量经济学会'(1930)，Tinbergen建立了第一个宏观经济计量模型（1936, 荷兰经济）——d估出国与出口之间的关系参数的所有估计方法都是回归的延伸。",
      key_takeaway: "Galton的'回归'（向均值回归）+ Legendre/Gauss的OLS（最小化误差平方和）+ Frisch/Tinbergen的经济数据应用→现代回归分析的三大源流。"
    },
    {
      module_id: "concept",
      module_title: "核心概念：回归模型的四个基础组件",
      module_tag: "核心概念",
      hook: "每个回归模型都可以分解为四个部分——解开它，你就掌握了计量90%的骨架。",
      content: "**回归模型的标准形式**：`Y = β₀ + β₁X₁ + β₂X₂ + ... + βₖXₖ + ε`\n\n**组件1：被解释变量 (Dependent Variable) Y**\n在计量经济学中，Y也被称为'因变量'、'结果变量'、'左边变量'。例如：工资、GDP增长率、股票收益率。一个模型有一个Y——它是我们试图'解释'或'预测'的对象。\n\n**组件2：解释变量 (Explanatory Variables) X₁,...,Xₖ**\nX₁,...,Xₖ也被称为'自变量'、'协变量'、'右边变量'或**回归子（regressors）**。在一个包含k个回归子（不含截距/常数项）的模型中，我们估计k个斜率系数（β₁,...,βₖ）+ 1个截距（β₀）。\n\n**组件3：误差项 (Error Term) ε**\nε代表所有'未被X解释的Y的变异'。它包括：\n- **遗漏变量**：我们没有数据的所有影响Y的其他因素\n- **测量误差**：Y或X的测量不精确\n- **真实的随机性**：人类行为中不可预测的成分\n在OLS中，ε被假设为均值为零（`E[ε]=0`）且与X不相关（`E[ε|X]=0`）。这些假设构成了OLS推断的基础——**两个假设中的任何一个都不可能被完全验证**（它们本质上是不可直接观测的）。\n\n**组件4：回归系数 (Regression Coefficients) β₀, β₁, ..., βₖ**\n**β₀（截距）**：当所有X=0时Y的预测值（但这个解释只在X=0有意义时成立——例如X='教育年限'时，X=0=0年教育是有意义的；X='GDP'时，GDP=0通常无意义）。\n**βⱼ（斜率系数）**：ceteris paribus（其他条件不变），Xⱼ每增加1个单位，Y平均变化βⱼ个单位。注意'平均'——因为这个'变化'中已经假定ε均值为零已被'平均化'。",
      formulas: [
        { latex: "$$Y_i = \\beta_0 + \\beta_1 X_{i1} + \\beta_2 X_{i2} + \\dots + \\beta_k X_{ik} + \\varepsilon_i$$", caption: "多元线性回归模型的通用形式——每个观测i有自己的一套(X₁,...,Xₖ)和Y" },
        { latex: "$$\\frac{\\partial \\mathbb{E}(Y \\mid X)}{\\partial X_j} = \\beta_j$$", caption: "βⱼ的'边际效应'解释：在其他X不变的条件下，Xⱼ每增加一个单位，Y的条件期望增加βⱼ" }
      ],
      key_takeaway: "Y（被解释）+ X₁...Xₖ（解释）+ β₀...βₖ（系数）+ ε（误差）→回归的四大组件，缺一不可。"
    },
    {
      module_id: "principle",
      module_title: "核心原理：最小二乘的直觉与推导",
      module_tag: "核心概念",
      hook: "OLS做了一件极其朴素的几何操作：它在所有可能的直线中，挑选那条使得数据点到直线的垂直距离平方和最小的直线。",
      content: "**最小二乘思想的核心演进**：\n\n**第1步：定义'好'直线**\n对于每个观测点(xᵢ, yᵢ)，从点到候选直线`ŷ = β₀ + β₁x`的垂直距离（残差）为`eᵢ = yᵢ - (β₀ + β₁xᵢ)`。我们希望这些残差'尽可能小'——但如何定义'小'？\n\n**第2步：选择损失函数**\n为什么是'平方和'(Sum of Squared Residuals)而不是'绝对值和'(Sum of Absolute Residuals)？\n- 平方和`SSR = Σeᵢ²`在数学上可以**微**（导数处处连续），而绝对值不可微（在0处有'尖点'）→求最小值的解析解成为可能\n- 平方函数对大残差的惩罚**平方级**加重——一个残差=10的点的'失分'（100）等于100个残差=1的点——因此OLS对异常值极为敏感\n- 在正态性假设下，最小化SSR等同于**极大似然**（因此OLS也是MLE在那特定条件下的特例）\n\n**第3步：构造最优条件**\n对于简单回归（k=1），OLS最小化`SSR(β₀,β₁) = Σ(yᵢ - β₀ - β₁xᵢ)²`。对β₀和β₁求偏导并设为零，得到正规方程：\n- `nβ₀ + β₁Σxᵢ = Σyᵢ`（第一个正规方程：截距条件）\n- `β₀Σxᵢ + β₁Σxᵢ² = Σxᵢyᵢ`（第二个正规方程：斜率条件）\n\n解得：`β̂₁ = Σ(xᵢ-x̄)(yᵢ-ȳ)/Σ(xᵢ-x̄)² = Cov(x,y)/Var(x)`，`β̂₀ = ȳ - β̂₁x̄`\n\n**第4步：将几何意义内化**\n- `β̂₀ = ȳ - β̂₁x̄`表示**回归直线必然通过均值点(x̄, ȳ)**——这是OLS的一个核心几何性质\n- `β̂₁` = x和y的协方差除以x的方差——这是一个纯样本矩运算——不需要任何分布假设",
      formulas: [
        { latex: "$$\\hat{\\beta}_1 = \\frac{\\sum_{i=1}^n (x_i - \\bar{x})(y_i - \\bar{y})}{\\sum_{i=1}^n (x_i - \\bar{x})^2} = \\frac{\\text{Cov}(x,y)}{\\text{Var}(x)}$$", caption: "简单OLS斜率的公式——协方差/方差：x与y线性关联的方向和强度", expandable: true,
          derivation: "从SSR最小化的一阶条件：∂SSR/∂β₁ = -2Σxᵢ(yᵢ-β₀-β₁xᵢ) = 0和∂SSR/∂β₀ = -2Σ(yᵢ-β₀-β₁xᵢ) = 0。第二个方程→β̂₀=ȳ-β̂₁x̄。代入第一个→Σxᵢ(yᵢ-ȳ+β̂₁x̄-β̂₁xᵢ)=0→Σxᵢ(yᵢ-ȳ)=β̂₁Σxᵢ(xᵢ-x̄)。注意Σxᵢ(xᵢ-x̄)=Σ(xᵢ-x̄)(xᵢ-x̄)+x̄Σ(xᵢ-x̄)=Σ(xᵢ-x̄)²。且Σxᵢ(yᵢ-ȳ)=Σ(xᵢ-x̄)(yᵢ-ȳ)+x̄Σ(yᵢ-ȳ)=Σ(xᵢ-x̄)(yᵢ-ȳ)。整理即得β̂₁=Cov(x,y)/Var(x)。"
        }
      ],
      key_takeaway: "OLS=在所有直线中找残差平方和最小的那一条。一阶条件(导数=0)→正规方程→β̂₁=Cov(x,y)/Var(x)。纯代数，无需分布假设。"
    },
    {
      module_id: "development",
      module_title: "发展迭代：从一元到多元到非参数",

function buildModuleHTML(mod){var tg=getTagClass(mod.module_tag||'');var h='<section class="module-section" id="'+mod.module_id+'"><div class="module-header"><span class="module-tag '+tg+'">'+(mod.module_tag||'')+'</span><h2 class="module-title">'+(mod.module_title||mod.module_id)+'</h2></div>';if(mod.hook)h+='<div class="module-hook">'+mod.hook+'</div>';h+='<div class="module-content">'+parseMD(mod.content||'')+'</div>';if(mod.formulas&&mod.formulas.length>0){mod.formulas.forEach(function(f){var hasD=f.expandable&&f.derivation;h+='<div class="formula-block'+(hasD?'':' not-expandable')+'" onclick="'+(hasD?'toggleDerivation(this)':'')+'"><div>'+f.latex+'</div>';if(f.caption)h+='<div class="formula-caption">'+f.caption+'</div>';if(hasD){h+='<div class="formula-expand-hint">💡 点击展开推导过程</div><div class="formula-derivation">'+f.derivation+'</div>'}h+='</div>'})}if(mod.charts&&mod.charts.length>0){mod.charts.forEach(function(cc,ci){var cid='chart_'+mod.module_id+'_'+ci;h+='<div class="chart-container"><div class="chart-wrapper" id="'+cid+'"></div>';if(cc.caption)h+='<div class="chart-caption">'+cc.caption+'</div>';if(cc.data_source)h+='<div class="chart-source">'+cc.data_source+'</div>';h+='</div>'})}if(mod.tables&&mod.tables.length>0){mod.tables.forEach(function(tb){h+='<div style="overflow-x:auto"><table class="module-table"><thead><tr>'+(tb.headers||[]).map(function(th){return'<th>'+th+'</th>'}).join('')+'</tr></thead><tbody>'+(tb.rows||[]).map(function(r){return'<tr>'+r.map(function(c){return'<td>'+c+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table>';if(tb.caption)h+='<div class="table-caption">'+tb.caption+'</div>';if(tb.data_source)h+='<div class="chart-source">'+tb.data_source+'</div>';h+='</div>'})}if(mod.references&&mod.references.length>0){h+='<div class="module-references"><h4>📚 参考文献</h4><ol>';mod.references.forEach(function(ref){var lk='';if(ref.doi)lk+=' <a href="https://doi.org/'+ref.doi+'" target="_blank">DOI</a>';if(ref.url)lk+=' <a href="'+ref.url+'" target="_blank">链接</a>';h+='<li>'+(ref.authors||'')+' ('+(ref.year||'')+'). <strong>'+(ref.title||'')+'</strong>.'+lk+'</li>'});h+='</ol></div>'}if(mod.key_takeaway)h+='<div class="key-takeaway">💡 '+mod.key_takeaway+'</div>';h+='</section>';return h}
function toggleDerivation(el){el.classList.toggle('expanded')}
function initPage(){document.body.classList.remove('loading');document.body.classList.add('loaded');buildMetaCard();buildSidebar();var mc=document.getElementById('modules-container');PAGE_DATA.modules.forEach(function(m){mc.innerHTML+=buildModuleHTML(m)});var ses=mc.querySelectorAll('.module-section');ses.forEach(function(s){observer.observe(s)});renderFormulas(mc);setTimeout(function(){PAGE_DATA.modules.forEach(function(m){if(m.charts){m.charts.forEach(function(cc,ci){renderChart(m.module_id,cc,ci)})}})},100);var fo=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)e.target.classList.add('visible')})},{threshold:0.08});ses.forEach(function(s){fo.observe(s)})}
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='d'){e.preventDefault();toggleTheme()}});
(function bg(){var cv=document.getElementById('bg-canvas');var ctx=cv.getContext('2d');var pts=[];function rs(){cv.width=window.innerWidth;cv.height=window.innerHeight}window.addEventListener('resize',rs);rs();var n=Math.min(40,Math.floor((cv.width*cv.height)/30000));for(var i=0;i<n;i++)pts.push({x:Math.random()*cv.width,y:Math.random()*cv.height,vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,r:Math.random()*1.2+0.3,a:Math.random()*0.3+0.05});function an(){ctx.clearRect(0,0,cv.width,cv.height);var c='129,140,248';pts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=cv.width;if(p.x>cv.width)p.x=0;if(p.y<0)p.y=cv.height;if(p.y>cv.height)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fillStyle='rgba('+c+','+p.a+')';ctx.fill()});requestAnimationFrame(an)}an()})();
document.addEventListener('DOMContentLoaded',initPage);
</script>
