.sidebar-link{display:block;padding:6px 12px;margin:2px 0;border-radius:var(--radius-sm);font-size:13px;color:var(--text-secondary);text-decoration:none;transition:all var(--transition);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.formula-block{background:var(--bg-tertiary);border:1px solid var(--border);border-radius:var(--radius-sm);padding:20px 24px;margin:16px 0;position:relative;cursor:pointer;transition:all var(--transition)}
.formula-block:hover{box-shadow:var(--shadow)}
.formula-caption{font-size:12px;color:var(--text-tertiary);margin-top:8px;text-align:center}

.formula-block.expanded .formula-derivation{display:block}
.formula-expand-hint{font-size:11px;color:var(--text-tertiary);text-align:right;margin-top:4px}
.chart-container{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin:20px 0}
.chart-wrapper{width:100%;height:380px}
.chart-caption{font-size:13px;color:var(--text-secondary);text-align:center;margin-top:12px}
.chart-source{font-size:11px;color:var(--text-tertiary);text-align:right;margin-top:4px}
.module-table{width:100%;border-collapse:collapse;margin:16px 0;font-size:14px;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
.module-table th{background:var(--bg-tertiary);padding:10px 16px;text-align:left;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:0.03em;color:var(--text-secondary)}

.module-references ol{margin-left:20px}
.module-references li{margin-bottom:4px}

      content: '多模型协作的思想并非凭空出现，其根源可以追溯到计算机科学中分布式系统的核心理念。早在20世纪80年代，研究人员就发现单一专家系统在处理复杂问题时存在不可逾越的认知边界。正如No Single Agent Can Solve It All这一论断所揭示的，复杂任务的解决需要不同专长能力的组合与协同。\n\n在深度学习时代，这一思想经历了从隐式到显式的演进。早期的集成学习方法如Bagging和Boosting，本质上就是多模型协作的雏形——通过组合多个弱学习器来构建强学习器。然而，这些方法中的模型是同质的，协作方式也是静态的。真正意义上的多模型协作，要求模型在能力上具有异质性，在协作方式上具有动态性。\n\n2017年Transformer架构的提出开启了大语言模型时代，但随之而来的是对模型通用性与专业性之间矛盾的深刻认识。一个模型难以同时在代码生成、数学推理、创意写作和知识问答等领域都达到最优水平。这种能力的不均衡性，恰恰构成了多模型协作的必要性基础。\n\n2022年至2024年间，随着GPT-4、Claude、Gemini等模型的出现，业界开始系统性地探索多模型协作范式。从简单的模型级联到复杂的Agent编排，从静态Pipeline到动态路由，多模型协作从工程实践逐渐上升为一种系统性的方法论。LangChain、AutoGen、CrewAI等框架的涌现，标志着多模型协作已经从学术概念走向工程标准化。\n\n理解这一演进脉络，有助于我们把握多模型协作不是一种权宜之计，而是AI系统设计的必然趋势——正如人类社会从个体劳动走向分工协作一样，AI系统也必然从单模型走向多模型协同。',

    {
      module_id: 'm02-concept',
      module_title: '核心概念：多模型协作的定义与分类体系',
      module_tag: '核心概念',
      hook: '多模型协作不仅仅是把几个模型拼在一起——它是一套关于分工、通信与决策的系统理论。',
      content: '多模型协作（Multi-Model Collaboration）是指两个或多个AI模型通过结构化的信息交换与任务分配机制，共同完成单一模型难以有效处理的复杂任务。这一定义包含三个关键要素：**模型异质性**（参与协作的模型在架构、能力或知识上存在差异）、**结构化通信**（模型之间通过明确的协议交换信息）和**目标一致性**（所有模型服务于共同的最终目标）。\n\n从协作拓扑的角度，多模型协作可以分为以下几类：\n\n**串行协作（Sequential/Pipeline）**：模型按照固定顺序依次处理，前一模型的输出作为后一模型的输入。典型例子是RAG系统中的检索-生成流水线。串行协作的优势在于流程清晰、易于调试，劣势是延迟叠加且缺乏反馈回路。\n\n**并行协作（Parallel/Ensemble）**：多个模型同时处理相同或不同的子任务，最终通过聚合机制合并结果。并行协作能显著降低单点故障风险并提升响应速度，但需要设计有效的结果融合策略。\n\n**层级协作（Hierarchical）**：存在控制层与执行层的区分，控制模型负责任务分解与调度，执行模型负责具体子任务。这种模式类似于企业中的管理层与执行层关系，在Agent编排系统中广泛使用。\n\n**图状协作（Graph/DAG）**：模型之间的协作关系形成有向无环图，每个模型可以接收多个上游输入并向多个下游输出。这是最通用的协作拓扑，也是LangGraph等框架的设计基础。\n\n从决策机制的角度，还可以分为：**静态协作**（协作流程在运行前确定）与**动态协作**（运行时根据输入动态决定协作方式）。动态协作通常需要一个路由器（Router）或编排器（Orchestrator）来实时决策。\n\n理解这些分类维度，有助于我们在面对具体任务时选择最合适的协作模式，避免过度设计或设计不足。',

    {
      module_id: 'm03-principle',
      module_title: '核心原理：信息流、控制流与组合的理论基础',
      module_tag: '核心概念',
      hook: '多模型协作的本质是信息与控制的流动——理解这两种流的规律，就掌握了协作设计的密码。',
      content: '多模型协作系统的运行可以用两种基本流来描述：**信息流（Information Flow）**和**控制流（Control Flow）**。信息流描述数据如何在模型之间传递和变换，控制流描述决策权如何在模型之间分配和转移。这两种流的设计直接决定了协作系统的性能与可靠性。\n\n**信息流理论**：在多模型协作中，信息流遵循信息论的基本约束。每个模型可以被视为一个信息处理节点，其输入是上游节点的输出加上外部上下文。信息流的关键挑战在于**信息瓶颈**——当中间模型的输出丢失关键信息时，下游模型无法恢复这些信息。这要求我们在设计信息传递格式时，既要控制信息量（避免上下文窗口溢出），又要保留关键信号。\n\n形式化地，设模型$M_i$的输出为$y_i$，则信息瓶颈可以表示为：$I(y_i; x) \\leq I(y_{i-1}; x)$，即每经过一次模型处理，关于原始输入$x$的互信息只可能减少或保持，不可能增加。这意味着在串行Pipeline中，信息只会逐层衰减。\n\n**控制流理论**：控制流决定了哪个模型在何时被激活、以什么参数执行。静态控制流在编译时确定，动态控制流在运行时根据中间结果决定。动态控制流的核心组件是**路由器（Router）**，它根据当前状态选择下一步执行哪个模型。\n\n路由决策可以建模为马尔可夫决策过程（MDP）：在每个决策点，路由器观察当前状态$s_t$，从可用模型集合$A$中选择动作$a_t$（即选择执行哪个模型），获得奖励$r_t$（如任务完成度），转移到新状态$s_{t+1}$。最优路由策略$\\pi^*$最大化累积奖励。\n\n**组合的涌现性**：多模型协作最引人入胜的特性是涌现能力——组合系统的能力超越任何单个组件。这类似于复杂系统中的涌现现象：简单的局部交互规则可以产生全局层面的复杂行为。在实践中，涌现性来源于模型之间的互补性：当模型A擅长X但不擅长Y，模型B擅长Y但不擅长X时，A+B的组合能力远超A或B单独的能力。\n\n然而，涌现性并非自动产生。它要求：(1)模型之间确实存在能力互补；(2)信息传递格式能保留互补信息；(3)控制流能正确地将子任务分配给最合适的模型。这三个条件的满足程度，直接决定了协作系统的实际效果。',
      formulas: [
        { latex: '$$I(y_i; x) \\leq I(y_{i-1}; x) \\quad \\text{(Information Bottleneck)}$$', caption: '信息瓶颈不等式：串行处理中信息逐层衰减', expandable: true, derivation: '由数据处理不等式（Data Processing Inequality）直接得出：对于马尔可夫链 $x \\to y_{i-1} \\to y_i$，有 $I(y_i; x) \\leq I(y_{i-1}; x)$。这意味着任何对数据的处理都不可能增加关于原始信号的信息量。在多模型串行Pipeline中，每个中间模型的输出都是对前一步输出的有损压缩，因此关键信息必须在每一步被显式保留。' },
        { latex: '$$\\pi^* = \\arg\\max_{\\pi} \\mathbb{E}\\left[\\sum_{t=0}^{T} \\gamma^t r_t | \\pi\\right]$$', caption: '最优路由策略：最大化累积折扣奖励', expandable: false }

      content: '多模型协作系统的架构设计决定了系统的可扩展性、可维护性和运行效率。本节深入分析当前主流的架构模式及其适用场景。\n\n**1. 编排器模式（Orchestrator Pattern）**\n这是最经典的架构模式。一个中心编排器负责任务分解、模型调度和结果聚合。编排器拥有全局视角，可以做出最优的调度决策。AutoGen和CrewAI都采用了这种模式。优势是控制力强、易于监控；劣势是编排器成为单点瓶颈和故障点。当工作流复杂度增加时，编排器的逻辑也会急剧膨胀。\n\n**2. 事件驱动模式（Event-Driven Pattern）**\n模型之间通过事件总线进行松耦合通信。每个模型订阅特定类型的事件，当收到事件时触发处理并可能发布新事件。这种模式的代表是LangGraph的状态图设计。优势是高度解耦、易于扩展新模型；劣势是调试困难、事件追踪复杂。\n\n**3. 对等协作模式（Peer-to-Peer Pattern）**\n没有中心控制节点，模型之间直接通信协商。每个模型既是客户端也是服务端。这种模式在学术研究中较为常见，如多Agent辩论场景。优势是高度灵活、无单点故障；劣势是协调开销大、可能陷入死锁。\n\n**4. 分层架构（Layered Architecture）**\n将协作系统分为多个层次：基础设施层（模型调用、API管理）、编排层（工作流定义与执行）、应用层（业务逻辑与用户交互）。每一层只与相邻层交互。这种架构适合企业级生产环境，因为它提供了清晰的关注点分离和标准化接口。\n\n**5. 黑板系统模式（Blackboard Pattern）**\n所有模型共享一个全局状态空间（黑板），模型独立地从黑板读取信息、写入结果。控制机制可以是主动的（由调度器决定哪个模型工作）或被动的（模型自行判断是否可以贡献）。这种模式特别适合需要多模型渐进式完善结果的场景，如文档协作编辑。\n\n在实际项目中，这些模式往往不是孤立使用的。一个成熟的多模型协作系统通常会混合使用多种架构模式。例如，在编排器模式的基础上引入事件驱动机制来处理异步任务，或在分层架构的编排层中使用图状工作流。',

      content: '多模型协作系统的成本分析是工程落地中最容易被低估的环节。许多团队在设计阶段只关注功能实现，忽视了运行成本可能随协作复杂度呈指数级增长的现实。\n\n**直接成本构成**：多模型协作的直接成本包括API调用费用、计算资源消耗和网络传输开销。以GPT-4级别的模型为例，单次API调用的输入成本约为$0.03/1K tokens，输出成本约为$0.06/1K tokens。在一个典型的三模型串行协作中，如果每个模型平均处理2K tokens输入和1K tokens输出，单次完整工作流的成本约为$0.24——看似不多，但在高并发场景下（如每秒100次请求），日成本可达惊人的数字。\n\n**隐性成本**：除了直接的API费用，还存在多种隐性成本。**重试成本**：当某个模型输出质量不达标时需要重新调用，平均重试率在10%-30%之间。**上下文膨胀成本**：在多轮协作中，上下文窗口不断增长，后续调用的token消耗远超首次调用。**编排开销**：路由器本身的运行也需要消耗计算资源。\n\n**成本优化策略**：\n\n1. **模型分层策略**：不是所有子任务都需要最强模型。将简单任务（如格式转换、关键词提取）分配给轻量模型（如GPT-3.5或本地小模型），将复杂任务（如推理、创意生成）分配给强模型。这种分层可以降低60%-80%的成本。\n\n2. **缓存机制**：对相同或相似的输入进行缓存，避免重复调用。语义缓存（Semantic Cache）通过向量相似度匹配来识别语义等价的请求，缓存命中率可达30%-50%。\n\n3. **早停机制**：在串行Pipeline中设置质量检查点，当中间结果已满足要求时提前终止后续模型调用。\n\n4. **批处理优化**：将多个请求合并为批量调用，利用API的批处理折扣（通常可节省50%费用）。\n\n5. **动态模型选择**：根据任务难度实时选择最经济的模型组合，而非固定使用最强配置。\n\n成本优化不是一次性工作，而是需要持续监控和调整的运营活动。建立完善的成本监控仪表盘，设置预算告警，定期审查成本分布，是多模型协作系统可持续运行的基本保障。',

      hook: '从LangChain到CrewAI，开源框架正在让多模型协作从专家技能变成大众工具——但选错框架的代价同样高昂。',
      content: '多模型协作的开源生态在2023-2025年间经历了爆发式增长。理解这些框架的设计理念和适用边界，是高效构建协作系统的前提。\n\n**LangChain** 是最早也是最广泛使用的编排框架。它采用链式（Chain）抽象来组织模型调用序列，后来扩展到支持Agent和工具调用。LangChain的优势在于生态丰富、集成广泛（支持数百个模型和工具），劣势是抽象层次过多导致调试困难，且链式抽象在处理复杂工作流时显得力不从心。LangGraph是LangChain团队对这一问题的回应——它引入了图状工作流抽象，支持条件分支、循环和状态管理。\n\n**AutoGen** 由微软研究院开发，采用多Agent对话的协作范式。每个Agent被赋予不同的角色和能力，通过对话来协商和完成任务。AutoGen的创新在于支持人类参与的对话循环（Human-in-the-loop），使得协作过程可以融入人类专家的判断。其劣势是对话式协作的效率较低，且对Agent的角色设计要求较高。\n\n**CrewAI** 专注于角色驱动的多Agent协作。它将协作过程建模为一个船员团队（Crew），每个Agent是一个船员（Crew Member），拥有特定的角色、目标和工具。CrewAI的优势是概念模型直观、上手快；劣势是灵活性有限，难以处理非预设的协作模式。\n\n**Dify** 和 **Coze** 代表了另一类工具——低代码/无代码的多模型协作平台。它们提供可视化工作流编辑器，用户通过拖拽节点和连线来构建协作流程。这类工具极大地降低了入门门槛，但在处理复杂逻辑和定制化需求时受限。\n\n**Semantic Kernel** 是微软推出的企业级SDK，强调与现有软件工程的集成。它采用技能（Skills）和规划器（Planner）的抽象，支持将AI能力无缝嵌入传统应用程序。\n\n选择框架时需要考虑的关键因素：团队技术栈（Python/TypeScript/C#）、协作复杂度（简单链式 vs 复杂图状）、部署环境（本地/云端/混合）、以及是否需要人类参与。没有最好的框架，只有最合适的框架。',

      hook: '如何证明三个模型协作真的比一个模型强？这不仅是技术问题，更是方法论挑战。',
      content: '多模型协作系统的评测是一个远比单模型评测复杂的课题。单模型评测关注准确率和效率，而多模型协作评测还需要关注协作增益、通信开销和系统鲁棒性等维度。\n\n**评测维度框架**：一个完整的多模型协作评测应覆盖以下维度：\n\n1. **任务完成质量**：最终输出的正确性、完整性和有用性。这是最基本的评测维度，通常使用与单模型相同的指标（如BLEU、ROUGE、准确率等），但需要额外关注协作是否带来了质量提升。\n\n2. **协作增益（Collaboration Gain）**：衡量多模型协作相对于最佳单模型的改进幅度。这是多模型协作最核心的评测指标——如果协作不能带来增益，那么额外的复杂度和成本就是浪费。\n\n3. **通信效率**：模型之间交换的信息量与任务完成质量之间的关系。理想情况下，通信量应该远小于直接传输原始输入的量，否则协作的价值就值得质疑。\n\n4. **系统鲁棒性**：当某个模型失效或输出质量下降时，系统整体的降级程度。优秀的协作系统应该具备优雅降级的能力，而非级联崩溃。\n\n5. **延迟与吞吐**：从用户发起请求到获得最终响应的时间，以及系统在单位时间内能处理的请求数量。\n\n**基准数据集**：目前专门针对多模型协作的基准数据集仍在发展中。现有的评测多采用以下策略：\n\n- **复用单模型基准**：在MMLU、HumanEval等基准上对比单模型与多模型协作的表现差异。\n- **构建协作专用基准**：如MINT（Multi-turn INteraction Testing）专门评测多轮交互场景，AgentBench评测Agent的端到端任务完成能力。\n- **人工评测**：对于开放性任务（如创意写作、复杂推理），人工评测仍然是金标准，但成本高昂且难以规模化。\n\n**评测陷阱**：多模型协作评测中常见的陷阱包括：选择偏差（只评测协作擅长的任务）、组合偏差（忽略协作的失败案例）和成本盲区（不考虑计算成本只看质量）。一个严谨的评测应该同时报告增益和成本，计算性价比指标。',

      hook: '从简单的模型堆叠到智能的Agent编排，多模型协作的每一次跃迁都伴随着抽象层次的提升。',
      content: '多模型协作技术的发展可以划分为四个明显的代际，每一代都代表了抽象层次的跃迁和协作能力的质变。\n\n**第一代：静态Pipeline（2020-2022）**\n这一代的核心特征是固定的处理流程。开发者预先定义好模型调用的顺序和参数，运行时不会动态调整。典型的例子是早期的RAG系统：检索模型获取文档，生成模型基于文档生成回答。这种方式的优点是简单可靠，缺点是缺乏灵活性——无论输入是什么，都走相同的流程，即使某些步骤对特定输入是不必要的。\n\n**第二代：条件路由（2022-2023）**\n第二代引入了条件分支和动态路由。系统可以根据输入的特征或中间结果，选择不同的处理路径。例如，简单问题直接用小模型回答，复杂问题才调用大模型。路由器（Router）成为这一代的核心组件。LangChain的RouterChain和Semantic Kernel的Planner都属于这一代。条件路由显著提升了效率，但路由决策本身可能出错，且路由器的训练和维护是额外的工程负担。\n\n**第三代：Agent编排（2023-2024）**\n第三代赋予了模型自主决策的能力。Agent不仅执行任务，还可以自主规划、使用工具、与其他Agent通信和反思纠错。ReAct、Reflexion和AutoGen代表了这一代的技术方向。Agent编排的核心挑战是可控性——如何让自主Agent在保持灵活性的同时不偏离目标。提示工程（Prompt Engineering）在这一代成为关键技能，因为Agent的行为主要由提示词决定。\n\n**第四代：自适应协作（2024-至今）**\n第四代正在形成中，其核心特征是协作模式的自适应演化。系统不再依赖预定义的协作模式，而是根据任务特征和历史经验动态调整协作策略。这包括：动态组建协作团队（根据任务选择最合适的模型组合）、自适应通信协议（根据任务进展调整信息交换频率和粒度）、以及持续学习（从历史协作中学习更优的协作策略）。\n\n每一代技术都不是完全替代前一代，而是在前一代基础上叠加新的能力。实际系统中往往同时存在多个代际的特征——静态Pipeline处理确定性步骤，条件路由处理分支逻辑，Agent编排处理开放性任务。',

    {
      module_id: 'm11-risk',
      module_title: '风险与挑战：多模型系统的潜在问题',
      module_tag: '风险与挑战',
      hook: '级联错误、隐私泄露、对抗攻击——多模型协作在放大能力的同时，也在放大风险。',
      content: '多模型协作系统面临的风险远比单模型系统复杂，因为风险不仅存在于每个组件内部，还存在于组件之间的交互过程中。\n\n**1. 级联错误（Cascading Errors）**\n这是多模型协作最普遍也最危险的风险。在串行Pipeline中，如果第一个模型的输出包含错误，这个错误会传递给后续所有模型，并在传递过程中被放大和变形。例如，在RAG系统中，如果检索模型返回了错误的文档，生成模型会基于错误文档生成看似合理但事实错误的回答——这种错误比直接产生幻觉更难检测，因为它有看似可信的来源。\n\n级联错误的传播概率可以用链式法则估算：如果每个模型的错误率为$p_i$，则整个Pipeline的错误率约为$1 - \\prod(1-p_i)$。对于5个错误率各为5%的模型，整体错误率高达22.6%。\n\n**2. 隐私与数据安全**\n多模型协作中数据在多个模型之间流转，增加了隐私泄露的攻击面。特别是在使用第三方API模型时，敏感数据可能被发送到不受控的服务器。即使每个模型单独是安全的，组合后也可能产生新的隐私风险——例如，模型A输出的中间结果可能无意中泄露了输入中的敏感信息。\n\n**3. 对抗攻击面扩大**\n攻击者可以针对协作链中的最弱环节发起攻击。例如，在检索-生成系统中，攻击检索模型使其返回恶意文档，就能操纵最终生成结果。多模型系统的攻击面是所有组件攻击面的并集，且组件间接口还引入了新的攻击向量。\n\n**4. 一致性与可靠性**\n多个模型可能对同一输入产生不一致的输出，导致协作系统的行为不可预测。在并行Ensemble中，不同模型的投票可能产生平局；在串行Pipeline中，后续模型可能误解前序模型的输出意图。\n\n**5. 可解释性缺失**\n当最终输出是多个模型协作的结果时，很难追溯某个具体输出是由哪个模型的哪个决策导致的。这种可解释性缺失在医疗、金融等高合规领域是致命缺陷。\n\n**缓解策略**：针对级联错误，可以引入中间验证节点和回退机制；针对隐私风险，可以采用联邦学习和差分隐私技术；针对对抗攻击，需要对每个接口实施输入验证和输出过滤；针对一致性问题，需要设计冲突解决机制；针对可解释性，需要建立完整的决策日志和溯源链。',
      formulas: [
        { latex: '$$P_{\\text{cascade}} = 1 - \\prod_{i=1}^{n}(1 - p_i)$$', caption: '级联错误概率：n个模型串联时的整体错误率', expandable: true, derivation: '假设各模型错误独立，则整体正确概率为各模型正确概率之积 $\\prod(1-p_i)$，因此整体错误概率为 $1 - \\prod(1-p_i)$。当 $p_i$ 较小时可近似为 $\\sum p_i$。例如5个错误率5%的模型串联，整体错误率约为 $1 - 0.95^5 \\approx 22.6\\%$。' }

    {

      hook: '当多个模型共同做出决策时，谁来承担责任？多模型协作的伦理问题比单模型更加棘手。',
      content: '多模型协作引入了独特的伦理挑战，这些挑战在单模型系统中不存在或不如突出。理解这些伦理维度对于负责任地部署多模型协作系统至关重要。\n\n**责任归属问题**\n当多模型协作系统产生有害输出时，责任应该由谁承担？是提供基础模型的厂商、设计协作流程的开发者、还是部署系统的企业？在单模型场景中，这个问题已经足够复杂；在多模型协作中，它变得更加模糊——因为最终输出是多个模型共同作用的结果，很难将责任归因于单一组件。这被称为**责任分散效应**，类似于心理学中的旁观者效应：当多个主体参与决策时，每个主体都倾向于认为其他主体会承担责任。\n\n**偏见放大**\n多模型协作可能放大而非缓解偏见。如果多个模型共享相似的训练数据或架构，它们的偏见可能高度相关，导致Ensemble的偏见比任何单个模型都更强烈。更危险的是，协作系统可能产生新的偏见形式——例如，当模型A的偏见输出被模型B当作事实输入时，偏见就被固化并传播。\n\n**透明度与知情同意**\n用户通常不知道他们正在与一个多模型协作系统交互，也不知道他们的数据在多个模型之间如何流转。这违反了知情同意原则。特别是在使用第三方API时，用户数据可能被发送到多个不同的服务商，每个服务商都有自己的数据处理政策。\n\n**公平性**\n多模型协作可能在不同用户群体间产生不公平的差异。例如，路由器可能将简单问题分配给弱模型、复杂问题分配给强模型，但如果问题复杂度的判断本身存在偏见（如对非英语母语者的问题判断为更复杂），就会导致服务质量的不公平分配。\n\n**自主性与人类代理**\n当多模型协作系统越来越自主地做出决策时，人类的代理空间可能被压缩。在Human-in-the-loop系统中，人类可能因为系统的高自信度而放弃独立判断，形成对AI系统的过度依赖。\n\n应对这些伦理挑战需要技术手段（如偏见检测工具、可解释性框架）和制度手段（如伦理审查委员会、责任分配协议）的结合。单纯依赖技术手段无法解决根本问题，因为伦理问题本质上是价值判断问题，需要社会共识和制度保障。',

      content: '多模型协作的行业生态可以分为四个层次：基础模型层、编排框架层、平台服务层和应用解决方案层。每一层都有不同的参与者、商业模式和竞争格局。\n\n**基础模型层**\n这一层提供协作所需的基础模型能力。OpenAI（GPT系列）、Anthropic（Claude系列）、Google（Gemini系列）和Meta（Llama系列）是主要玩家。中国的通义千问、文心一言、DeepSeek等也在快速追赶。基础模型层的竞争焦点是模型能力和API稳定性。值得注意的是，基础模型厂商正在从单纯提供API向提供协作工具扩展——如OpenAI的Assistants API和GPTs，就是将编排能力内置到模型服务中。\n\n**编排框架层**\n这一层提供构建协作工作流的开发工具。LangChain/LangGraph、AutoGen、CrewAI、Semantic Kernel是主要玩家。编排框架层的竞争焦点是开发体验和生态集成。这一层的特点是开源主导——几乎所有主流框架都是开源的，商业模式主要围绕托管服务（如LangSmith）和企业支持。\n\n**平台服务层**\n这一层提供低代码/无代码的协作构建平台。Dify、Coze（字节跳动）、Flowise、n8n等是代表。平台服务层的目标用户是非AI专业的开发者和业务人员，竞争焦点是易用性和模板丰富度。这一层正在快速商品化，差异化越来越依赖于垂直行业模板和预构建组件。\n\n**应用解决方案层**\n这一层直接面向终端用户，提供特定领域的多模型协作解决方案。如Cursor（AI编程）、Harvey（法律AI）、Abridge（医疗AI）等。这一层的壁垒在于领域知识和数据，而非技术本身。\n\n**投资与并购趋势**：2024年，多模型协作领域的投资集中在编排框架和垂直解决方案两个方向。基础模型层的投资已经趋于理性，而编排层和解决方案层仍在高速增长。并购方面，大型云服务商正在收购编排框架和平台服务公司，以补全其AI产品线。\n\n**区域格局**：美国在基础模型和编排框架层领先，中国在平台服务和应用解决方案层有独特优势（如微信生态、短视频生态中的AI应用）。欧洲在AI伦理和合规方面走在前列，对多模型协作的治理框架有重要影响。',

      module_tag: '前沿探索',
      hook: '尽管多模型协作已经取得了显著进展，但仍有几个根本性问题悬而未决——它们的解决将决定这一领域的未来走向。',
      content: '多模型协作领域当前面临的关键挑战可以归纳为以下五个方向，每一个都涉及深层次的理论和工程问题。\n\n**1. 最优协作策略的自动发现**\n当前的多模型协作策略主要依赖人工设计——开发者根据经验选择协作拓扑、模型组合和通信协议。然而，最优策略可能因任务而异，甚至因输入而异。如何让系统自动发现最优协作策略，是一个关键的开放问题。这涉及组合优化（从大量可能的模型组合中搜索最优解）和元学习（从历史协作经验中学习策略）两个技术方向。目前的进展包括基于强化学习的路由器训练和基于进化算法的架构搜索，但距离实用化还有较大距离。\n\n**2. 跨模型语义对齐**\n不同模型对同一概念可能有不同的内部表示。当模型A向模型B传递信息时，B如何准确理解A的意图？当前的解决方案主要依赖自然语言作为中间表示，但自然语言本身存在歧义性。更根本的解决方案需要实现跨模型的语义空间对齐——让不同模型在共享的语义空间中交换信息。这方面的研究包括对比学习对齐和适配器（Adapter）方法。\n\n**3. 协作系统的可验证性**\n如何验证多模型协作系统的输出是正确的？在单模型系统中，这已经是一个难题；在多模型系统中，验证需要考虑所有协作路径和组合效应。形式化验证方法（如模型检查）在协作系统规模增大时面临状态爆炸问题。基于测试的验证方法则面临组合爆炸——需要测试的路径数量随模型数量指数增长。\n\n**4. 动态协作中的稳定性保证**\n在动态路由和自适应协作中，系统的行为可能不稳定——相同的输入可能因为路由决策的微小差异而产生截然不同的输出。这种不稳定性在安全关键应用中是不可接受的。如何在保持灵活性的同时保证行为的确定性和稳定性，是一个重要的工程和理论挑战。\n\n**5. 协作效率的理论下界**\n多模型协作的效率提升是否存在理论下界？即，给定N个模型和任务T，协作系统相比最佳单模型的改进是否存在上限？如果存在，这个上限由什么决定？这些问题目前缺乏系统性的理论回答。信息论和计算复杂性理论可能为回答这些问题提供工具，但相关研究刚刚起步。',

    {
      module_id: 'm15-prospect',
      module_title: '未来展望：多模型协作的发展方向',
      module_tag: '前沿探索',
      hook: '从人工编排到自主协作，从静态组合到动态演化——多模型协作的未来正在被重新定义。',
      content: '多模型协作的未来发展将沿着以下方向演进，每一条路径都将深刻改变我们构建和使用AI系统的方式。\n\n**方向一：从预定义协作到自主协作**\n当前的多模型协作需要人类预先定义协作流程。未来的系统将能够根据任务特征自主决定协作方式——包括选择哪些模型参与、如何分配子任务、采用什么通信协议。这需要模型具备元认知能力：知道自己擅长什么、不擅长什么，以及何时需要寻求其他模型的帮助。这种自主协作的实现将大幅降低多模型协作系统的构建门槛，使非专业用户也能受益于协作范式。\n\n**方向二：从离散协作到连续协作**\n当前的协作是离散的：模型A完成输出后，模型B才开始处理。未来的协作将更加连续和流畅——多个模型可以同时处理同一输入的不同方面，实时交换中间状态，动态调整注意力焦点。这种连续协作模式更接近人类团队的协作方式，也更能发挥模型之间的互补优势。\n\n**方向三：从通用协作到领域特化**\n通用协作框架虽然灵活，但在特定领域往往不如专门设计的协作系统高效。未来将出现更多领域特化的协作模式——如法律领域的多模型论证系统、医学领域的多模型诊断系统、金融领域的多模型风控系统。这些特化系统将嵌入领域知识、遵循行业规范、优化领域特定指标。\n\n**方向四：从云端协作到端云协同**\n随着端侧模型能力的提升，未来的多模型协作将不再局限于云端。轻量级模型在端侧处理简单任务和敏感数据，重量级模型在云端处理复杂任务，两者通过高效的通信协议协同工作。这种端云协同模式既能降低延迟和成本，又能保护用户隐私。\n\n**方向五：从模型协作到人机协作**\n最终，多模型协作系统将把人类纳入协作循环——不是作为旁观者或审批者，而是作为与AI模型平等的协作伙伴。人类提供AI缺乏的常识、价值观和创造力，AI提供人类缺乏的速度、一致性和规模。这种人机深度协作将重新定义知识工作的范式。\n\n这些方向不是互斥的，而是相互促进的。自主协作需要连续协作的技术支撑，领域特化需要端云协同的基础设施，人机协作需要所有这些方向的成熟。最终，多模型协作将从一种技术手段演变为一种新的计算范式——AI不再是一个工具，而是一个由多个专业能力组成的团队。',

    {
      module_id: 'm16-effort-direction',
      module_title: '努力方向：从业者应关注的重点',
      module_tag: '前沿探索',
      hook: '在多模型协作这个快速变化的领域，知道不做什么比知道做什么更重要——聚焦核心能力，避免追逐风口。',
      content: '对于希望深入多模型协作领域的从业者，以下方向值得重点投入，它们具有长期价值和较高的投资回报率。\n\n**1. 掌握编排设计模式**\n编排设计是构建多模型协作系统的核心技能。这不仅仅是学会使用某个框架的API，而是理解不同协作模式的适用场景、权衡取舍和设计原则。建议从简单的串行Pipeline开始实践，逐步过渡到条件路由和图状工作流。每个模式都应该通过实际项目来深入理解，而非仅停留在概念层面。具体来说，应该掌握：任务分解策略（如何将复杂任务拆分为可独立执行的子任务）、模型选择策略（如何为每个子任务选择最合适的模型）、错误处理策略（如何处理模型输出不符合预期的情况）。\n\n**2. 建立评测能力**\n评测是多模型协作系统持续改进的基础。从业者应该建立系统化的评测流程，包括：自动化评测流水线（能在代码提交后自动运行）、多维评测指标（质量、成本、延迟、鲁棒性）、以及A/B测试框架（能安全地对比不同协作策略的效果）。评测能力的建设是一项长期投资，但它能避免盲目优化和方向性错误。\n\n**3. 深入理解模型能力边界**\n多模型协作的前提是了解每个模型的能力边界——它擅长什么、不擅长什么、在什么条件下会失败。这需要系统性的实验和记录。建议为常用模型建立能力画像（Capability Profile），记录其在不同任务类型、输入长度、领域知识上的表现。这种画像不是静态的——随着模型更新，需要定期重新评测。\n\n**4. 关注成本工程**\n在多模型协作中，成本控制是决定项目能否持续运行的关键因素。从业者应该建立成本意识，学会计算和优化协作系统的运行成本。具体技能包括：token消耗估算、缓存策略设计、模型分层策略和批处理优化。成本工程不是事后优化，而应该从设计阶段就纳入考量。\n\n**5. 培养系统思维**\n多模型协作是一个系统工程问题，需要从整体视角来设计和优化。从业者应该培养系统思维，关注组件之间的交互效应，而非孤立地优化单个组件。这包括：理解级联效应（一个组件的变化如何影响其他组件）、识别瓶颈（系统的性能上限由最慢的组件决定）、以及设计冗余（关键组件的备份和降级方案）。\n\n**避免的方向**：不建议过度投入特定框架的实现细节（框架会迭代更新）、不建议追逐最新的模型发布（模型能力会趋同）、不建议在没有评测基础的情况下做复杂优化（可能优化了不重要的方向）。',

      content: '多模型协作领域存在大量看似合理但实际错误的认知，这些误区可能导致严重的工程决策失误。以下是最常见的六大误区及其纠正。\n\n**误区一：模型越多效果越好**\n这是最普遍的误区。实际上，模型数量的增加带来的边际收益递减，而边际成本递增。在大多数场景中，2-3个精心选择的模型组合就能达到接近最优的效果，继续增加模型主要增加的是复杂度和成本，而非质量。更糟糕的是，过多的模型可能导致决策冲突和级联错误。正确的做法是根据任务需求选择最少数量的必要模型，遵循奥卡姆剃刀原则。\n\n**误区二：协作一定比单模型强**\n协作增益（Collaboration Gain）并非总是正的。在某些场景中，多模型协作的输出质量可能低于最佳单模型——这被称为协作退化（Collaboration Degradation）。退化通常发生在：模型之间能力高度重叠（没有互补性）、信息传递损失严重（中间模型丢失关键信息）、或协作开销过大（编排逻辑消耗了过多上下文窗口）。在引入协作之前，应该先验证协作确实能带来增益。\n\n**误区三：最强模型组合就是最佳组合**\n将多个最强模型组合在一起并不一定产生最佳效果。模型组合的效果取决于互补性而非绝对能力。一个强模型加一个弱但互补的模型，可能比两个强模型的组合效果更好——因为强模型之间可能能力重叠度高，互补性反而不足。\n\n**误区四：框架选择决定项目成败**\n框架只是工具，真正决定项目成败的是协作设计——即如何分解任务、选择模型、设计通信协议和处理错误。一个优秀的协作设计用任何框架都能实现，而一个糟糕的协作设计用最好的框架也无法挽救。过度关注框架选择而忽视设计思维，是本末倒置。\n\n**误区五：多模型协作只适用于复杂任务**\n即使是看似简单的任务，也可能从多模型协作中受益。例如，简单的文本分类任务，通过引入验证模型进行二次确认，可以显著降低错误率。关键不在于任务复杂度，而在于错误成本——如果错误的代价很高，即使简单任务也值得用多模型协作来提升可靠性。\n\n**误区六：自动化编排一定优于手动编排**\n自动化编排（如RL路由器）在理论上能找到更优策略，但在实践中面临训练数据不足、策略不稳定和可解释性差等问题。在大多数场景中，基于领域知识的手动编排反而更可靠、更易调试。自动化编排应该作为手动编排的补充而非替代。',

      content: '以下是多模型协作领域的核心术语及其精确定义，按字母顺序排列，方便快速查阅。\n\n**Agent（智能体）**：具有自主决策能力的AI实体，能够感知环境、制定计划、执行动作并反思结果。在多模型协作中，每个Agent通常由一个基础模型加上提示词、工具和记忆组成。\n\n**Chain（链）**：LangChain中的核心抽象，表示一系列按顺序执行的模型调用。Chain可以是线性的（顺序执行），也可以包含条件分支。\n\n**Crew（团队）**：CrewAI中的核心抽象，表示一组具有不同角色的Agent组成的协作团队。每个Crew有明确的任务目标和协作流程。\n\n**DAG（有向无环图）**：一种图结构，用于描述模型之间的依赖关系。DAG中的节点表示模型调用，边表示数据流向。DAG保证了协作流程不会出现循环依赖。\n\n**Ensemble（集成）**：多个模型独立处理同一输入，通过投票或加权平均等方式合并结果的协作方式。\n\n**Human-in-the-Loop（人机协同）**：在自动化工作流中引入人类审核和决策环节，确保关键决策有人类参与。\n\n**MoE（Mixture of Experts，混合专家）**：一种模型架构，通过门控机制动态选择不同的专家子网络来处理输入。MoE是多模型协作在单一模型内部的实现形式。\n\n**Orchestrator（编排器）**：负责协调多个模型协作的中心组件，负责任务分解、模型调度和结果聚合。\n\n**Pipeline（流水线）**：模型按固定顺序依次处理的协作方式，前一模型的输出作为后一模型的输入。\n\n**RAG（Retrieval-Augmented Generation，检索增强生成）**：将外部知识检索与语言模型生成相结合的技术，是多模型协作最典型的应用场景之一。\n\n**Router（路由器）**：根据输入特征或中间结果，动态选择执行路径或模型的组件。路由器是多模型动态协作的核心。\n\n**StateGraph（状态图）**：LangGraph中的核心抽象，将协作流程建模为状态机，节点是处理函数，边是条件转移。\n\n**Tool/Function Calling（工具调用）**：模型通过调用外部工具（如搜索引擎、数据库、计算器）来扩展自身能力的技术。工具调用是Agent与外部世界交互的主要方式。\n\n**Workflow（工作流）**：描述多模型协作完整流程的抽象，包括任务分解、模型调用顺序、数据传递和错误处理等所有方面。',

      content: '多模型协作领域存在几个根本性的学术争论，这些争论的走向将深刻影响整个领域的发展方向。\n\n**争论一：多模型协作 vs 单一通用模型**\n这是最根本的争论。一方认为，随着模型规模和能力的持续增长，最终会出现一个足够强大的通用模型，使得多模型协作变得不必要。另一方认为，不同任务对模型能力的要求存在结构性差异，单一模型无论多强都无法在所有维度上同时达到最优，因此多模型协作是必然趋势。\n\n支持单一模型的论据包括：Scaling Law表明模型能力随规模持续提升；GPT-4已经在很多任务上超越了专门模型的组合；维护单一模型比维护多模型系统简单得多。\n\n支持多模型协作的论据包括：能力天花板效应——即使最大的模型在某些任务上也有不可逾越的局限；效率优势——针对特定任务使用专用模型比使用通用模型更高效；鲁棒性优势——多模型系统的单点故障影响范围有限。\n\n**争论二：编排智能应该在哪里**\n多模型协作中的编排智能应该内置在模型中（让模型自己决定何时协作），还是外置在编排框架中（由框架控制协作流程）？\n\n内置派认为，编排能力应该是模型本身的能力之一——模型应该知道何时需要求助、如何分解任务、如何整合结果。这样协作更自然、更灵活。外置派认为，将编排逻辑与模型能力分离，可以实现更好的可控性、可观测性和可维护性。编排逻辑的变更不需要重新训练模型。\n\n**争论三：协作是否需要显式通信协议**\n模型之间的通信应该使用结构化的协议（如JSON Schema定义的消息格式），还是自由形式的自然语言？\n\n结构化协议派认为，显式协议可以消除歧义、便于验证、支持自动化处理。自然语言派认为，结构化协议限制了模型的表达能力，自然语言更灵活、更接近人类的协作方式。实践中，两者的折中方案——半结构化通信——正在成为主流。\n\n**争论四：多模型协作是否是通向AGI的路径**\n一些研究者认为，多模型协作是通向AGI的可行路径——通过组合足够多的专业模型，可以实现通用智能。另一些研究者认为，真正的AGI需要统一的理解和推理能力，而非多个模型的机械组合。这个争论目前无法通过实验解决，因为它涉及对智能本质的哲学理解。\n\n这些争论没有标准答案，但理解它们有助于我们在实践中做出更明智的技术选择。争论的存在本身就说明多模型协作仍是一个活跃的研究领域，远未达到成熟阶段。',

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('slm-theme', theme);
  updateThemeIcon();
  Object.values(activeCharts).forEach(function(chart) {
    var opt = chart.getOption();
    chart.setOption(createThemedOption(opt), { notMerge: false });
  });
}

function toggleTheme() {
  var current = document.documentElement.getAttribute('data-theme') || 'light';
  applyTheme(current === 'dark' ? 'light' : 'dark');
}

function updateThemeIcon() {
  var t = document.getElementById('theme-toggle');
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  t.textContent = isDark ? '\u2600\uFE0F' : '\uD83C\uDF13';
}

var savedTheme = localStorage.getItem('slm-theme') || 'dark';
applyTheme(savedTheme);

    });
    container.appendChild(a);
    sidebarLinks.push({ el: a, id: mod.module_id });
  });
}

var observer = new IntersectionObserver(function(entries) {
  entries.forEach(function(entry) {
    if (entry.isIntersecting) {
      sidebarLinks.forEach(function(link) {
        link.el.classList.toggle('active', link.id === entry.target.id);
      });
    }
  });
}, { rootMargin: '-80px 0px -60% 0px' });

function buildMetaCard() {
  var md = PAGE_DATA;
  var domainClass = md.domain === 'finance' ? 'domain-finance' : 'domain-ai';
  var levelClass = 'level-' + md.level;
  var t = md.texture || '';
  var db = md.depth + '\u00D7' + md.breadth;
  var planInfo = '';
  if (md.plan_id) {
    planInfo = '<div class="meta-plan-info"><span class="meta-badge plan-badge">\uD83D\uDCCB ' + md.phase_name + ' (' + md.phase_position + ')</span><span>\u6765\u6E90\u65B9\u6848\uFF1A</span><a class="plan-link" onclick="goBack()">' + md.plan_name + '</a><span>\u00B7 \u77E5\u8BC6\u70B9 p2_4</span></div>';
  }
  document.getElementById('meta-card-container').innerHTML = '<div class="meta-card"><div class="meta-item"><span class="icon">\uD83D\uDCD6</span><strong>' + md.topic + '</strong></div><div class="meta-item"><span class="meta-badge ' + domainClass + '">' + md.domain_name + '</span></div><div class="meta-item"><span class="meta-badge ' + levelClass + '">' + md.level_name + '</span></div>' + (t ? '<div class="meta-item"><span class="meta-badge texture-badge">' + t + ' ' + (md.texture_name||'') + '</span></div>' : '') + (md.depth ? '<div class="meta-item"><span class="meta-badge depth-breadth">' + db + '</span></div>' : '') + '<div class="meta-item"><span class="icon">\u23F1\uFE0F</span>\u7EA6' + md.reading_time + '\u5206\u949F\u9605\u8BFB</div><div class="meta-item"><span class="icon">\uD83D\uDCE6</span>' + md.module_count + '\u4E2A\u6A21\u5757</div>' + planInfo + '</div>';
}

function renderFormulas(container) {
  if (typeof renderMathInElement !== 'undefined') {
    renderMathInElement(container, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '$', right: '$', display: false }
      ],
      throwOnError: false
    });
  }
}

function createThemedOption() {
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  var color = isDark
    ? ['#818cf8','#a78bfa','#c4b5fd','#67e8f9','#fbbf24','#34d399','#f87171','#f472b6']
    : ['#6366f1','#8b5cf6','#a78bfa','#22d3ee','#f59e0b','#10b981','#ef4444','#ec4899'];
  return { color: color };
}

function renderChart(moduleId, chartConfig, index) {
  var chartId = 'chart_' + moduleId + '_' + index;
  var wrapper = document.getElementById(chartId);
  if (!wrapper) return;
  if (typeof echarts === 'undefined') {
    wrapper.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-tertiary);font-size:13px;">\uD83D\uDCCA \u56FE\u8868(\u9759\u6001\u6A21\u5F0F)<br><small>\u52A0\u8F7DCDN\u540E\u53EF\u4EA4\u4E92</small></div>';
    return;
  }
  try {
    var chart = echarts.init(wrapper);
    var opt = chartConfig.echarts_option || {};
    if (typeof opt === 'string') {
      try { chart.setOption(Object.assign({}, createThemedOption(), JSON.parse(opt))); } catch(e) { wrapper.textContent = '\u56FE\u8868\u914D\u7F6E\u89E3\u6790\u5931\u8D25'; return; }
    } else {
      chart.setOption(Object.assign({}, createThemedOption(), opt));
    }
    activeCharts[chartId] = chart;
    var resizeObserver = new ResizeObserver(function() { chart.resize(); });
    resizeObserver.observe(wrapper);
  } catch(e) {
    wrapper.textContent = '\u56FE\u8868\u6E32\u67D3\u5931\u8D25: ' + e.message;
  }
}

function buildModuleHTML(mod) {
  var tagClass = getTagClass(mod.module_tag || '');
  var html = '<section class="module-section" id="' + mod.module_id + '"><div class="module-header"><span class="module-tag ' + tagClass + '">' + (mod.module_tag || '') + '</span><h2 class="module-title">' + (mod.module_title || mod.module_id) + '</h2></div>';
  if (mod.hook) {
    html += '<div class="module-hook">' + mod.hook + '</div>';
  }
  html += '<div class="module-content">' + parseMarkdownContent(mod.content || '') + '</div>';
  if (mod.formulas && mod.formulas.length > 0) {
    mod.formulas.forEach(function(formula) {
      var hasDerivation = formula.expandable && formula.derivation;
      html += '<div class="formula-block' + (hasDerivation ? '' : ' not-expandable') + '" onclick="' + (hasDerivation ? 'toggleDerivation(this)' : '') + '"><div>' + formula.latex + '</div>';
      if (formula.caption) {
        html += '<div class="formula-caption">' + formula.caption + '</div>';
      }
      if (hasDerivation) {
        html += '<div class="formula-expand-hint">\uD83D\uDCA1 \u70B9\u51FB\u5C55\u5F00\u63A8\u5BFC\u8FC7\u7A0B</div><div class="formula-derivation">' + formula.derivation + '</div>';
      }
      html += '</div>';
    });
  }
  if (mod.charts && mod.charts.length > 0) {
    mod.charts.forEach(function(chart, ci) {
      var chartId = 'chart_' + mod.module_id + '_' + ci;
      html += '<div class="chart-container"><div class="chart-wrapper" id="' + chartId + '"></div>';
      if (chart.caption) html += '<div class="chart-caption">' + chart.caption + '</div>';
      if (chart.data_source) html += '<div class="chart-source">' + chart.data_source + '</div>';
      html += '</div>';
    });
  }
  if (mod.tables && mod.tables.length > 0) {
    mod.tables.forEach(function(table) {
      html += '<div style="overflow-x:auto"><table class="module-table"><thead><tr>' + (table.headers||[]).map(function(h) { return '<th>' + h + '</th>'; }).join('') + '</tr></thead><tbody>' + (table.rows||[]).map(function(row) { return '<tr>' + row.map(function(c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>';
      if (table.caption) html += '<div class="table-caption">' + table.caption + '</div>';
      html += '</div>';
    });
  }
  if (mod.references && mod.references.length > 0) {
    html += '<div class="module-references"><h4>\uD83D\uDCDA \u53C2\u8003\u6587\u732E</h4><ol>';
    mod.references.forEach(function(ref) {
      var linkHtml = ref.doi ? ' <a href="https://doi.org/' + ref.doi + '" target="_blank">DOI</a>' : '';
      var urlHtml = ref.url ? ' <a href="' + ref.url + '" target="_blank">\u94FE\u63A5</a>' : '';
      html += '<li>' + (ref.authors || '') + ' (' + (ref.year || '') + '). <strong>' + (ref.title || '') + '</strong>.' + linkHtml + urlHtml + '</li>';
    });
    html += '</ol></div>';
  }
  if (mod.key_takeaway) {
    html += '<div class="key-takeaway">\uD83D\uDCA1 ' + mod.key_takeaway + '</div>';
  }
  html += '</section>';
  return html;
}

function getTagClass(tag) {
  var map = {
    '\u6838\u5FC3\u6982\u5FF5': 'tag-core',
    '\u524D\u7F6E\u77E5\u8BC6': 'tag-core',
    '\u6838\u5FC3\u5DE5\u5177': 'tag-tools',
    '\u53D1\u5C55\u6F14\u8FDB': 'tag-evolution',
    '\u5B9E\u8DF5\u5E94\u7528': 'tag-application',
    '\u98CE\u9669\u4E0E\u6311\u6218': 'tag-risk',
    '\u524D\u6CBF\u63A2\u7D22': 'tag-frontier'
  };
  return map[tag] || 'tag-core';
}

function parseMarkdownContent(content) {
  if (!content) return '';
  var html = content;
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  html = html.replace(/`([^`]+)`/g, '<code style="background:var(--bg-tertiary);padding:2px 6px;border-radius:4px;font-size:13px;">$1</code>');
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  html = html.replace(/^### (.+)$/gm, '<h3 style="font-size:17px;font-weight:600;margin:20px 0 8px;">$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h3 style="font-size:18px;font-weight:600;margin:24px 0 10px;">$1</h3>');
  html = html.replace(/\n\n/g, '</p><p>');
  html = '<p>' + html + '</p>';
  html = html.replace(/<p>\s*<\/p>/g, '');
  return html;
}

function toggleDerivation(el) {
  el.classList.toggle('expanded');
}

function initPage() {
  document.body.classList.remove('loading');
  document.body.classList.add('loaded');

  buildMetaCard();
  buildSidebar();
  buildMobileNav();

  var modulesContainer = document.getElementById('modules-container');
  PAGE_DATA.modules.forEach(function(mod) {
    var html = buildModuleHTML(mod);
    modulesContainer.innerHTML += html;
  });

  var sectionEls = modulesContainer.querySelectorAll('.module-section');
  sectionEls.forEach(function(sec) { observer.observe(sec); });

  renderFormulas(modulesContainer);

  setTimeout(function() {
    PAGE_DATA.modules.forEach(function(mod) {
      if (mod.charts) {
        mod.charts.forEach(function(chart, ci) {
          renderChart(mod.module_id, chart, ci);
        });
      }
    });
  }, 100);

  var fadeObserver = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
      }
    });
  }, { threshold: 0.08 });
  sectionEls.forEach(function(sec) { fadeObserver.observe(sec); });

  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); openSearch(); }
    if ((e.ctrlKey || e.metaKey) && e.key === 'd') { e.preventDefault(); toggleTheme(); }
    if (e.key === 'Escape') {
      if (document.getElementById('searchOverlay').classList.contains('open')) { closeSearch(); return; }
      if (document.getElementById('helpOverlay').classList.contains('open')) { document.getElementById('helpOverlay').classList.remove('open'); return; }
    }
    if (e.shiftKey && e.key === '?') { e.preventDefault(); document.getElementById('helpOverlay').classList.add('open'); }
  });
}

function exportPDF() { window.print(); }

function openSearch() {
  var ov = document.getElementById('searchOverlay'); ov.classList.add('open');
  var inp = document.getElementById('searchInput'); inp.value = ''; inp.focus();
  document.getElementById('searchResults').innerHTML = '';
}
function closeSearch() { document.getElementById('searchOverlay').classList.remove('open'); }
document.getElementById('searchOverlay').addEventListener('click', function(e) { if (e.target === this) closeSearch(); });
document.getElementById('searchInput').addEventListener('input', function() {
  var q = this.value.toLowerCase(); var r = document.getElementById('searchResults');
  if (!q || q.length < 2) { r.innerHTML = ''; return; }
  function hl(t) { if (!t) return ''; var i = t.toLowerCase().indexOf(q); if (i === -1) return t; return t.substring(0,i)+'<mark>'+t.substring(i,i+q.length)+'</mark>'+t.substring(i+q.length); }
  var results = [];
  PAGE_DATA.modules.forEach(function(m) {
    var title = m.module_title || m.module_id || '';
    var txt = (m.hook||'') + ' ' + (m.content||'') + ' ' + (m.key_takeaway||'');
    if (title.toLowerCase().indexOf(q) !== -1 || txt.toLowerCase().indexOf(q) !== -1) {
      results.push({ id: m.module_id, title: hl(title), snippet: (m.hook || txt).substring(0, 80) });
    }
  });
  r.innerHTML = results.slice(0, 12).map(function(x) { return '<div class="sr-item" onclick="document.getElementById(\''+x.id+'\').scrollIntoView({behavior:\'smooth\'});closeSearch();"><div class="sr-title">'+x.title+'</div><div class="sr-snippet">'+x.snippet+'</div></div>'; }).join('') || '<div class="search-empty">\u65E0\u5339\u914D\u7ED3\u679C</div>';
});

function exportNotes() {
  var lines = ['# '+PAGE_DATA.topic+' - \u5B66\u4E60\u7B14\u8BB0', '', '\u751F\u6210\u65E5\u671F: '+new Date().toLocaleDateString('zh-CN'), ''];
  lines.push('## \uD83D\uDCDA \u6A21\u5757\u5217\u8868');
  PAGE_DATA.modules.forEach(function(m) { lines.push('- **'+(m.module_title||m.module_id)+'**: '+(m.key_takeaway||m.hook||'')); });
  var txt = lines.join('\n');
  if (navigator.clipboard) { navigator.clipboard.writeText(txt).then(function() { alert('\u2705 \u5B66\u4E60\u7B14\u8BB0\u5DF2\u590D\u5236\u5230\u526A\u8D34\u677F!'); }); }
  else { var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); alert('\u2705 \u5B66\u4E60\u7B14\u8BB0\u5DF2\u590D\u5236\u5230\u526A\u8D34\u677F!'); }
}

function buildMobileNav() {
  var items = [];
  PAGE_DATA.modules.forEach(function(m, i) { if (i % Math.max(1, Math.ceil(PAGE_DATA.modules.length / 5)) === 0) items.push({ id: m.module_id, label: (m.module_title||m.module_id).substring(0, 4) }); });
  if (items.length > 5) items = items.slice(0, 5);
  var inner = document.getElementById('mbnInner');
  inner.innerHTML = items.map(function(x) { return '<button class="mbn-item" onclick="document.getElementById(\''+x.id+'\').scrollIntoView({behavior:\'smooth\'})"><span class="mbn-icon">\uD83D\uDCD1</span>'+x.label+'</button>'; }).join('');
  inner.innerHTML += '<button class="mbn-item" onclick="window.scrollTo({top:0,behavior:\'smooth\'})"><span class="mbn-icon">\u2B06</span>\u9876\u90E8</button>';
}
document.getElementById('helpOverlay').addEventListener('click', function(e) { if (e.target === this) this.classList.remove('open'); });

window.addEventListener('scroll', function() {
  var sections = document.querySelectorAll('.module-section');
  var activeIdx = -1;
  sections.forEach(function(s, i) { var top = s.getBoundingClientRect().top; if (top < 150 && top > -s.offsetHeight + 150) activeIdx = i; });
  var btns = document.querySelectorAll('.mbn-item');
  btns.forEach(function(b, i) { b.classList.toggle('mbn-active', i === activeIdx); });
});

document.addEventListener('DOMContentLoaded', initPage);

window.addEventListener('themechange', function() {
  Object.values(activeCharts).forEach(function(chart) { chart.resize(); });
});

(function(){
  var cv = document.getElementById('bg-canvas');
  var ctx = cv.getContext('2d');
  var particles = [];
  function rsz() { cv.width = window.innerWidth; cv.height = window.innerHeight; }
  window.addEventListener('resize', rsz); rsz();
  var count = Math.min(60, Math.floor((cv.width * cv.height) / 20000));
  for (var i = 0; i < count; i++) {
    particles.push({ x: Math.random()*cv.width, y: Math.random()*cv.height, vx: (Math.random()-0.5)*0.3, vy: (Math.random()-0.5)*0.3, r: Math.random()*1.5+0.3, a: Math.random()*0.3+0.05 });
  }
  function animate() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    var isDark = document.documentElement.getAttribute('data-theme') !== 'light';
    var c = isDark ? '129,140,248' : '99,102,241';
    particles.forEach(function(p) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = cv.width; if (p.x > cv.width) p.x = 0;
      if (p.y < 0) p.y = cv.height; if (p.y > cv.height) p.y = 0;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.28);
      ctx.fillStyle = 'rgba('+c+','+p.a+')'; ctx.fill();
    });
    for (var j = 0; j < particles.length; j++) {
      for (var k = j+1; k < particles.length; k++) {
        var dx = particles[j].x - particles[k].x;
        var dy = particles[j].y - particles[k].y;
        var d = Math.sqrt(dx*dx+dy*dy);
        if (d < 110) { ctx.beginPath(); ctx.moveTo(particles[j].x, particles[j].y); ctx.lineTo(particles[k].x, particles[k].y); ctx.strokeStyle = 'rgba('+c+','+(0.06*(1-d/110))+')'; ctx.lineWidth = 0.5; ctx.stroke(); }
      }
    }
    requestAnimationFrame(animate);
  }
  animate();
})();
</script>
</body>
