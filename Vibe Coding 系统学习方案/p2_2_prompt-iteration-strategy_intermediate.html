<style>
:root{
--bg:#0d0d0d;--bg-secondary:#1a1a1a;--bg-tertiary:#222222;
--text:#ededed;--text-secondary:#a0a0a0;--text-tertiary:#787878;
--border:rgba(160,160,160,.15);
--primary:#5b8db8;--primary-light:rgba(91,141,184,.12);
--accent:#8878a8;--accent-light:rgba(136,120,168,.12);
--cyan:#6ea8c0;--cyan-light:rgba(110,168,192,.1);
--orange:#c0a060;--orange-light:rgba(192,160,96,.1);
--green:#5a9e6f;--green-light:rgba(90,158,111,.1);
--red:#c06050;--red-light:rgba(192,96,80,.1);
--pink:#8878a8;--pink-light:rgba(136,120,168,.12);
--shadow-sm:0 1px 3px rgba(0,0,0,.3);--shadow:0 4px 16px rgba(0,0,0,.4);
--shadow-md:0 4px 16px rgba(0,0,0,.4);--shadow-lg:0 8px 32px rgba(0,0,0,.5);
}
[data-theme="light"]{
--bg:#fafafa;--bg-secondary:#ffffff;--bg-tertiary:#eeeeee;
--text:#121212;--text-secondary:#4a4a4a;--text-tertiary:#5e5e5e;
--border:rgba(18,18,18,.08);
--primary:#3a6088;--primary-light:rgba(58,96,136,.08);
--accent:#5a4878;--accent-light:rgba(90,72,120,.08);
--cyan:#3a7888;--cyan-light:rgba(58,120,136,.08);
--orange:#886830;--orange-light:rgba(136,104,48,.08);
--green:#3d8055;--green-light:rgba(61,128,85,.08);
--red:#983830;--red-light:rgba(152,56,48,.08);
--pink:#5a4878;--pink-light:rgba(90,72,120,.08);
--shadow-sm:0 1px 3px rgba(0,0,0,.06);--shadow:0 4px 16px rgba(0,0,0,.08);
--shadow-md:0 4px 16px rgba(0,0,0,.08);--shadow-lg:0 8px 32px rgba(0,0,0,.12);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  transition: background var(--transition), color var(--transition);
}

body.loading{opacity:0}body.loaded{opacity:1;transition:opacity 0.4s ease}

/* Progress Bar */
#progress-bar {
  position: fixed; top: 0; left: 0; height: 3px;
  background: linear-gradient(90deg, var(--primary), var(--accent), var(--cyan));
  z-index: 1000; transition: width 0.1s linear;
}

/* Theme Toggle */
#theme-toggle {
  position: fixed; top: 20px; right: 20px; z-index: 999;
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--bg-secondary); border: 1px solid var(--border);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 18px; transition: all var(--transition);
  box-shadow: var(--shadow-sm);
}
#theme-toggle:hover { transform: scale(1.1); box-shadow: var(--shadow); }

/* Sidebar */
#sidebar {
  position: fixed; top: 0; left: 0; width: var(--sidebar-width); height: 100vh;
  background: var(--bg-secondary); border-right: 1px solid var(--border);
  padding: 80px 16px 24px; overflow-y: auto; z-index: 100;
  transition: transform var(--transition);
}
#sidebar h3 {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--text-tertiary); margin-bottom: 12px; font-weight: 600;
}
.sidebar-link {
  display: block; padding: 6px 12px; margin: 2px 0; border-radius: var(--radius-sm);
  font-size: 13px; color: var(--text-secondary); text-decoration: none;
  transition: all var(--transition); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sidebar-link:hover { background: var(--bg-tertiary); color: var(--text); }
.sidebar-link.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }

/* Main Content */
#main-content {
  margin-left: var(--sidebar-width);
  max-width: calc(100% - var(--sidebar-width) - 40px);
  padding: 60px 32px 120px;
}

/* Meta Card */
.meta-card {
  background: linear-gradient(135deg, var(--primary-light), var(--accent-light));
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px 32px; margin-bottom: 48px;
  display: flex; flex-wrap: wrap; gap: 24px; align-items: center;
}
.meta-card .meta-item { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-secondary); }
.meta-card .meta-item .icon { font-size: 20px; }
.meta-card .meta-item strong { color: var(--text); }
.meta-badge {
  display: inline-block; padding: 4px 12px; border-radius: 20px;
  font-size: 12px; font-weight: 600; letter-spacing: 0.02em;
}
.meta-badge.domain-finance { background: var(--primary-light); color: var(--primary); }
.meta-badge.domain-ai { background: var(--accent-light); color: var(--accent); }
.meta-badge.level-beginner { background: var(--green-light); color: var(--green); }
.meta-badge.level-intermediate { background: var(--orange-light); color: var(--orange); }
.meta-badge.level-expert { background: var(--red-light); color: var(--red); }

.meta-badge.texture-badge {
  background: var(--cyan-light); color: #0891b2;
  font-family: 'SF Mono', 'JetBrains Mono', monospace;
}

.meta-badge.depth-breadth {
  background: var(--pink-light); color: var(--pink);
}

#cdn-indicator {
  position: fixed; top: 20px; right: 72px; z-index: 999;
  padding: 4px 10px; border-radius: 6px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.03em;
  background: var(--green-light); color: var(--green);
  display: none;
}
#cdn-indicator.enhanced { display: block; background: var(--orange-light); color: var(--orange); }
#cdn-indicator.baseline { display: block; background: var(--bg-tertiary); color: var(--text-tertiary); }

/* Module Section */
.module-section {
  margin-bottom: 56px; opacity: 0; transform: translateY(24px);
  transition: opacity 0.6s ease, transform 0.6s ease;
}
.module-section.visible { opacity: 1; transform: translateY(0); }

.module-header {
  display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
}
.module-tag {
  display: inline-block; padding: 3px 10px; border-radius: 6px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase;
}
.tag-core { background: var(--primary-light); color: var(--primary); }
.tag-tools { background: var(--accent-light); color: var(--accent); }
.tag-evolution { background: var(--cyan-light); color: #0891b2; }
.tag-application { background: var(--green-light); color: var(--green); }
.tag-risk { background: var(--red-light); color: var(--red); }
.tag-frontier { background: var(--orange-light); color: var(--orange); }

.module-title {
  font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -0.02em;
}

.module-hook {
  font-size: 16px; color: var(--text-secondary); font-style: italic;
  border-left: 3px solid var(--primary); padding-left: 16px; margin-bottom: 20px;
}

.module-content { font-size: 15px; color: var(--text); }
.module-content p { margin-bottom: 12px; }
.module-content strong { color: var(--text); }
.module-content a { color: var(--primary); text-decoration: none; }
.module-content a:hover { text-decoration: underline; }
.module-content ul, .module-content ol { margin: 8px 0 16px 24px; }
.module-content li { margin-bottom: 6px; }

/* Formula */
.formula-block {
  background: var(--bg-tertiary); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 20px 24px; margin: 16px 0;
  position: relative; cursor: pointer; transition: all var(--transition);
}
.formula-block:hover { box-shadow: var(--shadow); }
.formula-caption { font-size: 12px; color: var(--text-tertiary); margin-top: 8px; text-align: center; }
.formula-derivation {
  display: none; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border);
  font-size: 14px; color: var(--text-secondary);
}
.formula-block.expanded .formula-derivation { display: block; }
.formula-expand-hint {
  font-size: 11px; color: var(--text-tertiary); text-align: right; margin-top: 4px;
}

/* Chart */
.chart-container {
  background: var(--bg-secondary); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 24px; margin: 20px 0;
}
.chart-wrapper { width: 100%; height: 380px; }
.chart-caption { font-size: 13px; color: var(--text-secondary); text-align: center; margin-top: 12px; }
.chart-source { font-size: 11px; color: var(--text-tertiary); text-align: right; margin-top: 4px; }

/* Table */
.module-table {
  width: 100%; border-collapse: collapse; margin: 16px 0;
  font-size: 14px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  overflow: hidden;
}
.module-table th {
  background: var(--bg-tertiary); padding: 10px 16px; text-align: left;
  font-weight: 600; font-size: 12px; text-transform: uppercase;
  letter-spacing: 0.03em; color: var(--text-secondary);
}
.module-table td { padding: 10px 16px; border-top: 1px solid var(--border); color: var(--text); }
.module-table tr:hover td { background: var(--bg-tertiary); }
.table-caption { font-size: 12px; color: var(--text-tertiary); text-align: center; margin-top: 8px; }

/* References */
.module-references {
  margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border);
  font-size: 12px; color: var(--text-tertiary);
}
.module-references h4 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
.module-references ol { margin-left: 20px; }
.module-references li { margin-bottom: 4px; }

/* Key Takeaway */
.key-takeaway {
  margin-top: 16px; padding: 14px 20px; border-radius: var(--radius-sm);
  background: var(--primary-light); border-left: 4px solid var(--primary);
  font-size: 14px; font-weight: 500; color: var(--text);
}

/* Footer */
#page-footer {
  margin-top: 60px; padding: 32px 0; border-top: 1px solid var(--border);
  display: flex; gap: 12px; flex-wrap: wrap;
}
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 20px; border-radius: var(--radius-sm);
  font-size: 14px; font-weight: 500; cursor: pointer;
  border: 1px solid var(--border); background: var(--bg);
  color: var(--text); transition: all var(--transition);
  text-decoration: none;
}
.btn:hover { background: var(--bg-tertiary); }
.btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn.primary:hover { filter: brightness(1.1); }

/* Tooltip */
.tooltip-trigger {
  color: var(--primary); text-decoration: underline dotted;
  cursor: help; position: relative;
}
.tooltip-content {
  display: none; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
  background: var(--text); color: var(--bg); padding: 8px 12px; border-radius: 6px;
  font-size: 12px; white-space: nowrap; z-index: 500; box-shadow: var(--shadow-lg);
  pointer-events: none;
}
.tooltip-trigger:hover .tooltip-content { display: block; }

/* Mobile Sidebar */
#sidebar-toggle {
  display: none; position: fixed; top: 16px; left: 16px; z-index: 999;
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--bg-secondary); border: 1px solid var(--border);
  cursor: pointer; font-size: 18px; align-items: center; justify-content: center;
  box-shadow: var(--shadow-sm);
}

/* Responsive */
@media (max-width: 1024px) {
  :root { --sidebar-width: 200px; }
  #main-content { padding: 48px 24px 80px; }
}
@media (max-width: 768px) {
  #sidebar-toggle { display: flex; }
  #sidebar { transform: translateX(-100%); }
  #sidebar.open { transform: translateX(0); }
  #main-content { margin-left: 0; max-width: 100%; padding: 72px 20px 60px; }
  #theme-toggle { top: 16px; right: 16px; }
  .meta-card { padding: 20px 24px; flex-direction: column; gap: 12px; align-items: flex-start; }
  .chart-wrapper { height: 280px; }
  .module-title { font-size: 19px; }
}

@media print {
  #sidebar, #progress-bar, #theme-toggle, #page-footer { display: none !important; }
  #main-content { margin-left: 0; max-width: 100%; padding: 0; }
  .module-section { opacity: 1; transform: none; break-inside: avoid; }
  body { font-size: 12px; line-height: 1.5; }
  #bg-canvas, .mobile-bottom-nav, .search-overlay, .help-overlay { display: none !important; }
}

/* Canvas Background */
#bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

/* Search Overlay */
.search-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 500; background: rgba(0,0,0,0.6); display: flex; justify-content: center; padding-top: 18vh; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
.search-overlay.open { opacity: 1; pointer-events: auto; }
[data-theme="dark"] .search-overlay { background: rgba(0,0,0,0.7); }
[data-theme="light"] .search-overlay { background: rgba(15,23,42,0.3); }
.search-dialog { width: 560px; max-width: 92vw; border-radius: 16px; background: var(--bg-secondary); border: 1px solid var(--border); box-shadow: 0 25px 60px rgba(0,0,0,0.5); overflow: hidden; }
.search-dialog input { width: 100%; padding: 16px 20px; border: none; background: transparent; color: var(--text); font-size: 16px; outline: none; border-bottom: 1px solid var(--border); }
.search-dialog input::placeholder { color: var(--text-tertiary); }
.search-results { max-height: 360px; overflow-y: auto; }
.search-results .sr-item { padding: 12px 20px; cursor: pointer; transition: background 0.15s; border-bottom: 1px solid rgba(255,255,255,0.03); }
.search-results .sr-item:hover { background: var(--bg-tertiary); }
.search-results .sr-item .sr-title { font-size: 14px; font-weight: 600; color: var(--text); }
.search-results .sr-item .sr-title mark { background: rgba(52,211,153,0.25); color: #34d399; border-radius: 2px; padding: 0 2px; font-weight: 700; }
[data-theme="light"] .search-results .sr-item .sr-title mark { background: rgba(16,185,129,0.2); color: #10b981; }
.search-results .sr-item .sr-snippet { font-size: 12px; color: var(--text-tertiary); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search-empty { text-align: center; padding: 28px; color: var(--text-tertiary); font-size: 13px; }

/* Help Overlay */
.help-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 600; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
[data-theme="light"] .help-overlay { background: rgba(15,23,42,0.3); }
.help-overlay.open { opacity: 1; pointer-events: auto; }
.help-dialog { padding: 28px 32px; border-radius: 16px; background: var(--bg-secondary); border: 1px solid var(--border); max-width: 400px; margin: 0 16px; box-shadow: 0 25px 60px rgba(0,0,0,0.5); }
.help-dialog h4 { font-size: 15px; margin-bottom: 14px; color: var(--green); }
.help-dialog .kbd-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.help-dialog .kbd-row:last-child { border-bottom: none; }
.help-dialog .kbd-key { padding: 3px 8px; border-radius: 5px; background: var(--bg-tertiary); border: 1px solid var(--border); font-family: 'JetBrains Mono',monospace; font-size: 11px; color: var(--primary); min-width: 20px; text-align: center; white-space: nowrap; }
.help-dialog .kbd-desc { color: var(--text-secondary); flex: 1; }

/* Mobile Bottom Nav */
.mobile-bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 300; background: var(--bg-secondary); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--border); padding: 6px 8px; padding-bottom: max(6px, env(safe-area-inset-bottom)); }
.mobile-bottom-nav .mbn-inner { display: flex; justify-content: space-around; align-items: center; }
.mobile-bottom-nav .mbn-item { display: flex; flex-direction: column; align-items: center; gap: 1px; color: var(--text-tertiary); cursor: pointer; font-size: 10px; font-weight: 500; background: transparent; border: none; padding: 4px; font-family: inherit; transition: color 0.2s; }
.mobile-bottom-nav .mbn-item:hover, .mobile-bottom-nav .mbn-item.mbn-active { color: var(--green); }
.mobile-bottom-nav .mbn-item .mbn-icon { font-size: 17px; }

@media (max-width: 768px) {
  .mobile-bottom-nav { display: block; }
  #page-footer { padding-bottom: 64px; }
}
</style>
</head>

<script>
// ============ DATA INJECTION POINT ============
const PAGE_DATA = {

      content: "提示迭代优化的核心定义是：**通过系统化的测试、评估和调整循环，持续提升LLM在特定任务上的输出质量、一致性和效率的过程。**\n\n其三个核心支柱为：\n\n### 1. A/B测试（Prompt A/B Testing）\n对同一任务设计两个或多个提示变体，在相同测试集上运行，通过量化指标比较表现。例如：\n- **变体A**：直接指令 `将以下文本总结为3句话`\n- **变体B**：结构化指令 `请按以下格式总结：[要点1]、[要点2]、[要点3]`\n\nA/B测试的关键原则：**每次只改变一个变量**（控制变量法），否则无法归因性能变化。\n\n### 2. 提示版本管理（Prompt Versioning）\n将每次修改的提示保存为不可变版本（类似Git commit），记录：\n- 修改时间、修改人、修改原因\n- 对应的评测分数（准确率、延迟、token消耗）\n- 模型版本和超参数配置\n\n推荐命名规范：`task_v{major}.{minor}_{date}`，例如 `summarize_v2.3_20260115`\n\n### 3. 评测循环（Evaluation Loop）\n每次提示修改后自动触发评测流程：\n1. 加载测试集（含标准答案或评分标准）\n2. 批量调用LLM获取输出\n3. 计算评测指标（准确率、F1、ROUGE-L等）\n4. 生成对比报告\n\n这三个支柱共同构成了提示优化的「骨架」——缺少任何一个，优化过程就会退化为「凭感觉修改」。",

      content: "提示迭代优化最经典的理论框架是**PDCA循环**（Plan-Do-Check-Act），它由统计学家戴明推广，但在LLM时代被赋予了全新的内涵：\n\n### Plan（计划阶段）\n- 分析当前提示的缺点：通过错误分析（Error Analysis）识别高频失败模式\n- 设定优化目标：例如「将分类准确率从87%提升到93%」\n- 制定优化假设：例如「添加2个Few-Shot示例应该能减少格式错误」\n\n### Do（执行阶段）\n- 基于假设创建提示的新版本\n- 修改范围应尽量小：「一次只改变一个因素」\n- 记录修改内容到版本管理系统\n\n### Check（检查阶段）\n- 在新旧提示之间运行A/B测试\n- 计算量化指标差异，检查是否满足目标\n- 进行统计显著性检验：提升是否显著，还是随机波动？\n\n### Act（处理阶段）\n- 如果目标达成：将新提示设为生产版本，记录成功经验\n- 如果未达成：分析失败原因，返回Plan阶段提出新假设\n- 关键原则：**每个PDCA循环完成后，基线（Baseline）自动更新为最新最优版本**\n\n### 反馈回路分析\n一个完整的提示优化迭代可以形式化为以下优化过程：给定初始提示 $$p_0$$ 和评测函数 $$E(p)$$（返回提示p在某任务上的性能分数），我们希望在迭代次数 $$T$$ 内找到：\n\n$$p^* = \\arg\\max_{p \\in \\{p_0, p_1, ..., p_T\\}} E(p)$$\n\n其中每一步 $$p_{t+1} = f(p_t, \\Delta_t)$$，$$\\Delta_t$$ 是基于第t轮检查结果得出的修改策略。",

      content: "以下是经过10+个生产项目验证的**提示迭代优化标准流程**（Standard Operating Procedure）：\n\n### 步骤1：建立基线（Baseline） ⏱️ 约1小时\n- [ ] 编写提示的初始版本 `prompt_v1.0`\n- [ ] 准备**黄金测试集**（Golden Test Set）：至少50条代表性样本+标准答案\n- [ ] 运行基线评测，记录所有指标作为基准\n- [ ] **代码示例**：\n```\nimport json\nresults = []\nfor sample in test_set:\n    output = llm.call(prompt_v1, sample.input)\n    score = evaluate(output, sample.golden_answer)\n    results.append(score)\nbaseline_score = sum(results) / len(results)\nprint(f\"Baseline: {baseline_score:.2%}\")\n```\n\n### 步骤2：错误分析（Error Analysis） ⏱️ 约1-2小时\n- [ ] 将测试结果按错误类型聚类：格式错误、内容遗漏、幻觉、逻辑错误等\n- [ ] 为每类错误统计频率，生成**帕累托图**（Pareto Chart）确定优先级\n- [ ] 提出2-3个优化假设，按预期效果排序\n\n### 步骤3：创建变体（Create Variants） ⏱️ 约30分钟/个\n- [ ] 基于假设创建提示变体：`prompt_v1.1`, `prompt_v1.2`\n- [ ] 每次只改变**一个因素**（控制变量法）\n- [ ] 记录修改内容：`git commit -m \"v1.1: add role setting 'You are an expert summarizer'\"`\n\n### 步骤4：并行评测（Parallel Evaluation） ⏱️ 取决于API速率\n- [ ] 同时运行所有变体 + 基线（确保模型版本一致）\n- [ ] 记录：准确率、F1、延迟、token消耗\n- [ ] 运行统计显著性检验（如McNemar检验）\n\n### 步骤5：分析与决策（Analysis & Decision） ⏱️ 约30分钟\n- [ ] 生成对比报告：变体 vs 基线的**效果量**（Effect Size）\n- [ ] 做出决策：采纳 / 拒绝 / 回滚\n- [ ] 决策矩阵：\n  - 效果 > 5% 且 p < 0.05 → **立即采纳**\n  - 效果 2-5% 且 p < 0.05 → **可选采纳（需人工评审确认）**\n  - 效果 < 2% 或 p > 0.05 → **拒绝（退回步骤2）**\n\n### 步骤6：部署与监控（Deploy & Monitor） ⏱️ 持续\n- [ ] 将新基线推送到生产环境\n- [ ] 设置**漂移检测**：每周自动运行评测，检测性能是否下降\n- [ ] 当性能下降到阈值时，自动触发新一轮迭代",

      content: "基于数十个生产项目的经验总结，以下是提示迭代优化中最常见的六个误区：\n\n### 误区1：「迭代越多越好」\n**真相**：大多数提示在5-8轮迭代后就会遇到**收益递减点**（Diminishing Returns Point）。超过这个点，每轮提升可能<1%，而过度优化的风险（过拟合、提示膨胀）急剧上升。\n**正确做法**：设置**早停标准**（Early Stopping Criteria）——连续2轮提升<2%即停止。\n\n### 误区2：「评测分数高 = 生产表现好」\n**真相**：评测分数和生产表现之间的相关性通常在0.6-0.8之间（r值），这意味着有相当比例的「高分提示」在生产中表现平平。\n**正确做法**：在优化流程中加入**A/B上线测试**（Shadow Deployment），将候选提示部署到5-10%的流量上观察实际表现。\n\n### 误区3：「模型越大，提示越不重要」\n**真相**：GPT-4虽然比GPT-3.5更「聪明」，但对提示中的**歧义**也更加敏感。一个在GPT-3.5上「碰巧好用」的模糊提示，在GPT-4上可能产生完全不同的解释。\n\n### 误区4：「Few-Shot示例越多越好」\n**真相**：示例数量与效果的关系是非线性的。3-5个精选示例通常达到最佳效果，超过8个反而可能因**上下文窗口稀释**导致性能下降。\n\n### 误区5：「优化 = 不断加内容」\n**真相**：有效的优化经常是**做减法**：删除冗余的指令、精简示例、用更准确的措辞替代模糊描述。\n\n### 误区6：「自动化可以完全替代人工判断」\n**真相**：自动指标和LLM-as-Judge只能告诉你「是否更好」，不能告诉你「为什么更好」。保留人工抽检环节（至少每5轮一次）对于发现**指标无法捕获的质量问题**至关重要。",

// ============ THEME ============
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('slm-theme', theme);
  updateThemeIcon();
  Object.values(activeCharts).forEach(chart => {
    const opt = chart.getOption();
    chart.setOption(createThemedOption(opt), { notMerge: false });
  });
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  applyTheme(current === 'dark' ? 'light' : 'dark');
}

function updateThemeIcon() {
  const t = document.getElementById('theme-toggle');
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  t.textContent = isDark ? '\u2600\uFE0F' : '\uD83C\uDF13';
}

const savedTheme = localStorage.getItem('slm-theme') || 'dark';
applyTheme(savedTheme);

function renderFormulas(container) {

    renderMathInElement(container, {

// ============ CHART RENDERING ============
function createThemedOption(existingOpt) {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const color = isDark
    ? ['#5b8db8','#8878a8','#6ea8c0','#c0a060','#5a9e6f','#c06050','#8878a8']
    : ['#3a6088','#5a4878','#3a7888','#886830','#3d8055','#983830','#5a4878'];
  return { color: color, ...existingOpt };
}

function renderChart(moduleId, chartConfig, index) {
  const chartId = 'chart_' + moduleId + '_' + index;
  const wrapper = document.getElementById(chartId);
  if (!wrapper) return;

  if (typeof echarts === 'undefined') {
    wrapper.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-tertiary);font-size:13px;">\uD83D\uDCCA \u56FE\u8868(\u9759\u6001\u6A21\u5F0F)<br><small>\u52A0\u8F7DCDN\u540E\u53EF\u4EA4\u4E92<\/small><\/div>';
    return;
  }

  try {
    const chart = echarts.init(wrapper);
    const opt = chartConfig.echarts_option || {};
    if (typeof opt === 'string') {
      try { chart.setOption(createThemedOption(JSON.parse(opt))); } catch(e) { wrapper.textContent = '\u56FE\u8868\u914D\u7F6E\u89E3\u6790\u5931\u8D25'; return; }
    } else {
      chart.setOption(createThemedOption(opt));
    }
    activeCharts[chartId] = chart;

    const resizeObserver = new ResizeObserver(() => chart.resize());
    resizeObserver.observe(wrapper);
  } catch(e) {
    wrapper.textContent = '\u56FE\u8868\u6E32\u67D3\u5931\u8D25: ' + e.message;
  }
}

// ============ BUILD MODULES ============
function buildModuleHTML(mod) {
  const tagClass = getTagClass(mod.module_tag || '');

  let html = '\n    <section class="module-section" id="' + mod.module_id + '">\n      <div class="module-header">\n        <span class="module-tag ' + tagClass + '">' + (mod.module_tag || '') + '<\/span>\n        <h2 class="module-title">' + (mod.module_title || mod.module_id) + '<\/h2>\n      <\/div>';

  if (mod.hook) {
    html += '<div class="module-hook">' + mod.hook + '<\/div>';
  }

  html += '<div class="module-content">' + parseMarkdownContent(mod.content || '') + '<\/div>';

  // Formulas
  if (mod.formulas && mod.formulas.length > 0) {
    mod.formulas.forEach(function(formula, fi) {
      var hasDerivation = formula.expandable && formula.derivation;
      html += '<div class="formula-block' + (hasDerivation ? '' : ' not-expandable') + '" onclick="' + (hasDerivation ? 'toggleDerivation(this)' : '') + '">\n        <div>' + formula.latex + '<\/div>';
      if (formula.caption) {
        html += '<div class="formula-caption">' + formula.caption + '<\/div>';
      }
      if (hasDerivation) {
        html += '<div class="formula-expand-hint">\uD83D\uDCA1 \u70B9\u51FB\u5C55\u5F00\u63A8\u5BFC\u8FC7\u7A0B<\/div>\n        <div class="formula-derivation">' + formula.derivation + '<\/div>';
      }
      html += '<\/div>';
    });
  }

  // Charts
  if (mod.charts && mod.charts.length > 0) {
    mod.charts.forEach(function(chart, ci) {
      var chartId = 'chart_' + mod.module_id + '_' + ci;
      html += '<div class="chart-container">\n        <div class="chart-wrapper" id="' + chartId + '"><\/div>';
      if (chart.caption) html += '<div class="chart-caption">' + chart.caption + '<\/div>';
      if (chart.data_source) html += '<div class="chart-source">' + chart.data_source + '<\/div>';
      html += '<\/div>';
    });
  }

  // Tables
  if (mod.tables && mod.tables.length > 0) {
    mod.tables.forEach(function(table) {
      html += '<div style="overflow-x:auto">\n        <table class="module-table">\n          <thead><tr>' + (table.headers||[]).map(function(h){ return '<th>' + h + '<\/th>'; }).join('') + '<\/tr><\/thead>\n          <tbody>' + (table.rows||[]).map(function(row){ return '<tr>' + row.map(function(c){ return '<td>' + c + '<\/td>'; }).join('') + '<\/tr>'; }).join('') + '<\/tbody>\n        <\/table>';
      if (table.caption) html += '<div class="table-caption">' + table.caption + '<\/div>';
      html += '<\/div>';
    });
  }

  // References
  if (mod.references && mod.references.length > 0) {
    html += '<div class="module-references"><h4>\uD83D\uDCDA \u53C2\u8003\u6587\u732E<\/h4><ol>';
    mod.references.forEach(function(ref) {
      var linkHtml = ref.doi ? ' <a href="https://doi.org/' + ref.doi + '" target="_blank">DOI<\/a>' : '';
      var urlHtml = ref.url ? ' <a href="' + ref.url + '" target="_blank">\u94FE\u63A5<\/a>' : '';
      html += '<li>' + (ref.authors || '') + ' (' + (ref.year || '') + '). <strong>' + (ref.title || '') + '<\/strong>.' + linkHtml + urlHtml + '<\/li>';
    });
    html += '<\/ol><\/div>';
  }

  // Key Takeaway
  if (mod.key_takeaway) {
    html += '<div class="key-takeaway">\uD83D\uDCA1 ' + mod.key_takeaway + '<\/div>';
  }

  html += '<\/section>';
  return html;
}

function getTagClass(tag) {
  const map = {
    '\u6838\u5FC3\u6982\u5FF5': 'tag-core',
    '\u524D\u7F6E\u77E5\u8BC6': 'tag-core',
    '\u8DEF\u7EBF\u5BFC\u822A': 'tag-core',
    '\u6838\u5FC3\u5DE5\u5177': 'tag-tools',
    '\u53D1\u5C55\u6F14\u8FDB': 'tag-evolution',
    '\u5B9E\u8DF5\u5E94\u7528': 'tag-application',
    '\u98CE\u9669\u4E0E\u6311\u6218': 'tag-risk',
    '\u524D\u6CBF\u63A2\u7D22': 'tag-frontier'
  };
  return map[tag] || 'tag-core';
}

function parseMarkdownContent(content) {
  if (!content) return '';
  let html = content;
  // Bold
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1<\/strong>');
  // Italic
  html = html.replace(/\*(.+?)\*/g, '<em>$1<\/em>');
  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code style="background:var(--bg-tertiary);padding:2px 6px;border-radius:4px;font-size:13px;">$1<\/code>');
  // Links
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1<\/a>');
  // Headers
  html = html.replace(/^### (.+)$/gm, '<h3 style="font-size:17px;font-weight:600;margin:20px 0 8px;">$1<\/h3>');
  html = html.replace(/^## (.+)$/gm, '<h3 style="font-size:18px;font-weight:600;margin:24px 0 10px;">$1<\/h3>');
  // Line breaks -> paragraphs
  html = html.replace(/\n\n/g, '<\/p><p>');
  html = '<p>' + html + '<\/p>';
  html = html.replace(/<p>\s*<\/p>/g, '');
  return html;
}

function toggleDerivation(el) {
  el.classList.toggle('expanded');
}

// ============ INIT ============
function initPage() {
  document.body.classList.remove('loading');
  document.body.classList.add('loaded');

  buildMetaCard();
  buildSidebar();
  buildMobileNav();

  const modulesContainer = document.getElementById('modules-container');
  PAGE_DATA.modules.forEach(mod => {
    const html = buildModuleHTML(mod);
    modulesContainer.innerHTML += html;
  });

  // Set sidebar link hrefs
  const sectionEls = modulesContainer.querySelectorAll('.module-section');
  sectionEls.forEach(sec => observer.observe(sec));

  // Render formulas
  renderFormulas(modulesContainer);

  // Render charts (after DOM is ready)
  setTimeout(() => {
    PAGE_DATA.modules.forEach(mod => {
      if (mod.charts) {
        mod.charts.forEach((chart, ci) => {
          renderChart(mod.module_id, chart, ci);
        });
      }
    });
  }, 100);

  // Scroll fade-in animation
  const fadeObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
      }
    });
  }, { threshold: 0.08 });
  sectionEls.forEach(sec => fadeObserver.observe(sec));

  // Keyboard shortcut for theme
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); openSearch(); }
    if ((e.ctrlKey || e.metaKey) && e.key === 'd') { e.preventDefault(); toggleTheme(); }
    if (e.key === 'Escape') {
      if (document.getElementById('searchOverlay').classList.contains('open')) { closeSearch(); return; }
      if (document.getElementById('helpOverlay').classList.contains('open')) { document.getElementById('helpOverlay').classList.remove('open'); return; }
    }
    if (e.shiftKey && e.key === '?') { e.preventDefault(); document.getElementById('helpOverlay').classList.add('open'); }
  });
}

// ============ CANVAS BACKGROUND ============
(function(){
  var cv = document.getElementById('bg-canvas');
  var ctx = cv.getContext('2d');
  var particles = [];
  function rsz() { cv.width = window.innerWidth; cv.height = window.innerHeight; }
  window.addEventListener('resize', rsz); rsz();
  var count = Math.min(60, Math.floor((cv.width * cv.height) / 20000));
  for (var i = 0; i < count; i++) {
    particles.push({ x: Math.random()*cv.width, y: Math.random()*cv.height, vx: (Math.random()-0.5)*0.3, vy: (Math.random()-0.5)*0.3, r: Math.random()*1.5+0.3, a: Math.random()*0.3+0.05 });
  }
  function animate() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    var isDark = document.documentElement.getAttribute('data-theme') !== 'light';
    var c = isDark ? '91,141,184' : '58,96,136';
    particles.forEach(function(p) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = cv.width; if (p.x > cv.width) p.x = 0;
      if (p.y < 0) p.y = cv.height; if (p.y > cv.height) p.y = 0;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.28);
      ctx.fillStyle = 'rgba('+c+','+p.a+')'; ctx.fill();
    });
    for (var j = 0; j < particles.length; j++) {
      for (var k = j+1; k < particles.length; k++) {
        var dx = particles[j].x - particles[k].x;
        var dy = particles[j].y - particles[k].y;
        var d = Math.sqrt(dx*dx+dy*dy);
        if (d < 110) { ctx.beginPath(); ctx.moveTo(particles[j].x, particles[j].y); ctx.lineTo(particles[k].x, particles[k].y); ctx.strokeStyle = 'rgba('+c+','+(0.06*(1-d/110))+')'; ctx.lineWidth = 0.5; ctx.stroke(); }
      }
    }
    requestAnimationFrame(animate);
  }
  animate();
})();

  sections.forEach(function(s, i) { var top = s.getBoundingClientRect().top; if (top < 150 && top > -s.offsetHeight + 150) activeIdx = i; });
  var btns = document.querySelectorAll('.mbn-item');
  btns.forEach(function(b, i) { b.classList.toggle('mbn-active', i === activeIdx); });
});

// Start
document.addEventListener('DOMContentLoaded', initPage);

// Handle global theme changes for ECharts
window.addEventListener('themechange', () => {
  Object.values(activeCharts).forEach(chart => {
    chart.resize();
  });
});
</script>
