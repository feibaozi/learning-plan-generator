      content: "**AI Agent的正式定义**\n\nAI Agent（人工智能代理）是一个能够感知环境、自主决策并使用工具执行任务的智能系统。在编程领域，一个AI编程Agent通常包含四个核心组件：\n\n1. **LLM大脑（Brain）**：负责理解自然语言指令、规划任务分解、生成代码和推理——这是Agent的核心智能引擎。\n\n2. **工具调用（Tool Use）**：Agent能够调用外部工具——读写文件、执行终端命令、操作Git、查询数据库、调用API等。没有工具调用能力，Agent只是一个'只说不练'的顾问。\n\n3. **记忆系统（Memory）**：包括短期记忆（当前会话上下文）和长期记忆（持久化存储——项目知识、用户偏好、历史经验）。记忆让Agent能够'记住'之前的交互，避免重复犯错。\n\n4. **规划与执行循环（Planning & Execution Loop）**：Agent的核心工作流——感知当前状态→分解任务→选择工具→执行→观察结果→调整计划。这是一个持续迭代的闭环。\n\n**MCP协议的核心概念**\n\nMCP (Model Context Protocol) 是一种开放协议，定义了AI应用如何与外部数据源和工具进行安全、标准化的通信。它采用经典的Client-Server架构：\n\n- **MCP Host**：AI应用本身（如Claude Desktop、Cursor、VS Code插件）\n- **MCP Client**：运行在Host内部，与特定Server建立一对一连接的协议客户端\n- **MCP Server**：提供特定功能的轻量服务——暴露工具(Tools)、资源(Resources)和提示模板(Prompts)\n\n**Agent编程 vs 传统AI编程**\n\n| 维度 | 传统AI编程 (Copilot模式) | Agent编程 |\n|------|------------------------|-----------|\n| 交互模式 | 实时补全+单轮对话 | 多步骤任务规划+自动执行 |\n| 工具能力 | 仅代码补全 | 终端+文件系统+Git+浏览器+API |\n| 执行范围 | 当前文件/选区 | 整个项目/跨仓库 |\n| 验证闭环 | 依赖人工 | 自动运行测试+修复 |\n| 工作流 | 人驱动 | Agent驱动+人监督 |",

      content: "**Agent的ReAct循环**\n\nAI编程Agent的核心工作模式遵循ReAct（Reasoning + Acting）范式，这是一个'思考→行动→观察→再思考'的循环：\n\n1. **感知 (Perceive)**：Agent读取当前任务、项目文件结构、代码上下文、错误信息、终端输出等环境状态。\n\n2. **推理 (Reason)**：LLM基于当前状态进行推理——'现在项目结构是什么？用户要添加什么功能？从哪里开始修改？需要先读取哪些文件？'\n\n3. **规划 (Plan)**：Agent将复杂任务分解为步骤序列——'第一步：读取package.json确认依赖；第二步：在src下创建新模块文件；第三步：编写组件代码；第四步：运行测试验证'\n\n4. **执行 (Act)**：Agent调用工具执行具体操作——使用文件系统工具写入代码、使用终端工具运行测试、使用Git工具提交变更。\n\n5. **观察 (Observe)**：Agent收集执行结果——测试通过了还是失败了？有lint错误吗？终端输出了什么？\n\n6. **调整 (Adjust)**：如果执行结果不符合预期，Agent调整计划并重新执行——'测试失败，错误是import路径不对，让我检查文件结构并修复'\n\n**MCP协议的通信机制**\n\nMCP协议基于JSON-RPC 2.0 ，通过标准输入/输出(stdin/stdout)或HTTP SSE(Server-Sent Events)进行双向通信。核心通信原语包括：\n\n- **initialize**：客户端与服务器握手，协商协议版本和能力\n- **tools/list**：客户端查询服务器提供了哪些工具\n- **tools/call**：客户端调用特定工具并传递参数\n- **resources/list**和**resources/read**：获取服务器暴露的资源（如文件内容、数据库记录）\n- **prompts/list**和**prompts/get**：获取预定义的提示模板",

          derivation: "MCP协议严格遵循JSON-RPC 2.0规范。当MCP Client需要调用Server上的某个工具时，构造上述JSON对象并通过传输层（stdin/stdout或HTTP SSE）发送给Server。Server执行完毕后返回一个包含content数组的响应，每个content项可以是text、image或resource类型。这种标准化的请求-响应模式使得任何实现了MCP协议的工具都能被任何MCP兼容的AI应用直接调用，无需额外的适配代码。"

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('slm-theme', theme);
  updateThemeIcon();
  if (typeof activeCharts === 'object' && activeCharts !== null) {
    Object.values(activeCharts).forEach(chart => {
      var opt = chart.getOption();
      chart.setOption(createThemedOption(opt), { notMerge: false });
    });
  }
}
function toggleTheme() {
  var current = document.documentElement.getAttribute('data-theme') || 'light';
  applyTheme(current === 'dark' ? 'light' : 'dark');
}
function updateThemeIcon() {
  var t = document.getElementById('theme-toggle');
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  t.textContent = isDark ? '☀️' : '🌓';
}
var savedTheme = localStorage.getItem('slm-theme') || 'dark';
applyTheme(savedTheme);

function renderChart(moduleId, chartConfig, index, retryCount) {
  var chartId = 'chart_' + moduleId + '_' + index;
  var wrapper = document.getElementById(chartId);
  if (!wrapper) return;
  retryCount = retryCount || 0;
  
  if (typeof echarts === 'undefined') {
    if (retryCount < 10) {
      setTimeout(function() { renderChart(moduleId, chartConfig, index, retryCount + 1); }, 500);
      return;
    }
    wrapper.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-tertiary);font-size:14px;">📊 <strong>图表加载失败</strong><br><small>ECharts CDN未加载，图表数据如下：</small><div style="margin-top:12px;padding:12px;background:var(--bg-tertiary);border-radius:8px;text-align:left;font-size:12px;max-height:150px;overflow:auto;">' + JSON.stringify(chartConfig.echarts_option || {}, null, 2).substring(0, 500) + '...</div></div>';
    return;
  }
  try {
    var chart = echarts.init(wrapper);
    var opt = chartConfig.echarts_option || {};
    chart.setOption(Object.assign({}, createThemedOption(opt), opt));
    activeCharts[chartId] = chart;
    var resizeObserver = new ResizeObserver(function() { chart.resize(); });
    resizeObserver.observe(wrapper);
  } catch(e) {
    wrapper.textContent = '图表渲染失败: ' + e.message;
  }
}

function buildModuleHTML(mod) {
  var tagClass = getTagClass(mod.module_tag || '');
  var html = '<section class="module-section" id="'+mod.module_id+'"><div class="module-header"><span class="module-tag '+tagClass+'">'+(mod.module_tag||'')+'</span><h2 class="module-title">'+(mod.module_title||mod.module_id)+'</h2></div>';
  if (mod.hook) html += '<div class="module-hook">'+mod.hook+'</div>';
  html += '<div class="module-content">'+parseMarkdownContent(mod.content||'')+'</div>';
  if (mod.formulas && mod.formulas.length > 0) {
    mod.formulas.forEach(function(formula) {
      var hasDerivation = formula.expandable && formula.derivation;
      html += '<div class="formula-block'+(hasDerivation?'':'')+'" onclick="'+(hasDerivation?'toggleDerivation(this)':'')+'"><div>'+formula.latex+'</div>';
      if (formula.caption) html += '<div class="formula-caption">'+formula.caption+'</div>';
      if (hasDerivation) html += '<div class="formula-expand-hint">💡 点击展开推导过程</div><div class="formula-derivation">'+formula.derivation+'</div>';
      html += '</div>';
    });
  }
  if (mod.charts && mod.charts.length > 0) {
    mod.charts.forEach(function(chart, ci) {
      var chartId = 'chart_' + mod.module_id + '_' + ci;
      html += '<div class="chart-container"><div class="chart-wrapper" id="'+chartId+'"></div>';
      if (chart.caption) html += '<div class="chart-caption">'+chart.caption+'</div>';
      if (chart.data_source) html += '<div class="chart-source">'+chart.data_source+'</div>';
      html += '</div>';
    });
  }
  if (mod.tables && mod.tables.length > 0) {
    mod.tables.forEach(function(table) {
      html += '<div style="overflow-x:auto"><table class="module-table"><thead><tr>'+table.headers.map(function(h){return '<th>'+h+'</th>';}).join('')+'</tr></thead><tbody>'+table.rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+c+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table>';
      if (table.caption) html += '<div class="table-caption">'+table.caption+'</div>';
      html += '</div>';
    });
  }
  if (mod.references && mod.references.length > 0) {
    html += '<div class="module-references"><h4>📚 参考文献</h4><ol>';
    mod.references.forEach(function(ref) {
      var linkHtml = ref.doi ? ' <a href="https://doi.org/'+ref.doi+'" target="_blank">DOI</a>' : '';
      var urlHtml = ref.url ? ' <a href="'+ref.url+'" target="_blank">链接</a>' : '';
      html += '<li>'+(ref.authors||'')+' ('+(ref.year||'')+'). <strong>'+(ref.title||'')+'</strong>.'+linkHtml+urlHtml+'</li>';
    });
    html += '</ol></div>';
  }
  if (mod.key_takeaway) html += '<div class="key-takeaway">💡 '+mod.key_takeaway+'</div>';
  html += '</section>';
  return html;
}

function getTagClass(tag) {
  var map = {'核心概念':'tag-core','核心工具':'tag-tools','发展演进':'tag-evolution','实践应用':'tag-application','风险与挑战':'tag-risk','前沿探索':'tag-frontier'};
  return map[tag] || 'tag-core';
}

function parseMarkdownContent(content) {
  if (!content) return '';
  var html = content;
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  html = html.replace(/`([^`]+)`/g, '<code style="background:var(--bg-tertiary);padding:2px 6px;border-radius:4px;font-size:13px;">$1</code>');
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  html = html.replace(/^### (.+)$/gm, '<h3 style="font-size:17px;font-weight:600;margin:20px 0 8px;">$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h3 style="font-size:18px;font-weight:600;margin:24px 0 10px;">$1</h3>');
  html = html.replace(/\n\n/g, '</p><p>');
  html = '<p>' + html + '</p>';
  html = html.replace(/<p>\s*<\/p>/g, '');
  return html;
}

(function(){

  if(!cv)return;
  var ctx = cv.getContext('2d');
  var particles = [];
  function rsz() { cv.width = window.innerWidth; cv.height = window.innerHeight; }
  window.addEventListener('resize', rsz); rsz();
  var count = Math.min(60, Math.floor((cv.width * cv.height) / 20000));
  for (var i = 0; i < count; i++) {
    particles.push({ x: Math.random()*cv.width, y: Math.random()*cv.height, vx: (Math.random()-0.5)*0.3, vy: (Math.random()-0.5)*0.3, r: Math.random()*1.5+0.3, a: Math.random()*0.3+0.05 });
  }
  function animate() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    var isDark = document.documentElement.getAttribute('data-theme') !== 'light';
    var c = isDark ? '129,140,248' : '99,102,241';
    particles.forEach(function(p) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = cv.width; if (p.x > cv.width) p.x = 0;
      if (p.y < 0) p.y = cv.height; if (p.y > cv.height) p.y = 0;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.28);
      ctx.fillStyle = 'rgba('+c+','+p.a+')'; ctx.fill();
    });
    for (var j = 0; j < particles.length; j++) {
      for (var k = j+1; k < particles.length; k++) {
        var dx = particles[j].x - particles[k].x, dy = particles[j].y - particles[k].y;
        var d = Math.sqrt(dx*dx+dy*dy);
        if (d < 110) { ctx.beginPath(); ctx.moveTo(particles[j].x, particles[j].y); ctx.lineTo(particles[k].x, particles[k].y); ctx.strokeStyle = 'rgba('+c+','+(0.06*(1-d/110))+')'; ctx.lineWidth = 0.5; ctx.stroke(); }
      }
    }
    requestAnimationFrame(animate);
  }
  animate();
})();

function openSearch() { var ov=document.getElementById('searchOverlay');ov.classList.add('open');document.getElementById('searchInput').value='';document.getElementById('searchInput').focus();document.getElementById('searchResults').innerHTML=''; }
function closeSearch() { document.getElementById('searchOverlay').classList.remove('open'); }
document.getElementById('searchOverlay').addEventListener('click', function(e) { if (e.target===this) closeSearch(); });
document.getElementById('searchInput').addEventListener('input', function() {
  var q=this.value.toLowerCase(),r=document.getElementById('searchResults');
  if(!q||q.length<2){r.innerHTML='';return;}
  function hl(t){if(!t)return '';var i=t.toLowerCase().indexOf(q);if(i===-1)return t;return t.substring(0,i)+'<mark>'+t.substring(i,i+q.length)+'</mark>'+t.substring(i+q.length);}
  var results=[];
  PAGE_DATA.modules.forEach(function(m){
    var title=m.module_title||m.module_id||'',txt=(m.hook||'')+' '+(m.content||'')+' '+(m.key_takeaway||'');
    if(title.toLowerCase().indexOf(q)!==-1||txt.toLowerCase().indexOf(q)!==-1) results.push({id:m.module_id,title:hl(title),snippet:(m.hook||txt).substring(0,80)});
  });
  r.innerHTML=results.slice(0,12).map(function(x){return '<div class="sr-item" onclick="document.getElementById(\''+x.id+'\').scrollIntoView({behavior:\'smooth\'});closeSearch();"><div class="sr-title">'+x.title+'</div><div class="sr-snippet">'+x.snippet+'</div></div>';}).join('')||'<div class="search-empty">无匹配结果</div>';
});

function exportNotes() {
  var lines=['# '+PAGE_DATA.topic+' - 学习笔记','','生成日期: '+new Date().toLocaleDateString('zh-CN'),''];
  lines.push('## 📚 模块列表');
  PAGE_DATA.modules.forEach(function(m){lines.push('- **'+(m.module_title||m.module_id)+'**: '+(m.key_takeaway||m.hook||''));});
  var txt=lines.join('\n');
  if(navigator.clipboard){navigator.clipboard.writeText(txt).then(function(){alert('✅ 学习笔记已复制到剪贴板!');});}
  else{var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);alert('✅ 学习笔记已复制!');}
}

function buildMobileNav() {
  var items=[];
  PAGE_DATA.modules.forEach(function(m,i){if(i%Math.max(1,Math.ceil(PAGE_DATA.modules.length/5))===0)items.push({id:m.module_id,label:(m.module_title||m.module_id).substring(0,4)});});
  if(items.length>5)items=items.slice(0,5);
  var inner=document.getElementById('mbnInner');
  inner.innerHTML=items.map(function(x){return '<button class="mbn-item" onclick="document.getElementById(\''+x.id+'\').scrollIntoView({behavior:\'smooth\'})"><span class="mbn-icon">📑</span>'+x.label+'</button>';}).join('');
  inner.innerHTML+='<button class="mbn-item" onclick="window.scrollTo({top:0,behavior:\'smooth\'})"><span class="mbn-icon">⬆</span>顶部</button>';
}

window.addEventListener('scroll', function() {
  var sections=document.querySelectorAll('.module-section');
  var activeIdx=-1;
  sections.forEach(function(s,i){var top=s.getBoundingClientRect().top;if(top<150&&top>-s.offsetHeight+150)activeIdx=i;});
  var btns=document.querySelectorAll('.mbn-item');
  btns.forEach(function(b,i){b.classList.toggle('mbn-active',i===activeIdx);});
});

document.addEventListener('DOMContentLoaded', initPage);
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initPage);
} else {
  setTimeout(initPage, 100);
}
</script>
