<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<style>
:root{
--bg-base:#0d0d0d;
--bg-card:#1a1a1a;
--bg-elevated:#222222;
--bg-overlay:rgba(0,0,0,.6);
--text-primary:#ededed;
--text-secondary:#a0a0a0;
--text-muted:#787878;
--accent-indigo:#5b8db8;
--accent-purple:#8878a8;
--accent-cyan:#6ea8c0;
--accent-gold:#c0a060;
--accent-green:#5a9e6f;
--accent-red:#c06050;
--accent-blue:#5b8db8;
--accent-color:#5b8db8;
--accent-dark:#3a6088;
--border-subtle:rgba(160,160,160,.15);
--border-glow:rgba(91,141,184,.2);
--shadow-sm:0 1px 3px rgba(0,0,0,.3);
--shadow-md:0 4px 16px rgba(0,0,0,.4);
--shadow-lg:0 8px 32px rgba(0,0,0,.5);
--shadow-elevated:0 8px 32px rgba(0,0,0,.5);
--radius-sm:6px;
--radius-md:10px;
--radius-lg:16px;
--font-sans:'Segoe UI',system-ui,-apple-system,sans-serif;
--font-mono:Consolas,'Cascadia Code',monospace;
--transition:.25s cubic-bezier(.4,0,.2,1);
--transition-smooth:.3s ease;
--nav-h:56px;
--accent-color-rgb:91,141,184;
--chart-grid:#252525;
--chart-axis-label:#787878;
}
[data-theme="light"]{
--bg-base:#fafafa;
--bg-card:#ffffff;
--bg-elevated:#eeeeee;
--bg-overlay:rgba(0,0,0,.3);
--text-primary:#121212;
--text-secondary:#4a4a4a;
--text-muted:#5e5e5e;
--accent-indigo:#3a6088;
--accent-purple:#5a4878;
--accent-cyan:#3a7888;
--accent-gold:#886830;
--accent-green:#3d8055;
--accent-red:#983830;
--accent-blue:#3a6088;
--accent-color:#3a6088;
--accent-dark:#284868;
--border-subtle:rgba(18,18,18,.08);
--border-glow:rgba(58,96,136,.2);
--shadow-sm:0 1px 3px rgba(0,0,0,.06);
--shadow-md:0 4px 16px rgba(0,0,0,.08);
--shadow-lg:0 8px 32px rgba(0,0,0,.12);
--shadow-elevated:0 8px 32px rgba(0,0,0,.12);
--accent-color-rgb:58,96,136;
--chart-grid:#e5e5e5;
--chart-axis-label:#5e5e5e;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:16px}
body{font-family:'Inter','Noto Sans SC',-apple-system,sans-serif;background:var(--bg-base);color:var(--text-primary);line-height:1.75;-webkit-font-smoothing:antialiased;transition:background var(--transition),color var(--transition)}
body.loading{opacity:0}body.loaded{opacity:1;transition:opacity 0.4s ease}
#progress-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--accent-blue),var(--accent-cyan),var(--accent-purple));z-index:1000;transition:width 0.1s linear}
#theme-toggle{position:fixed;top:20px;right:20px;z-index:999;width:40px;height:40px;border-radius:50%;background:var(--bg-card);border:1px solid var(--border-subtle);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all var(--transition);box-shadow:var(--shadow-sm)}
#theme-toggle:hover{transform:scale(1.1);box-shadow:var(--shadow-md)}
#sidebar{position:fixed;top:var(--nav-h);left:0;width:240px;height:calc(100vh - var(--nav-h));background:var(--bg-card);border-right:1px solid var(--border-subtle);padding:16px 12px 24px;overflow-y:auto;z-index:90;transition:transform var(--transition)}
#sidebar h3{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:12px;font-weight:600;padding:0 8px}
.sidebar-link{display:block;padding:6px 12px;margin:2px 0;border-radius:var(--radius-sm);font-size:13px;color:var(--text-secondary);text-decoration:none;transition:all var(--transition);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-link:hover{background:var(--bg-elevated);color:var(--text-primary)}
.sidebar-link.active{background:rgba(91,141,184,.12);color:var(--accent-blue);font-weight:600}
.sidebar-back-link{display:block;padding:8px 12px;margin-bottom:12px;border-radius:var(--radius-sm);background:var(--bg-elevated);color:var(--accent-blue);text-decoration:none;font-size:13px;font-weight:600}
#main-content{margin-left:240px;max-width:780px;padding:70px 32px 120px;margin-right:auto}
.integration-navbar{display:flex;align-items:center;gap:12px;padding:10px 24px;background:var(--bg-card);border-bottom:1px solid var(--border-subtle);font-size:14px;position:sticky;top:0;z-index:95}
.integration-navbar a{color:var(--accent-blue);text-decoration:none;font-weight:600}
.integration-navbar a:hover{text-decoration:underline}
.meta-card{background:linear-gradient(135deg,rgba(91,141,184,.08),rgba(110,168,192,.06));border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:28px 32px;margin-bottom:48px;display:flex;flex-wrap:wrap;gap:20px;align-items:center}
.meta-row{width:100%;font-size:13px;color:var(--text-muted);margin-bottom:4px}
.meta-item{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text-secondary)}
.meta-item .icon{font-size:20px}
.meta-item strong{color:var(--text-primary)}
.meta-badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;letter-spacing:.02em}
.badge-domain{background:rgba(136,120,168,.12);color:var(--accent-purple)}
.badge-level{background:rgba(192,160,96,.12);color:var(--accent-gold)}
.module-section{margin-bottom:56px;opacity:0;transform:translateY(24px);transition:opacity 0.6s ease,transform 0.6s ease}
.module-section.visible{opacity:1;transform:translateY(0)}
.module-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.module-tag{display:inline-block;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.tag-bg{background:rgba(91,141,184,.12);color:var(--accent-blue)}
.tag-pr{background:rgba(136,120,168,.12);color:var(--accent-purple)}
.tag-ev{background:rgba(110,168,192,.12);color:var(--accent-cyan)}
.tag-ap{background:rgba(90,158,111,.12);color:var(--accent-green)}
.tag-ri{background:rgba(192,96,80,.12);color:var(--accent-red)}
.tag-fr{background:rgba(192,160,96,.12);color:var(--accent-gold)}
.module-title{font-size:22px;font-weight:700;color:var(--text-primary);letter-spacing:-.02em}
.module-hook{font-size:16px;color:var(--text-secondary);font-style:italic;border-left:3px solid var(--accent-blue);padding-left:16px;margin-bottom:20px}
.module-content{font-size:15px;color:var(--text-primary)}
.module-content p{margin-bottom:12px}
.module-content strong{color:var(--text-primary)}
.module-content ul,.module-content ol{margin:8px 0 16px 24px}
.module-content li{margin-bottom:6px}
.module-content code{background:var(--bg-elevated);padding:2px 6px;border-radius:4px;font-size:13px;font-family:'JetBrains Mono',Consolas,monospace}
.formula-block{background:var(--bg-elevated);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:20px 24px;margin:16px 0;position:relative;cursor:pointer;transition:all var(--transition)}
.formula-block:hover{box-shadow:var(--shadow-sm)}
.formula-caption{font-size:12px;color:var(--text-muted);margin-top:8px;text-align:center}
.formula-derivation{display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--border-subtle);font-size:14px;color:var(--text-secondary)}
.formula-block.expanded .formula-derivation{display:block}
.formula-expand-hint{font-size:11px;color:var(--text-muted);text-align:right;margin-top:4px}
.chart-container{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:24px;margin:20px 0}
.chart-wrapper{width:100%;height:380px}
.chart-caption{font-size:13px;color:var(--text-secondary);text-align:center;margin-top:12px}
.chart-source{font-size:11px;color:var(--text-muted);text-align:right;margin-top:4px}
.module-table{width:100%;border-collapse:collapse;margin:16px 0;font-size:14px;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);overflow:hidden}
.module-table th{background:var(--bg-elevated);padding:10px 16px;text-align:left;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-secondary)}
.module-table td{padding:10px 16px;border-top:1px solid var(--border-subtle);color:var(--text-primary)}
.module-table tr:hover td{background:var(--bg-elevated)}
.table-caption{font-size:12px;color:var(--text-muted);text-align:center;margin-top:8px}
.module-references{margin-top:20px;padding-top:16px;border-top:1px solid var(--border-subtle);font-size:12px;color:var(--text-muted)}
.module-references h4{font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.module-references ol{margin-left:20px}
.module-references li{margin-bottom:4px}
.module-references a{color:var(--accent-blue);text-decoration:none}
.key-takeaway{margin-top:16px;padding:14px 20px;border-radius:var(--radius-sm);background:rgba(91,141,184,.08);border-left:4px solid var(--accent-blue);font-size:14px;font-weight:500;color:var(--text-primary)}
#page-footer{margin-top:60px;padding:32px 0;border-top:1px solid var(--border-subtle);display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;cursor:pointer;border:1px solid var(--border-subtle);background:var(--bg-card);color:var(--text-primary);transition:all var(--transition);text-decoration:none}
.btn:hover{background:var(--bg-elevated)}
.btn.primary{background:var(--accent-blue);color:#fff;border-color:var(--accent-blue)}
.btn.primary:hover{filter:brightness(1.15)}
.back-btn{position:fixed;right:24px;bottom:24px;z-index:200}
.back-btn button{background:linear-gradient(135deg,var(--accent-blue),var(--accent-purple));color:white;border:none;border-radius:24px;padding:12px 24px;font-size:.85rem;font-weight:600;cursor:pointer;box-shadow:0 4px 12px rgba(91,141,184,.3);transition:transform .2s}
.back-btn button:hover{transform:translateY(-2px)}
#sidebar-toggle{display:none;position:fixed;top:16px;left:16px;z-index:99;width:40px;height:40px;border-radius:50%;background:var(--bg-card);border:1px solid var(--border-subtle);cursor:pointer;font-size:18px;align-items:center;justify-content:center;box-shadow:var(--shadow-sm)}
@media(max-width:1024px){#sidebar{width:200px}#main-content{margin-left:200px;padding:70px 24px 80px}}
@media(max-width:768px){#sidebar-toggle{display:flex}#sidebar{transform:translateX(-100%)}#sidebar.open{transform:translateX(0)}#main-content{margin-left:0;padding:70px 20px 60px}.meta-card{padding:20px 24px;flex-direction:column;gap:12px;align-items:flex-start}.chart-wrapper{height:280px}.module-title{font-size:19px}.back-btn{right:15px;bottom:15px}.back-btn button{padding:10px 16px;font-size:.8rem}}
@media print{#sidebar,#progress-bar,#theme-toggle,#page-footer,.back-btn,.integration-navbar{display:none!important}#main-content{margin-left:0;max-width:100%;padding:0}.module-section{opacity:1;transform:none;break-inside:avoid}body{font-size:12px;line-height:1.5}}
</style>
</head>

<div class="integration-navbar">

  <span style="color:var(--text-muted)">|</span>
  <span style="color:var(--text-secondary)">第1/4阶段 · AI编程工具掌握</span>
</div>

<div id="progress-bar"></div>
<button id="theme-toggle" title="切换深色/浅色模式" onclick="toggleTheme()">🌓</button>
<button id="sidebar-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>

<nav id="sidebar">
  <a href="#" onclick="goBack();return false;" class="sidebar-back-link">← 返回主方案</a>
  <h3>📑 内容导航</h3>
  <div id="sidebar-links"></div>
</nav>

<main id="main-content">

  <footer id="page-footer">
    <button class="btn primary" onclick="window.print()">📥 导出 PDF</button>

  </footer>
</main>

</div>

<script>
var DEEP_DIVE_KP_ID = 'p1_1';
function goBack() {
  var MAIN_PAGE = 'vibe_coding_learning.html';
  var WIN_NAME = '_ml_llm_main';
  var CH_KEY = '_ml_llm_nav';
  localStorage.setItem(CH_KEY, JSON.stringify({kpId: DEEP_DIVE_KP_ID, ts: Date.now()}));
  var mainWin = window.open(MAIN_PAGE, WIN_NAME);
  if (mainWin) { mainWin.focus(); }
}

var PAGE_DATA = {
  topic: "AI编程环境搭建与工具选型",
  domain: "ai-tech",
  domain_name: "AI与科技",
  level: "intermediate",
  level_name: "进阶",
  reading_time: "35",
  module_count: 21,
  texture: "G8",
  texture_name: "教程实操型",
  depth: "理解",
  breadth: "标准",
  modules: []
};

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('slm-theme', theme);
  updateThemeIcon();
  try { Object.values(activeCharts).forEach(function(chart) { var opt = chart.getOption(); chart.setOption(createThemedOption(opt), {notMerge: false}); }); } catch(e) {}
}
function toggleTheme() {
  var current = document.documentElement.getAttribute('data-theme') || 'dark';
  applyTheme(current === 'light' ? 'dark' : 'light');
}
function updateThemeIcon() {
  var t = document.getElementById('theme-toggle');
  t.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌓';
}
var savedTheme = localStorage.getItem('slm-theme') || 'dark';
applyTheme(savedTheme);

window.addEventListener('scroll', function() {
  var scrollTop = window.scrollY;
  var docHeight = document.documentElement.scrollHeight - window.innerHeight;
  var progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
  document.getElementById('progress-bar').style.width = progress + '%';
});

var activeCharts = {};
var sidebarLinks = [];

function buildSidebar() {
  var container = document.getElementById('sidebar-links');
  sidebarLinks = [];
  PAGE_DATA.modules.forEach(function(mod) {
    var a = document.createElement('a');
    a.href = '#' + mod.module_id;
    a.className = 'sidebar-link';
    a.textContent = mod.module_title || mod.module_id;
    a.addEventListener('click', function(e) { e.preventDefault(); document.getElementById(mod.module_id).scrollIntoView({behavior: 'smooth'}); });
    container.appendChild(a);
    sidebarLinks.push({el: a, id: mod.module_id});
  });
}

var obs = new IntersectionObserver(function(entries) {
  entries.forEach(function(entry) {
    if (entry.isIntersecting) {
      sidebarLinks.forEach(function(link) { link.el.classList.toggle('active', link.id === entry.target.id); });
    }
  });
}, {rootMargin: '-80px 0px -60% 0px'});

function buildMetaCard() {
  var md = PAGE_DATA;
  document.getElementById('meta-card-container').innerHTML =
    '<div class="meta-card">' +
      '<div class="meta-row">🔗 📚 Vibe Coding (AI自然语言编程) 系统学习方案 · AI编程工具掌握（1/4）</div>' +
      '<div class="meta-item"><span class="icon">📖</span><strong>' + md.topic + '</strong></div>' +
      '<div class="meta-item"><span class="meta-badge badge-domain">' + md.domain_name + '</span></div>' +
      '<div class="meta-item"><span class="meta-badge badge-level">' + md.level_name + '</span></div>' +
      '<div class="meta-item"><span class="icon">⏱️</span>约' + md.reading_time + '分钟阅读</div>' +
      '<div class="meta-item"><span class="icon">📦</span>' + md.module_count + '个模块</div>' +
    '</div>';
}

function renderFormulas(container) {
  if (typeof renderMathInElement !== 'undefined') {
    renderMathInElement(container, { delimiters: [{left: '$$', right: '$$', display: true},{left: '$', right: '$', display: false}], throwOnError: false });
  }
}
function createThemedOption(existingOpt) {
  var isDark = document.documentElement.getAttribute('data-theme') !== 'light';
  return {color: isDark ? ['#818cf8','#a78bfa','#c4b5fd','#67e8f9','#fbbf24','#34d399','#f87171','#f472b6'] : ['#6366f1','#8b5cf6','#a78bfa','#22d3ee','#f59e0b','#10b981','#ef4444','#ec4899']};
}
function renderChart(moduleId, chartConfig, index) {
  var chartId = 'chart_' + moduleId + '_' + index;
  var wrapper = document.getElementById(chartId);
  if (!wrapper) return;
  if (typeof echarts === 'undefined') { wrapper.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:13px;">📊 图表(ECharts CDN 未加载)</div>'; return; }
  try {
    var chart = echarts.init(wrapper);
    var opt = chartConfig.echarts_option || {};
    if (typeof opt === 'string') { try { chart.setOption(createThemedOption(JSON.parse(opt))); } catch(e) { wrapper.textContent = '图表配置解析失败'; return; } }
    else { chart.setOption(createThemedOption(opt)); }
    activeCharts[chartId] = chart;
    new ResizeObserver(function() { chart.resize(); }).observe(wrapper);
  } catch(e) { wrapper.textContent = '图表渲染失败: ' + e.message; }
}

function buildModuleHTML(mod) {
  var tagMap = { '背景与缘起':'tag-bg','核心概念':'tag-pr','核心原理':'tag-pr','发展迭代':'tag-ev','实践应用':'tag-ap','实践案例':'tag-ap','潜在风险':'tag-ri','发展格局':'tag-ev','发展问题':'tag-ri','发展前景':'tag-fr','努力方向':'tag-fr','常见误区':'tag-ri','学习路径':'tag-ap','关键术语表':'tag-bg','争议与辩论':'tag-ri','技术架构':'tag-pr','算力与成本':'tag-ev','开源生态':'tag-ev','Benchmark数据':'tag-ev','伦理与安全':'tag-ri','产学研图谱':'tag-fr' };
  var tagClass = tagMap[mod.module_tag] || 'tag-bg';

  var html = '<section class="module-section" id="' + mod.module_id + '">' +
    '<div class="module-header"><span class="module-tag ' + tagClass + '">' + (mod.module_tag||'') + '</span><h2 class="module-title">' + (mod.module_title||mod.module_id) + '</h2></div>';
  if (mod.hook) html += '<div class="module-hook">' + mod.hook + '</div>';
  html += '<div class="module-content">' + parseMd(mod.content||'') + '</div>';

  if (mod.formulas && mod.formulas.length > 0) {
    mod.formulas.forEach(function(f) {
      var hd = f.expandable && f.derivation;
      html += '<div class="formula-block' + (hd?'':' not-expandable') + '" onclick="' + (hd?'toggleDerivation(this)':'') + '"><div>' + f.latex + '</div>';
      if (f.caption) html += '<div class="formula-caption">' + f.caption + '</div>';
      if (hd) html += '<div class="formula-expand-hint">💡 点击展开推导过程</div><div class="formula-derivation">' + f.derivation + '</div>';
      html += '</div>';
    });
  }
  if (mod.charts && mod.charts.length > 0) {
    mod.charts.forEach(function(ch, ci) {
      var cid = 'chart_' + mod.module_id + '_' + ci;
      html += '<div class="chart-container"><div class="chart-wrapper" id="' + cid + '"></div>';
      if (ch.caption) html += '<div class="chart-caption">' + ch.caption + '</div>';
      if (ch.data_source) html += '<div class="chart-source">' + ch.data_source + '</div>';
      html += '</div>';
    });
  }
  if (mod.tables && mod.tables.length > 0) {
    mod.tables.forEach(function(t) {
      html += '<div style="overflow-x:auto"><table class="module-table"><thead><tr>' + (t.headers||[]).map(function(h){return '<th>'+h+'</th>';}).join('') + '</tr></thead><tbody>' + (t.rows||[]).map(function(r){return '<tr>'+r.map(function(c){return '<td>'+c+'</td>';}).join('')+'</tr>';}).join('') + '</tbody></table>';
      if (t.caption) html += '<div class="table-caption">' + t.caption + '</div>';
      html += '</div>';
    });
  }
  if (mod.references && mod.references.length > 0) {
    html += '<div class="module-references"><h4>📚 参考文献</h4><ol>';
    mod.references.forEach(function(ref) {
      html += '<li>' + (ref.authors||'') + ' ('+(ref.year||'')+'). <strong>'+(ref.title||'')+'</strong>.';
      if (ref.doi) html += ' <a href="https://doi.org/'+ref.doi+'" target="_blank">DOI</a>';
      if (ref.url) html += ' <a href="'+ref.url+'" target="_blank">链接</a>';
      html += '</li>';
    });
    html += '</ol></div>';
  }
  if (mod.key_takeaway) html += '<div class="key-takeaway">💡 ' + mod.key_takeaway + '</div>';
  html += '</section>';
  return html;
}
function parseMd(c) {
  if (!c) return '';
  c = c.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  c = c.replace(/\*(.+?)\*/g,'<em>$1</em>');
  c = c.replace(/`([^`]+)`/g,'<code>$1</code>');
  c = c.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" style="color:var(--accent-blue)">$1</a>');
  c = c.replace(/^### (.+)$/gm,'<h3 style="font-size:17px;font-weight:600;margin:20px 0 8px;">$1</h3>');
  c = c.replace(/^## (.+)$/gm,'<h3 style="font-size:18px;font-weight:600;margin:24px 0 10px;">$1</h3>');
  c = c.replace(/\n\n/g,'</p><p>');
  c = '<p>' + c + '</p>';
  c = c.replace(/<p>\s*<\/p>/g,'');
  return c;
}

  "content": "### AI编程模型的核心Benchmark\n\n**1. HumanEval (代码生成基准)**\n- 测试: 给定函数签名和docstring，生成完整函数体\n- 2025年初领先者: Claude 3.5 Sonnet (92.0%), GPT-4o (90.2%), DeepSeek-Coder-V2 (88.5%)\n- 解读: 90%+意味着10次中有9次能生成可直接运行的代码\n\n**2. SWE-bench Verified (真实Bug修复)**\n- 测试: 给定GitHub Issue和代码库，AI自动定位+修复Bug\n- Claude 3.5 Sonnet: 49.0%（Agent模式）, GPT-4o: 38.2%\n- 关键发现: Agent模式（AI自主读代码→定位→改代码→验证）比单轮对话效果好3-4倍\n\n**3. BigCodeBench (大规模编程任务)**\n- 测试: 涵盖43种编程语言、1,140个实际开发场景\n- DeepSeek-Coder-V2在该基准上超越了GPT-4（开源模型首次）\n\n**4. RepoBench (代码库级理解)**\n- 测试: 跨文件引用、API调用链追踪、全库级重构\n- Cursor+Claude组合在此类任务中表现最优（得益于Cursor的项目索引+RAG）\n\n### 这些数字对你有意义吗？\n\n- HumanEval 90% vs 85% — 在你每天触发100次补全时，差了5次需要手动修正\n- SWE-bench Agent vs 单轮 — Agent模式是质的飞跃，而不只是量的优化\n- **最重要的'Benchmark'是你自己的实际使用体验**——每个代码库不同，每个开发者习惯不同。花1天同时试用2个工具，比看100篇评测更有价值。",

  "module_id": "07-risk",
  "module_title": "潜在风险",
  "module_tag": "潜在风险",
  "hook": "把公司核心代码喂给云端AI——听起来高效，但你的CTO可能会失眠。AI编程的六个'暗面'需要被正视。",
  "content": "### AI编程的六类风险\n\n**1. 代码隐私泄露（最高频的担忧）**\n- IDE插件会将你的代码上下文发送到云端模型\n- 如果你的代码包含API Key、内部URL、业务逻辑——它们都在传输中\n- **缓解**: 使用本地模型(Continue+Ollama)、配置.gitignore排除敏感文件、使用Business版(数据不用于训练)\n\n**2. 许可证合规风险**\n- AI生成的代码可能'学了'GPL/AGPL许可的代码\n- GitHub Copilot曾因训练数据包含GPL代码被诉讼（2023年集体诉讼，仍在审理中）\n- **缓解**: 使用代码扫描工具(如FOSSA)检查AI生成代码的许可证兼容性\n\n**3. 安全漏洞引入**\n- Stanford研究(2023): 使用AI编程助手的开发者写出**不安全代码的概率反而更高**（因为过度信任AI输出）\n- 常见AI生成漏洞: SQL注入、XSS、不安全的反序列化\n- **缓解**: AI生成的代码必须经过和手写代码**同等水平的安全审查**\n\n**4. 幻觉代码（Hallucination）**\n- AI可能调用不存在的API、引用错误的库版本、发明不存在的函数参数\n- **缓解**: 永远运行AI生成的代码前先阅读它\n\n**5. 技能退化风险**\n- 过度依赖Tab补全可能导致你忘记基础语法\n- Google内部研究(2024): 使用Copilot的初级开发者在关闭Copilot后编码速度下降35%\n- **缓解**: 定期做'无AI日'练习，保持核心编程能力\n\n**6. 供应商锁定（Vendor Lock-in）**\n- `.cursorrules`是Cursor专用格式，换工具等于从头配置\n- **缓解**: 选择支持标准协议的(MCP)或开源工具(Continue)",

  "content": "### AI编程工具竞争格局（2025视角）\n\n**第一梯队：巨头平台**\n- **Microsoft/GitHub Copilot** — 平台优势：VS Code市场占有率70%+，GitHub生态独占。策略：从补全→Chat→Workspace(全流程)，做'AI驱动的软件开发生命周期'。最大护城河：渠道分发能力\n- **Google/Gemini Code Assist** — 差异化：Gemini 1M token超长上下文窗口（可直接吞入整个中型代码库）。策略：用Google Cloud生态绑定企业客户\n- **Amazon/CodeWhisperer(Q Developer)** — 差异化：AWS生态深度集成（可直接生成CDK/IaC代码）。策略：用AWS账单锁定\n\n**第二梯队：垂直创新者**\n- **Cursor** — 最激进的AI IDE创新者，Agent模式和Composer定义了'下一代IDE'标准。风险：依赖Anthropic API\n- **Windsurf(Codeium)** — 独立IDE策略（不像Cursor基于VS Code），Flow模式独树一帜\n- **Claude Code(Anthropic)** — 定义了'Agent式CLI编程'品类。优势：模型能力最强。风险：无IDE生态\n\n**第三梯队：开源与社区**\n- **Continue.dev** — 开源IDE助手的标杆\n- **Aider** — 开源终端结对编程标杆\n- **Ollama + Open WebUI** — 本地模型部署方案\n\n**关键趋势**：\n1. **协议标准化**: MCP正在成为AI与工具通信的事实标准\n2. **能力民主化**: 2023年只有GPT-4能做代码，2025年DeepSeek-Coder-V2开源模型已接近闭源水平\n3. **IDE去中心化**: 从'所有人都用VS Code'到'各IDE有自己的AI方案'",
