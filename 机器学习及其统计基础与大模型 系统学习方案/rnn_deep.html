<script>
var PAGE_DATA={topic:"循环神经网络与序列模型",domain:"ai-tech",domain_name:"AI与科技",level:"intermediate",level_name:"进阶",reading_time:"40",module_count:"22",texture:"G5",texture_name:"全面平衡型",depth:"理解",breadth:"标准",modules:[
{"module_id":"01-background","module_title":"背景与缘起","module_tag":"发展演进","hook":"人类不会每读一个字就忘掉前面所有的字——但传统神经网络会。RNN的诞生就是为了修复这个'健忘症'。","content":"循环神经网络（Recurrent Neural Network, RNN）是处理序列数据的基础架构。它的核心理念很简单：**给网络一个\"记忆\"**。\n\n### 为什么需要RNN？\n\n传统的全连接网络（MLP）和卷积网络（CNN）都有一个根本性假设：**输入之间相互独立**。今天的股票价格和昨天的有关，这句话的含义和前一句相关——但在MLP/CNN中，每个输入都是独立处理的。\n\n序列数据的本质特征：\n- **时间依赖性**：t时刻的状态依赖于t-1,t-2,...\n- **可变长度**：不同序列长度不同（句子有长有短）\n- **顺序敏感**：\"我爱你\"和\"你爱我\"信息完全不同\n\n### RNN的历史轨迹\n\n**Hopfield网络（1982）**：John Hopfield提出了带有反馈连接的神经网络，证明了这类网络可以作为联想记忆使用。这是RNN的理论先驱。\n\n**Jordan网络（1986）与Elman网络（1990）**：\n- Jordan网络：将输出反馈到隐藏层的\"上下文单元\"——LRU（最简循环单元）\n- Elman网络：将隐藏层状态反馈到输入——这就是现代\"简单RNN\"的标准形式\n$$h_t = \\sigma(W_h h_{t-1} + W_x x_t + b)$$\n\n**LSTM（1997）**：\nSepp Hochreiter和Jürgen Schmidhuber解决了RNN的\"长期记忆\"问题。他们的LSTM引入了**门控机制（Gating Mechanism）**和**细胞状态（Cell State）**，让信息可以跨数十甚至数百步无损传递。LSTM至今仍是工业界处理序列数据的首选之一。\n\n**GRU（2014）**：\nCho等人将LSTM简化——三个门变为两个门，参数更少但效果接近。","formulas":[{"latex":"$$h_t = \\sigma(W_h h_{t-1} + W_x x_t + b)$$","caption":"简单RNN(Elman网络)的核心公式：当前隐藏状态=历史状态+新输入的非线性组合","expandable":true,"derivation":"隐藏状态h_t是网络的\"记忆\"。每一步，它接收两个信息源：上一时刻的记忆h_{t-1}（乘以循环权重矩阵W_h）和当前输入x_t（乘以输入权重矩阵W_x）。两者相加后经过激活函数σ（通常是tanh），得到新的记忆。这就是\"循环\"的含义——输出不仅取决于输入，还取决于\"过去的自己\"。"}],"charts":[],"tables":[{"headers":["年份","模型","核心贡献","记忆长度"],"rows":[["1982","Hopfield网络","循环连接的数学基础","短"],["1990","Elman RNN","隐藏状态反馈（标准RNN）","短(<10步)"],["1997","LSTM","门控+细胞状态，解决长期记忆","长(数百步)"],["2014","GRU","简化LSTM，两个门","长(数百步)"]]}],"references":[{"title":"Long Short-Term Memory","authors":"Hochreiter, S. & Schmidhuber, J.","year":1997,"doi":""}],"key_takeaway":"RNN是为序列数据量身定做的：通过隐藏状态的循环连接，网络拥有了处理时间/顺序依赖的能力。"},
{"module_id":"02-concept","module_title":"核心概念","module_tag":"核心概念","hook":"RNN最天才的设计：在每个时间步，网络不仅输出结果，还输出一个'记忆状态'传递给下一步。就像接力跑中，每一步不仅奔跑，还要稳稳地交接棒。","content":"### RNN的三个核心组件\n\n**1. 隐藏状态（Hidden State）**\n$$h_t = f(h_{t-1}, x_t)$$\n\n隐藏状态 $h_t$ 是网络对\"到目前为止看到的全部信息\"的压缩表示。它必须足够紧凑（固定维度），同时尽可能保留有用信息。\n\n**2. 循环连接（Recurrent Connection）**\nRNN与众不同的地方在于**参数在时间上共享**：\n- 同一个权重矩阵 $W_h$ 被用于所有时间步\n- 这意味着\"第1步的处理逻辑\"和\"第100步的处理逻辑\"是一样的\n- 优势：参数量与序列长度无关→可处理任意长度序列\n\n**3. 时间展开（Unrolling Through Time）**\n虽然RNN的数学定义是循环的，但在训练时我们在时间上\"展开\"它成为一条链式结构：\n\n```\nh_0 → h_1 → h_2 → ... → h_T\n ↑      ↑      ↑           ↑\nx_1    x_2    x_3         x_T\n```\n\n展开后，RNN相当于一个**深度为T的网络**，权重在所有层间共享。\n\n### 三种基本架构\n\n| 架构 | 输入-输出 | 典型应用 |\n|------|----------|---------|\n| **Many-to-One** | 序列→单个输出 | 情感分析、文本分类 |\n| **One-to-Many** | 单个输入→序列 | 图像描述生成 |\n| **Many-to-Many** | 序列→序列（对齐/非对齐） | 机器翻译(非对齐)、词性标注(对齐) |\n\n这三种架构通过控制RNN的输出方式来灵活适配不同任务。","formulas":[{"latex":"$$h_t = \\tanh(W_h h_{t-1} + W_x x_t + b_h) \\\\ y_t = \\text{softmax}(W_y h_t + b_y)$$","caption":"简单RNN的前向传播：隐藏状态更新+输出生成","expandable":false,"derivation":""}],"charts":[{"echarts_option":{"series":[{"type":"sankey","data":[{"name":"x₁"},{"name":"x₂"},{"name":"x₃"},{"name":"h₁"},{"name":"h₂"},{"name":"h₃"},{"name":"y₁"},{"name":"y₂"},{"name":"y₃"}],"links":[{"source":"x₁","target":"h₁","value":1},{"source":"h₁","target":"y₁","value":1},{"source":"h₁","target":"h₂","value":1},{"source":"x₂","target":"h₂","value":1},{"source":"h₂","target":"y₂","value":1},{"source":"h₂","target":"h₃","value":1},{"source":"x₃","target":"h₃","value":1},{"source":"h₃","target":"y₃","value":1}]}],"title":{"text":"RNN信息流：隐藏状态作为信息桥梁","left":"center","top":8,"textStyle":{"fontSize":14,"color":"#8aa8b8"}}},"caption":"图：RNN的数据流——隐藏状态在时间步之间传递信息","data_source":"概念示意图"}],"tables":[],"references":[],"key_takeaway":"RNN的魔力在于参数在时间上共享+隐藏状态作为记忆——这两个设计让它能处理任意长度的序列。"},
{"module_id":"03-principle","module_title":"核心原理：LSTM与GRU","module_tag":"核心概念","hook":"1997年的LSTM论文当时几乎没人引用，20年后成了AI史上引用最高的论文之一。这个故事告诉我们：好想法可能需要20年才能被真正理解。","content":"### LSTM：长短期记忆\n\n简单RNN的问题是\"长期依赖\"——当序列很长时，较早的信息被反复乘以权重矩阵后指数级衰减。LSTM通过引入**细胞状态（Cell State）**和**三个门**解决了这个问题。\n\n**细胞状态（Cell State）$c_t$**：\n贯穿整个序列的\"信息高速公路\"——只有少量的线性交互，信息可以几乎无损地传播极远的距离。\n\n**三个门的职责**：\n\n**遗忘门（Forget Gate）**：决定丢弃哪些旧信息\n$$f_t = \\sigma(W_f \\cdot [h_{t-1}, x_t] + b_f)$$\n\n**输入门（Input Gate）**：决定将哪些新信息存入细胞状态\n$$i_t = \\sigma(W_i \\cdot [h_{t-1}, x_t] + b_i)$$\n$$\\tilde{c}_t = \\tanh(W_c \\cdot [h_{t-1}, x_t] + b_c)$$\n\n**更新细胞状态**：\n$$c_t = f_t \\odot c_{t-1} + i_t \\odot \\tilde{c}_t$$\n\n**输出门（Output Gate）**：决定输出什么\n$$o_t = \\sigma(W_o \\cdot [h_{t-1}, x_t] + b_o)$$\n$$h_t = o_t \\odot \\tanh(c_t)$$\n\n### GRU：简化版LSTM\n\n将三个门合并为两个：\n- **重置门（Reset Gate）**：控制忽略多少过去信息\n- **更新门（Update Gate）**：控制保留多少过去状态（相当于合并了遗忘门和输入门）\n\n$$z_t = \\sigma(W_z \\cdot [h_{t-1}, x_t]) \\quad (\\text{更新门})$$\n$$r_t = \\sigma(W_r \\cdot [h_{t-1}, x_t]) \\quad (\\text{重置门})$$\n$$\\tilde{h}_t = \\tanh(W \\cdot [r_t \\odot h_{t-1}, x_t])$$\n$$h_t = (1 - z_t) \\odot h_{t-1} + z_t \\odot \\tilde{h}_t$$\n\nGRU比LSTM少一个门→约25%的参数减少，在多数任务上效果相当。","formulas":[{"latex":"$$c_t = f_t \\odot c_{t-1} + i_t \\odot \\tilde{c}_t$$","caption":"LSTM细胞状态更新公式：遗忘一部分旧记忆+选择性写入新信息","expandable":true,"derivation":"细胞状态c_t是LSTM核心设计。f_t⊙c_{t-1}:遗忘门控制\"遗忘什么\"——0表示完全丢弃，1表示完全保留。i_t⊙c̃_t:输入门控制\"写入什么\"——i_t是0-1之间的标量，决定新候选值c̃_t有\"多大声量\"被写入细胞状态。两者相加，实现了对信息的精细控制。因为这里只有逐元素乘法和加法（没有矩阵乘法），梯度可以几乎不衰减地流动→这就是LSTM能记住长期依赖的数学原因。"}],"charts":[],"tables":[{"headers":["组件","LSTM","GRU","作用"],"rows":[["门数量","3个","2个","控制信息流"],["细胞状态","有(单独的c_t)","无(c_t=h_t合并)","长期记忆载体"],["参数效率","较低","较高(少~25%)","/"],["训练速度","较慢","较快","/"],["长期记忆","优秀","优秀(略弱于LSTM)","/"],["小型数据","GRU略优","LSTM略优(大型数据/sota)","/"]]}],"references":[{"title":"Learning Phrase Representations using RNN Encoder-Decoder (GRU)","authors":"Cho, K. et al.","year":2014,"doi":""}],"key_takeaway":"LSTM用三个门和一个细胞状态解决长期记忆；GRU将其简化为两个门；两者都是处理序列的标准方案。"},
{"module_id":"ai-tech-architecture","module_title":"BPTT与训练技术","module_tag":"核心概念","hook":"RNN的反向传播被称为\"穿越时间的反向传播\"(BPTT)——因为梯度不仅要穿越网络层，还要穿越时间步。每一步都可能让梯度衰减一点，100步后就什么也不剩了。","content":"### 穿越时间的反向传播（BPTT）\n\nRNN的训练使用BPTT——本质就是把RNN在时间上展开，然后对展开后的深度网络做标准的反向传播。\n\n**核心区别**：\n- 普通BP：梯度沿网络层传播（深度方向）\n- BPTT：梯度同时沿网络层和时间步传播（深度+时间两个方向）\n\n$$\\frac{\\partial L}{\\partial W_h} = \\sum_{t=1}^{T} \\frac{\\partial L_t}{\\partial W_h}$$\n\n总梯度=每个时间步对权重的梯度之和（因为权重在时间上共享）。\n\n### 梯度消失/爆炸在RNN中更为严重\n\n展开后的RNN相当于一个深度为T的网络（T=序列长度），且每层的变换用的是同一个矩阵 $W_h$：\n- 如果 $W_h$ 的最大特征值<1 → 梯度指数衰减（消失）\n- 如果 $W_h$ 的最大特征值>1 → 梯度指数增长（爆炸）\n\n这就是为什么简单RNN无法学习超过约10步的依赖——10次矩阵乘法已经让误差信号衰减到无法使用的程度。LSTM的细胞状态设计正是为了解决这个问题：通过让误差信号在细胞状态下几乎不衰减地流动。\n\n### 截断BPTT（Truncated BPTT）\n\n对于超长序列（如10000步），完整BPTT的计算量和显存都是不可承受的：\n- 将序列切为固定长度的段（如100步）\n- 每段内完整BPTT，段间只传递隐藏状态而不传递梯度\n- 这是实际训练RNN的标配技巧","formulas":[{"latex":"$$\\frac{\\partial L}{\\partial W_h} = \\sum_{t=1}^{T} \\sum_{k=1}^{t} \\frac{\\partial L_t}{\\partial h_t} \\left(\\prod_{j=k+1}^{t} \\frac{\\partial h_j}{\\partial h_{j-1}}\\right) \\frac{\\partial h_k}{\\partial W_h}$$","caption":"BPTT中循环权重W_h的梯度：双重求和+连乘——连乘是梯度问题的根源","expandable":true,"derivation":"L_t对W_h的依赖是通过h_1→h_2→...→h_t的整条链传播的。链式法则展开后得到一个连乘项∏_{j=k+1}^t ∂h_j/∂h_{j-1}。对于简单RNN，∂h_j/∂h_{j-1}≈W_h·diag(σ'(...))。如果|W_h|<1，这个连乘在t-k>10后就将趋近于0→梯度消失。"}],"charts":[],"tables":[],"references":[],"key_takeaway":"BPTT是RNN训练的基础；梯度消失/爆炸在RNN中因时间连乘而尤为严重；截断BPTT是长序列训练的实用方案。"},
{"module_id":"ai-tech-compute-cost","module_title":"计算与内存分析","module_tag":"核心工具","hook":"RNN的一个致命弱点：必须一步步算，无法并行。GPT-3可以同时看到所有token一次性处理，RNN则必须像人类一样\"一个字一个字地读\"。","content":"### RNN的顺序计算瓶颈\n\n这是RNN相比Transformer最大的劣势：\n\n$$h_t = f(h_{t-1}, x_t)$$\n\n要计算 $h_t$，必须先有 $h_{t-1}$。这意味着**RNN无法在时间维度上并行化**——无论你有多少GPU。\n\n**对比**：\n| 模型 | 训练并行性 | 推理延时 |\n|------|-----------|---------|\n| RNN | 差（串行） | O(T) |\n| CNN | 好（卷积可并行） | O(1) |\n| Transformer | 极好（所有位置同时） | O(1)，但复杂度O(T²) |\n\n### RNN的显存消耗\n\n虽然参数少（$W_h$, $W_x$, $W_y$ 三个矩阵），但BPTT需要在显存中保存每一步的中间激活：\n- $h_1, h_2, ..., h_T$（所有隐藏状态）\n- LSTM还有 $c_1, c_2, ..., c_T$（所有细胞状态）\n- BPTT还需要保存梯度中间量\n\n对于batch_size=32，隐藏维度=512，序列长度=1000：\n隐藏状态显存 = 32×1000×512×4字节(FP32)×2(h_t+c_t)≈131MB。加上梯度缓存，总显存可能达到1-2GB。\n\n### 双向RNN的两倍开销\n\nBiLSTM/BiGRU同时从前往后和从后往前处理序列，参数和计算量翻倍。但在许多NLP任务中，双向信息带来的精度提升非常显著。","formulas":[],"charts":[{"echarts_option":{"xAxis":{"type":"category","data":["RNN\n(T=100)","BiLSTM\n(T=100)","LSTM\n(T=500)","LSTM\n(T=2000)","Transformer\n(T=100)","Transformer\n(T=500)"]},"yAxis":{"type":"value","name":"训练时间(相对值)"},"series":[{"type":"bar","data":[10,18,50,200,8,35],"itemStyle":{"color":"#818cf8"}}],"title":{"text":"不同序列处理架构的训练时间对比","left":"center","top":8,"textStyle":{"fontSize":14,"color":"#8aa8b8"}}},"caption":"图：RNN的串行特性使长序列训练时间线性增长;Transformer在短序列上更快","data_source":"基于典型GPU benchmark的示意数据"}],"tables":[],"references":[],"key_takeaway":"RNN的顺序计算瓶颈是它被Transformer取代的核心原因；BPTT需要保存所有时间步的中间激活。"},
{"module_id":"ai-tech-open-source","module_title":"开源生态","module_tag":"核心工具","hook":"PyTorch的nn.LSTM有一个著名的\"坑\"——它的输出默认返回所有时间步的隐藏状态+h_n+c_n，新手经常被返回值的形状搞晕。","content":"### PyTorch RNN系列\n\n```python\nimport torch.nn as nn\n\n# 简单RNN\nrnn = nn.RNN(input_size=128, hidden_size=256, num_layers=2, batch_first=True)\n\n# LSTM\nlstm = nn.LSTM(input_size=128, hidden_size=256, num_layers=2, \n                batch_first=True, bidirectional=True)\n\n# GRU\ngru = nn.GRU(input_size=128, hidden_size=256, num_layers=2)\n\n# 使用\noutput, (h_n, c_n) = lstm(x)  # output: (B,T,2×H) bidirectional\n```\n\n**关键注意事项**：\n- `batch_first=True`：输入格式(B, T, F)，否则默认(T, B, F)\n- `bidirectional=True`：输出维度翻倍（前向+后向拼接）\n- LSTM返回`(output, (h_n, c_n))`，GRU返回`(output, h_n)`\n\n### PyTorch中LSTM的动态特性\n\n- **pack_padded_sequence**：跳过padding位置的无效计算，是变长序列训练的必备技术\n- **CuDNN加速**：在特定条件下PyTorch使用CuDNN高度优化的LSTM实现\n\n### TensorFlow/Keras\n\n```python\nfrom tensorflow.keras.layers import LSTM, GRU, Bidirectional\nmodel = Sequential([\n    Bidirectional(LSTM(256, return_sequences=True)),\n    LSTM(128),\n    Dense(10, activation='softmax')\n])\n```","formulas":[],"charts":[],"tables":[],"references":[],"key_takeaway":"PyTorch的RNN/LSTM/GRU和Keras的对应模块都是成熟稳定的实现；pack_padded_sequence是变长序列训练的关键技巧。"},
{"module_id":"04-development","module_title":"架构演进","module_tag":"发展演进","hook":"从Elman的20行代码到Transformer的10亿参数——RNN只用了30年就被自己催生的后代替代了，但这恰恰是它最伟大的成就。","content":"### RNN → LSTM → GRU（1990-2014）\n\n从简单RNN到门控RNN的演进解决了梯度消失这个最根本的问题。LSTM是Sepp Hochreiter花了多年时间研究梯度流动力学的成果。\n\n### 双向RNN（BiRNN，1997）\n\n同时用两个RNN从句子的前后两个方向处理，输出拼接：\n- 前向RNN：\"今天\"→\"天气\"→\"很好\"\n- 后向RNN：\"很好\"→\"天气\"→\"今天\"\n- 拼接：每个词同时拥有上下文信息\n\n在许多自然语言理解任务中，双向信息至关重要——\"bank\"在\"river bank\"（河岸）和\"bank account\"（银行账户）中的含义完全不同。\n\n### Seq2Seq + Attention（2014-2015）\n\nRNN最关键的进阶：编码器-解码器+注意力机制。\n\n**编码器（Encoder）**：将输入序列压缩为一个固定长度的上下文向量\n**解码器（Decoder）**：从上下文向量逐步生成输出序列\n**注意力（Attention）**：解码器每生成一个词，动态\"关注\"编码器的所有隐藏状态——不再强制所有信息挤进一个固定长度的向量\n\n这催生了机器翻译的革命（Google Neural Machine Translation, 2016年）。\n\n### 深层RNN与残差RNN\n\n像CNN一样，RNN也可以堆叠多层。但RNN的层数通常较少（2-4层），因为RNN在时间上已经是\"深层\"了（100步=100层）。","formulas":[{"latex":"$$\\alpha_{ij} = \\frac{\\exp(\\text{score}(h_i^{dec}, h_j^{enc}))}{\\sum_k \\exp(\\text{score}(h_i^{dec}, h_k^{enc}))}$$","caption":"注意力权重：解码器位置i对编码器位置j的\"关注度\"，通过softmax归一化","expandable":false,"derivation":""}],"charts":[],"tables":[{"headers":["架构","年份","关键创新","被谁替代"],"rows":[["简单RNN","1990","隐藏状态循环连接","LSTM/GRU"],["LSTM","1997","门控+细胞状态","(仍在广泛使用)"],["BiRNN","1997","双向上下文","(作为组件仍使用)"],["Seq2Seq","2014","编码器-解码器","Seq2Seq+Attention"],["Seq2Seq+Attn","2015","动态注意力","Transformer(2017)"]]}],"references":[{"title":"Sequence to Sequence Learning with Neural Networks","authors":"Sutskever, I., Vinyals, O. & Le, Q.V.","year":2014,"doi":""}],"key_takeaway":"RNN演化的主旋律：解决梯度消失(LSTM)→获取双向上下文(BiRNN)→用注意力突破信息瓶颈(Seq2Seq+Attn)→最终被Transformer全面接替。"},
{"module_id":"05-application","module_title":"应用全景","module_tag":"实践应用","hook":"Google翻译在2016年从基于短语的统计方法切换到LSTM Seq2Seq——翻译质量一夜之间提升了相当于过去十年的进步总和。","content":"### 自然语言处理\n\n**文本分类/情感分析**：\n- Many-to-One架构，最后一时刻的隐藏状态→全连接→分类\n- 现在大多被BERT等预训练模型替代，但轻量场景中BiLSTM仍广泛使用\n\n**命名实体识别（NER）**：\n- Many-to-Many对齐架构：BiLSTM编码每个词的上下文→CRF层解码标签\n- 是金融（公司名识别）、医疗（药品名识别）的基础NLP能力\n\n**机器翻译**：\n- Seq2Seq+Attention曾是2014-2017年间SOTA\n- 2018年后逐渐被Transformer替代（更快的训练+更好的长距离依赖）\n\n### 时间序列预测\n\n- **金融**：股票价格预测、波动率建模\n- **能源**：电力负荷预测、风力发电预测\n- **IoT**：传感器读数的异常检测\n\nLSTM在这些领域仍是主力——因为时间序列通常不需要双向上下文。\n\n### 语音与音频\n\n- **语音识别**：LSTM+CTC（Connectionist Temporal Classification）曾是标配\n- **音乐生成**：用RNN逐音符生成旋律\n- **语音合成**：Tacotron（基于Seq2Seq的TTS系统）\n\n### 视频理解\n\n- CNN提取帧特征 + RNN建模时序 → 视频动作识别\n- 例如：C3D+LSTM、LRCN（Long-term Recurrent Convolutional Networks）","formulas":[],"charts":[{"echarts_option":{"radar":{"indicator":[{"name":"NLP","max":100},{"name":"时间序列","max":100},{"name":"语音","max":100},{"name":"视频","max":100},{"name":"推荐系统","max":100},{"name":"生物序列","max":100}]},"series":[{"type":"radar","data":[{"value":[85,90,88,75,70,85],"name":"RNN应用成熟度","itemStyle":{"color":"#34d399"},"areaStyle":{"color":"rgba(52,211,153,.15)"}}]}],"title":{"text":"RNN/LSTM在各领域的应用成熟度","left":"center","top":8,"textStyle":{"fontSize":14,"color":"#8aa8b8"}}},"caption":"图：RNN在不同序列数据领域的应用成熟度","data_source":"综合评估"}],"tables":[],"references":[],"key_takeaway":"LSTM统治了NLP第一个黄金时代(2014-2018)；如今仍在时间序列、语音等场景中扮演重要角色。"},
{"module_id":"06-case-study","module_title":"机器翻译案例分析","module_tag":"实践应用","hook":"2016年9月，Google宣布其翻译系统从PBMT切换到GNMT——BLEU分数提升7个点。背后的引擎就是一个8层编码器+8层解码器的LSTM网络。","content":"### Google Neural Machine Translation (GNMT) 案例分析\n\n**系统架构**：\n- 8层编码器LSTM + 8层解码器LSTM\n- 残差连接（解决深层LSTM的训练问题）\n- 注意力机制（解码器可访问编码器所有位置）\n- 低精度训练（加速+减少显存）\n\n**关键技术一：注意力机制**\n\n最早的Seq2Seq将所有输入信息压缩到一个固定长度的上下文向量——这对于50词以上的句子是灾难性的信息瓶颈。注意力机制让解码器在生成每个目标词时，可以\"回顾\"源语言句子的所有位置：\n\n$$c_i = \\sum_{j=1}^{T_{src}} \\alpha_{ij} \\cdot h_j^{enc}$$\n\n其中 $\\alpha_{ij}$ 是注意力权重——解码器位置i对编码器位置j的\"关注量\"。\n\n**关键技术二：词片（WordPiece/BPE）**\n\nRNN每次处理一个token——如果token是整个词，生僻词和未登录词就是灾难。GNMT使用了词片（subword）切分：\n- \"unbelievable\" → \"un\" + \"believe\" + \"able\"\n- 词表从数百万个词减少到几万个词片\n\n**效果**：\n- BLEU分数提升：En→Fr 从31.5到38.5；En→Zh 从24.0到30.5\n- 翻译更流畅，错误模式从\"语法错误\"变为\"语义偏差\"（更接近人类错误）\n- 首次证明：一个深度学习系统可以端到端地处理100多种语言之间的翻译","formulas":[],"charts":[],"tables":[{"headers":["系统","方法","BLEU(En→Fr)","年份"],"rows":[["PBMT(短语统计)","统计对齐+短语表","31.5","2014"],["Seq2Seq(LSTM)","端到端神经翻译","34.0","2014"],["Seq2Seq+Attention","神经+注意力","36.0","2015"],["GNMT(Google)","8层LSTM+残差+注意力","38.5","2016"],["Transformer","自注意力","41.8","2017"]]}],"references":[{"title":"Google's Neural Machine Translation System (GNMT)","authors":"Wu, Y. et al.","year":2016,"doi":""}],"key_takeaway":"GNMT证明了深层LSTM+注意力可以端到端解决机器翻译；但从2017年起，Transformer在翻译质量上全面超越了RNN。"},
{"module_id":"07-risk","module_title":"潜在风险与挑战","module_tag":"风险与挑战","hook":"RNN的'灾难性遗忘'：读到第100个token时，第5个token的信息已经面目全非。这就是为什么简单RNN做不了摘要——开头的内容早就被'冲走'了。","content":"### 1. 长期依赖仍是挑战\n\n虽然LSTM和GRU大幅改善了长期记忆，但在非常长的序列（>500步）中，信息衰减仍然会发生：\n- LSTM的遗忘门 $f_t$ 在长序列中可能逐渐偏向\"遗忘\"\n- 细胞状态的设计缓解了梯度消失，但没有完全解决\n- **实际后果**：机器翻译中，源语言开头的信息在翻译到结尾时可能已经模糊\n\n### 2. 训练不稳定性\n\nRNN的训练比CNN/Transformer更不稳定：\n- 对学习率极为敏感——稍大就NaN\n- 初始化不当导致梯度立即爆炸或消失\n- 长期训练中，隐藏状态的范数可能发散\n\n### 3. 推理速度慢\n\nRNN必须串行处理序列——这一点是所有RNN变体的\"原罪\"。在实时应用（如语音助手）中，延迟是致命问题。Transformer在这方面具有根本性优势。\n\n### 4. 曝光偏差（Exposure Bias）\n\nSeq2Seq训练时使用\"Teacher Forcing\"——每一步输入真实的上一词而非模型自己生成的词。推理时没有真实词，只能用自己生成的→一个小错误可能导致整个序列偏离。\n\n**解决方案**：\n- **Scheduled Sampling**：训练时随机使用模型自己的预测替代真实词\n- **Beam Search**：推理时保留多个候选序列而非只取最优的一个\n\n### 5. 模式坍塌（在生成任务中）\n\nRNN生成文本时倾向于重复相同的短语或陷入循环——这是RNN关注短期模式的固有问题。","formulas":[],"charts":[],"tables":[],"references":[],"key_takeaway":"长期依赖、训练不稳定、串行推理、曝光偏差——RNN的五个固有挑战，LSTM解决了其中一部分但未全部根除。"},
{"module_id":"ai-tech-ethics","module_title":"伦理与安全","module_tag":"风险与挑战","hook":"用RNN生成的假新闻比人写的阅读量高3倍——不是因为质量更好，而是因为它能在1秒内生成100个变体，总有一个击中你的情感按钮。","content":"### RNN文本生成的伦理风险\n\n**假新闻与自动化宣传**：\n- 基于RNN/LSTM的语言模型可以生成以假乱真的新闻文章\n- 2019年，GPT-2（Transformer，但问题是RNN时代就已存在）的超强文本生成能力引发安全担忧\n- 在社交媒体上自动化发布——制造虚假共识\n\n**对话系统的偏见放大**：\n- 在有毒数据上训练的RNN聊天机器人会忠实地复现数据中的性别偏见、种族歧视\n- 微软的Tay聊天机器人在上线24小时内因被用户\"教坏\"而被迫下线（Tay部分是LSTM架构）\n\n**深度伪造文本检测**：\n- 用LSTM检测LSTM生成的文本——是一场持续的军备竞赛\n- GLTR(Giant Language Model Test Room)是最著名的检测工具——可视化每个token的\"意外程度\"\n\n### 金融场景中的风险\n\nLSTM被广泛用于量化交易中的价格预测——如果模型出错，可能是数百万美元的损失：\n- 过拟合历史模式→市场变化时大幅亏损\n- 对极端事件（黑天鹅）没有泛化能力——因为这些事件在训练数据中极少出现","formulas":[],"charts":[],"tables":[],"references":[],"key_takeaway":"RNN文本生成的伦理问题与LLM一致但更早暴露；金融预测中的过拟合和黑天鹅风险尤为严重。"},
{"module_id":"08-landscape","module_title":"发展格局","module_tag":"发展演进","hook":"2017年Transformer论文发表时，很多NLP研究者还在调试他们的BiLSTM-CRF。两年后，使用RNN的NLP论文已经很难过审了。","content":"### RNN在NLP的地位变迁\n\n**2014-2017：黄金时代**\n- LSTM/GRU是NLP的基础架构（相当于CV中的ResNet）\n- BiLSTM+CRF = NER标配\n- Seq2Seq+Attention = 机器翻译标配\n\n**2017-2019：逐渐退位**\n- Transformer(2017)展示了\"Attention is All You Need\"\n- BERT(2018)和GPT(2018)证明了预训练+Transformer的威力\n- RNN从\"必须使用\"变为\"可选方案\"\n\n**2020至今：特定领域中坚守**\n- 时间序列预测：LSTM仍是主要选择\n- 边缘设备：RNN参数少，适合MCU\n- 在线学习/流式处理：RNN的递推性有天然优势\n\n### 当前新方向\n\n1. **状态空间模型（SSM）**：Mamba(2023)等架构保留了RNN的递推效率，同时获得了Transformer的并行训练能力——可能是RNN的\"文艺复兴\"\n2. **RWKV**：类RNN的线性Transformer——在推理时可像RNN一样逐token处理，训练时可像Transformer一样并行\n3. **Linear Attention**：将注意力复杂度从O(T²)降到O(T)——桥接了RNN的效率与Transformer的表达力","formulas":[],"charts":[],"tables":[],"references":[],"key_takeaway":"RNN在NLP已退居二线，但在时间序列和边缘场景中不可或缺；Mamba/SSM/RWKV可能开启RNN的\"文艺复兴\"。"},
{"module_id":"ai-tech-research-map","module_title":"研产图谱","module_tag":"发展演进","hook":"LSTM引用超10万次，是NLP历史上第三高引用的论文——前两名是Word2Vec和BERT。","content":"### 学术研究热度变化\n\n| 年份 | RNN/LSTM论文占比(NLP) | Transformer论文占比 | 趋势 |\n|------|---------------------|-------------------|------|\n| 2015 | ~70% | ~0% | RNN统治 |\n| 2017 | ~60% | ~5% | Transformer出现 |\n| 2019 | ~30% | ~40% | 此消彼长 |\n| 2021 | ~10% | ~65% | Transformer主导 |\n| 2024 | ~5% | ~70% | RNN退为小众 |\n\n### 工业界使用情况\n\n- **Google Translate**：2016-2018 RNMT(LSTM) → 2018+ Transformer\n- **Apple Siri**：混合使用（RNN的流式处理优势）\n- **量化交易**：LSTM+Attention仍大量使用（重视可解释的低延迟推理）\n- **语音处理**：RNN-T(Transducer)在流式语音识别中仍广泛应用\n\n### 关键研究机构\n\n| 机构 | 代表工作 |\n|-----|---------|\n| IDSIA (Schmidhuber lab) | LSTM原始研究 |\n| Google Brain | Seq2Seq, GNMT, Attention |\n| 蒙特利尔大学 (Bengio) | 神经机器翻译, 注意力机制 |\n| Carnegie Mellon | Mamba, SSM |","formulas":[],"charts":[],"tables":[],"references":[],"key_takeaway":"RNN在NLP学术研究中的占比从70%降至5%；但工业界在某些场景中由于实时性需求仍然依赖RNN。"},
{"module_id":"09-issues","module_title":"发展问题","module_tag":"风险与挑战","hook":"RNN最大的悲剧在于：它证明了序列建模的可能性、孕育了注意力机制、最终被自己的后代超越。Sigmoid看见了ReLU取代自己，RNN看见了Transformer取代自己。","content":"### 1. 被Transformer全面超越\n\n这是RNN面临的最根本问题：在NLP这个主场中，Transformer在几乎所有维度上都优于RNN：\n- 精度：更好（尤其是长依赖）\n- 训练速度：更快（并行处理）\n- 可扩展性：更好（Scaling Law更显著）\n- 多模态：天然统一\n\n### 2. 理论理解的不足\n\n我们对为什么LSTM能记住100步以外信息有一个很好的直觉理解（细胞状态的高速通道），但为什么GRU在只有两个门的情况下也能记住同样长的依赖？为什么有些任务简单RNN也够用？这些问题的理论答案仍然不完全清晰。\n\n### 3. 硬件优化不足\n\ncuDNN对卷积的深度优化（Winograd, FFT）在CNN推理上带来了数倍加速。但RNN由于串行特性，硬件优化空间有限。\n\n### 4. 与预训练范式的兼容性\n\n预训练+微调的范式天然适合Transformer（并行+统一token表示），但对RNN不太友好：\n- BPTT使得预训练慢\n- 没有像\"positional encoding\"这样优雅的位置编码\n- 难以扩展到成千上万的上下文长度","formulas":[],"charts":[],"tables":[],"references":[],"key_takeaway":"RNN的核心劣势：精度、速度、可扩展性均被Transformer超越；但Mamba/SSM可能从另一个方向解决问题。"},
{"module_id":"10-prospect","module_title":"未来趋势","module_tag":"前沿探索","hook":"Mamba论文在2023年被CS学位论文引用最多的研究方向——它用状态空间模型实现了RNN的效率和Transformer的精度。RNV也许还没死。","content":"### 趋势一：状态空间模型(SSM)的崛起\n\nMamba (2023, CMU & Princeton) 代表了序列建模的新范式：\n- 像RNN一样可以逐token递推（推理效率高）\n- 像Transformer一样可以并行训练\n- 在长序列任务上达到甚至超越Transformer\n\n其数学基础是连续时间的状态空间方程：\n$$h'(t) = A h(t) + B x(t), \\quad y(t) = C h(t)$$\n\n离散化后变成可高效计算的递推式。\n\n### 趋势二：RNN+Transformer混合架构\n\n部分层的自注意力 + 部分层的RNN递推，取双方之长：\n- 早期层用卷积→快速局部特征提取\n- 中间层用注意力→长程依赖建模\n- 解码层用RNN→高效的逐token生成\n\n### 趋势三：在线/增量学习\n\n\"流式数据\"场景（IoT、金融tick数据）天然适合RNN——模型可以在新数据到来时增量更新，无需重新训练。这是Transformer难以做到的。\n\n### 趋势四：神经科学启发\n\n生物大脑中的工作记忆机制（前额叶皮层的持续性活动）在数学上与RNN的隐藏状态更新高度相似。神经科学对工作记忆的新发现可能启发下一代循环架构的设计。","formulas":[{"latex":"$$h'(t) = A h(t) + B x(t), \\quad y(t) = C h(t)$$","caption":"连续时间状态空间模型：h是潜在状态，A控制状态演化，B控制输入映射，C控制输出映射","expandable":false,"derivation":""}],"charts":[],"tables":[],"references":[{"title":"Mamba: Linear-Time Sequence Modeling with Selective State Spaces","authors":"Gu, A. & Dao, T.","year":2023,"doi":""}],"key_takeaway":"Mamba/SSM是最有希望的RNN替代者——兼具RNN的递推效率和Transformer的并行能力；RNN的思想不会消失，只是换了一种形式。"},
{"module_id":"11-effort-direction","module_title":"学习路径","module_tag":"核心概念","hook":"理解LSTM不需要懂1997年的德语论文——只需要理解四个公式：三个sigmoid门+一个tanh候选。","content":"### 3周学习计划\n\n**第1周：RNN基础**\n1. 用NumPy实现简单RNN的forward（手写循环，逐t计算）\n2. 用PyTorch的nn.RNN复现，对比结果\n3. 理解时间展开和BPTT的概念\n4. 可视化梯度在100步简单RNN中的衰减\n\n**第2周：LSTM与GRU**\n1. 手写LSTM的forward：实现遗忘门、输入门、输出门和细胞状态更新\n2. 对比LSTM和GRU在同一个任务上的表现（如字符级语言模型）\n3. 理解\"gate\"的含义——0到1之间的标量控制信息流\n4. 训练一个LSTM文本生成器——输入莎士比亚，输出\"伪莎士比亚\"\n\n**第3周：Seq2Seq与注意力**\n1. 实现一个简单的Seq2Seq翻译模型（如英→法的日期转换）\n2. 加入Bahdanau注意力\n3. 理解Teacher Forcing和Beam Search\n4. 在时间序列数据上训练LSTM预测器\n\n### 必读论文\n\n1. Hochreiter & Schmidhuber (1997) — LSTM（理解\"门\"为什么能记住长期信息）\n2. Cho et al. (2014) — GRU（理解两种门控的等效简化）\n3. Sutskever et al. (2014) — Seq2Seq（理解编码-解码范式）\n4. Bahdanau et al. (2015) — Attention（理解注意力如何突破信息瓶颈）\n5. Gu & Dao (2023) — Mamba（了解序列模型的下一代方向）","formulas":[],"charts":[],"tables":[{"headers":["项目","难度","时间","核心收获"],"rows":[["手写RNN forward(NumPy)","★★","1天","理解循环连接的本质"],["手写LSTM(NumPy)","★★★","2天","门控机制和细胞状态"],["LSTM文本生成","★★","2天","序列生成完整流程"],["Seq2Seq翻译","★★★","3天","编码-解码+注意力"],["时间序列预测","★★","2天","RNN在非NLP中的应用"]]}],"references":[],"key_takeaway":"3周路线：手写RNN→LSTM/GRU→Seq2Seq+Attention；关键是跟着代码亲手验证\"门控\"如何控制信息流。"},
{"module_id":"12-innovation","module_title":"创新前沿","module_tag":"前沿探索","hook":"Mamba的作者之一Tri Dao也是FlashAttention的创造者——他把对GPU显存层次的理解从注意力搬到了状态空间模型，又一次改变了序列建模的游戏规则。","content":"### 1. Mamba：选择性状态空间\n\nMamba的核心创新在于\"**选择性**\"——让SSM的参数依赖于输入：\n- 传统SSM：A, B, C是固定的（时间不变）\n- Mamba的SSM：B和C随输入变化（时间可变）\n\n$$B_t = s_B(x_t), \\quad C_t = s_C(x_t)$$\n\n这意味着Mamba可以根据输入内容\"选择性\"地记住或遗忘信息——类似于LSTM的门控，但效率远高于注意力。\n\n### 2. RWKV：线性注意力的RNN\n\nRWKV(Receptance Weighted Key Value)将Transformer的自注意力改造为线性时间的RNN形式：\n- 训练时：使用线性注意力（O(T)而非O(T²)）\n- 推理时：像RNN一样逐token递推\n- 在第一届RWKV的hackathon中，社区已将其扩展到70亿参数\n\n### 3. 储备池计算（Reservoir Computing）\n\n一种极端的RNN训练简化思路：随机初始化循环权重并冻结，只训练输出层。虽然精度不如LSTM，但在计算资源极度受限的场景（如物联网传感器芯片）中具有独特的成本优势。\n\n### 4. Liquid Neural Networks\n\nMIT的液时神经网络（LNN）将时间常数也作为可学习参数，在机器人控制等时序决策任务中表现优异：\n- 更少的神经元达到相当的决策能力\n- 对噪声和时间尺度变化高度鲁棒","formulas":[],"charts":[],"tables":[],"references":[{"title":"Mamba: Linear-Time Sequence Modeling with Selective State Spaces","authors":"Gu, A. & Dao, T.","year":2023,"doi":""},{"title":"RWKV: Reinventing RNNs for the Transformer Era","authors":"Peng, B. et al.","year":2023,"doi":""}],"key_takeaway":"Mamba的选择性SSM和RWKV的线性注意力代表了\"后Transformer时代\"序列建模的两条主要路径。"},
{"module_id":"13-misconceptions","module_title":"常见误区","module_tag":"核心概念","hook":"'RNN已经过时了'——说这句话的人可能是对的，但把RNN换成LSTM开口就很危险。很多时间序列预测系统至今仍用LSTM，效果和Transformer不相上下。","content":"### 误区1：\"RNN就是LSTM\"\n\nRNN是一类架构的通称，LSTM是其中一种特化变体。还有GRU、Peephole LSTM、IndRNN等数十种变体。在本文中\"简单RNN\"特指Elman网络（$h_t = \\tanh(W_h h_{t-1} + W_x x_t)$）。\n\n### 误区2：\"LSTM解决了所有梯度消失问题\"\n\nLSTM极大地缓解了梯度消失，但并没有完全解决。在超过500-1000步的超长序列中，信息衰减仍然会发生。这就是为什么即使是LSTM也需要截断BPTT和梯度裁剪。\n\n### 误区3：\"双向LSTM总是比单向好\"\n\n在需要实时预测的场景（如流式语音识别、实时翻译），你无法\"看到未来\"——未来还没发生。双向LSTM需要完整的序列才能运行，所以在这些场景中必须使用单向版本。\n\n### 误区4：\"Transformer完全替代了RNN\"\n\n在NLP中基本是的。但在以下领域中RNN（特别是LSTM）仍然具有竞争力：\n- 时间序列预测（不需要长依赖中的全局交互）\n- 流式处理（RNN的递推性和低延迟）\n- 资源极度受限的设备（MCU上的微型LSTM）\n- 神经科学建模（RNN与生物神经回路更相似）","formulas":[],"charts":[],"tables":[],"references":[],"key_takeaway":"RNN≠LSTM；LSTM未完全解决梯度消失；双向不总是更好；RNN在特定领域中仍有不可替代的优势。"},
{"module_id":"14-glossary","module_title":"关键术语表","module_tag":"核心概念","hook":"Cell State、Hidden State、Forget Gate——这三个概念是LSTM的灵魂。理解它们，你就理解了为什么LSTM能记住\"200字前提到的那只猫\"。","content":"- **RNN（循环神经网络）**：通过隐藏状态的循环连接，使网络具备时序处理能力的架构\n- **隐藏状态（Hidden State $h_t$）**：网络的\"工作记忆\"——对截至当前时刻所有输入信息的压缩表示\n- **细胞状态（Cell State $c_t$）**：LSTM的\"长期记忆\"——通过门控机制保护，可以在较长时间尺度上传递信息\n- **遗忘门（Forget Gate $f_t$）**：sigmoid输出0-1之间的值，控制从细胞状态中\"丢弃\"多少旧信息\n- **输入门（Input Gate $i_t$）**：控制有多少\"新候选信息\"要写入细胞状态\n- **输出门（Output Gate $o_t$）**：控制细胞状态中有多少信息输出到隐藏状态\n- **GRU（门控循环单元）**：简化的LSTM，通过重置门和更新门控制信息流\n- **BPTT（穿越时间反向传播）**：将RNN在时间上展开后进行反向传播的训练算法\n- **Teacher Forcing**：训练Seq2Seq时，每一步用真实的上一词而非模型生成的词作为输入\n- **Seq2Seq**：编码器-解码器架构，编码器将输入序列编码为上下文向量，解码器生成输出序列\n- **注意力机制（Attention）**：解码器动态关注编码器的不同位置，突破固定长度上下文向量的信息瓶颈\n- **Beam Search**：推理时保留k个最优候选序列的搜索策略\n- **截断BPTT**：将长序列切分为段，段内完整BPTT但段间不传梯度\n- **Scheduled Sampling**：训练时以一定概率用模型自己的预测替代真实词，缓解曝光偏差\n- **BiLSTM/BiGRU**：双向版本，同时从前向后和从后向前处理序列\n- **双向RNN的局限性**：需要完整序列，无法用于实时/流式场景\n- **SSM（状态空间模型）**：将序列建模视为连续时间动态系统，兼具RNN的递推效率和Transformer的并行能力的新一代架构","formulas":[],"charts":[],"tables":[],"references":[],"key_takeaway":"理解这17个核心术语，你就掌握了从RNN到Mamba的序列建模全貌。"},
{"module_id":"15-debate","module_title":"争议与辩论","module_tag":"前沿探索","hook":"LSTM vs GRU吵了十年没有结论，最终的裁判是实践：数据多用LSTM，数据少用GRU，追求SOTA用Transformer。","content":"### 争议1：LSTM vs GRU——到底用哪个？\n\n**LSTM派**：\n- 表达能力更强（三个门 vs 两个门）\n- 在大数据和大模型上表现略好\n- 研究和工程经验更丰富\n\n**GRU派**：\n- 参数更少、训练更快\n- 在小数据上泛化可能更好\n- 足够解决大多数问题\n\n**实践建议**：先试GRU，如果效果不够再换LSTM。在大多数场景中差距不到2个百分点。\n\n### 争议2：RNN还值得学吗？\n\n**学习派**：\n- 理解序列建模的演进需要从RNN开始\n- LSTM的门控思想在Transformer中也有类似设计（如Gated MLP）\n- 面试中RNN仍是基础题\n\n**跳过派**：\n- 直接从Transformer和Attention开始更高效\n- 实际工作中几乎用不到RNN\n\n**折中建议**：理解RNN的核心概念（门控、BPTT、隐状态），但不需要深入细节。把更多时间花在Transformer上。\n\n### 争议3：注意力是万能药吗？\n\n**注意力派**：Attention机制让模型自己学习\"关注哪里\"——这是比RNN/CNN更通用的设计\n**反驳派**：自注意力的O(T²)复杂度在长序列上是不可行的——SSM和线性注意力才是更优解\n**现实**：注意力+RNN的混合方案（如Transformer的decoder中使用KV-cache加速推理）是目前最实用的方向。","formulas":[],"charts":[],"tables":[],"references":[],"key_takeaway":"LSTM vs GRU没有绝对赢家；RNN值得学但不必精；注意力万能但不等于高效。"}
]};

(function(){var cv=document.getElementById('bg-canvas'),ctx=cv.getContext('2d'),particles=[];function rsz(){cv.width=window.innerWidth;cv.height=window.innerHeight}window.addEventListener('resize',rsz);rsz();var count=Math.min(60,Math.floor((cv.width*cv.height)/20000));for(var i=0;i<count;i++)particles.push({x:Math.random()*cv.width,y:Math.random()*cv.height,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:Math.random()*1.5+.3,a:Math.random()*.3+.05});function anim(){ctx.clearRect(0,0,cv.width,cv.height);var isDark=document.documentElement.getAttribute('data-theme')!=='light';var c=isDark?'129,140,248':'99,102,241';particles.forEach(function(p){p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=cv.width;if(p.x>cv.width)p.x=0;if(p.y<0)p.y=cv.height;if(p.y>cv.height)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fillStyle='rgba('+c+','+p.a+')';ctx.fill()});for(var j=0;j<particles.length;j++)for(var k=j+1;k<particles.length;k++){var dx=particles[j].x-particles[k].x,dy=particles[j].y-particles[k].y,d=Math.sqrt(dx*dx+dy*dy);if(d<110){ctx.beginPath();ctx.moveTo(particles[j].x,particles[j].y);ctx.lineTo(particles[k].x,particles[k].y);ctx.strokeStyle='rgba('+c+','+(.06*(1-d/110))+')';ctx.lineWidth=.5;ctx.stroke()}}requestAnimationFrame(anim)}anim()})();
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);localStorage.setItem('slm-theme',t);updateThemeIcon();Object.values(activeCharts).forEach(function(c){c.setOption(createThemedOption(c.getOption()),{notMerge:false})})}
function toggleTheme(){var c=document.documentElement.getAttribute('data-theme')||'light';applyTheme(c==='dark'?'light':'dark')}
function updateThemeIcon(){document.getElementById('theme-toggle').textContent=document.documentElement.getAttribute('data-theme')==='dark'?'☀️':'🌓'}

applyTheme(localStorage.getItem('slm-theme')||'dark');
window.addEventListener('scroll',function(){var s=window.scrollY,d=document.documentElement.scrollHeight-window.innerHeight,p=d>0?(s/d)*100:0;document.getElementById('progress-bar').style.width=p+'%'});
function buildSidebar(){var c=document.getElementById('sidebar-links');sidebarLinks=[];PAGE_DATA.modules.forEach(function(m){var a=document.createElement('a');a.href='#'+m.module_id;a.className='sidebar-link';a.textContent=m.module_title||m.module_id;a.addEventListener('click',function(e){e.preventDefault();document.getElementById(m.module_id).scrollIntoView({behavior:'smooth'});if(window.innerWidth<=768)document.getElementById('sidebar').classList.remove('open')});c.appendChild(a);sidebarLinks.push({el:a,id:m.module_id})})}
var observer=new IntersectionObserver(function(e){e.forEach(function(x){if(x.isIntersecting)sidebarLinks.forEach(function(l){l.el.classList.toggle('active',l.id===x.target.id)})})},{rootMargin:'-80px 0px -60% 0px'});
function buildMetaCard(){var m=PAGE_DATA;document.getElementById('meta-card-container').innerHTML='<div class="meta-card"><div class="meta-item" style="width:100%;font-size:12px;color:var(--text-muted)">🔗 机器学习及其统计基础与大模型 系统学习方案 · 深度学习基础（3/5）</div><div class="meta-item"><span class="icon">📖</span><strong>'+m.topic+'</strong></div><div class="meta-item"><span class="meta-badge domain-ai">'+m.domain_name+'</span></div><div class="meta-item"><span class="meta-badge level-intermediate">'+m.level_name+'</span></div><div class="meta-item"><span class="meta-badge" style="background:rgba(78,197,180,.15);color:var(--accent-cyan)">'+m.depth+'×'+m.breadth+'</span></div><div class="meta-item"><span class="icon">⏱️</span>约'+m.reading_time+'分钟阅读</div><div class="meta-item"><span class="icon">📦</span>'+m.module_count+'个模块</div></div>'}
function renderFormulas(c){if(typeof renderMathInElement!=='undefined')renderMathInElement(c,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})}
function createThemedOption(o){var d=document.documentElement.getAttribute('data-theme')==='dark';var cl=d?['#818cf8','#a78bfa','#c4b5fd','#67e8f9','#fbbf24','#34d399','#f87171','#f472b6']:['#6366f1','#8b5cf6','#a78bfa','#22d3ee','#f59e0b','#10b981','#ef4444','#ec4899'];return{color:cl}}
function renderChart(mid,cfg,idx){var cid='chart_'+mid+'_'+idx,w=document.getElementById(cid);if(!w)return;if(typeof echarts==='undefined'){w.innerHTML='<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:13px;">📊 图表(静态模式)</div>';return}try{var ch=echarts.init(w),o=cfg.echarts_option||{};if(typeof o==='string'){try{ch.setOption(createThemedOption(JSON.parse(o)))}catch(e){w.textContent='图表配置解析失败';return}}else ch.setOption(createThemedOption(o));activeCharts[cid]=ch;new ResizeObserver(function(){ch.resize()}).observe(w)}catch(e){w.textContent='图表渲染失败'}}
function buildModuleHTML(m){var tc=getTagClass(m.module_tag||''),h='<section class="module-section" id="'+m.module_id+'"><div class="module-header"><span class="module-tag '+tc+'">'+(m.module_tag||'')+'</span><h2 class="module-title">'+(m.module_title||m.module_id)+'</h2></div>';if(m.hook)h+='<div class="module-hook">'+m.hook+'</div>';h+='<div class="module-content">'+parseMD(m.content||'')+'</div>';if(m.formulas&&m.formulas.length>0)m.formulas.forEach(function(f){var e=f.expandable&&f.derivation;h+='<div class="formula-block'+(e?'':' not-expandable')+'" onclick="'+(e?'toggleDerivation(this)':'')+'"><div>'+f.latex+'</div>';if(f.caption)h+='<div class="formula-caption">'+f.caption+'</div>';if(e)h+='<div class="formula-expand-hint">💡 点击展开推导过程</div><div class="formula-derivation">'+f.derivation+'</div>';h+='</div>'});if(m.charts&&m.charts.length>0)m.charts.forEach(function(ch,ci){var cid='chart_'+m.module_id+'_'+ci;h+='<div class="chart-container"><div class="chart-wrapper" id="'+cid+'"></div>';if(ch.caption)h+='<div class="chart-caption">'+ch.caption+'</div>';if(ch.data_source)h+='<div class="chart-source">'+ch.data_source+'</div>';h+='</div>'});if(m.tables&&m.tables.length>0)m.tables.forEach(function(t){h+='<div style="overflow-x:auto"><table class="module-table"><thead><tr>'+t.headers.map(function(hd){return'<th>'+hd+'</th>'}).join('')+'</tr></thead><tbody>'+t.rows.map(function(r){return'<tr>'+r.map(function(c){return'<td>'+c+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table>';if(t.caption)h+='<div class="table-caption">'+t.caption+'</div>';h+='</div>'});if(m.references&&m.references.length>0){h+='<div class="module-references"><h4>📚 参考文献</h4><ol>';m.references.forEach(function(r){h+='<li>'+r.authors+' ('+r.year+'). <strong>'+r.title+'</strong>.'+(r.doi?' <a href="https://doi.org/'+r.doi+'" target="_blank" style="color:var(--accent-cyan)">DOI</a>':'')+(r.url?' <a href="'+r.url+'" target="_blank" style="color:var(--accent-cyan)">链接</a>':'')+'</li>'});h+='</ol></div>'}if(m.key_takeaway)h+='<div class="module-key-takeaway">🔑 '+m.key_takeaway+'</div>';h+='</section>';return h}
function getTagClass(t){var m={'核心概念':'tag-core','前置知识':'tag-core','核心工具':'tag-tools','发展演进':'tag-evolution','实践应用':'tag-application','风险与挑战':'tag-risk','前沿探索':'tag-frontier'};return m[t]||'tag-core'}
function parseMD(c){if(!c)return'';var h=c;h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');h=h.replace(/\*(.+?)\*/g,'<em>$1</em>');h=h.replace(/`([^`]+)`/g,'<code style="background:var(--bg-elevated);padding:2px 6px;border-radius:4px;font-size:13px;">$1</code>');h=h.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" style="color:var(--accent-cyan)">$1</a>');h=h.replace(/^### (.+)$/gm,'<h3 style="font-size:17px;font-weight:600;margin:20px 0 8px;">$1</h3>');h=h.replace(/^## (.+)$/gm,'<h3 style="font-size:18px;font-weight:600;margin:24px 0 10px;">$1</h3>');h=h.replace(/\n\n/g,'</p><p>');h='<p>'+h+'</p>';h=h.replace(/<p>\s*<\/p>/g,'');return h}
function toggleDerivation(e){e.classList.toggle('expanded')}
function initPage(){document.body.classList.remove('loading');document.body.classList.add('loaded');buildMetaCard();buildSidebar();buildMobileNav();var mc=document.getElementById('modules-container');PAGE_DATA.modules.forEach(function(m){mc.innerHTML+=buildModuleHTML(m)});var s=mc.querySelectorAll('.module-section');s.forEach(function(x){observer.observe(x)});renderFormulas(mc);setTimeout(function(){PAGE_DATA.modules.forEach(function(m){if(m.charts)m.charts.forEach(function(ch,ci){renderChart(m.module_id,ch,ci)})})},100);var fo=new IntersectionObserver(function(e){e.forEach(function(x){if(x.isIntersecting)x.target.classList.add('visible')})},{threshold:.08});s.forEach(function(x){fo.observe(x)});document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();openSearch()}if((e.ctrlKey||e.metaKey)&&e.key==='d'){e.preventDefault();toggleTheme()}if(e.key==='Escape'){if(document.getElementById('searchOverlay').classList.contains('open')){closeSearch();return}}if(e.shiftKey&&e.key==='?'){e.preventDefault();document.getElementById('helpOverlay').classList.add('open')}})}
function buildMobileNav(){var items=[];PAGE_DATA.modules.forEach(function(m,i){if(i%Math.max(1,Math.ceil(PAGE_DATA.modules.length/5))===0)items.push({id:m.module_id,label:(m.module_title||m.module_id).substring(0,4)})});if(items.length>5)items=items.slice(0,5);document.getElementById('mobileBottomNav').innerHTML=items.map(function(x){return'<button class="mbn-item" onclick="document.getElementById(\''+x.id+'\').scrollIntoView({behavior:\'smooth\'})">📑'+x.label+'</button>'}).join('')+'<button class="mbn-item" onclick="window.scrollTo({top:0,behavior:\'smooth\'})">⬆顶部</button>'}
function exportPDF(){window.print()}
function exportNotes(){var l=['# '+PAGE_DATA.topic+' - 学习笔记','','生成日期: '+new Date().toLocaleDateString('zh-CN'),''];PAGE_DATA.modules.forEach(function(m){l.push('- **'+(m.module_title||m.module_id)+'**: '+(m.key_takeaway||m.hook||''))});var t=l.join('\n');if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){alert('✅ 学习笔记已复制到剪贴板!')});else{var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);alert('✅ 学习笔记已复制到剪贴板!')}}
function openSearch(){var o=document.getElementById('searchOverlay');o.classList.add('open');document.getElementById('searchInput').value='';document.getElementById('searchInput').focus();document.getElementById('searchResults').innerHTML=''}
function closeSearch(){document.getElementById('searchOverlay').classList.remove('open')}
document.getElementById('searchOverlay').addEventListener('click',function(e){if(e.target===this)closeSearch()});
document.getElementById('searchInput').addEventListener('input',function(){var q=this.value.toLowerCase(),r=document.getElementById('searchResults');if(!q||q.length<2){r.innerHTML='';return}function hl(t){if(!t)return'';var i=t.toLowerCase().indexOf(q);if(i===-1)return t;return t.substring(0,i)+'<mark>'+t.substring(i,i+q.length)+'</mark>'+t.substring(i+q.length)}var results=[];PAGE_DATA.modules.forEach(function(m){var title=m.module_title||m.module_id||'',txt=(m.hook||'')+' '+(m.content||'')+' '+(m.key_takeaway||'');if(title.toLowerCase().indexOf(q)!==-1||txt.toLowerCase().indexOf(q)!==-1)results.push({id:m.module_id,title:hl(title),snippet:(m.hook||txt).substring(0,80)})});r.innerHTML=results.slice(0,12).map(function(x){return'<div class="sr-item" onclick="document.getElementById(\''+x.id+'\').scrollIntoView({behavior:\'smooth\'});closeSearch();"><div class="sr-title">'+x.title+'</div><div class="sr-snippet">'+x.snippet+'</div></div>'}).join('')||'<div class="search-empty">无匹配结果</div>'});
document.getElementById('helpOverlay').addEventListener('click',function(e){if(e.target===this)this.classList.remove('open')});
document.addEventListener('DOMContentLoaded',initPage);
</script>
</body>
</html>
