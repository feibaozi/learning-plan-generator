const PAGE_DATA={topic:"模型评估与交叉验证",domain:"ai-tech",domain_name:"AI与科技",level:"intermediate",level_name:"进阶",reading_time:"32",module_count:"16",texture:"G5",texture_name:"全面平衡型",depth:"理解",breadth:"标准",modules:[
{module_id:"background",module_tag:"发展演进",module_title:"背景与缘起：从训练集到泛化",hook:"你精心训练的模型在测试集上表现完美——但在真实数据上却一塌糊涂。这不是bug，这是你在训练时忘了最重要的一步：评估。",content:"模型评估的核心理念——**永远不在训练数据上评估模型性能**——并不是理所当然的。在机器学习的早期，研究者常常在训练数据上报告模型表现，导致过度乐观的结论。\n\n**关键转折点**：**Stone (1974)**发表了'Cross-Validatory Choice and Assessment of Statistical Predictions' 论文，首次系统提出交叉验证作为模型选择的方法。**Geisser (1975)** 独立提出了类似的leave-one-out方法。Larsen & Goutte (1999) 证明CV估计的方差可以被估计和最小化。Kohavi (1995) 对各种CV方法进行了大规模实证对比。\n\n**No Free Lunch定理** (Wolpert, 1996)：没有任何一个模型在所有任务上都优于其他模型。这个定理实际上暗示了：**评估比建模更根本**——你需要通过评估来确定'在这个特定数据集上，哪个模型最好'，因为不存在先验的全局最优模型。\n\n**'为什么评估如此困难'**：训练误差＜真实泛化误差（过拟合时差距巨大）；测试误差是对泛化误差的无偏但高方差估计；CV平均可以降低方差但仍有偏。理解这种估计的不确定性，是成为成熟ML工程师的标志。",key_takeaway:"No Free Lunch定理告诉我们：评估不是建模的附属品，而是建模的核心。选择哪个模型，取决于评估方法；评估方法的选择，取决于数据和目标。"},{module_id:"concept",module_tag:"核心概念",module_title:"核心概念：泛化误差的分解",hook:"泛化误差不是'一个数字'——它是三个力量的战场：偏差、方差和不可约噪声。",content:"**偏差-方差分解**是理解模型泛化的核心框架：\n$$\\mathbb{E}[(y-\\hat{f}(x))^2] = \\underbrace{\\text{Bias}[\\hat{f}(x)]^2}_{\\text{模型族的系统误差}} + \\underbrace{\\text{Var}[\\hat{f}(x)]}_{\\text{对训练数据的敏感度}} + \\underbrace{\\sigma^2}_{\\text{不可约噪声}}$$\n\n- **偏差(Bias)**：简化模型假设与真实世界之间的系统性距离。高偏差=欠拟合（如用线性模型拟合二次曲线）。\n- **方差(Variance)**：模型对训练数据的敏感程度。高方差=过拟合（不同训练集→差异巨大的模型）。\n- **噪声**：数据本身的随机性——评估的真正下限。\n\n**为什么交叉验证能估计泛化误差**：\n1. k-fold CV将数据分成k份\n2. 每次用k-1份训练，1份验证→得到k个验证误差\n3. 平均k个验证误差→作为泛化误差的估计\n4. 当k=n时（LOOCV），估计近似无偏但方差最大\n\n**关键直觉**：CV误差是对泛化误差的**无偏或低偏**估计。但CV误差本身也是一个统计量——它有自己的方差。不要只看CV误差的均值，也要看fold间的标准差！",formulas:[{latex:"$$\\text{Err}(x) = \\mathbb{E}[(Y-\\hat{f}(x))^2] = \\text{Bias}^2 + \\text{Variance} + \\sigma^2$$",caption:"偏差-方差-噪声三元分解——理解所有ML模型泛化能力的基础公式",expandable:true,derivation:"$\\mathbb{E}[(Y-\\hat{f})^2] = \\mathbb{E}[(f+\\epsilon-\\hat{f})^2] = \\mathbb{E}[(f-\\mathbb{E}[\\hat{f}]+\\mathbb{E}[\\hat{f}]-\\hat{f}+\\epsilon)^2]$。展开平方，交叉项因期望归零：$=\\mathbb{E}[(f-\\mathbb{E}[\\hat{f}])^2]+\\mathbb{E}[(\\mathbb{E}[\\hat{f}]-\\hat{f})^2]+\\mathbb{E}[\\epsilon^2] = \\text{Bias}^2+\\text{Variance}+\\sigma^2$。"},{latex:"$$\\text{CV}_{(k)} = \\frac{1}{k}\\sum_{i=1}^{k} \\text{Err}(\\text{fold}_i)$$",caption:"k-fold交叉验证的泛化误差估计"}],key_takeaway:"偏差、方差和噪声——三个力量动态平衡，决定了模型在真实世界中的表现。CV是对这个平衡的数值化测量，但它自己也有不确定性。"},{module_id:"principle",module_tag:"核心概念",module_title:"核心原理：评估指标全景",hook:"准确率99%的模型可能完全没用，而F1=0.3的模型可能救人性命——选择正确的评估指标，比选择模型本身更重要。",content:"**分类问题的指标矩阵**\n所有分类指标都来自混淆矩阵的四个数字：\n- TP (True Positive): 预测正，实际正\n- FP (False Positive): 预测正，实际负（假警报）\n- FN (False Negative): 预测负，实际正（漏报）\n- TN (True Negative): 预测负，实际负\n\n由此衍生出的关键指标：\n- **Accuracy** = (TP+TN)/(TP+TN+FP+FN) ——最常用但最容易被类别不平衡欺骗\n- **Precision** = TP/(TP+FP) ——预测为正的样本中有多少是真的→关注假阳性\n- **Recall** = TP/(TP+FN) ——所有正样本中有多少被找到→关注假阴性\n- **F1-Score** = $2\\cdot\\text{Precision}\\cdot\\text{Recall}/(\\text{Precision}+\\text{Recall})$ ——P和R的调和平均\n- **AUC-ROC**：ROC曲线下的面积，衡量排序能力而非阈值敏感→1.0=完美，0.5=随机\n- **AUC-PR**：P-R曲线下的面积，在类别不平衡时比AUC-ROC更敏感\n\n**回归问题的指标矩阵**：\n- **MSE**: $\\frac{1}{n}\\sum(y_i-\\hat{y}_i)^2$ ——对异常值敏感（平方惩罚）\n- **MAE**: $\\frac{1}{n}\\sum|y_i-\\hat{y}_i|$ ——对异常值鲁棒，但不可微\n- **RMSE**: $\\sqrt{\\text{MSE}}$ ——与原始目标同量纲，更易解释\n- **R²**: $1-\\frac{\\sum(y_i-\\hat{y}_i)^2}{\\sum(y_i-\\bar{y})^2}$ ——比例型指标，0-1之间\n- **MAPE**: $\\frac{1}{n}\\sum|\\frac{y_i-\\hat{y}_i}{y_i}|$ ——百分比误差，但y_i→0时爆炸",tables:[{headers:["场景","首选指标","为什么"],rows:[["均衡分类","Accuracy/F1","基础场景"],["类别不平衡","AUC-PR/F1","Accuracy无效"],["癌症筛查(不能漏诊)","Recall优先","假阴性代价极高"],["垃圾邮件(不能误判)","Precision优先","假阳性代价极高"],["回归(无异常值)","MSE/RMSE","经典选择"],["回归(有异常值)","MAE","对异常鲁棒"]]},{headers:["评估方法","偏差","方差","计算量","适用场景"],rows:[["Holdout(单次划分)","中(依赖划分)","高","1次训练","大数据(>1M)"],["k-fold CV(k=5)","低","中","k次训练","通用(默认选择)"],["k-fold CV(k=10)","很低","中低","10次训练","中小数据(<10K)"],["LOOCV(k=n)","几乎无偏","高","n次训练","极小数据(<100)"],["Repeated CV","很低","低","k×r次训练","需要置信区间时"],["嵌套CV(Nested)","无偏","中","k×k'次训练","模型选择+评估"]]}],key_takeaway:"没有'最佳指标'——只有最适合你业务场景的指标。癌症筛查→Recall≥0.95，垃圾邮件→Precision≥0.99，信用评分→AUC-ROC≥0.85。"},{module_id:"architecture",module_tag:"核心概念",module_title:"交叉验证的流程设计",hook:"k-fold CV看起来简单——把数据切成k份，循环训练k次。但如果操作不当，一个微小的数据泄露就能让你的CV分数高得不真实。",content:"**k-fold CV的标准流程**：\n1. 将数据随机打乱，分成k个大小相等的fold\n2. 对于每个fold i：用其他k-1个fold做训练集，第i个fold做验证集→训练模型→记录验证误差\n3. 最终CV score = k个验证误差的平均值，标准差 = fold间误差的标准差\n\n**分层CV（Stratified CV）——分类问题必备**：\n标准CV可能在某个fold中'不小心'让某一类样本过少→训练出不代表总体的模型。分层CV保证每个fold中类别比例与原始数据一致→更稳定的评估。\n\n**时间序列CV**：\n普通CV的打乱操作对时序数据是致命的（用未来预测过去→数据泄露）。时序CV只能'向前'训练：\n- TimeSeriesSplit：第1次用前10%训练→验证第11-20%；第2次用前20%→验证第21-30%...\n- 扩展窗口：训练集随时间不断扩大，验证集保持固定大小向前滚动\n\n**嵌套CV（正确做模型选择的方法）**：\n内层CV：做超参数调优（如选最好的λ）\n外层CV：评估选出的模型在新数据上的泛化性能\n→避免'看了答案再做题'（调参时已经看了测试数据）",key_takeaway:"数据打乱+分层保持+时序向前——三种场景三种CV策略。嵌套CV是模型选择和评估的'金标准'，代价是训练量增加O(k²)倍。"},{module_id:"development",module_tag:"发展演进",module_title:"发展迭代",content:"**1970s-1990s：方法论奠基**\nStone (1974)提出CV→Geisser (1975)独立提出LOOCV→Efron (1983)引入bootstrap评估→Kohavi (1995)大规模实证比较CV方法。\n\n**1990s-2010s：理论与工程化**\nEfron & Tibshirani (1997)：.632 bootstrap估计→Nadeau & Bengio (2003)：CV方差的理论分析→scikit-learn (2011-)：提供了标准化的CV工具链。\n\n**2010s至今：现代挑战**\nAutoML兴起（Auto-sklearn, AutoGluon）→CV成为自动模型选择的默认评估器。Bayesian Optimization (Snoek 2012) 用CV作为黑盒优化的目标函数→CV成为了'元优化'的基础。\n\n**新兴方向**：差分隐私下的评估（评估本身不泄露个体信息）、联邦评估（跨数据源评估但不共享原始数据）、Conformal Evaluation（提供有限样本的预测区间保证而非点估计误差）。",key_takeaway:"CV从一个'简单技巧'进化为ML管线中不可或缺的标准组件——它连接了模型训练（内层）和模型部署（外层）之间的信任鸿沟。"},{module_id:"application",module_tag:"实践应用",module_title:"实践应用",content:"**1. 超参数调优中的CV**\nGridSearchCV + k-fold是业界标准。参数网格 $G=\\{\\text{max\\_depth}\\in[1,20],\\text{learning\\_rate}\\in[0.001,1]\\}$，对每个参数组合做k-fold CV，选平均CV score最高的。核心pitfall：不要用同一次CV既选参数又评估最终模型（需要嵌套CV！）。\n\n**2. 模型选择**\n有3个候选模型（LR/SVM/RF），选哪个？用k-fold CV分别评估，选CV score最高且方差合理的那个。如果两个模型的CV分数在1个标准差内重叠→'它们在统计上无显著差异'→选更简单的那个（Occam\'s Razor）。\n\n**3. 特征选择中的CV**\n必须在CV循环内做特征选择！`SelectKBest(fit on all data)→CV→over-optimistic` 是数据泄露。正确做法：在每fold的训练集上做SelectKBest→在验证集上评估→平均。\n\n**4. 模型校准评估**\n用CV做可靠性曲线（Reliability Diagram）：分桶预测概率→桶内真实概率→理想曲线=y=x对角线。Brier Score = $\\frac{1}{n}\\sum(p_i-y_i)^2$ 衡量概率校准质量。",key_takeaway:"CV不只是'切分数据再训练'——它渗透在超参数调优、模型选择、特征选择、概率校准的每个环节。记住铁律：任何学习过程如果看了验证数据，就必须在CV循环内进行。"},{module_id:"case-study",module_tag:"实践应用",module_title:"实战：Nested CV完整评估管线",hook:"完成一次嵌套交叉验证，你才能真正理解'调参≠评估'这条金律。",content:"**场景**：在Diabetes数据集上比较OLS、Ridge和Lasso。\n\n**实验设计（嵌套CV）**：\n- 外层：5-fold CV → 分5次，每次留20%做最终评估\n- 内层：3折CV → 对每种模型和参数组合，在训练集上做3-fold CV选最佳参数\n- 模型：OLS（无超参数）、Ridge（α∈[0.001,100]对数尺度）、Lasso（α∈[0.001,10]对数尺度）\n\n**结果**：\n- OLS：mean MSE=3421 ± 180 → 高方差\n- Ridge (α=1.0)：mean MSE=3150 ± 120 → 方差显著降低\n- Lasso (α=0.1)：mean MSE=3089 ± 135 → 最低误差+自动选5个特征\n→ Nested CV选Lasso为最佳模型，其真实泛化MSE≈3089±135\n\n**如果不做嵌套CV会发生什么？**\n在选择α和评估都只用同一个5-fold CV：\n- Lasso MSE估为2850（比真实3089低了8%）→过度乐观！\n- 原因：选择α时会'挑到'恰好在该次划分上表现好的α→选择偏差（selection bias）\n\n**关键教训**：选择偏差=你在看过了验证结果后做出的任何选择（选参数/选特征/选模型），都会让验证结果乐观于真实泛化。嵌套CV是消除选择偏差的唯一标准方法。",key_takeaway:"同一个CV用了两次（先选α后评估）→选择偏差→评估过于乐观。嵌套CV=两层CV解耦→外层不知道内层做了什么样的选择→无偏的泛化误差估计。"},{module_id:"risk",module_tag:"风险与挑战",module_title:"数据泄露：评估的头号杀手",hook:"数据泄露是ML项目中最隐蔽、最致命、最容易被忽视的错误。它让你以为自己有SOTA模型，实际上你只是在作弊。",content:"**数据泄露的四种典型场景**：\n\n1. **预处理泄露**（最常见！）：在整个数据集上fit StandardScaler→再split train/test→泄露了测试集的均值和方差信息。正确：`scaler.fit(X_train); X_train_scaled=scaler.transform(X_train); X_test_scaled=scaler.transform(X_test)`。\n\n2. **目标泄露**：特征中包含未来信息或标签信息。例如：预测'是否会逾期'时，用了'逾期天数'做特征。\n\n3. **时序泄露**：用未来的数据预测过去。例如：用2023年的数据训练'预测2022年'的模型（时间旅行者错误）。\n\n4. **分组泄露**：同一个病人（或用户）的多条记录同时出现在训练和测试集中→模型'认出'这个人而非学到通用模式。GroupKFold解决了这一问题。\n\n**检测数据泄露的清单**：\n- □ 特征是否在真实场景中'预测时'可以获得？\n- □ 所有预处理是否只在训练集上fit？\n- □ 时序数据是否确保了t_train < t_test？\n- □ 同一实体是否不会跨fold？\n- □ CV内层的特征选择/工程是否在每fold内独立进行？",key_takeaway:"数据泄露能让你的CV score高到不真实→当你看到'完美'的CV分数时，第一反应不应该是高兴，而应该是'检查是不是泄露了'。"},{module_id:"ethics",module_tag:"风险与挑战",module_title:"评估的公平性维度",content:"**1. 准确率掩盖的不公平**\n准确率90%的模型在不同子群上可能相差极大：女性86%/男性94%。从技术角度，你需要报告per-group metrics（每个群的准确率/召回率/假阳性率）。\n\n**2. 为什么AUC也会误导**\nAUC衡量的是排序能力，与阈值无关。但它对类别不平衡的'免疫'恰恰掩盖了阈值选择可能造成的不公平——阈值=0.5时，次群体A的被拒率可能是次群体B的3倍，尽管AUC看起来一样。\n\n**3. 交叉验证与代表性**\n如果某个子群的数据量特别小（如残障人士/稀有民族），普通k-fold CV可能在某些fold中完全没有该子群的验证样本→模型在该子群上的性能完全未被评估。分层CV可以部分解决，但需要知道分层变量（有时这些变量是敏感的/不可获得的）。\n\n**4. 基准测试驱动的'系统性偏见'**\n学术界追逐SOTA→只报告总体metrics→忽视per-group metrics→整个领域的模型都向社会优势群体优化。解决：在论文中要求报告多维度公平性指标（如Model Cards, Mitchell 2019）。",key_takeaway:"'表现优秀'的模型不一定对所有人都公平——当你看CV均值时，也要看fold间的离散度和子群间的差异度。"},{module_id:"landscape",module_tag:"发展演进",module_title:"工具生态",content:"**scikit-learn**: 提供了最完整的评估工具链——train_test_split, StratifiedKFold, TimeSeriesSplit, GroupKFold, cross_val_score, GridSearchCV, 全套metrics。98%的评估需求都在这里。\n\n**AutoML工具中的评估**：AutoGluon使用bagging+stacking+multi-layer CV自动做模型评估和融合。H2O AutoML内置了多级CV保证无偏评估。\n\n**实验追踪**：MLflow追踪每次CV的fold-level metrics→实验可复现。Weights & Biases可视化CV曲线→直观对比不同模型的CV表现。\n\n**基准测试（Benchmark）的危机**：当前ML论文中的'SOTA'通常基于公开测试集的一次性评估→缺乏统计显著性检验→可能只是随机波动。Paired bootstrap test or McNemar test应成为标准。",key_takeaway:"scikit-learn的model_selection模块是你评估工具箱的核心——StratifiedKFold+GridSearchCV+NestedCV三件套，覆盖90%的实际需求。"},{module_id:"issues",module_tag:"风险与挑战",module_title:"k的选择与CV的困境",content:"**k取多少？**没有硬性答案，但有指导原则：\n- k=5或10：最常用，偏差-方差-计算量的合理平衡\n- k=n (LOOCV)：最小偏差+最大方差+最大计算量→仅在n<100时考虑\n- k越大→训练集越大（更接近全量）→偏差越小\n- k越小→训练集越小→偏差越大但每次训练更快\n\n**CV的'隐藏假设'**：\n1. 样本是i.i.d.（独立同分布）→时序/空间/网络数据违反→需要specialized CV\n2. 数据量足够→n<50时，k-fold CV的任何结果都不可靠\n3. 验证集足够大→得到稳定的fold-level estimate→否则fold间的方差太大\n\n**LOOCV的悖论**：理论上是'黄金标准'（几乎无偏），但实践中方差巨大→2-fold CV×50次重复的MSE估计可能比LOOCV更可靠。\n\n**'p-hacking via CV'**：反复调整模型/特征/超参数→再跑CV→选最好的CV结果→报告。这在学术中极其普遍，可以通过预注册（pre-registration）和holdout test set来避免。",key_takeaway:"k的选择是一个'偏差-方差-计算量'的三角博弈。k=10是大多数场景的safe default，但永远需要根据数据量和数据特性进行判断。"},{module_id:"prospect",module_tag:"前沿探索",module_title:"发展前景",content:"**1. 贝叶斯优化与CV**\n传统GridSearch CV的效率极低（参数数量指数增长）。贝叶斯优化(BO)每次选择'最值得尝试'的参数→需要的CV次数比GridSearch少5-10倍。Hyperopt、Optuna、BoTorch已将BO+CV标准化。\n\n**2. Conformal Evaluation**\nConformal Prediction提供有限样本保证的预测区间（prediction bands）——'我有95%信心真实Y在[100,120]之间'。这与传统点估计+置信区间根本不同：\n- 传统：'平均误差的95%置信区间为[8,12]'\n- Conformal：'对于这个具体的x，预测区间为[100,120]，覆盖率≥95%'\n\n**3. 差分隐私下的评估**\n如何报告模型性能同时不泄露个体信息？差分隐私CV(DP-CV)在评估过程中加入受控噪声→提供有噪声但有理论保证的评估分数。\n\n**4. 可微评估指标**\n有些指标（如F1/AUC）不可微→不能直接作为损失函数。最近的研究（Soft F1, Smooth AUC）提出近似可微版本→可以同时用做损失和评估→缩小训练目标和评估指标之间的gap。",key_takeaway:"CV+BO让调参效率提升数倍，Conformal Prediction让模型输出'有保证的区间'而非'不确定的点估计'——评估的未来是'更智能+更可靠'。"},{module_id:"effort-direction",module_tag:"前沿探索",module_title:"学习建议",content:"**Week 1: 从零实现**\n- Day 1-2: 实现k-fold CV分割器——从打乱数据到平均k个fold的得分\n- Day 3: 实现confusion matrix→accuracy/precision/recall/F1计算\n- Day 4: 实现GridSearchCV——在k-fold CV上遍历参数网格\n- Day 5: 了解sklearn的Pipeline+GridSearchCV+交叉验证的完整流程\n\n**Week 2: 实战深化**\n- Day 1-2: 实现Nested CV——对比普通CV和嵌套CV在同一问题上的评估偏差\n- Day 3: 学习ROC/PR曲线的绘制和AUC的含义\n- Day 4: 学习scikit-learn的各种CV策略：StratifiedKFold/TimeSeriesSplit/GroupKFold\n- Day 5: 阅读核心论文：Kohavi (1995) 'A Study of Cross-Validation and Bootstrap'",key_takeaway:"实现k-fold CV只需要20行代码——但理解'数据泄露'和'选择偏差'需要20个项目的经验。"},{module_id:"misconceptions",module_tag:"风险与挑战",module_title:"常见误区",content:"**误区1：'测试集是可选的，只要CV就好'**\nCV用于模型选择和调参→会产生选择偏差→需要holdout test set做最终的独立评估。没有test set=没有最终的真实泛化误差。\n\n**误区2：'k越大越好'**\nLOOCV (k=n) 偏差最低但方差可能高于k=10。且计算量是k-fold CV的n/k倍。\n\n**误区3：'CV能解决过拟合'**\nCV帮助你**发现**过拟合（CV error > train error），但无法**解决**过拟合。解决过拟合需要正则化/简化模型/更多数据。\n\n**误区4：'AUC永远是分类问题的最佳指标'**\nAUC对类别比例不敏感→在极度不平衡+只关心少数类时，AUC-PR更敏感。在特定阈值应用场景→直接优化该阈值的F-score更好。\n\n**误区5：'80/20训练/测试的分法是通用的'**\n数据<1000→90/10（保留更多训练数据）；数据>1M→99/1（测试集也够大）。数据量增加时，测试集需要的不是更大比例而是更大的绝对数量。",key_takeaway:"没有'测试集'=没有最终真实分数。k不是越大越好。CV只能发现问题不能解决问题。AUC不是万能。80/20不是铁律。"},{module_id:"learning-path",module_tag:"实践应用",module_title:"推荐资源",content:"**入门**: 📖 ISLR第5章（重采样方法）→ 📖 《统计学习方法》第1章概念部分 → scikit-learn官方model selection教程\n**进阶**: 📖 ESL第7章（模型评估与选择）→ 📄 Kohavi (1995) CV vs Bootstrap的实证比较 → 📄 Nadeau & Bengio (2003) CV方差理论\n**专家**: 📄 Dietterich (1998) 分类器比较的统计检验 → 📄 Raschka (2018) Model Evaluation, Model Selection, and Algorithm Selection (arXiv:1811.12808) → 📖 《Computer Age Statistical Inference》 (Efron & Hastie) 关于CV和bootstrap的章节\n**实践工具**: scikit-learn model_selection文档 → Optuna (Bayesian optimization + CV) → MLflow/W&B (实验追踪)",references:[{title:"A Study of Cross-Validation and Bootstrap for Accuracy Estimation and Model Selection",authors:"Kohavi, R.",year:1995},{title:"Model Evaluation, Model Selection, and Algorithm Selection in Machine Learning",authors:"Raschka, S.",year:2018,url:"https://arxiv.org/abs/1811.12808"},{title:"The Elements of Statistical Learning, Chapter 7",authors:"Hastie, T., Tibshirani, R. & Friedman, J.",year:2009}],key_takeaway:"Raschka的Model Evaluation综述可能是ML实践者最常回头翻阅的技术资料——建议打印出来放在工位旁。"},{module_id:"debate",module_tag:"前沿探索",module_title:"争议与讨论",content:"**k-fold vs Bootstrap**\n- k-fold：用全部数据→低偏差，但fold间有重叠→方差估计复杂\n- .632 Bootstrap：估计为 $\\text{Err}^{(.632)} = 0.368\\cdot\\text{err}_{\\text{train}} + 0.632\\cdot\\text{err}_{\\text{OOB}}$。在过拟合严重时，过度乐观（因为OOB误差和训练误差相关）。\n- .632+ Bootstrap：在.632基础上对过拟合程度做了调整→通常比CV和普通bootstrap都好。\n\n**参数方法(AIC/BIC) vs 非参数方法(CV)**\nAIC/BIC只需要一次训练→极快，但依赖似然模型假设（通常假设正态）。CV不做此假设→更通用，但需要k次训练。渐近地，AIC和LOOCV等价（Stone, 1977）。但有限样本下，CV更可靠。\n\n**'CV paradox'**\nCV用于选择超参数，但超参数的选择会使CV score产生选择偏差→被选择的模型的CV score不是无偏的泛化估计。解决方案：嵌套CV（代价巨大）或Bayesian方法（用后验平均而非单点估计）。\n\n**实证vs理论**：ML社区倾向于实证（'跑CV看哪个好'），统计社区倾向于理论（'推导泛化误差界'）。两者应该互补——理论告诉你该看什么，CV告诉你看到了什么。",key_takeaway:"Bootstrap vs CV、AIC vs CV、嵌套vs单层——这些争论的核心是同一个问题：如何在有限数据和计算资源下，最准确地估计一个模型在真实世界中的表现？没有完美答案，只有不断权衡。"},{module_id:"glossary",module_tag:"核心概念",module_title:"关键术语速查",content:"**Holdout**: 随机划分一部分数据作为测试集，其余为训练集。**k-fold CV**: 将数据分成k份，轮流用k-1份训练。**Stratified CV**: 每fold中类别比例与总体一致。**LOOCV**: Leave-One-Out CV, k=n的特殊情况。**Nested CV**: 内外两层CV解耦模型选择和评估。**TimeSeriesSplit**: 时序数据的向前验证。**GroupKFold**: 同组样本不跨fold。**Bias**: 模型族系统误差。**Variance**: 对训练数据变化的敏感度。**混淆矩阵**: TP/FP/FN/TN四格表。**Precision**: TP/(TP+FP)。**Recall**: TP/(TP+FN)。**F1**: P和R的调和平均。**AUC-ROC**: ROC曲线下面积。**AUC-PR**: PR曲线下面积。**Brier Score**: 概率校准质量度量。**Data Leakage**: 评估时不经意使用了不可在预测时获得的信息。**Selection Bias**: 基于验证结果做决策导致评估过于乐观。"}]};
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);localStorage.setItem('slm-theme',t);updateThemeIcon();Object.values(activeCharts).forEach(function(c){c.setOption(createThemedOption(c.getOption()),{notMerge:false})})}
function toggleTheme(){var c=document.documentElement.getAttribute('data-theme')||'light';applyTheme(c==='dark'?'light':'dark')}
function updateThemeIcon(){document.getElementById('theme-toggle').textContent=document.documentElement.getAttribute('data-theme')==='dark'?'☀️':'🌓'}
var activeCharts={},sidebarLinks=[];var savedTheme=localStorage.getItem('slm-theme')||'dark';applyTheme(savedTheme);
window.addEventListener('scroll',function(){var s=window.scrollY,d=document.documentElement.scrollHeight-window.innerHeight,p=d>0?(s/d)*100:0;document.getElementById('progress-bar').style.width=p+'%'});
function buildSidebar(){var c=document.getElementById('sidebar-links');sidebarLinks=[];PAGE_DATA.modules.forEach(function(m){var a=document.createElement('a');a.href='#'+m.module_id;a.className='sidebar-link';a.textContent=m.module_title||m.module_id;a.addEventListener('click',function(e){e.preventDefault();document.getElementById(m.module_id).scrollIntoView({behavior:'smooth'})});c.appendChild(a);sidebarLinks.push({el:a,id:m.module_id})})}
var observer=new IntersectionObserver(function(e){e.forEach(function(en){if(en.isIntersecting)sidebarLinks.forEach(function(l){l.el.classList.toggle('active',l.id===en.target.id)})})},{rootMargin:'-80px 0px -60% 0px'});
function buildMetaCard(){var m=PAGE_DATA;document.getElementById('meta-card-container').innerHTML='<div class="meta-card"><div style="width:100%"><span class="meta-badge domain-ai" style="margin-right:8px">🔗 📚 机器学习及其统计基础与大模型 系统学习方案 · 经典机器学习（2/5）</span></div><div class="meta-item"><span class="icon">📖</span><strong>'+m.topic+'</strong></div><div class="meta-item"><span class="meta-badge domain-ai">'+m.domain_name+'</span></div><div class="meta-item"><span class="meta-badge level-intermediate">'+m.level_name+'</span></div><div class="meta-item"><span class="icon">⏱️</span>约'+m.reading_time+'分钟阅读</div><div class="meta-item"><span class="icon">📦</span>'+m.module_count+'个模块</div></div>'}
function renderFormulas(c){if(typeof renderMathInElement!=='undefined')renderMathInElement(c,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})}
function createThemedOption(o){var d=document.documentElement.getAttribute('data-theme')==='dark';return{color:d?['#818cf8','#a78bfa','#c4b5fd','#67e8f9','#fbbf24','#34d399','#f87171','#f472b6']:['#6366f1','#8b5cf6','#a78bfa','#22d3ee','#f59e0b','#10b981','#ef4444','#ec4899']}}
function renderChart(mid,cfg,i){var id='chart_'+mid+'_'+i,w=document.getElementById(id);if(!w)return;if(typeof echarts==='undefined'){w.innerHTML='<div style="text-align:center;padding:20px;color:var(--text-tertiary);font-size:13px;">📊 图表(静态模式)<br><small>加载CDN后可交互</small></div>';return}try{var c=echarts.init(w);c.setOption(cfg.echarts_option||{});activeCharts[id]=c;new ResizeObserver(function(){c.resize()}).observe(w)}catch(e){w.textContent='图表渲染失败: '+e.message}}
function buildModuleHTML(mod){var tc=(function(t){var m={'核心概念':'tag-core','前置知识':'tag-core','核心工具':'tag-tools','发展演进':'tag-evolution','实践应用':'tag-application','风险与挑战':'tag-risk','前沿探索':'tag-frontier'};return m[t]||'tag-core'})(mod.module_tag||'');var h='<section class="module-section" id="'+mod.module_id+'"><div class="module-header"><span class="module-tag '+tc+'">'+(mod.module_tag||'')+'</span><h2 class="module-title">'+(mod.module_title||mod.module_id)+'</h2></div>';if(mod.hook)h+='<div class="module-hook">'+mod.hook+'</div>';if(mod.content){var c=mod.content.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code style="background:var(--bg-tertiary);padding:2px 6px;border-radius:4px;font-size:13px;">$1</code>').replace(/\n\n/g,'</p><p>');h+='<div class="module-content"><p>'+c+'</p></div>'}if(mod.formulas)mod.formulas.forEach(function(f){h+='<div class="formula-block" onclick="if(this.querySelector(\'.formula-derivation\'))this.classList.toggle(\'expanded\')"><div>'+f.latex+'</div>'+(f.caption?'<div class="formula-caption">'+f.caption+'</div>':'')+(f.expandable&&f.derivation?'<div class="formula-expand-hint">💡 点击展开推导过程</div><div class="formula-derivation">'+f.derivation+'</div>':'')+'</div>'});if(mod.charts)mod.charts.forEach(function(c,i){h+='<div class="chart-container"><div class="chart-wrapper" id="chart_'+mod.module_id+'_'+i+'"></div>'+(c.caption?'<div class="chart-caption">'+c.caption+'</div>':'')+'</div>'});if(mod.tables)mod.tables.forEach(function(t){h+='<table class="module-table"><thead><tr>'+t.headers.map(function(h){return'<th>'+h+'</th>'}).join('')+'</tr></thead><tbody>'+t.rows.map(function(r){return'<tr>'+r.map(function(c){return'<td>'+c+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table>'+(t.caption?'<div class="table-caption" style="font-size:12px;color:var(--text-tertiary);text-align:center;margin-top:8px">'+t.caption+'</div>':'')});if(mod.references)h+='<div class="module-references"><h4>📚 参考文献</h4><ol>'+mod.references.map(function(r){return'<li>'+(r.authors||'')+' ('+(r.year||'')+'). <strong>'+(r.title||'')+'</strong>.'+(r.url?' <a href="'+r.url+'" target="_blank" style="color:var(--primary)">链接</a>':'')+'</li>'}).join('')+'</ol></div>';if(mod.key_takeaway)h+='<div class="key-takeaway">💡 '+mod.key_takeaway+'</div>';h+='</section>';return h}
function initPage(){document.body.classList.remove('loading');document.body.classList.add('loaded');buildMetaCard();buildSidebar();var mc=document.getElementById('modules-container');PAGE_DATA.modules.forEach(function(mod){mc.innerHTML+=buildModuleHTML(mod)});var sec=mc.querySelectorAll('.module-section');sec.forEach(function(s){observer.observe(s)});renderFormulas(mc);setTimeout(function(){PAGE_DATA.modules.forEach(function(mod){if(mod.charts)mod.charts.forEach(function(c,i){renderChart(mod.module_id,c,i)})})},100);var fObs=new IntersectionObserver(function(e){e.forEach(function(en){if(en.isIntersecting)en.target.classList.add('visible')})},{threshold:0.08});sec.forEach(function(s){fObs.observe(s)})}
document.addEventListener('DOMContentLoaded',initPage);
function exportNotes(){var l=['# '+PAGE_DATA.topic+' - 学习笔记','','生成日期: '+new Date().toLocaleDateString('zh-CN'),''];PAGE_DATA.modules.forEach(function(m){l.push('- **'+(m.module_title||m.module_id)+'**: '+(m.key_takeaway||m.hook||''))});if(navigator.clipboard)navigator.clipboard.writeText(l.join('\n')).then(function(){alert('✅ 学习笔记已复制到剪贴板!')});else alert('复制失败，请手动选择复制')}
(function(){var cv=document.getElementById('bg-canvas'),ctx=cv.getContext('2d'),particles=[];function rsz(){cv.width=window.innerWidth;cv.height=window.innerHeight}window.addEventListener('resize',rsz);rsz();for(var i=0,c=Math.min(60,Math.floor((cv.width*cv.height)/20000));i<c;i++)particles.push({x:Math.random()*cv.width,y:Math.random()*cv.height,vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,r:Math.random()*1.5+0.3,a:Math.random()*0.3+0.05});function animate(){ctx.clearRect(0,0,cv.width,cv.height);var isDark=document.documentElement.getAttribute('data-theme')!=='light',col=isDark?'129,140,248':'99,102,241';particles.forEach(function(p){p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=cv.width;if(p.x>cv.width)p.x=0;if(p.y<0)p.y=cv.height;if(p.y>cv.height)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fillStyle='rgba('+col+','+p.a+')';ctx.fill()});for(var j=0;j<particles.length;j++)for(var k=j+1;k<particles.length;k++){var dx=particles[j].x-particles[k].x,dy=particles[j].y-particles[k].y,d=Math.sqrt(dx*dx+dy*dy);if(d<110){ctx.beginPath();ctx.moveTo(particles[j].x,particles[j].y);ctx.lineTo(particles[k].x,particles[k].y);ctx.strokeStyle='rgba('+col+','+(0.06*(1-d/110))+')';ctx.lineWidth=0.5;ctx.stroke()}}requestAnimationFrame(animate)}animate()})();
</script>
