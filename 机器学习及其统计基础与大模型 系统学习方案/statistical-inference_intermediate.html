var PAGE_DATA={topic:"统计推断：估计与假设检验",domain:"ai-tech",domain_name:"AI与科技",level:"intermediate",level_name:"进阶",reading_time:"25",module_count:"14",texture:"G5",texture_name:"全面平衡型",depth:"理解",breadth:"标准",
modules:[
{module_id:"background",module_title:"背景与缘起",module_tag:"发展演进",hook:"为什么R.A. Fisher的MLE被称为'统计学的牛顿定律'？为什么p<0.05成为科学的默认门槛？——统计推断的故事，是一部从直觉到数学、从猜想到决策的史诗。",content:"统计推断（Statistical Inference）的核心问题是：**如何从有限的观测数据中，推断出产生这些数据的未知机制？**\n\n**R.A. Fisher**在1920年代提出了极大似然估计（MLE）、充分统计量和Fisher信息矩阵，奠定了频率学派统计推断的数学基础。他的核心思想是：参数的真实值是固定的，只是我们不知道——通过数据找到'最可能'的参数值。\n\n**Neyman和Pearson**在1930年代引入假设检验框架，定义了第一类和第二类错误、检验功效（Power）和似然比检验。**'p<0.05'**的惯例源于Fisher的个人偏好——他认为5%是'足以拒绝零假设'的合理阈值。\n\n在机器学习中，统计推断无处不在：MLE是大多数损失函数的根源，p值常用于特征选择，A/B测试的核心就是假设检验。但ML社区也在重新审视这些传统方法——当数据量大到'所有特征都显著'时，p值还有意义吗？",key_takeaway:"统计推断=用数据定量地做出决策。MLE给了我们'最可能的参数'，假设检验给了我们'是否拒绝某个假设'的决策框架。"},
{module_id:"concept",module_title:"MLE与MAP：参数估计的双子星",module_tag:"核心概念",hook:"MLE说'让数据最可能的参数就是真实的'，MAP说'别急，我还有先验知识'——两者的冲突与融合，塑造了整个统计推断的格局。",content:"**极大似然估计（MLE）**：\n$$\\hat{\\theta}_{\\text{MLE}} = \\arg\\max_\\theta \\prod_{i=1}^n P(x_i|\\theta)$$\n核心思想：选择使观测数据出现概率最大的参数。\n\n**常见ML中的MLE等价形式**：\n- 高斯误差 + MLE → MSE损失（最小二乘回归）\n- 伯努利标签 + MLE → 交叉熵损失（二分类逻辑回归）\n- 多项标签 + MLE → 多分类交叉熵\n\n**最大后验估计（MAP）**：\n$$\\hat{\\theta}_{\\text{MAP}} = \\arg\\max_\\theta P(\\theta) \\prod_{i=1}^n P(x_i|\\theta)$$\n比MLE多了一项先验 $P(\\theta)$。\n\n- 高斯先验 + MLE → L2正则化（Ridge回归）\n- 拉普拉斯先验 + MLE → L1正则化（Lasso回归）\n\n**MLE vs MAP的本质区别**：\n- MLE相信数据足够多时真理自现（频率派）\n- MAP相信先验知识能帮你在数据少时不做蠢事（贝叶斯派）\n- 当数据量 $n\\to\\infty$ 时，MAP趋近MLE——先验的影响被数据淹没",formulas:[{latex:"$$\\hat{\\theta}_{\\text{MLE}} = \\arg\\max_\\theta \\prod_{i=1}^n P(x_i|\\theta) = \\arg\\max_\\theta \\sum_{i=1}^n \\log P(x_i|\\theta)$$",caption:"MLE的对数形式（计算上更稳定）",expandable:true,derivation:"取对数：$\\log\\prod P = \\sum\\log P$。对数函数单调递增，argmax不变，但将乘法转为加法，数值更稳定，解析计算更容易。"},{latex:"$$\\hat{\\theta}_{\\text{MAP}} = \\arg\\max_\\theta P(\\theta) \\cdot P(X|\\theta) = \\arg\\max_\\theta \\left[\\log P(\\theta) + \\sum_{i=1}^n \\log P(x_i|\\theta)\\right]$$",caption:"MAP的对数形式——先验log项+似然log项"}],key_takeaway:"MLE='只看数据'，MAP='数据+先验知识'。正则化就是MAP的另一种说法。"},
{module_id:"principle",module_title:"假设检验的核心框架",module_tag:"核心概念",hook:"p<0.05——三个字符统治了半个多世纪的科学发表。但你知道它真正的含义是什么吗？（答案可能和你以为的不一样）",content:"**假设检验五步法**：\n\n1. **建立假设**：$H_0$（零假设/原假设，现状）、$H_1$（备择假设，你想证明的）\n2. **选择检验统计量**：如t统计量 $t = \\frac{\\bar{X}-\\mu_0}{s/\\sqrt{n}}$\n3. **确定显著性水平** $\\alpha$（通常0.05）\n4. **计算p值**：$P(\\text{观察到至少这么极端的结果}|H_0\\text{为真})$\n5. **做出决策**：如果 $p < \\alpha$，拒绝 $H_0$；否则不拒绝\n\n**两类错误**：\n- **第一类错误（Type I）**：$H_0$为真却被拒绝。概率 = $\\alpha$\n- **第二类错误（Type II）**：$H_1$为真却未拒绝$H_0$。概率 = $\\beta$\n- **检验功效（Power）** = $1-\\beta$ = 正确拒绝$H_0$的概率\n\n**为什么p值被滥用？**\n- p=0.049和p=0.051几乎没有实际差别，但前者'显著'、后者'不显著'\n- p值不能告诉你效应的大小（需要效应量）\n- p值不能告诉你假设为真的概率（需要贝叶斯因子）\n- 多重检验问题：做20次检验，即使$H_0$全为真，也大概率会有一个p<0.05",formulas:[{latex:"$$\\text{p-value} = P(T \\geq t_{\\text{obs}} \\mid H_0 \\text{ is true})$$",caption:"p值的精确定义——它在H₀为真的条件下才有意义"}],tables:[{headers:["决策","H₀为真","H₀为假"],rows:[["拒绝H₀","第一类错误 (α)","正确 (Power=1-β)"],["不拒绝H₀","正确 (1-α)","第二类错误 (β)"]],caption:"假设检验的四种结果"}],key_takeaway:"p值不是'假设为假的概率'，而是'在假设为真的前提下，数据有多极端'。这两者有天壤之别。"},
{module_id:"development",module_title:"从Fisher到Bootstrap：估计方法的进化",module_tag:"发展演进",hook:"如果数据不服从正态分布怎么办？如果样本量太小，渐近理论不适用怎么办？Bootstrap和贝叶斯给出了惊艳的答案。",content:"**经典方法（1900s-1970s）**：\n- 点估计：MLE（Fisher, 1922）、矩估计（Pearson）\n- 区间估计：基于渐近正态的Wald置信区间 $\\hat{\\theta} \\pm z_{\\alpha/2}\\cdot \\text{SE}(\\hat{\\theta})$\n- 检验：t检验、F检验、卡方检验\n\n**计算密集型方法（1970s-至今）**：\n- **Bootstrap（Efron, 1979）**：通过对数据重抽样构建参数的经验分布。不需要任何分布假设！\n- **置换检验（Permutation Test）**：通过打乱标签重计算检验统计量来估计p值\n\n**贝叶斯方法**：\n- **MCMC**：当后验没有解析解时，通过采样来近似\n- **贝叶斯因子（Bayes Factor）**：$B_{10} = \\frac{P(X|H_1)}{P(X|H_0)}$——直接比较两个假设的证据强度\n- **可信区间（Credible Interval）**：$P(\\theta \\in [a,b]|X) = 0.95$——这正是p值的置信区间版本所不能说出的概率陈述",key_takeaway:"现代统计推断已从'套用渐近分布'进化为'让计算机暴力采样'——Bootstrap和MCMC是两大革命性工具。"},
{module_id:"application",module_title:"ML中的统计推断应用",module_tag:"实践应用",hook:"特征是否真的有用？新模型的提升是统计显著还是运气？A/B测试的决策边界在哪里？——ML从业者每天都在做统计推断。",content:"**1. 损失函数=负对数似然的MLE**\n你写的每一行`model.compile(loss='mse')`，背后都是在求解一个高斯噪声假设下的MLE。\n\n**2. 特征选择**\n- 线性回归系数的t检验：检查每个特征的p值\n- 卡方检验：检查分类特征与标签的关联性\n- Lasso的变量选择：$\\lambda$ = 先验的逆方差（贝叶斯视角）\n\n**3. 模型比较**\n- 配对t检验：两个模型在10次CV上的分数是否显著不同？\n- McNemar检验：两个分类器在相同测试集上的错误模式是否不同？\n\n**4. A/B测试（在线实验）**\n$H_0$: $\\mu_{\\text{control}} = \\mu_{\\text{treatment}}$，$H_1$: $\\mu_{\\text{control}} \\neq \\mu_{\\text{treatment}}$\n- 双样本t检验或Z检验\n- 需注意多重比较（Multi-armed Bandit问题）\n\n**5. 置信区间预测**\n- Bootstrap预测区间：对模型预测重抽样\n- 共形预测（Conformal Prediction）：提供有限样本的分布无关覆盖保证",key_takeaway:"从损失函数到模型比较，统计推断渗透了ML的每一个环节。不理解推断，你就无法真正理解'为什么这个模型更好'。"},
{module_id:"case-study",module_title:"实战：A/B测试中的统计推断",module_tag:"实践应用",hook:"新推荐算法将点击率从5.0%提升到5.2%——这是真实的改进还是随机波动？统计推断给出答案。",content:"**场景**：随机将10000用户分为对照组（旧算法）和实验组（新算法），各5000人。对照组CTR=5.0%，实验组CTR=5.2%。\n\n**分析流程**：\n1. $H_0$：新旧算法CTR相同；$H_1$：不同（双尾检验）\n2. 双样本Z检验：$Z = \\frac{\\hat{p}_2 - \\hat{p}_1}{\\sqrt{\\hat{p}(1-\\hat{p})(\\frac{1}{n_1}+\\frac{1}{n_2})}}$\n3. 计算：$\\hat{p}_{\\text{pooled}} = \\frac{250+260}{10000}=0.051$，$SE=0.0044$，$Z = 0.46$\n4. p值 = $2\\times(1-\\Phi(0.46)) \\approx 0.65$\n\n**结论**：p=0.65 >> 0.05，**不能拒绝H₀**——0.2%的提升在统计上不显著，很可能是随机波动。\n\n**教训**：直觉上'提升了'不等于统计上显著。很多看似有意义的改进，其实只是噪声。\n\n**进阶思考**：如果做一次检验就够了还好——如果你们团队每周跑一次A/B测试，一年52次，每次都宣称'显著！'(p<0.05)，请问有多少次可能只是运气？答案：在H₀全为真的情况下，期望有2.6次是假阳性——这就是多重比较的陷阱。",formulas:[{latex:"$$Z = \\frac{\\hat{p}_1 - \\hat{p}_2}{\\sqrt{\\hat{p}(1-\\hat{p})(\\frac{1}{n_1}+\\frac{1}{n_2})}}$$",caption:"双样本比例Z检验的检验统计量"}],key_takeaway:"A/B测试中0.2%的提升可能毫无意义——必须用统计推断来区分信号和噪声。"},
{module_id:"risk",module_title:"p值陷阱与多重比较",module_tag:"风险与挑战",hook:"'我们跑了100个特征和label的相关性检验，其中5个p<0.05——这些特征是有用的！'——这是数据科学中最常见的致命错误。",content:"**陷阱1：p-hacking（数据挖掘）**\n不断尝试不同的模型设定、数据子集、变量变换，直到得到p<0.05——然后只报告这个结果。这个过程让真实的第一类错误率远高于名义的5%。\n\n**陷阱2：多重比较（Multiple Comparisons）**\n同时做m次独立检验，至少有一个p<0.05的概率 = $1-(0.95)^m$。m=14时概率就超过50%。\n\n**解决方案**：\n- **Bonferroni校正**：将显著性水平调整为 $\\alpha/m$（过于保守）\n- **Benjamini-Hochberg（BH）**：控制FDR（False Discovery Rate），在假阳性率和发现率之间取得平衡\n- **Hold-out Set**：在完全没碰过的测试集上做一次最终检验\n\n**陷阱3：效应量被忽视**\n即使p<0.05，效应可能小到毫无实用价值。例如CTR从5.000%提升到5.001%——如果有十亿样本当然显著，但对业务毫无意义。\n\n**陷阱4：停止规则问题**\n每隔100个样本检验一次，p<0.05就停止实验——这会让真实假阳性率达到30%以上。正确的做法是预先确定样本量（Power Analysis）或使用序贯分析。",key_takeaway:"p-hacking是科研界的流行病。预防之道：预注册分析计划、使用hold-out集、控制FDR而非逐个看p值。"},
{module_id:"landscape",module_title:"频率 vs 贝叶斯：观点碰撞",module_tag:"发展演进",hook:"置信区间 vs 可信区间——两者看起来差不多，但含义完全不同。这是理解两大统计哲学的核心入口。",content:"**频率学派的置信区间（Confidence Interval）**：\n'在重复抽样中，95%的置信区间会包含真实参数。'\n- 不能说'真实参数有95%的概率在这个区间内'——参数是固定的，概率要么是0要么是1\n- CI是**过程**的一个性质，不是**具体区间**的性质\n\n**贝叶斯学派的可靠区间（Credible Interval）**：\n'给定数据和先验，真实参数在这个区间内的概率是95%。'\n- 这正是人们直觉上想要的答案\n- 但需要指定先验——不同先验给出不同区间\n\n**现代ML的实用主义立场**：\n- 训练模型：用频率方法（SGD+MLE）——简单高效\n- 理解模型不确定性：用贝叶斯方法——Bootstrap、MC Dropout、Ensemble\n- 在线决策：用贝叶斯——Thompson Sampling天然平衡exploration/exploitation",key_takeaway:"置信区间和可信区间虽然数值上可能接近，但概率陈述的逻辑完全不同——前者是过程性质，后者是信念更新。"},
{module_id:"issues",module_title:"大数据时代的统计推断困境",module_tag:"风险与挑战",hook:"样本量从100变成10亿，p值变了吗？变了——几乎任何微小的效应都'显著'了。这到底是好事还是坏事？",content:"**大n问题**：当样本量极大时，$H_0$几乎总是被拒绝——任何微小的偏离都会产生极小的p值。$t = (\\bar{X}-\\mu_0)/(s/\\sqrt{n})$中，$\\sqrt{n}$在分母——n越大，t越大，p越小。\n\n这意味着：在大数据时代，**统计显著 ≠ 实际有意义**。必须结合效应量（Cohen's d、相对提升百分比等）判断。\n\n**分布假设敏感性问题**：经典检验（t检验、F检验）依赖正态假设。大样本下渐近理论可以救场（CLT），但收敛速度取决于分布的偏度和峰度。\n\n**大p小n问题（高维统计）**：特征数 $p \\gg$ 样本量 $n$——传统渐近理论全部失效。需要：\n- Lasso类方法的oracle性质（变量选择一致性）\n- Knockoff方法（控制FDR的特征选择）\n- 高维CLT理论的进一步发展",key_takeaway:"大数据让'统计显著'变得廉价——未来属于能正确解读效应量、量化不确定性的方法论。"},
{module_id:"prospect",module_title:"统计推断的未来方向",module_tag:"前沿探索",hook:"当深度学习遇到统计推断——因果推断、共形预测、双重机器学习正在重新定义'从数据中学习'的含义。",content:"**1. 因果推断（Causal Inference）**\n从'相关性推断'到'因果推断'是统计学的下一个飞跃。Do-calculus（Pearl）、双重稳健估计（DR）、工具变量——这些方法让'从观测数据推断因果关系'成为可能。\n\n**2. 共形预测（Conformal Prediction）**\n不需要任何分布假设就能提供有效的预测区间。2020年后的研究让共形预测从理论工具变成了实际可用的ML工具。\n\n**3. 选择性推断（Selective Inference）**\n传统p值在数据驱动的模型选择（如Lasso选变量后再检验）下失效——选择性推断修正了这个问题，给出后选择（post-selection）的有效p值。\n\n**4. e-values**\n作为p值的替代品——对可选停止和多重检验具有天然的鲁棒性。2023-2024年的统计热点话题。",key_takeaway:"统计推断的未来=因果+选择性+分布无关+在线决策——这四项技术将改变ML的评价和实践方式。"},
{module_id:"effort-direction",module_title:"学习路径与推荐资源",module_tag:"实践应用",hook:"从MLE的直觉到Bootstrap的实现，从p值的计算到贝叶斯因子的解读——一条高效的统计推断学习路径。",content:"**推荐学习顺序**：\n1. **MLE完全掌握**：自己推导高斯和伯努利的MLE闭式解\n2. **Bootstrap动手实现**：用Numpy写一个Bootstrap循环，画置信区间直方图\n3. **假设检验深入**：读完ASA 2016年的p值声明（'The ASA Statement on p-Values'，必读！）\n4. **贝叶斯入门**：用PyMC做一次简单的贝叶斯线性回归\n5. **因果推断**：阅读《The Book of Why》（Pearl, 2018）或Brady Neal的因果推断课程\n\n**核心资源**：\n- 📖 《All of Statistics》(Wasserman) — 统计推断的浓缩精华\n- 📖 《Computer Age Statistical Inference》(Efron & Hastie) — 从经典到现代的全景图\n- 📖 《Statistical Rethinking》(McElreath) — 贝叶斯重新入门\n- 📄 ASA Statement on p-Values (2016) — 每个ML从业者都该读",references:[{title:"Computer Age Statistical Inference",authors:"Bradley Efron, Trevor Hastie",year:2016,url:"https://hastie.su.domains/CASI/"},{title:"The ASA Statement on p-Values",authors:"Ronald L. Wasserstein, Nicole A. Lazar",year:2016}],key_takeaway:"先从MLE和Bootstrap出发建立直觉，再逐步深入假设检验和贝叶斯——'做'比'读'快10倍。"},
{module_id:"misconceptions",module_title:"统计推断最常见的5大误解",module_tag:"风险与挑战",hook:"以下误解你可能也犯过——毕竟，即使是Nature和Science的论文也经常在这些问题上栽跟头。",content:"**误解1：'不显著=零效应'**\n不拒绝H₀ ≠ 证明了H₀。可能是样本量太小、方差太大——效应可能存在但没有被检测到。\n\n**误解2：'显著=效应重要'**\np<0.05可能对应极其微小的效应，在业务上毫无意义。必须结合效应量。\n\n**误解3：'p=0.8说明H₀为真的概率是80%'**\np值测量的是数据的极端性，不是假设为真的概率。后者是贝叶斯因子的领域。\n\n**误解4：'置信区间=参数落在其中的概率'**\n95%CI的含义是'如果重复实验，95%的CI包含真值'，不是'真值在这个CI中的概率是95%'。\n\n**误解5：'MLE是最佳估计量'**\nMLE是渐近有效的（大样本下达到Cramér-Rao下界），但在小样本或misspecified模型下可能有偏且不稳定——这正是为什么我们需要正则化。",key_takeaway:"统计推断中的误解源于将'直觉结论'硬套在'技术定义'上。每个术语都有精确的数学含义，不能凭直觉意会。"},
{module_id:"glossary",module_title:"关键术语表",module_tag:"核心概念",content:"",tables:[{headers:["术语","英文","简要解释"],rows:[["MLE","Maximum Likelihood Estimation","使观测数据出现概率最大的参数估计器"],["MAP","Maximum A Posteriori","结合先验的最大后验估计"],["p值","p-value","在H₀为真时观测到至少如此极端结果的概率"],["第一类错误","Type I Error","H₀为真却被拒绝(假阳性)"],["第二类错误","Type II Error","H₀为假却未拒绝(假阴性)"],["检验功效","Power","正确拒绝H₀的概率=1-β"],["置信区间","Confidence Interval","在重复抽样中包含真值的区间估计"],["可信区间","Credible Interval","参数以某概率落入的贝叶斯区间"],["Bootstrap","Bootstrap","通过重抽样构建统计量经验分布的方法"],["FDR","False Discovery Rate","被拒绝的H₀中实际为真的比例期望"],["效应量","Effect Size","量化效应大小的标准化指标(Cohen's d等)"],["贝叶斯因子","Bayes Factor","两个假设下数据证据的比值"]]}],key_takeaway:"掌握这些术语的定义和区别，是避免统计推断中常见陷阱的第一步。"},
{module_id:"debate",module_title:"争议：我们需要'统计显著性'吗？",module_tag:"前沿探索",hook:"2019年，《The American Statistician》发表特刊，800多位统计学家联名呼吁：放弃'统计显著性'这个二元标签。",content:"**正方（废弃p<0.05）**：\n- p值的二分法('显著/不显著')造成了虚假的确定性\n- p=0.049和p=0.051在科学上没有本质区别\n- 鼓励p-hacking和发表偏倚（只发表阳性的结果）\n\n**反方（保留但改进）**：\n- p值作为连续度量仍然有用——问题不在于p值本身，而在于对它的二元解读\n- 在严格控制的实验（如A/B测试、临床试验）中，预设阈值仍然必要\n- 相比废除，更应该推广多重报告：效应量+置信区间+贝叶斯因子+p值\n\n**推荐实践（ASA 2019共识）**：\n1. 永远不要仅凭p值做结论\n2. 报告效应量及其不确定性\n3. 预注册分析计划（pre-registration）防止p-hacking\n4. 在适合的场景使用贝叶斯方法\n5. 将'不显著'改为'未发现足够证据'",key_takeaway:"p值不会消失，但'p<0.05=真理'的二元思维应该被埋进坟墓。科学推断需要的是全面的证据，不是单一的阈值。"}]};
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('slm-theme', theme);
  updateThemeIcon();
  Object.values(activeCharts).forEach(function(chart){
    var opt = chart.getOption();
    chart.setOption(createThemedOption(opt), {notMerge: false});
  });
}
function toggleTheme(){
  var current = document.documentElement.getAttribute('data-theme') || 'light';
  applyTheme(current === 'dark' ? 'light' : 'dark');
}
function updateThemeIcon(){
  var t = document.getElementById('theme-toggle');
  t.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌓';
}
var activeCharts = {};
var sidebarLinks = [];
var savedTheme = localStorage.getItem('slm-theme') || 'dark';
applyTheme(savedTheme);

window.addEventListener('scroll', function(){
  var scrollTop = window.scrollY;
  var docHeight = document.documentElement.scrollHeight - window.innerHeight;
  var progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
  document.getElementById('progress-bar').style.width = progress + '%';
});

function buildSidebar(){
  var container = document.getElementById('sidebar-links');
  sidebarLinks = [];
  PAGE_DATA.modules.forEach(function(mod){
    var a = document.createElement('a');
    a.href = '#' + mod.module_id;
    a.className = 'sidebar-link';
    a.textContent = mod.module_title || mod.module_id;
    a.addEventListener('click', function(e){
      e.preventDefault();
      document.getElementById(mod.module_id).scrollIntoView({behavior: 'smooth'});
    });
    container.appendChild(a);
    sidebarLinks.push({el: a, id: mod.module_id});
  });
}

var observer = new IntersectionObserver(function(entries){
  entries.forEach(function(entry){
    if(entry.isIntersecting){
      sidebarLinks.forEach(function(link){link.el.classList.toggle('active', link.id === entry.target.id);});
    }
  });
}, {rootMargin: '-80px 0px -60% 0px'});

function buildMetaCard(){

  document.getElementById('meta-card-container').innerHTML =
    '<div class="meta-card">'+
    '<div style="width:100%"><span class="meta-badge domain-ai" style="margin-right:8px">🔗 📚 机器学习及其统计基础与大模型 系统学习方案 · 统计与数学基础（1/5）</span></div>'+
    '<div class="meta-item"><span class="icon">📖</span><strong>'+md.topic+'</strong></div>'+
    '<div class="meta-item"><span class="meta-badge domain-ai">'+md.domain_name+'</span></div>'+
    '<div class="meta-item"><span class="meta-badge level-intermediate">'+md.level_name+'</span></div>'+
    '<div class="meta-item"><span class="icon">⏱️</span>约'+md.reading_time+'分钟阅读</div>'+
    '<div class="meta-item"><span class="icon">📦</span>'+md.module_count+'个模块</div></div>';
}

function renderFormulas(container){
  if(typeof renderMathInElement !== 'undefined'){
    renderMathInElement(container, {delimiters: [{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}], throwOnError: false});
  }
}
function createThemedOption(existingOpt){
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  var color = isDark ? ['#818cf8','#a78bfa','#c4b5fd','#67e8f9','#fbbf24','#34d399','#f87171','#f472b6'] : ['#6366f1','#8b5cf6','#a78bfa','#22d3ee','#f59e0b','#10b981','#ef4444','#ec4899'];
  return {color: color};
}
function renderChart(moduleId, chartConfig, index){
  var chartId = 'chart_' + moduleId + '_' + index;
  var wrapper = document.getElementById(chartId);
  if(!wrapper) return;
  if(typeof echarts === 'undefined'){wrapper.innerHTML='<div style="text-align:center;padding:20px;color:var(--text-tertiary);font-size:13px;">📊 图表(静态模式)<br><small>加载CDN后可交互</small></div>';return;}
  try{
    var chart = echarts.init(wrapper);
    chart.setOption(chartConfig.echarts_option||{});
    activeCharts[chartId] = chart;
    new ResizeObserver(function(){chart.resize();}).observe(wrapper);
  }catch(e){wrapper.textContent = '图表渲染失败: ' + e.message;}
}

function buildModuleHTML(mod){
  var tagClass = (function(t){
    var m = {'核心概念':'tag-core','前置知识':'tag-core','核心工具':'tag-tools','发展演进':'tag-evolution','实践应用':'tag-application','风险与挑战':'tag-risk','前沿探索':'tag-frontier'};
    return m[t] || 'tag-core';
  })(mod.module_tag||'');
  var html = '<section class="module-section" id="'+mod.module_id+'"><div class="module-header"><span class="module-tag '+tagClass+'">'+(mod.module_tag||'')+'</span><h2 class="module-title">'+(mod.module_title||mod.module_id)+'</h2></div>';
  if(mod.hook) html += '<div class="module-hook">'+mod.hook+'</div>';
  if(mod.content){
    var c = mod.content;
    c = c.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    c = c.replace(/`([^`]+)`/g,'<code style="background:var(--bg-tertiary);padding:2px 6px;border-radius:4px;font-size:13px;">$1</code>');
    c = c.replace(/\n\n/g,'</p><p>');
    c = '<p>' + c + '</p>';
    html += '<div class="module-content">'+c+'</div>';
  }
  if(mod.formulas) mod.formulas.forEach(function(f){
    html += '<div class="formula-block" onclick="if(this.querySelector(\'.formula-derivation\'))this.classList.toggle(\'expanded\')"><div>'+f.latex+'</div>'+
      (f.caption?'<div class="formula-caption">'+f.caption+'</div>':'')+
      (f.expandable&&f.derivation?'<div class="formula-expand-hint">💡 点击展开推导过程</div><div class="formula-derivation">'+f.derivation+'</div>':'')+'</div>';
  });
  if(mod.charts) mod.charts.forEach(function(c,i){html += '<div class="chart-container"><div class="chart-wrapper" id="chart_'+mod.module_id+'_'+i+'"></div>'+(c.caption?'<div class="chart-caption">'+c.caption+'</div>':'')+'</div>';});
  if(mod.tables) mod.tables.forEach(function(t){
    html += '<table class="module-table"><thead><tr>'+t.headers.map(function(h){return '<th>'+h+'</th>';}).join('')+'</tr></thead><tbody>'+
      t.rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+c+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table>'+
      (t.caption?'<div class="table-caption" style="font-size:12px;color:var(--text-tertiary);text-align:center;margin-top:8px">'+t.caption+'</div>':'');
  });
  if(mod.references) html += '<div class="module-references"><h4>📚 参考文献</h4><ol>'+mod.references.map(function(r){
    return '<li>'+(r.authors||'')+' ('+(r.year||'')+'). <strong>'+(r.title||'')+'</strong>.'+(r.url?' <a href="'+r.url+'" target="_blank" style="color:var(--primary)">链接</a>':'')+'</li>';
  }).join('')+'</ol></div>';
  if(mod.key_takeaway) html += '<div class="key-takeaway">💡 '+mod.key_takeaway+'</div>';
  html += '</section>';
  return html;
}

function initPage(){
  document.body.classList.remove('loading');
  document.body.classList.add('loaded');
  buildMetaCard();
  buildSidebar();
  var mc = document.getElementById('modules-container');
  PAGE_DATA.modules.forEach(function(mod){mc.innerHTML += buildModuleHTML(mod);});
  var sections = mc.querySelectorAll('.module-section');
  sections.forEach(function(sec){observer.observe(sec);});
  renderFormulas(mc);
  setTimeout(function(){
    PAGE_DATA.modules.forEach(function(mod){
      if(mod.charts) mod.charts.forEach(function(c,i){renderChart(mod.module_id,c,i);});
    });
  },100);
  var fObs = new IntersectionObserver(function(entries){entries.forEach(function(e){if(e.isIntersecting)e.target.classList.add('visible');});},{threshold:0.08});
  sections.forEach(function(sec){fObs.observe(sec);});
}
document.addEventListener('DOMContentLoaded', initPage);

function exportNotes(){
  var lines = ['# '+PAGE_DATA.topic+' - 学习笔记','','生成日期: '+new Date().toLocaleDateString('zh-CN'),''];
  PAGE_DATA.modules.forEach(function(m){lines.push('- **'+(m.module_title||m.module_id)+'**: '+(m.key_takeaway||m.hook||''));});
  if(navigator.clipboard){navigator.clipboard.writeText(lines.join('\n')).then(function(){alert('✅ 学习笔记已复制到剪贴板!');});}
  else{alert('复制失败，请手动选择复制');}
}

(function(){
  var cv = document.getElementById('bg-canvas');
  var ctx = cv.getContext('2d');
  var particles=[];
  function rsz(){cv.width=window.innerWidth;cv.height=window.innerHeight;}
  window.addEventListener('resize',rsz);rsz();
  var count = Math.min(60,Math.floor((cv.width*cv.height)/20000));
  for(var i=0;i<count;i++) particles.push({x:Math.random()*cv.width,y:Math.random()*cv.height,vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,r:Math.random()*1.5+0.3,a:Math.random()*0.3+0.05});
  function animate(){
    ctx.clearRect(0,0,cv.width,cv.height);
    var isDark = document.documentElement.getAttribute('data-theme') !== 'light';
    var c = isDark?'129,140,248':'99,102,241';
    particles.forEach(function(p){
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0)p.x=cv.width;if(p.x>cv.width)p.x=0;
      if(p.y<0)p.y=cv.height;if(p.y>cv.height)p.y=0;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);
      ctx.fillStyle='rgba('+c+','+p.a+')';ctx.fill();
    });
    for(var j=0;j<particles.length;j++) for(var k=j+1;k<particles.length;k++){
      var dx=particles[j].x-particles[k].x,dy=particles[j].y-particles[k].y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<110){ctx.beginPath();ctx.moveTo(particles[j].x,particles[j].y);ctx.lineTo(particles[k].x,particles[k].y);ctx.strokeStyle='rgba('+c+','+(0.06*(1-d/110))+')';ctx.lineWidth=0.5;ctx.stroke();}
    }
    requestAnimationFrame(animate);
  }
  animate();
})();</script></body></html>
