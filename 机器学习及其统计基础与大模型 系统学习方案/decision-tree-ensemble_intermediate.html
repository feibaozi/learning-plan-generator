const PAGE_DATA={topic:"决策树与集成方法",domain:"ai-tech",domain_name:"AI与科技",level:"intermediate",level_name:"进阶",reading_time:"32",module_count:"16",texture:"G5",texture_name:"全面平衡型",depth:"理解",breadth:"标准",modules:[
{module_id:"background",module_tag:"发展演进",module_title:"背景与缘起",hook:"一棵决策树不能解决的问题，就用一百棵来解决——这个朴素的想法，造就了统治表格数据竞赛20年的方法论。",content:"决策树的起源可追溯到1963年**Morgan和Sonquist**的AID（Automatic Interaction Detection）算法。但真正的突破来自**Quinlan**：1979年ID3（Iterative Dichotomiser 3）用信息增益选择分裂特征，1993年C4.5用增益率解决了ID3偏向多值特征的缺陷。同期**Breiman**等人（1984年）提出了CART（Classification and Regression Trees），用Gini系数作为分裂标准。\n\n**集成革命**彻底改变了游戏规则：**Breiman**(1996)的Bagging通过bootstrap采样+投票将不稳定的基学习器（如深度树）转化为稳定强学习器；**Freund和Schapire**(1995)的AdaBoost通过序列加权让简单分类器专注于'难样本'；**Breiman**(2001)的随机森林在Bagging基础上随机选择特征子集→不仅提升性能且增加了树的多样性。\n\n**梯度提升**成为Kaggle竞赛的王者：**Friedman**(2001)将提升视为梯度下降——每棵新树拟合负梯度（残差）；**Chen**(2014)的XGBoost加上正则化和分布式优化，一度称霸竞赛；微软的LightGBM(2017)引入GOSS和EFB大幅加速；Yandex的CatBoost(2017)用有序提升优雅处理类别特征。",key_takeaway:"从ID3到XGBoost，决策树的进化史就是两个字——'集成'。单棵树是弱学习器（bias低、variance高），集成后成为强学习器（bias低、variance也低）。"},{module_id:"concept",module_tag:"核心概念",module_title:"核心概念：从一棵树到一片森林",hook:"如果你只能选一种ML算法上Kaggle竞赛——决策树集成可能是最安全的选择。",content:"**决策树的本质**：通过对特征空间递归二分割，构建一个树形决策规则。每个内部节点是对一个特征的条件测试，每个叶子节点是一个预测值。\n\n**分裂标准**（决定'在哪里切'）：\n- **分类树**：\n  - 信息增益=$\\text{IG}=H(D)-\\sum\\frac{|D_v|}{|D|}H(D_v)$，其中$H(D)=-\\sum p_k\\log_2 p_k$（熵）。问题：偏向多值特征。\n  - 增益率=$\\text{IG}/\\text{SplitInfo}$，C4.5使用，但可能导致过小分裂。\n  - Gini系数=$G=1-\\sum p_k^2$，CART使用，计算比熵快。\n- **回归树**：MSE减少=$\\text{MSE}(D)-\\frac{|D_L|}{|D|}\\text{MSE}(D_L)-\\frac{|D_R|}{|D|}\\text{MSE}(D_R)$\n\n**三种集成范式的直觉**：\n1. **Bagging**：训练100棵树（每棵在不同的bootstrap样本上），投票/平均→降方差。\n2. **Boosting**：顺序训练100棵树，每棵专注于前一棵犯错的地方→降偏差。\n3. **Stacking**：训练多种不同类型的模型，用元模型（通常是LR）融合它们的预测→综合利用不同类型模型的优势。",formulas:[{latex:"$$\\text{Gini}(D) = 1 - \\sum_{k=1}^{K} p_k^2$$",caption:"Gini不纯度——CART分类树的分裂标准"},{latex:"$$\\text{Entropy}(D) = -\\sum_{k=1}^{K} p_k \\log_2 p_k$$",caption:"信息熵——ID3/C4.5的分裂基础"}],tables:[{headers:["特性","Bagging","Boosting","Stacking"],rows:[["训练方式","并行(独立训练)","串行(依赖前一个)","两阶段(基模型→元模型)"],["基学习器","强学习器(深度树)","弱学习器(浅树桩)","异质(不同类型)"],["主要降什么","方差","偏差","综合"],["代表算法","随机森林","AdaBoost/XGBoost","Stacked Generalization"],["过拟合风险","低","中(需早停/shinkage)","需谨慎设计CV"]]}],key_takeaway:"Bagging=投票委员会（你一言我一语，取平均），Boosting=导师制（每个人针对上一个的错误改进），Stacking=管理咨询（请各种专家出主意，最后总结合并）。"},{module_id:"principle",module_tag:"核心概念",module_title:"核心原理：梯度提升的数学",hook:"XGBoost的论文只有13页——但它背后的数学思想，改变了整个ML竞赛的格局。",content:"**Gradient Boosting的核心思想**\n传统Boosting中，AdaBoost通过改变样本权重来串联弱学习器。Friedman(2001)提出了更通用的视角：将Boosting视为在函数空间中的梯度下降。\n\n在第m步，我们希望找到新基学习器$h_m(x)$来近似当前残差的负梯度：\n$$r_{im} = -\\left[\\frac{\\partial L(y_i, F(x_i))}{\\partial F(x_i)}\\right]_{F=F_{m-1}}$$\n\n当$L$为MSE时，$r_{im}=y_i-F_{m-1}(x_i)$——就是残差！当$L$为交叉熵时，$r_{im}$是真实标签与预测概率的差。\n\n**XGBoost的三个创新**：\n1. **二阶泰勒展开**：不仅用梯度，还用二阶导（Hessian）信息→更精准的树分裂。\n2. **正则化**：目标函数=$\\sum L(y_i,\\hat{y}_i)+\\sum\\Omega(f_k)$，其中$\\Omega(f)=\\gamma T+\\frac{1}{2}\\lambda\\|w\\|^2$（T=叶子数，w=叶权重）→天然防止过拟合。\n3. **近似分裂查找**：对连续特征的候选分裂点用分位数近似→大幅加速。\n\n**LightGBM vs XGBoost的关键差异**：\n- XGBoost按层生长（Level-wise）：每层所有节点同时分裂→平衡但浪费（有些叶子不需要分裂）\n- LightGBM按叶子生长（Leaf-wise）：每次选loss减少最多的叶子分裂→更快但可能产生很深的不平衡树→需要限制最大深度",formulas:[{latex:"$$F_m(x) = F_{m-1}(x) + \\eta \\cdot h_m(x)$$",caption:"梯度提升的迭代表达式——η是学习率(shrinkage)，防止过拟合"},{latex:"$$\\text{Obj}^{(t)} = \\sum_{i=1}^n\\left[g_i f_t(x_i)+\\frac{1}{2}h_i f_t^2(x_i)\\right]+\\gamma T+\\frac{1}{2}\\lambda\\sum_{j=1}^T w_j^2$$",caption:"XGBoost第t轮的目标函数——二阶泰勒展开+正则化"}],key_takeaway:"梯度提升=在函数空间中沿着负梯度方向逐步优化。XGBoost=把这个想法用二阶泰勒展开+正则化+高效工程实践做到了极致。"},{module_id:"architecture",module_tag:"核心概念",module_title:"素描：分裂的过程与树的生长",hook:"决策树的训练过程不是一个黑盒——它在每一步都告诉你'为什么在这里切'。这正是它可解释性的来源。",content:"**训练一棵决策树的步骤（贪心递归）**：\n1. 从根节点开始，包含全部训练数据\n2. 对每个特征，尝试所有可能的切分点，计算切分后的'纯度提升'（IG/Gini/MSE reduction）\n3. 选择纯度提升最大的特征和切分点，将数据分成左右两部分\n4. 对左右子节点递归执行步骤2-3\n5. 满足停止条件时停止：达到最大深度/样本数小于min_samples_split/纯度足够高\n\n**随机森林的'两次随机'**：\n1. 行采样（Bootstrap）：每棵树在原始数据的bootstrap样本上训练（约63%的样本被选中，37%的OOB可用于评估）\n2. 列采样（Feature Subsampling）：每次分裂时，只在随机选取的$\\sqrt{p}$（分类）或$p/3$（回归）个特征中找最佳分裂\n\n**特征重要性（Feature Importance）**：\n树模型天然提供两种重要性度量：\n- MDI（Mean Decrease in Impurity）：该特征在所有树的所有分裂中，平均降低了多少Gini/entropy\n- Permutation Importance：随机打乱该特征后，模型预测误差增加了多少——更可靠但不适合高维数据\n⚠️ MDI偏向连续特征和高基数类别特征，不应直接解读为'因果关系'。",key_takeaway:"决策树的训练就像二十问游戏——每次选最能缩小可能答案空间的问题。随机森林的'两次随机'保证每棵树看到不同的数据和特征，使得集成后的方差大幅降低。"},{module_id:"development",module_tag:"发展演进",module_title:"发展迭代：树的进化树",hook:"从CART (1984)到XGBoost (2014)，正好30年——一棵代码树的30年进化。",content:"**1984-2000：单树时代**\nBreiman et al. (1984): CART→Quinlan (1986): ID3→Quinlan (1993): C4.5（加入剪枝、连续值处理、缺失值处理）→Kass (1980): CHAID（卡方检验做分裂）\n\n**1995-2005：集成革命**\nBreiman (1996): Bagging→Freund & Schapire (1995): AdaBoost→Breiman (2001): Random Forest（把bagging+随机特征选择结合→成为经典）\n\n**2001-2016：梯度提升的工程化**\nFriedman (2001): Gradient Boosting Machine→Friedman (2002): Stochastic GBM（每棵树只用子样本）→Chen & Guestrin (2014): XGBoost→Ke et al. (2017): LightGBM→Prokhorenkova et al. (2017): CatBoost\n\n**2017-至今：可解释树模型**\nLundberg & Lee (2017): SHAP（基于Shapley值的树模型解释）→Nori et al. (2019): Explainable Boosting Machine (EBM)（可加的、每特征一条曲线的智能模型）→Grinsztajn et al. (2022): Why tree-based models still outperform deep learning on tabular data",key_takeaway:"从CART的'手工剪枝'到XGBoost的'自动正则化'——30年间，树的进化完美诠释了'简单思想+极致工程=game changer'。"},{module_id:"application",module_tag:"实践应用",module_title:"实践应用：为什么树模型统治表格数据",hook:"如果你的数据是整齐的表格（行=样本，列=特征），树模型几乎永远是你的首选。",content:"**1. 表格数据竞赛的王者**\nKaggle 2022年调查：95%的获奖方案用了XGBoost/LightGBM/CatBoost中的至少一个。树模型对表格数据的天然优势：不需要特征缩放、自动处理缺失值、天然捕捉非线性交互、对异常值鲁棒。\n\n**2. 信用评分与风控**\n单一决策树天然可解释（'如果你月入<5000且负债率>40%→高风险'），满足监管要求。SHAP值可以精确量化每个特征对单个预测的贡献——'为什么他被拒了？因为月收入贡献-15分，负债率贡献-20分'。\n\n**3. 搜索排序（Learning to Rank）**\nLambdaMART（Lambda梯度+GBDT=MART）是搜索引擎排序的标准方法。LambdaRank的pairwise loss天然适合用树模型建模排序关系。\n\n**4. 点击率预估**\n在深度学习统治推荐系统之前，GBDT+LR是业界标准方案：GBDT做自动化特征工程→将叶子节点ID作为新特征→输入LR做最终预测。Facebook 2014年提出，至今依然有效。",key_takeaway:"表格数据→树模型集成，几乎是一条铁律。不需要特征工程（独热编码不需要）、不需要标准化、不需要处理缺失值——你的数据是什么样的，直接扔进去就行。"},{module_id:"case-study",module_tag:"实践应用",module_title:"实战案例：Kaggle房价预测",hook:"用随机森林和XGBoost打一场经典Kaggle——你会发现，调参比建模花的时间多10倍。",content:"**问题**：根据79个房屋特征预测房价（Ames Housing数据集）。\n\n**Step 1: 基础建模**\n- 随机森林(RF) n_estimators=100, max_depth=None: RMSE=0.145\n- XGBoost默认参数: RMSE=0.138——已经优于RF\n\n**Step 2: 特征重要性分析**\nRF和XGBoost一致认为：OverallQual（整体质量）、GrLivArea（地上居住面积）、GarageCars（车库容量）是最重要的3个特征——两者特征重要性排序高度一致，说明信号稳定。\n\n**Step 3: 超参数调优（用Optuna搜索）**\n同样搜索100个trial：\n- RandomSearch: RMSE=0.127\n- Bayesian Optimization (Optuna): RMSE=0.121——贝叶斯优化每次从历史trial中学参数→更好的trial→更低的RMSE\n\n**Step 4: SHAP解释**\n用SHAP分析'为什么这间房子预测$220K而非$250K'：\n- OverallQual贡献+15K（质量高于平均）\n- LotArea贡献-8K（地块小于平均）\n- YearBuilt贡献-12K（建于1965年，偏旧）\n\n**关键教训**：XGBoost对树的max_depth非常敏感。depth=3（默认）→欠拟合，depth=10→过拟合。最佳depth=6，且learning_rate=0.01需要更多树（n_estimators=5000+）。",key_takeaway:"树模型的核心不是'选RF还是XGB'，而是'怎么调参'——同样的算法，经验工程师和入门者的RMSE可能差20%。"},{module_id:"risk",module_tag:"风险与挑战",module_title:"潜在陷阱",hook:"树模型不需要特征缩放——这既是它最大的便利，也是它的'陷阱之源'。",content:"**陷阱1：过拟合的诱惑**\n单棵决策树只要不限制深度→100%训练准确率（每个叶子一个样本）。但测试集准确率可能只有50%。解决方案：限制max_depth、min_samples_split、min_samples_leaf；使用剪枝（pre/post pruning）。\n\n**陷阱2：不稳定性**\n数据微小的变化→决策树结构完全改变（高variance）。老一辈数据科学家可能经历过：'昨天跑好的规则，今天换了100个样本，整个树不一样了。'这就是Bagging/Random Forest存在的理由。\n\n**陷阱3：特征重要性偏差**\n树模型的MDI重要性天然偏向连续特征（更多分裂点）和高基数类别特征（更多分裂组合）。随机森林的Permutation Importance可以部分缓解，但仍有偏差。SHAP值是目前最无偏的特征归因方法。\n\n**陷阱4：外推失败**\n树模型只能预测训练数据中见过的范围！如果训练数据income∈[0,200K]，测试中出现income=500K→树的预测还是叶子节点的平均值→严重低估/高估。深度学习/线性模型反而可以做外推。\n\n**陷阱5：梯度提升的计算时间**\nGBDT是串行的（每棵树依赖前一棵）→无法像RF一样并行训练。100棵树×5折CV=500次训练。",key_takeaway:"树模型会'记住'训练数据但不能'思考'训练数据之外的事——给它一个从未见过的特征值范围，它只能摊手。"},{module_id:"ethics",module_tag:"风险与挑战",module_title:"可解释性的伦理双面性",hook:"决策树的规则可以被任何人读懂——这意味着好决策可以被审查，也意味着坏决策可以被复制。",content:"**1. 可解释性的监管价值**\n在贷款审批、保险定价、招聘筛选等场景，法规（如FCRA、GDPR）要求决策过程可被解释。单一决策树天然满足这一需求：'因为你月收入<3000且过往逾期次数>2，所以被拒了'。随机森林/XGBoost可以通过SHAP进行近似解释。\n\n**2. 特征重要性的'伪因果'陷阱**\nMDI重要性显示'OverallQual是最重要的特征'——决策者可能解读为'提高质量能增加房价'（因果）。但MDI只衡量'模型用了这个特征多少'，不衡量因果关系。在混淆变量存在时，高重要性≠因果关系。\n\n**3. 代理歧视的风险**\n如果从数据中移除了'种族'特征，但保留了'邮政编码'（与种族高度相关），决策树可能通过邮编间接进行种族歧视——这比线性模型更隐蔽，因为树可以捕捉复杂的非线性代理关系。\n\n**4. 模型可解释性的'白洗'现象**\n公司展示一个可解释的单树模型用于公关，但实际部署的是另一个不可解释的深度模型——这被称为'解释性白洗'（Explainability Washing）。",key_takeaway:"树模型的'透明'不等于'公平'——一个可以被完全理解的歧视算法，仍然是一个歧视算法。"},{module_id:"landscape",module_tag:"发展演进",module_title:"三足鼎立：XGBoost vs LightGBM vs CatBoost",hook:"三个老板本都是梯度提升，但它们的差异足够让你做一个小时的实验来选——或者直接告诉你结论。",content:"**XGBoost (2014, 陈天奇)**\n- 优势：最成熟（文档/社区/教程丰富），sklearn兼容API，分布式支持完善，对GPU训练支持最好\n- 劣势：默认参数下训练最慢，类别特征需要手动处理（LabelEncoder/OneHot），内存占用偏高\n- 最适合：通用场景，尤其是需要分布式训练的大规模表格数据\n\n**LightGBM (2017, 微软)**\n- 优势：Leaf-wise生长→最快（比XGBoost快3-10倍），原生支持类别特征，内存占用最低，GOSS（基于梯度的采样）减少样本量\n- 劣势：小数据（<10K样本）上容易过拟合（leaf-wise树极深），参数min_data_in_leaf必须精心设置\n- 最适合：大数据（>100K样本），时效性要求高的场景，需要类别特征原生支持\n\n**CatBoost (2017, Yandex)**\n- 优势：对类别特征的处理最优（Ordered Target Encoding→避免数据泄露），默认参数下就很好（不需要大量调参），对无序类别特征天然友好\n- 劣势：训练最慢（尤其在大数据上），GPU支持不如XGBoost，社区相对较小\n- 最适合：类别特征占比高的场景，不想花时间调参时，中小规模数据",key_takeaway:"大数据→LightGBM，类别特征→CatBoost，分布式/GPU/成熟度→XGBoost。三个库都精通>只精一个。"},{module_id:"issues",module_tag:"风险与挑战",module_title:"当前挑战",hook:"树模型好用到让人忘记了它的短板——但当你遇到这些场景时，短板就会变成绊脚石。",content:"**挑战1：高维稀疏特征的困境**\n树模型在文本、推荐场景的高维稀疏特征上表现远不如线性模型。OneHot编码后特征维度从100飙升到100万→每个分裂只能用一个二值特征→找到好的分裂需要极深的树→过拟合。这就是为什么文本分类中LR常优于树模型。\n\n**挑战2：时间序列的外推**\n树模型无法预测趋势。给树'年份=2020,2021,2022'训练，它无法预测2023年的增长。树把时间当作普通的类别或数值特征→在训练域内可以插值，但永远不能外推。\n\n**挑战3：单调性约束的需求**\n很多金融场景有单调性需求（'收入越高，信用分应该越高/至少不降'）。XGBoost和LightGBM支持monotone_constraints，但限制了树的表达能力，且CatBoost的实现仍有局限。\n\n**挑战4：在线学习的困难**\nGDBN是串行的，增量更新的代价很高。当新数据不断到来（如实时交易流水），重新训练整个GBM代价太大。Evolving tree models和在线梯度提升仍是活跃研究领域。",key_takeaway:"树模型不是银弹——高维稀疏=线性模型更好，外推=线性/时序模型更好，在线学习=SGD更好。知道何时不用树模型，和知道何时用同样重要。"},{module_id:"prospect",module_tag:"前沿探索",module_title:"发展前景",content:"**1. 基于树的表格基础模型**\nTabPFN (Hollmann et al., 2023)等Transformer-based表格模型试图挑战树模型的统治地位。但它们目前只在小数据上有效——而树模型在大表格数据(>10K)上依然无敌。\n\n**2. 可解释提升机（EBM）**\n微软的InterpretML框架中的EBM——每个特征学习一条光滑的加性函数，天然可解释且精度不输XGBoost。在金融/医疗等受监管行业可能是最优选择。\n\n**3. 树+神经网络的混合**\n将决策树的离散分裂变为可微操作→嵌入神经网络→端到端训练。Google的Neural Decision Forests和Deep Forest是这方面的尝试。\n\n**4. 隐私保护的树模型**\n联邦学习中的树模型（Federated GBDT）——多个机构在不共享数据的前提下联合训练一个GBDT。SecureBoost（基于XGBoost）已经有工程实现。",key_takeaway:"树模型的未来在三个方向：更可解释（EBM）、融合深度学习（可微树）、隐私计算（联邦GBDT）——'树'的概念在进化，但'集成'的精髓不变。"},{module_id:"effort-direction",module_tag:"前沿探索",module_title:"学习建议",content:"**Week 1: 从零实现**\n- Day 1-2: 实现CART分类树（30行NumPy核心代码）——递归选择最佳分裂，理解Gini/entropy的计算。\n- Day 3-4: 实现随机森林——在CART基础上加bootstrap+特征子采样。\n- Day 5: 实现简单的AdaBoost——理解样本加权和弱学习器组合。\n\n**Week 2: 工程实战**\n- Day 1-2: 调优XGBoost：max_depth/learning_rate/subsample/colsample_bytree/reg_alpha/reg_lambda——每个参数的含义和理解。\n- Day 3: 用SHAP解释模型——waterfall plot, beeswarm plot, dependence plot。\n- Day 4: Kaggle竞赛实践——选一个表格数据竞赛，从EDA→特征工程→建模→调参→ensemble走完整流程。\n- Day 5: 阅读论文：XGBoost (Chen 2014) + LightGBM (Ke 2017) + SHAP (Lundberg 2017)三篇必读。",key_takeaway:"实现CART→理解树的本质；调优XGBoost→理解工业级ML；用SHAP解释→理解'为什么'——三步走，缺一不可。"},{module_id:"misconceptions",module_tag:"风险与挑战",module_title:"常见误区",content:"**误区1：'随机森林永远优于单棵树'**\n在需要极度可解释性（如监管要求的逐条规则）时，单棵浅树优于随机森林。当你需要向非技术人员解释模型时，'如果A且B则C'比'100棵树投票'更容易被接受。\n\n**误区2：'XGBoost永远优于LightGBM'**\nLightGBM在线下大数据场景通常更快且精度不输XGBoost。Benchmark (Anghel et al. 2018) 显示LightGBM在多个数据集上速度快3-10x，精度相当。\n\n**误区3：'特征重要度=因果重要性'**\nMDI特征重要度显示'这是模型分裂时最常用的特征'≠'这个特征因果地影响目标'。当一个特征和标签都被第三个混淆变量影响时，它的MDI仍然很高但因果作用为零。\n\n**误区4：'决策树不需要特征工程'**\n树的优势是不需要标准化和缺失值处理，但特征创造（如'面积/房间数=平均房间面积'等衍生特征）仍然能大幅提升树模型的效果。好的特征工程≈树模型额外+5%性能。\n\n**误区5：'树越深越好'**\n深度树=低偏差+高方差→即使有集成，基学习器偏差太低反而会让Boosting失去意义（Boosting需要弱学习器！）。经验法则：max_depth=3-6对于GBDT通常足够。",key_takeaway:"RF不是永远比单树好、XGB不是永远比LGBM好、特征重要度不是因果、树需要特征工程、树不是越深越好——5个误区，5个教训。"},{module_id:"learning-path",module_tag:"实践应用",module_title:"推荐资源",content:"**入门**: 📖 ISLR第8章（树模型入门）→ 📺 StatQuest Random Forest和XGBoost视频 → 📖 《统计学习方法》第5章（决策树）\n**进阶**: 📖 ESL第9-10章（Boosting和Random Forests的数学）→ 📄 XGBoost论文 (Chen 2016) → 📄 LightGBM论文 (Ke 2017) → 📄 CatBoost论文 (Prokhorenkova 2018)\n**专家**: 📄 SHAP论文 (Lundberg 2017) → 📄 Why do tree-based models still outperform deep learning on tabular data? (Grinsztajn 2022) → 📖 Interpretable Machine Learning (Molnar 2023, 在线阅读)\n**工具**: XGBoost官方文档 → LightGBM官方文档 → CatBoost官方文档 → SHAP官方文档 → Optuna (超参数优化)",references:[{title:"XGBoost: A Scalable Tree Boosting System",authors:"Chen, T. & Guestrin, C.",year:2016},{title:"LightGBM: A Highly Efficient Gradient Boosting Decision Tree",authors:"Ke, G., Meng, Q., et al.",year:2017},{title:"A Unified Approach to Interpreting Model Predictions (SHAP)",authors:"Lundberg, S. & Lee, S.I.",year:2017}],key_takeaway:"三篇论文（XGB+LightGBM+SHAP）+三个库（XGB/LGBM/CatBoost）+一本在线书（Interpretable ML）= 树模型的完整知识图谱。"},{module_id:"debate",module_tag:"前沿探索",module_title:"争议与讨论",content:"**深度vs广度：Level-wise vs Leaf-wise**\nXGBoost的Level-wise生长保证树平衡→可并行度高但浪费计算。LightGBM的Leaf-wise生长选loss减少最大的叶子分裂→收敛更快但树可能极深→不平衡→在小数据上过拟合。没有全局最优：数据>100K→Leaf-wise更好；数据<10K→Level-wise更安全。\n\n**是否需要特征缩放？**\n传统观点：树模型基于分裂点的排序→单调变换不影响分裂→不需要标准化。这是对的——但如果你在树的输出上叠加线性模型（如GBDT+LR），特征在进入LR前仍需要标准化。\n\n**深度树vs浅树×更多棵**\nShrinkage（学习率）让这个问题有了答案：使用极小的学习率(0.001)+大量的树(5000+)→每棵树的贡献很小→即使是浅树也不欠拟合→精度最高。这个策略叫做'slow learning'，是竞赛获胜的标准配置。\n\n**GBDT还是神经网络？**\n在表格数据上，GBDT用默认参数就能超越精心调参的MLP。但在图像/文本/语音上，CNN/Transformer碾压树模型。结论：数据类型决定模型选择→表格→树集成，非结构化→深度网络。",key_takeaway:"深度还是广度、缩不缩放、浅多还是深少、树还是网——四个争论的答案都是'看你的数据'。Dogma在ML中总是输给Empirical truth。"},{module_id:"glossary",module_tag:"核心概念",module_title:"关键术语速查",content:"**Gini不纯度**：$1-\\sum p_k^2$，CART的分裂标准。**信息增益**：$H(\\text{parent})-\\sum\\frac{|D_v|}{|D|}H(D_v)$。**剪枝**：减少树深度防止过拟合的技术。**Bootstrap**：从原始数据集有放回随机抽样。**Bagging**：Bootstrap Aggregating。**Boosting**：序列训练+加权组合。**AdaBoost**：自适应Boosting，根据错误率调整样本权重。**梯度提升**：用梯度下降思想串联树。**XGBoost**：eXtreme Gradient Boosting，工业级GBDT实现。**LightGBM**：基于直方图的轻量级GBDT。**CatBoost**：带有序目标编码的GBDT。**SHAP**：Shapley Additive Explanations，基于博弈论的模型解释方法。**OOB**：Out-of-Bag，bootstrap中未被选中的约37%样本用于无偏评估。**Stochastic GBM**：每棵树只在随机子样本上训练。**Shrinkage**：学习率η∈(0,1]，每棵树的贡献缩放。"}]};
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);localStorage.setItem('slm-theme',t);updateThemeIcon();Object.values(activeCharts).forEach(function(c){c.setOption(createThemedOption(c.getOption()),{notMerge:false})})}
function toggleTheme(){var c=document.documentElement.getAttribute('data-theme')||'light';applyTheme(c==='dark'?'light':'dark')}
function updateThemeIcon(){document.getElementById('theme-toggle').textContent=document.documentElement.getAttribute('data-theme')==='dark'?'☀️':'🌓'}
var activeCharts={},sidebarLinks=[];var savedTheme=localStorage.getItem('slm-theme')||'dark';applyTheme(savedTheme);
window.addEventListener('scroll',function(){var s=window.scrollY,d=document.documentElement.scrollHeight-window.innerHeight,p=d>0?(s/d)*100:0;document.getElementById('progress-bar').style.width=p+'%'});
function buildSidebar(){var c=document.getElementById('sidebar-links');sidebarLinks=[];PAGE_DATA.modules.forEach(function(m){var a=document.createElement('a');a.href='#'+m.module_id;a.className='sidebar-link';a.textContent=m.module_title||m.module_id;a.addEventListener('click',function(e){e.preventDefault();document.getElementById(m.module_id).scrollIntoView({behavior:'smooth'})});c.appendChild(a);sidebarLinks.push({el:a,id:m.module_id})})}
var observer=new IntersectionObserver(function(e){e.forEach(function(en){if(en.isIntersecting)sidebarLinks.forEach(function(l){l.el.classList.toggle('active',l.id===en.target.id)})})},{rootMargin:'-80px 0px -60% 0px'});
function buildMetaCard(){var m=PAGE_DATA;document.getElementById('meta-card-container').innerHTML='<div class="meta-card"><div style="width:100%"><span class="meta-badge domain-ai" style="margin-right:8px">🔗 📚 机器学习及其统计基础与大模型 系统学习方案 · 经典机器学习（2/5）</span></div><div class="meta-item"><span class="icon">📖</span><strong>'+m.topic+'</strong></div><div class="meta-item"><span class="meta-badge domain-ai">'+m.domain_name+'</span></div><div class="meta-item"><span class="meta-badge level-intermediate">'+m.level_name+'</span></div><div class="meta-item"><span class="icon">⏱️</span>约'+m.reading_time+'分钟阅读</div><div class="meta-item"><span class="icon">📦</span>'+m.module_count+'个模块</div></div>'}
function renderFormulas(c){if(typeof renderMathInElement!=='undefined')renderMathInElement(c,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})}
function createThemedOption(o){var d=document.documentElement.getAttribute('data-theme')==='dark';return{color:d?['#818cf8','#a78bfa','#c4b5fd','#67e8f9','#fbbf24','#34d399','#f87171','#f472b6']:['#6366f1','#8b5cf6','#a78bfa','#22d3ee','#f59e0b','#10b981','#ef4444','#ec4899']}}
function renderChart(mid,cfg,i){var id='chart_'+mid+'_'+i,w=document.getElementById(id);if(!w)return;if(typeof echarts==='undefined'){w.innerHTML='<div style="text-align:center;padding:20px;color:var(--text-tertiary);font-size:13px;">📊 图表(静态模式)<br><small>加载CDN后可交互</small></div>';return}try{var c=echarts.init(w);c.setOption(cfg.echarts_option||{});activeCharts[id]=c;new ResizeObserver(function(){c.resize()}).observe(w)}catch(e){w.textContent='图表渲染失败: '+e.message}}
function buildModuleHTML(mod){var tc=(function(t){var m={'核心概念':'tag-core','前置知识':'tag-core','核心工具':'tag-tools','发展演进':'tag-evolution','实践应用':'tag-application','风险与挑战':'tag-risk','前沿探索':'tag-frontier'};return m[t]||'tag-core'})(mod.module_tag||'');var h='<section class="module-section" id="'+mod.module_id+'"><div class="module-header"><span class="module-tag '+tc+'">'+(mod.module_tag||'')+'</span><h2 class="module-title">'+(mod.module_title||mod.module_id)+'</h2></div>';if(mod.hook)h+='<div class="module-hook">'+mod.hook+'</div>';if(mod.content){var c=mod.content.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code style="background:var(--bg-tertiary);padding:2px 6px;border-radius:4px;font-size:13px;">$1</code>').replace(/\n\n/g,'</p><p>');h+='<div class="module-content"><p>'+c+'</p></div>'}if(mod.formulas)mod.formulas.forEach(function(f){h+='<div class="formula-block" onclick="if(this.querySelector(\'.formula-derivation\'))this.classList.toggle(\'expanded\')"><div>'+f.latex+'</div>'+(f.caption?'<div class="formula-caption">'+f.caption+'</div>':'')+(f.expandable&&f.derivation?'<div class="formula-expand-hint">💡 点击展开推导过程</div><div class="formula-derivation">'+f.derivation+'</div>':'')+'</div>'});if(mod.charts)mod.charts.forEach(function(c,i){h+='<div class="chart-container"><div class="chart-wrapper" id="chart_'+mod.module_id+'_'+i+'"></div>'+(c.caption?'<div class="chart-caption">'+c.caption+'</div>':'')+'</div>'});if(mod.tables)mod.tables.forEach(function(t){h+='<table class="module-table"><thead><tr>'+t.headers.map(function(h){return'<th>'+h+'</th>'}).join('')+'</tr></thead><tbody>'+t.rows.map(function(r){return'<tr>'+r.map(function(c){return'<td>'+c+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table>'+(t.caption?'<div class="table-caption" style="font-size:12px;color:var(--text-tertiary);text-align:center;margin-top:8px">'+t.caption+'</div>':'')});if(mod.references)h+='<div class="module-references"><h4>📚 参考文献</h4><ol>'+mod.references.map(function(r){return'<li>'+(r.authors||'')+' ('+(r.year||'')+'). <strong>'+(r.title||'')+'</strong>.'+(r.url?' <a href="'+r.url+'" target="_blank" style="color:var(--primary)">链接</a>':'')+'</li>'}).join('')+'</ol></div>';if(mod.key_takeaway)h+='<div class="key-takeaway">💡 '+mod.key_takeaway+'</div>';h+='</section>';return h}
function initPage(){document.body.classList.remove('loading');document.body.classList.add('loaded');buildMetaCard();buildSidebar();var mc=document.getElementById('modules-container');PAGE_DATA.modules.forEach(function(mod){mc.innerHTML+=buildModuleHTML(mod)});var sec=mc.querySelectorAll('.module-section');sec.forEach(function(s){observer.observe(s)});renderFormulas(mc);setTimeout(function(){PAGE_DATA.modules.forEach(function(mod){if(mod.charts)mod.charts.forEach(function(c,i){renderChart(mod.module_id,c,i)})})},100);var fObs=new IntersectionObserver(function(e){e.forEach(function(en){if(en.isIntersecting)en.target.classList.add('visible')})},{threshold:0.08});sec.forEach(function(s){fObs.observe(s)})}
document.addEventListener('DOMContentLoaded',initPage);
function exportNotes(){var l=['# '+PAGE_DATA.topic+' - 学习笔记','','生成日期: '+new Date().toLocaleDateString('zh-CN'),''];PAGE_DATA.modules.forEach(function(m){l.push('- **'+(m.module_title||m.module_id)+'**: '+(m.key_takeaway||m.hook||''))});if(navigator.clipboard)navigator.clipboard.writeText(l.join('\n')).then(function(){alert('✅ 学习笔记已复制到剪贴板!')});else alert('复制失败，请手动选择复制')}
(function(){var cv=document.getElementById('bg-canvas'),ctx=cv.getContext('2d'),particles=[];function rsz(){cv.width=window.innerWidth;cv.height=window.innerHeight}window.addEventListener('resize',rsz);rsz();for(var i=0,c=Math.min(60,Math.floor((cv.width*cv.height)/20000));i<c;i++)particles.push({x:Math.random()*cv.width,y:Math.random()*cv.height,vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,r:Math.random()*1.5+0.3,a:Math.random()*0.3+0.05});function animate(){ctx.clearRect(0,0,cv.width,cv.height);var isDark=document.documentElement.getAttribute('data-theme')!=='light',col=isDark?'129,140,248':'99,102,241';particles.forEach(function(p){p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=cv.width;if(p.x>cv.width)p.x=0;if(p.y<0)p.y=cv.height;if(p.y>cv.height)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fillStyle='rgba('+col+','+p.a+')';ctx.fill()});for(var j=0;j<particles.length;j++)for(var k=j+1;k<particles.length;k++){var dx=particles[j].x-particles[k].x,dy=particles[j].y-particles[k].y,d=Math.sqrt(dx*dx+dy*dy);if(d<110){ctx.beginPath();ctx.moveTo(particles[j].x,particles[j].y);ctx.lineTo(particles[k].x,particles[k].y);ctx.strokeStyle='rgba('+col+','+(0.06*(1-d/110))+')';ctx.lineWidth=0.5;ctx.stroke()}}requestAnimationFrame(animate)}animate()})();
</script>
</body>
