function goBack(){var MAIN_PAGE='ml_learning.html';var WIN_NAME='_ml_llm_main';var CH_KEY='_ml_llm_nav';localStorage.setItem(CH_KEY,JSON.stringify({kpId:DEEP_DIVE_KP_ID,ts:Date.now()}));var mainWin=window.open(MAIN_PAGE,WIN_NAME);if(mainWin)mainWin.focus();}
const PAGE_DATA={topic:"分类模型：逻辑回归与SVM",domain:"ai-tech",domain_name:"AI与科技",level:"intermediate",level_name:"进阶",reading_time:"32",module_count:"16",texture:"G5",texture_name:"全面平衡型",depth:"理解",breadth:"标准",modules:[
{module_id:"background",module_title:"背景与缘起",module_tag:"发展演进",hook:"当一个医生判断病人是否有病、一家银行判断贷款是否会违约——这些'是/否'问题，驱动了分类模型长达百年的进化。",content:"分类问题的研究可以追溯到**Fisher**(1936)的线性判别分析(LDA)——用一条直线将两类鸢尾花分开。但真正革命性的突破来自**Cox**(1958)提出的**逻辑回归**(Logistic Regression)：它将线性回归的输出通过sigmoid函数映射为概率，首次为二分类问题提供了概率化的框架。\n\n**SVM的故事**更富戏剧性。1960年代，苏联数学家**Vapnik和Chervonenkis**在模式识别理论中建立了VC维理论。1992年，**Boser、Guyon和Vapnik**通过核技巧(Kernel Trick)将线性SVM扩展到非线性问题。1995年，**Cortes和Vapnik**引入软间隔(Soft Margin)，让SVM能够处理不可分数据——这篇论文成为ML历史上引用最多的论文之一。\n\n逻辑回归和SVM代表了分类模型的两条哲学路线：前者是**概率化**的（给出属于某类的概率），后者是**几何化**的（寻找最大间隔分割超平面）。两种思路至今仍是理解所有现代分类器的基础。",key_takeaway:"从Fisher的线性判别到Vapnik的核方法，分类模型的核心问题从未改变：如何在高维空间中画一条最佳的分割线——只是'最佳'的定义在概率化和几何化之间不断演替。"},
{module_id:"concept",module_title:"核心概念：从sigmoid到最大间隔",module_tag:"核心概念",hook:"如果说线性回归是预测一个数，那么分类模型要回答的终极问题只有一个：这个样本属于A还是B？",content:"**逻辑回归的本质**：直接建模条件概率$P(Y=1|X=x)$。\n- 线性函数：$z = w^Tx + b$\n- Sigmoid变换：$\\sigma(z) = \\frac{1}{1+e^{-z}}$，将$(-\\infty,+\\infty)$映射到(0,1)\n- 决策规则：若$\\sigma(z) > 0.5$（等价于$z > 0$）则预测为正类\n- **log-odds（对数几率）**：$\\log\\frac{P(Y=1)}{P(Y=0)} = w^Tx + b$——这就是'逻辑'的来源\n\n**SVM的本质**：寻找最大化两类之间间隔（Margin）的分割超平面。\n- 支持向量：离超平面最近的那些训练样本——只有它们决定超平面的位置！\n- 硬间隔SVM：要求所有样本被完美分类，$\\min_w \\frac{1}{2}\\|w\\|^2$ s.t. $y_i(w^T x_i + b) \\ge 1$\n- 软间隔SVM：允许少量分类错误，引入松弛变量$\\xi_i$和惩罚参数C\n- 核技巧：通过$K(x_i, x_j) = \\phi(x_i)^T\\phi(x_j)$在隐式高维空间中做线性分类\n\n**两者对比**：LR输出概率（可直接用于风险评分），SVM输出决策值（需要Platt Scaling才能转换为概率）。LR对异常值敏感（sigmoid的尾部衰减慢），SVM仅由支持向量决定→对异常值更鲁棒。",key_takeaway:"逻辑回归用概率说话（'有73%概率是正类'），SVM用几何说话（'这个点离分界线有0.8个单位的margin'）——选择哪个取决于你的下游任务需要概率还是决策。"},
{module_id:"principle",module_title:"核心原理：损失函数与优化",module_tag:"核心概念",hook:"为什么逻辑回归用交叉熵而非MSE？为什么SVM的Hinge Loss天然产生稀疏支持向量？——答案藏在损失函数的形状里。",content:"**逻辑回归的MLE推导**\n假设$y|x \\sim \\text{Bernoulli}(\\sigma(w^Tx))$，似然函数：$$\\mathcal{L}(w) = \\prod_{i=1}^n \\sigma(w^Tx_i)^{y_i}(1-\\sigma(w^Tx_i))^{1-y_i}$$\n取负对数似然得交叉熵损失：$$\\text{CE}(w) = -\\sum_{i=1}^n\\left[y_i\\log\\hat{y}_i + (1-y_i)\\log(1-\\hat{y}_i)\\right]$$\n该损失是凸函数——梯度下降保证收敛到全局最优。\n\n**SVM的Hinge Loss**\n软间隔SVM等价于无约束优化：$$\\min_w \\frac{1}{2}\\|w\\|^2 + C\\sum_i \\max(0, 1 - y_i(w^Tx_i + b))$$\nHinge Loss = $\\max(0, 1 - y\\hat{y})$：当样本被正确分类且margin>1时，loss=0→该样本不参与梯度更新→这就是为什么只有支持向量决定SVM！\n\n**三种损失对比**\n- 0-1 Loss：理论最优但不可微，无法优化\n- Hinge Loss：上界最小的凸代理损失→SVM\n- Logistic Loss（交叉熵）：Bayes一致→最优分类器收敛到真实后验概率→LR\n\n**核技巧的核心思想**\n不需要显式计算$\\phi(x)$，只需要能计算内积$K(x_i,x_j)=\\phi(x_i)^T\\phi(x_j)$。常用核：\n- 线性核：$K(x_i,x_j)=x_i^Tx_j$ → 就是线性SVM\n- RBF核：$K(x_i,x_j)=\\exp(-\\gamma\\|x_i-x_j\\|^2)$ → 相当于在无限维空间做分类！\n- 多项式核：$K(x_i,x_j)=(x_i^Tx_j+c)^d$",formulas:[{latex:"$$\\text{CrossEntropy} = -\\frac{1}{n}\\sum_{i=1}^n\\left[y_i\\log\\hat{y}_i + (1-y_i)\\log(1-\\hat{y}_i)\\right]$$",caption:"逻辑回归的交叉熵损失函数（二分类）",expandable:true,derivation:"从MLE出发：$w^* = \\arg\\max_w \\sum [y_i\\log\\sigma(w^Tx_i)+(1-y_i)\\log(1-\\sigma(w^Tx_i))]$。取负号转为最小化，除以n得平均损失。"},{latex:"$$\\min_w \\frac{1}{2}\\|w\\|^2 + C\\sum_i \\xi_i\\quad\\text{s.t.}\\quad y_i(w^Tx_i+b)\\ge1-\\xi_i,\\;\\xi_i\\ge0$$",caption:"软间隔SVM的原始问题（Primal Form）"}],tables:[{headers:["特性","逻辑回归(LR)","SVM(线性)","SVM(RBF核)"],rows:[["输出类型","概率(0-1)","决策值","决策值"],["损失函数","交叉熵(凸)","Hinge Loss(凸)","Hinge Loss(凸)"],["决策边界","线性超平面","线性超平面","非线性(任意复杂)"],["支持向量","无(所有样本参与)","仅有支持向量","仅有支持向量"],["对异常值","敏感","鲁棒(C控制)","鲁棒(C控制)"],["概率校准","原生","需要Platt Scaling","需要Platt Scaling"]]}],key_takeaway:"三种损失函数的选择决定了一个分类器的全部行为：Logistic Loss→概率化→LR，Hinge Loss→稀疏性→SVM。这是理解一切分类模型差异的钥匙。"},
{module_id:"architecture",module_title:"决策边界的几何洞察",module_tag:"核心概念",hook:"分类的本质就是'画线'——逻辑回归是概率等高线，SVM是最大间隔线。两条线看似相似，画出它们的逻辑完全不同。",content:"**逻辑回归的决策边界**\n决策条件$\\sigma(w^Tx+b) = 0.5$等价于$w^Tx+b=0$——也是一个线性超平面。但与SVM不同：LR的决策边界对离边界远的样本同样敏感（因为sigmoid永远不为0或1），而SVM只关心最近的样本。\n\n**从线性到非线性**\n- 线性分类器（LR/线性SVM）：只能画直线。当数据不是线性可分时→错误率高。\n- 核SVM：通过核函数映射到高维空间。RBF核$\\exp(-\\gamma\\|x_i-x_j\\|^2)$相当于在无穷维空间中寻找分离超平面→可以分割任意复杂形状的数据。\n- 直观理解RBF核：每个支持向量以其为中心建立一个'影响力范围'（高斯分布），新样本的类别由所有支持向量加权投票决定——类似于KNN但更优雅。\n\n**多分类的处理**\n- OvR (One-vs-Rest)：训练K个二分类器，每个区分'第k类 vs 其他所有类'\n- OvO (One-vs-One)：训练K(K-1)/2个二分类器，每对类别之间一个\n- Softmax/多项式LR：直接建模$P(Y=k)=\\frac{e^{w_k^Tx}}{\\sum_j e^{w_j^Tx}}$，一次训练K个分类器",key_takeaway:"LR和线性SVM的决策边界在形式上都只是一条直线——区别在于，LR关心所有点到直线的距离（概率化），SVM只关心最近的点（几何化）。这种哲学差异延伸到各自的非线性版本中。"},
{module_id:"development",module_title:"发展迭代",module_tag:"发展演进",hook:"从1958年的感知机到今天的LIBLINEAR和LIBLINEAR核方法——分类模型的进化史是一部'怎么画线最优雅'的创新史。",content:"**1958-1990：奠基与寒冬**\nRosenblatt(1958)：感知机→只能线性可分。Minsky(1969)在《Perceptrons》中证明感知机连XOR都解不了→第一次AI寒冬。\n\n**1990-2000：SVM黄金十年**\nVapnik(1992-1995)：核技巧+软间隔→SVM成为90年代最强大的分类器。Platt(1998)：SMO算法使大规模SVM训练成为可能。Joachims(1999)：SVMLight让SVM在文本分类中大放异彩。\n\n**2000-2010：工程化与大规模化**\nFan et al.(2008)：LIBLINEAR——线性分类器的大规模训练工具，至今仍是工业界首选。Bottou的SGD分类器——随机梯度下降让LR处理TB级数据。\n\n**2010-至今：深度学习时代的定位**\nLR和SVM不再是SOTA，但成为理解深度学习的基础：softmax分类器=多分类LR；神经网络最后一层=线性分类器；对比损失(Contrastive Loss)和三元组损失(Triplet Loss)本质上就是Hinge Loss的变体。",key_takeaway:"SVM统治了90年代，深度网络接管了10年代——但LR作为理解一切分类器的'通用语言'，地位从未动摇。"},
{module_id:"application",module_title:"实践应用",module_tag:"实践应用",hook:"从垃圾邮件过滤到癌症诊断，从信用卡欺诈到情感分析——分类模型是ML应用场景最多的模型家族。",content:"**1. 垃圾邮件检测**\n经典的二分类问题。LR适用于：特征以词频/TF-IDF为主且稀疏（高维稀疏天然在线性可分附近），训练快且易于解释（'这个词使邮件被判定为垃圾邮件的概率增加了X%'）。\n\n**2. 医疗诊断**\nSVM在医学影像分析中曾广泛使用。癌症检测中：特征少（数十个生物标记物）、样本少（数百例）→SVM的小样本泛化能力突出。LR更适用于需要输出病风险概率的场景。\n\n**3. 信用评分**\n监管要求模型决策可解释→LR是标准选择。每个特征对信用分的贡献可以精确量化为log-odds，满足'不利行动通知'的法规要求。\n\n**4. 文本分类/情感分析**\nLR在文本分类中表现始终出色——高维稀疏的文本特征天然接近线性可分。fastText本质上就是带n-gram特征的线性分类器，训练速度惊人（10亿词/分钟）。",key_takeaway:"高维稀疏场景用LR（文本分类），小样本场景用SVM（医学诊断），需要概率的场景用LR（信用评分），需要解释性的场景用LR（监管合规）。"},{module_id:"case-study",module_title:"实战案例：Titanic生存预测",module_tag:"实践应用",hook:"Kaggle的入门级竞赛，也是最经典的二分类教学案例——用逻辑回归预测泰坦尼克号上谁能活下来。",content:"**问题**：根据乘客特征（性别、年龄、舱位、票价等）预测其是否幸存。\n\n**探索性分析**：\n- 性别与生存率强相关：女性存活率74%，男性仅19%（'妇女儿童优先'）。\n- 舱位(Pclass)梯度明显：1等舱存活63%，3等舱仅24%。\n- 缺失值处理：年龄用中位数填充，登船港口(Embarked)用众数填充。\n\n**特征工程**：\n- 家庭规模 = SibSp + Parch + 1\n- IsAlone = (家庭规模==1)\n- 头衔提取（Mr/Mrs/Miss/Master→影响生存率）\n\n**建模与评估**：\n- LR基准：准确率79.4%，ROC-AUC=0.84\n- 加入多项式特征后RBF-SVM：准确率81.2%，但训练时间是LR的15倍\n- 最终选择LR——更高的可解释性+更快的推断速度，准确率差距仅1.8%\n\n**关键发现**：特征工程（而非模型复杂度）贡献了R²提升的80%以上。一个精心特征工程的LR，轻松超越一个粗糙特征的SVM。",key_takeaway:"模型选择不是'哪个模型更强大'，而是'哪个模型在给定数据和约束下性价比最高'——Titanic案例中，LR以1.8%的准确率差距换来15倍的速度提升和可解释性，完胜。"},
{module_id:"risk",module_title:"潜在陷阱",module_tag:"风险与挑战",hook:"类别不平衡可能是分类模型中最被低估的问题——当正样本只有1%时，一个'全预测负类'的模型准确率也能达到99%。",content:"**陷阱1：类别不平衡**\n准确率陷阱：欺诈检测中，如果欺诈率=1%，永远预测'非欺诈'=99%准确率→但模型完全无用。解决方案：重采样(SMOTE)、类别权重调整($w_+=\\frac{n_{total}}{2\\cdot n_+}$)、使用Precision-Recall而非Accuracy。\n\n**陷阱2：完全分离问题**\n当训练数据中被完美分离时，LR的MLE不存在（w→∞）。这是'好问题'产生的'坏后果'。解决方案：加L2正则化（等效于贝叶斯先验）、或使用Firth's惩罚。\n\n**陷阱3：SVM参数敏感度**\n- C（惩罚参数）：C太小→欠拟合；C太大→过拟合，对噪声样本过度敏感。\n- γ（RBF核宽度）：γ太小→过于平滑（欠拟合）；γ太大→每个点都成为支持向量（过拟合）。\n- 经验法则：先用线性SVM（无γ烦恼），不满足再用RBF并通过对数网格搜索$C\\in[10^{-3},10^3],\\gamma\\in[10^{-3},10^3]$。\n\n**陷阱4：特征尺度对SVM的影响**\nSVM的margin计算依赖距离→特征未标准化时，大方差特征主导margin→决策边界被歪曲。与决策树不同，**SVM和LR都需要标准化！**",key_takeaway:"类别不平衡+完全分离+参数敏感+尺度敏感——分类模型的四大陷阱，每一个都可能在你不经意间废掉一个看似优秀的模型。"},
{module_id:"ethics",module_title:"公平性与伦理",module_tag:"风险与挑战",hook:"COMPAS算法对黑人被告的误判率是白人的两倍——这个争议让整个ML社区重新审视分类模型的公平性问题。",content:"**COMPAS案例回顾**\n2016年，ProPublica调查发现：用于评估再犯风险的COMPAS算法（一个带正则化的LR模型）对黑人被告的假阳性率（误判为高风险）是白人的两倍（45% vs 23%）。而Equivant公司回击：模型的AUC和校准度在不同种族间一致。\n\n**公平性的三种定义（它们互不兼容！）**：\n1. **Demographic Parity**：$P(\\hat{Y}=1|A=a)=P(\\hat{Y}=1|A=b)$——各群体被预测为正类的概率相等\n2. **Equalized Odds**：各群体的假阳性率和假阴性率相等——这正是COMPAS违反的\n3. **Calibration**：${P(Y=1|\\hat{Y}=s,A=a)=P(Y=1|\\hat{Y}=s,A=b)}$——同等分数代表同等风险\n\n**不可能三角**：除特殊情况外，这三者不能同时满足。模型设计者需要明确：在你的场景中，哪种公平最重要？\n\n**实践建议**：训练时加入敏感属性的L1惩罚（迫使系数→0）不能解决代理变量问题（如邮编代理种族）。更有效的方案包括：对每个子群体分别评估和校准；在损失函数中加入公平性约束。",key_takeaway:"分类模型的'准确'不等于'公平'——COMPAS的AUC在不同种族间相同，却产生了不同的假阳性率。公平性不是一个技术指标，而是一个需要领域专家、伦理学家和ML工程师共同参与的设计问题。"},
{module_id:"landscape",module_title:"发展格局",module_tag:"发展演进",hook:"在深度学习时代，'传统'分类模型还有价值吗？答案是：在大多数表格数据场景中，它们依然是王者。",content:"**学术界**：SVM的研究已从前沿转向成熟工具。当前热点集中在：\n- **可解释分类**：如何让分类决策透明化（如LIME/SHAP对分类器的局部解释）\n- **稳健分类**：对抗样本下的分类器鲁棒性（SVM的margin天然提供某种鲁棒性）\n- **在线分类**：数据流场景下的增量分类器更新\n\n**工业界使用现状**（根据Kaggle 2023调查）：\n- 表格数据竞赛：LR+集成树占据前5方案中的4席\n- 文本分类：LR+TF-IDF仍是工业界最快的baseline，fastText每天处理数十亿次推理\n- 推荐系统：LR是业界使用最广的CTR预估基础模型\n\n**模型选择速查**：\n| 场景 | 首选 | 原因 |\n|------|------|------|\n| 高维稀疏(文本) | LR | 天然线性可分+速度 |\n| 小样本+非线性 | RBF-SVM | 小样本泛化能力 |\n| 需要概率输出 | LR | 原生校准 |\n| 需要可解释性 | LR | 系数=log-odds |\n| 大规模(>1M样本) | 线性SVM(SGD) | 训练速度快 |",key_takeaway:"在表格数据上，LR和SVM依然是你工具箱中最锋利的刀——深度学习更像是一把瑞士军刀，功能多但未必每件事都做得最好。"},
{module_id:"issues",module_title:"当前挑战",module_tag:"风险与挑战",hook:"多分类、不平衡学习、增量更新——这些看似'基础'的问题，至今没有完美的解决方案。",content:"**挑战1：多分类的策略选择**\nOvR（逻辑上不一致——两个分类器可能都说'这个样本是我的'）、OvO（分类器数量$O(K^2)$→K较大时效率低）、Softmax（假设各类独立，不适合有序分类）。实践中：K<10用Softmax；K≈100用OvR（scikit-learn的默认行为）；图像分类用Softmax。\n\n**挑战2：极端不平衡下的学习**\n当正负比=1:10000时，即使是加权损失函数也可能失效。当前最优实践：ensemble of undersampling——训练100个模型，每个在全部正样本+随机抽取的等量负样本上训练，最终投票。\n\n**挑战3：在线/增量学习**\n真实场景中数据不断产生（如金融交易流水），需要LR/SVM支持增量更新。SGD基的LR天然支持，但SVM的支持向量集需要动态维护——当新的支持向量出现时，旧的需要被淘汰，在线SVM（LASVM等）能处理但精度有损失。\n\n**挑战4：解释与可靠的矛盾**\nLR的系数解释（'x增加1单位，log-odds增加β'）依赖'其他变量不变'的假设——但在观测数据中这几乎永远不成立。因果推断框架下的分类器是当前的研究热点。",key_takeaway:"OvR vs OvO vs Softmax、极端不平衡、在线学习、因果分类——这些'经典'问题告诉我们：分类模型远未'完结'。"},
{module_id:"prospect",module_title:"发展前景",module_tag:"前沿探索",hook:"分类模型的未来，不是要取代深度学习，而是要让深度学习'更像'分类模型——更可解释、更校准、更稳健。",content:"**1. 深度核学习**\n将核方法的数学优雅性与深度网络的特征学习能力结合。Deep Kernel Learning用神经网络学习核函数——既有核方法的理论保证（RKHS框架），又有深度网络的表达能力。\n\n**2. 校准的深度学习**\n深度网络输出常常是overconfident的（softmax分数接近1但实际准确率低）。温度缩放(Temperature Scaling)、Platt Scaling在深度网络中的应用，让深度分类器也能输出可靠的概率。\n\n**3. 一致分类(Conformal Classification)**\nConformal Prediction提供分布无关的预测集合，保证覆盖率（如'真实类别在预测集合中的概率≥95%'）。这比单点预测+概率输出更可靠，尤其在安全关键应用中。\n\n**4. 可微分决策树与分类器融合**\n将决策树的离散分裂操作变为可微操作→嵌入神经网络→端到端训练。这种'软决策树'兼顾了树的可解释性和网络的表达能力。",key_takeaway:"LR和SVM的未来不在于自己变得更强——而在于成为'深度学习可解释性的语言'：当我们想理解一个神经网络为什么做出某个分类决定时，我们用一个局部的LR去近似它。"},
{module_id:"effort-direction",module_title:"学习建议",module_tag:"前沿探索",hook:"从推导交叉熵的梯度到调通一个SVM核参数——给你一个7天的实操路线。",content:"**Day 1-3: 从零实现**\n- 用NumPy实现逻辑回归（不使用sklearn）：前向传播→计算交叉熵损失→梯度下降更新参数。核心代码只需30行。\n- 推导交叉熵的梯度：$\\frac{\\partial L}{\\partial w} = \\frac{1}{n}X^T(\\hat{y}-y)$——惊人地简洁！\n- 在人工数据上可视化决策边界：生成2D二分类数据，肉眼观察不同迭代次数下边界如何移动。\n\n**Day 4-5: SVM实战**\n- 用scikit-learn在iris/mnist上对比线性SVM和RBF-SVM\n- 理解C和γ的含义：在2D数据上可视化超参数对决策边界的影响\n- 阅读经典：Cortes & Vapnik(1995)原始论文\n\n**Day 6-7: 综合实战**\n- Kaggle Titanic：LR baseline → 特征工程 → 超参数调优 → 模型对比\n- 核心练习：实现OvR多分类包装器——在MNIST上用10个二分类LR做字符识别\n- 进阶：阅读liblinear源码中的坐标下降求解（coordinate descent for LR）",key_takeaway:"LR和SVM的理论之美，只有在亲手实现梯度更新和亲眼看到决策边界时才能真正体会——别只读，写代码。"},
{module_id:"misconceptions",module_title:"常见误区",module_tag:"风险与挑战",hook:"这些关于分类模型的误解，从面试到生产环境，每天都在坑人。",content:"**误区1：'逻辑回归是回归不是分类'**\n名中带'回归'，但它是不折不扣的分类模型。LR输出概率，通过阈值转换为类别——它就是为分类而生的。名字是历史遗留问题。\n\n**误区2：'SVM总是比LR好'**\n在小样本+非线性+好特征时，SVM确实可能更好。但在高维稀疏（文本）、大数据量场景，LR+正则化常常不输甚至超越SVM，且训练速度快一个数量级。\n\n**误区3：'准确率是唯一的评价指标'**\n当数据不平衡时，准确率完全失去意义。正确姿势：同时报告Precision/Recall/F1-Score/ROC-AUC，并根据业务场景选择最关键的指标（如癌症筛查→宁可假阳性多也不能假阴性少→Recall优先）。\n\n**误区4：'SVM不需要特征缩放'**\n大错特错！SVM的margin以距离为基础，特征不标准化→scale大的特征主导所有。记住：LR和SVM都必须在标准化后使用。\n\n**误区5：'核函数可以'无脑'选RBF'**\nRBF是最通用的核，但在特征数>>样本数时（如文本），线性核通常足够且更快。经验法则：先试线性，不行再试RBF。",key_takeaway:"LR不是回归，SVM不是万能，准确率不是唯一指标，特征缩放不是可选项，RBF不是无脑选择——五个误区，五个教训。"},
{module_id:"learning-path",module_title:"推荐资源",module_tag:"实践应用",content:"**入门**：\n- 📖 《统计学习方法》(李航) 第6章（逻辑回归+最大熵模型）、第7章（SVM）\n- 📖 ISLR 第4章（分类）、第9章（SVM）\n- 📺 StatQuest — Logistic Regression和SVM的动画讲解\n\n**进阶**：\n- 📖 ESL 第4章（线性分类方法）、第12章（SVM与灵活判别分析）\n- 📄 Cortes & Vapnik (1995) \"Support-Vector Networks\" — 引用超70000次的原始论文\n- 📄 Fan et al. (2008) \"LIBLINEAR: A Library for Large Linear Classification\"\n\n**专家**：\n- 📖 Scholkopf & Smola (2002) \"Learning with Kernels\" — 核方法的'圣经'\n- 📖 Bishop PRML 第4章（线性分类模型）、第7章（SVM与核方法）\n- 📄 Bottou (2010) \"Large-Scale Machine Learning with SGD\" — 理解为什么SGD让LR统治工业界",references:[{title:"Support-Vector Networks",authors:"Cortes, C. & Vapnik, V.",year:1995},{title:"LIBLINEAR: A Library for Large Linear Classification",authors:"Fan, R.E., Chang, K.W., Hsieh, C.J., et al.",year:2008},{title:"The Elements of Statistical Learning, Chapters 4 & 12",authors:"Hastie, T., Tibshirani, R. & Friedman, J.",year:2009}],key_takeaway:"李航的SVM章节可能是中文ML学习资料中写得最清晰的数学推导之一——读3遍，每次都有新收获。"},
{module_id:"debate",module_title:"争议与讨论",module_tag:"前沿探索",content:"**LR vs SVM：概率vs几何**\nLR的输出天然是概率（理论保证→真实后验的MLE），可直接用于风险评分/排序/决策阈值调整。SVM需要额外校准步骤（Platt Scaling用sigmoid拟合SVM输出→概率），且校准可能失效。但SVM在小样本、非线性场景的理论保证更好。\n\n**生成式vs判别式：LDA vs LR**\nLDA（生成式）先建模P(X|Y)再推P(Y|X)，LR（判别式）直接建模P(Y|X)。Vapnik的原则：'不要解决比你需要的更难的问题'→判别式通常更好。但当数据确实接近高斯分布+样本少时，LDA的生成式假设带来更好的泛化。\n\n**核函数选择的艺术**\n- 线性核 = 特征工程后用线性SVM（'手动核'策略）\n- RBF核 = 让算法自己学特征变换（'自动核'策略）\n- 深度学习 = 学一个更好的$\\phi(x)$再用线性分类器（'学习的核'策略）\n\n这三种策略构成一个连续的谱系，选择取决于数据量、特征工程资源和计算预算。",key_takeaway:"LR vs SVM没有全局胜者——它们的差异不是'谁更强'，而是'在什么条件下、对什么目标更合适'。"},
{module_id:"glossary",module_title:"关键术语速查",module_tag:"核心概念",content:"**Sigmoid函数**：$\\sigma(z)=1/(1+e^{-z})$，将实数映射到(0,1)。\n**Log-odds**：对数几率，$\\log(p/(1-p))=w^Tx$，LR的线性部分。\n**交叉熵**：$-\\sum y\\log\\hat{y}+(1-y)\\log(1-\\hat{y})$，LR的损失函数。\n**Hinge Loss**：$\\max(0,1-y\\hat{y})$，SVM的损失函数。\n**支持向量**：离决策超平面最近的训练样本，仅它们决定SVM模型。\n**软间隔**：允许部分分类错误，参数C控制误差容忍度。\n**核函数**：$K(x_i,x_j)=\\phi(x_i)^T\\phi(x_j)$，无需显式计算高维映射。\n**RBF核**：$\\exp(-\\gamma\\|x_i-x_j\\|^2)$，最通用的核函数。\n**C参数**：SVM的惩罚参数，C越大对误分类惩罚越重→可能过拟合。\n**γ参数**：RBF核的宽度参数，γ越大每个支持向量影响范围越小。\n**Platt Scaling**：用sigmoid(A·f(x)+B)拟合SVM输出→概率。\n**OvR/OvO**：将二分类器扩展为多分类的策略。\n**Softmax**：$\\frac{e^{z_k}}{\\sum_j e^{z_j}}$，多分类LR的最终输出层。",key_takeaway:"掌握这些术语，你就能听懂任何关于分类模型的学术讨论和工程评审。"}]};

function applyTheme(theme){document.documentElement.setAttribute('data-theme',theme);localStorage.setItem('slm-theme',theme);updateThemeIcon();Object.values(activeCharts).forEach(function(c){c.setOption(createThemedOption(c.getOption()),{notMerge:false})})}
function toggleTheme(){var c=document.documentElement.getAttribute('data-theme')||'light';applyTheme(c==='dark'?'light':'dark')}
function updateThemeIcon(){document.getElementById('theme-toggle').textContent=document.documentElement.getAttribute('data-theme')==='dark'?'☀️':'🌓'}
var activeCharts={},sidebarLinks=[];var savedTheme=localStorage.getItem('slm-theme')||'dark';applyTheme(savedTheme);
window.addEventListener('scroll',function(){var s=window.scrollY,d=document.documentElement.scrollHeight-window.innerHeight,p=d>0?(s/d)*100:0;document.getElementById('progress-bar').style.width=p+'%'});
function buildSidebar(){var c=document.getElementById('sidebar-links');sidebarLinks=[];PAGE_DATA.modules.forEach(function(m){var a=document.createElement('a');a.href='#'+m.module_id;a.className='sidebar-link';a.textContent=m.module_title||m.module_id;a.addEventListener('click',function(e){e.preventDefault();document.getElementById(m.module_id).scrollIntoView({behavior:'smooth'})});c.appendChild(a);sidebarLinks.push({el:a,id:m.module_id})})}
var observer=new IntersectionObserver(function(e){e.forEach(function(en){if(en.isIntersecting)sidebarLinks.forEach(function(l){l.el.classList.toggle('active',l.id===en.target.id)})})},{rootMargin:'-80px 0px -60% 0px'});
function buildMetaCard(){var m=PAGE_DATA;document.getElementById('meta-card-container').innerHTML='<div class="meta-card"><div style="width:100%"><span class="meta-badge domain-ai" style="margin-right:8px">🔗 📚 机器学习及其统计基础与大模型 系统学习方案 · 经典机器学习（2/5）</span></div><div class="meta-item"><span class="icon">📖</span><strong>'+m.topic+'</strong></div><div class="meta-item"><span class="meta-badge domain-ai">'+m.domain_name+'</span></div><div class="meta-item"><span class="meta-badge level-intermediate">'+m.level_name+'</span></div><div class="meta-item"><span class="icon">⏱️</span>约'+m.reading_time+'分钟阅读</div><div class="meta-item"><span class="icon">📦</span>'+m.module_count+'个模块</div></div>'}
function renderFormulas(c){if(typeof renderMathInElement!=='undefined')renderMathInElement(c,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})}
function createThemedOption(o){var d=document.documentElement.getAttribute('data-theme')==='dark';return{color:d?['#818cf8','#a78bfa','#c4b5fd','#67e8f9','#fbbf24','#34d399','#f87171','#f472b6']:['#6366f1','#8b5cf6','#a78bfa','#22d3ee','#f59e0b','#10b981','#ef4444','#ec4899']}}
function renderChart(mid,cfg,i){var id='chart_'+mid+'_'+i,w=document.getElementById(id);if(!w)return;if(typeof echarts==='undefined'){w.innerHTML='<div style="text-align:center;padding:20px;color:var(--text-tertiary);font-size:13px;">📊 图表(静态模式)<br><small>加载CDN后可交互</small></div>';return}try{var c=echarts.init(w);c.setOption(cfg.echarts_option||{});activeCharts[id]=c;new ResizeObserver(function(){c.resize()}).observe(w)}catch(e){w.textContent='图表渲染失败: '+e.message}}
function buildModuleHTML(mod){var tc=(function(t){var m={'核心概念':'tag-core','前置知识':'tag-core','核心工具':'tag-tools','发展演进':'tag-evolution','实践应用':'tag-application','风险与挑战':'tag-risk','前沿探索':'tag-frontier'};return m[t]||'tag-core'})(mod.module_tag||'');var h='<section class="module-section" id="'+mod.module_id+'"><div class="module-header"><span class="module-tag '+tc+'">'+(mod.module_tag||'')+'</span><h2 class="module-title">'+(mod.module_title||mod.module_id)+'</h2></div>';if(mod.hook)h+='<div class="module-hook">'+mod.hook+'</div>';if(mod.content){var c=mod.content;c=c.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');c=c.replace(/`([^`]+)`/g,'<code style="background:var(--bg-tertiary);padding:2px 6px;border-radius:4px;font-size:13px;">$1</code>');c=c.replace(/\n\n/g,'</p><p>');c='<p>'+c+'</p>';h+='<div class="module-content">'+c+'</div>'}if(mod.formulas)mod.formulas.forEach(function(f){h+='<div class="formula-block" onclick="if(this.querySelector(\'.formula-derivation\'))this.classList.toggle(\'expanded\')"><div>'+f.latex+'</div>'+(f.caption?'<div class="formula-caption">'+f.caption+'</div>':'')+(f.expandable&&f.derivation?'<div class="formula-expand-hint">💡 点击展开推导过程</div><div class="formula-derivation">'+f.derivation+'</div>':'')+'</div>'});if(mod.charts)mod.charts.forEach(function(c,i){h+='<div class="chart-container"><div class="chart-wrapper" id="chart_'+mod.module_id+'_'+i+'"></div>'+(c.caption?'<div class="chart-caption">'+c.caption+'</div>':'')+'</div>'});if(mod.tables)mod.tables.forEach(function(t){h+='<table class="module-table"><thead><tr>'+t.headers.map(function(h){return'<th>'+h+'</th>'}).join('')+'</tr></thead><tbody>'+t.rows.map(function(r){return'<tr>'+r.map(function(c){return'<td>'+c+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table>'+(t.caption?'<div class="table-caption" style="font-size:12px;color:var(--text-tertiary);text-align:center;margin-top:8px">'+t.caption+'</div>':'')});if(mod.references)h+='<div class="module-references"><h4>📚 参考文献</h4><ol>'+mod.references.map(function(r){return'<li>'+(r.authors||'')+' ('+(r.year||'')+'). <strong>'+(r.title||'')+'</strong>.'+(r.url?' <a href="'+r.url+'" target="_blank" style="color:var(--primary)">链接</a>':'')+'</li>'}).join('')+'</ol></div>';if(mod.key_takeaway)h+='<div class="key-takeaway">💡 '+mod.key_takeaway+'</div>';h+='</section>';return h}
function initPage(){document.body.classList.remove('loading');document.body.classList.add('loaded');buildMetaCard();buildSidebar();var mc=document.getElementById('modules-container');PAGE_DATA.modules.forEach(function(mod){mc.innerHTML+=buildModuleHTML(mod)});var sec=mc.querySelectorAll('.module-section');sec.forEach(function(s){observer.observe(s)});renderFormulas(mc);setTimeout(function(){PAGE_DATA.modules.forEach(function(mod){if(mod.charts)mod.charts.forEach(function(c,i){renderChart(mod.module_id,c,i)})})},100);var fObs=new IntersectionObserver(function(e){e.forEach(function(en){if(en.isIntersecting)en.target.classList.add('visible')})},{threshold:0.08});sec.forEach(function(s){fObs.observe(s)})}
document.addEventListener('DOMContentLoaded',initPage);
function exportNotes(){var l=['# '+PAGE_DATA.topic+' - 学习笔记','','生成日期: '+new Date().toLocaleDateString('zh-CN'),''];PAGE_DATA.modules.forEach(function(m){l.push('- **'+(m.module_title||m.module_id)+'**: '+(m.key_takeaway||m.hook||''))});if(navigator.clipboard)navigator.clipboard.writeText(l.join('\n')).then(function(){alert('✅ 学习笔记已复制到剪贴板!')});else alert('复制失败，请手动选择复制')}
(function(){var cv=document.getElementById('bg-canvas'),ctx=cv.getContext('2d'),particles=[];function rsz(){cv.width=window.innerWidth;cv.height=window.innerHeight}window.addEventListener('resize',rsz);rsz();var count=Math.min(60,Math.floor((cv.width*cv.height)/20000));for(var i=0;i<count;i++)particles.push({x:Math.random()*cv.width,y:Math.random()*cv.height,vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,r:Math.random()*1.5+0.3,a:Math.random()*0.3+0.05});function animate(){ctx.clearRect(0,0,cv.width,cv.height);var isDark=document.documentElement.getAttribute('data-theme')!=='light',c=isDark?'129,140,248':'99,102,241';particles.forEach(function(p){p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=cv.width;if(p.x>cv.width)p.x=0;if(p.y<0)p.y=cv.height;if(p.y>cv.height)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fillStyle='rgba('+c+','+p.a+')';ctx.fill()});for(var j=0;j<particles.length;j++)for(var k=j+1;k<particles.length;k++){var dx=particles[j].x-particles[k].x,dy=particles[j].y-particles[k].y,d=Math.sqrt(dx*dx+dy*dy);if(d<110){ctx.beginPath();ctx.moveTo(particles[j].x,particles[j].y);ctx.lineTo(particles[k].x,particles[k].y);ctx.strokeStyle='rgba('+c+','+(0.06*(1-d/110))+')';ctx.lineWidth=0.5;ctx.stroke()}}requestAnimationFrame(animate)}animate()})();
</script>
