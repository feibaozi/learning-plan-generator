<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>识茶·喝茶·品茶 系统学习方案</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
/* ───────────────────────────────────────────────
   Template: Cedar Dawn (雪松晨曦) — plan.css
   Mood: warm, natural, organic
   Contrast verified: text-primary≥10:1, text-secondary≥6:1, text-muted≥4.5:1
   Light mode uses cool-toned text on warm background for hue separation
   ─────────────────────────────────────────────── */
:root{
--bg-deep:#1a1814;
--bg-primary:#211f1a;
--bg-card:#282520;
--bg-elevated:#312d27;
--bg-input:#26231e;
--text-primary:#ede6d8;
--text-secondary:#b8ad98;
--text-muted:#8a8070;
--accent-blue:#5ea87a;
--accent-cyan:#7ec8a0;
--accent-purple:#b898a0;
--accent-green:#6ebf8a;
--accent-orange:#d4984a;
--accent-pink:#d49898;
--accent-red:#d47860;
--accent-gold:#e6b95a;
--border-subtle:rgba(255,255,255,0.05);
--border-glow:rgba(94,168,122,0.25);
--shadow-sm:0 1px 3px rgba(0,0,0,0.3);
--shadow-md:0 4px 12px rgba(0,0,0,0.4);
--radius-sm:6px;
--radius-md:10px;
--radius-lg:16px;
--transition-fast:0.15s ease;
--transition-smooth:0.3s ease;
}
body.light{
--bg-deep:#fdfaf3;
--bg-primary:#fffdf7;
--bg-card:#faf7ed;
--bg-elevated:#f3efe3;
--bg-input:#ebe5d6;
--text-primary:#1f1a12;
--text-secondary:#4a4035;
--text-muted:#5c5042;
--accent-blue:#3d6b50;
--accent-cyan:#4a8e6a;
--accent-purple:#7a5a6a;
--accent-green:#4a9e66;
--accent-orange:#a06528;
--accent-pink:#a06068;
--accent-red:#b05038;
--accent-gold:#a07828;
--border-subtle:rgba(31,26,18,0.08);
--border-glow:rgba(61,107,80,0.25);
--shadow-sm:0 1px 3px rgba(0,0,0,0.06);
--shadow-md:0 4px 12px rgba(0,0,0,0.08);
}
body.light .knowledge-card.expanded{border-color:rgba(74,158,102,0.5)}
body.dark .knowledge-card.expanded{border-color:rgba(110,191,138,0.5);background:var(--bg-elevated)}
.graph-container{width:100%;height:420px;margin-top:8px}
.graph-toolbar{display:flex;justify-content:flex-end;margin-bottom:8px;flex-wrap:wrap;gap:8px}
.graph-legend{display:flex;gap:14px;font-size:.68rem;color:var(--text-muted);flex-wrap:wrap}
.gl-item{display:flex;align-items:center;gap:4px}
.gl-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.gl-line-prereq{color:var(--accent-blue)}
.gl-line-related{color:var(--text-muted)}
.method-step{cursor:pointer;transition:all var(--transition-smooth)}
.method-step:hover{border-color:var(--border-glow);transform:translateX(4px)}
.method-step.done .method-step-num{background:var(--accent-green)}
.method-step.done .method-step-num::after{content:' \2713';font-size:.7rem}
.method-step-example{margin-top:10px;padding:10px;background:var(--bg-elevated);border-radius:var(--radius-sm);overflow-x:auto;font-size:.7rem;color:var(--text-muted)}
.method-step-link{display:inline-block;margin-top:8px;font-size:.7rem;color:var(--accent-cyan);cursor:pointer;font-weight:600}
.method-step-link:hover{text-decoration:underline}
.method-progress{text-align:right;margin-top:16px;font-size:.72rem;color:var(--text-muted)}
.gallery-toolbar{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.gallery-filter{padding:4px 14px;border-radius:50px;font-size:.68rem;cursor:pointer;font-weight:600;border:1px solid var(--border-subtle);color:var(--text-secondary);background:var(--bg-elevated);font-family:inherit;transition:all var(--transition-fast)}
.gallery-filter:hover{color:var(--accent-cyan);border-color:var(--border-glow)}
.gallery-filter.active{background:rgba(94,168,122,.12);color:var(--accent-cyan);border-color:var(--accent-cyan)}
.drawing-card{cursor:pointer;position:relative;overflow:hidden}
.drawing-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.drawing-card .drawing-type{font-size:.6rem;font-weight:700;padding:2px 8px;border-radius:50px;display:inline-block;margin-bottom:8px}
.drawing-card .drawing-preview{width:100%;height:160px;background:var(--bg-elevated);border-radius:var(--radius-sm);margin-bottom:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.drawing-card .drawing-preview svg{max-width:100%;max-height:140px}
.drawing-card .drawing-detail-link{font-size:.65rem;color:var(--accent-cyan);cursor:pointer;font-weight:600}
.gallery-lightbox{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);align-items:center;justify-content:center}
.gallery-lightbox.open{display:flex}
.lightbox-content{max-width:90vw;max-height:90vh;position:relative}
.lightbox-close{position:absolute;top:-40px;right:0;background:none;border:none;color:#fff;font-size:1.5rem;cursor:pointer}
.lightbox-image{background:var(--bg-card);border-radius:var(--radius-md);padding:24px;overflow:auto}
.lightbox-image svg{max-width:100%;height:auto}
.lightbox-info{margin-top:12px;text-align:center;color:var(--text-secondary);font-size:.8rem}
@media(max-width:768px){.graph-container{height:320px}}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Noto Sans SC',-apple-system,sans-serif;background:var(--bg-deep);color:var(--text-primary);line-height:1.6;overflow-x:hidden}
body.loading{opacity:0}body.loaded{opacity:1;transition:opacity 0.4s ease}
.container{max-width:1200px;margin:0 auto;padding:0 24px}

.hero{text-align:center;padding:80px 0 60px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:radial-gradient(ellipse at 50% 0%,#5ea87a 0%,transparent 50%),radial-gradient(ellipse at 80% 50%,#d4984a 0%,transparent 40%);
  opacity:0.15;z-index:0}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:2.6rem;font-weight:900;letter-spacing:-0.02em;margin-bottom:16px;background:linear-gradient(135deg,#5ea87a,#d4984a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{font-size:1.05rem;color:var(--text-secondary);max-width:700px;margin:0 auto 32px}
.hero-stats{display:flex;gap:24px;justify-content:center;flex-wrap:wrap}
.hero-stat{background:var(--bg-elevated);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:16px 28px;text-align:center;min-width:100px}
.hero-stat .num{font-size:2rem;font-weight:800;color:var(--accent-blue)}
.hero-stat .lbl{font-size:0.75rem;color:var(--text-muted);margin-top:4px}

.topbar{position:sticky;top:0;z-index:100;background:rgba(5,10,16,0.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border-subtle);padding:10px 0}
.topbar .container{display:flex;gap:12px;align-items:center;overflow-x:auto}
.topbar a{color:var(--text-secondary);text-decoration:none;font-size:0.78rem;font-weight:600;padding:6px 14px;border-radius:50px;transition:all var(--transition-fast);white-space:nowrap}
.topbar a:hover{color:var(--accent-cyan);background:rgba(56,189,248,0.08)}
.topbar .theme-toggle,.topbar .search-toggle{background:var(--bg-elevated);border:1px solid var(--border-subtle);color:var(--text-secondary);font-size:0.78rem;padding:6px 14px;border-radius:50px;cursor:pointer;font-family:inherit;font-weight:600;transition:all var(--transition-fast)}
.topbar .theme-toggle:hover,.topbar .search-toggle:hover{color:var(--accent-cyan);border-color:var(--border-glow)}

.search-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px)}
.search-overlay.show{display:flex;align-items:flex-start;justify-content:center;padding-top:120px}
.search-box{background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--radius-md);padding:20px;width:90%;max-width:600px;box-shadow:0 16px 48px rgba(0,0,0,0.5)}
.search-box input{width:100%;background:var(--bg-input);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:12px 16px;color:var(--text-primary);font-size:0.95rem;font-family:inherit;outline:none}
.search-box input:focus{border-color:var(--accent-cyan)}
.search-results{margin-top:12px;max-height:300px;overflow-y:auto}
.search-result{padding:10px 14px;border-radius:var(--radius-sm);cursor:pointer;font-size:0.82rem;transition:background var(--transition-fast)}
.search-result:hover{background:rgba(56,189,248,0.08)}
.search-result .sr-title{font-weight:700;color:var(--accent-cyan)}
.search-result .sr-detail{color:var(--text-muted);font-size:0.72rem;margin-top:2px}

.section{padding:60px 0}
.section-title{font-size:1.5rem;font-weight:800;margin-bottom:28px;display:flex;align-items:center;gap:10px}

.phase-list{display:flex;flex-direction:column;gap:16px}
.phase-card{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);overflow:hidden;transition:all var(--transition-smooth)}
.phase-card:hover{border-color:var(--border-glow)}
.phase-card.open{border-color:var(--border-glow)}
.phase-header{padding:20px 24px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:background var(--transition-fast);user-select:none}
.phase-header:hover{background:rgba(96,165,250,0.03)}
.phase-icon{width:42px;height:42px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
.phase-info{flex:1}.phase-info h3{font-size:1.05rem;font-weight:700}.phase-info .phase-week{font-size:0.72rem;color:var(--text-muted);margin-top:2px}.phase-sub{font-size:0.72rem;padding:3px 10px;border-radius:50px;font-weight:600}
.phase-arrow{font-size:1.1rem;color:var(--text-muted);transition:transform var(--transition-smooth)}.phase-card.open .phase-arrow{transform:rotate(90deg)}
.phase-body{display:none;padding:0 24px 20px;border-top:1px solid var(--border-subtle)}
.phase-card.open .phase-body{display:block}
.phase-body-inner{padding-top:16px}
.phase-skills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.skill-chip{padding:3px 12px;background:var(--bg-elevated);border:1px solid var(--border-subtle);border-radius:50px;font-size:0.72rem;color:var(--text-secondary)}
.phase-desc{font-size:0.82rem;color:var(--text-muted);margin-bottom:12px;line-height:1.7}
.phase-codes{margin-top:8px}.phase-codes pre{background:rgba(0,0,0,0.3);border-radius:var(--radius-sm);padding:12px 16px;overflow-x:auto;font-size:0.72rem;font-family:'JetBrains Mono',monospace;color:var(--accent-cyan)}
.footer{text-align:center;padding:40px 0;color:var(--text-muted);font-size:0.72rem;border-top:1px solid var(--border-subtle)}

.knowledge-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.knowledge-filters{display:flex;gap:6px;flex-wrap:wrap}
.knowledge-filter{background:var(--bg-elevated);border:1px solid var(--border-subtle);color:var(--text-secondary);padding:4px 14px;border-radius:50px;cursor:pointer;font-size:0.72rem;font-weight:600;font-family:inherit;transition:all var(--transition-fast)}
.knowledge-filter:hover{color:var(--accent-cyan);border-color:var(--border-glow)}
.knowledge-filter.active{background:rgba(56,189,248,0.12);color:var(--accent-cyan);border-color:var(--accent-cyan)}
.knowledge-count{font-size:0.68rem;color:var(--text-muted)}
.knowledge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
@media(max-width:768px){.knowledge-grid{grid-template-columns:1fr}}

.knowledge-card{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-md);overflow:hidden;cursor:default;transition:all var(--transition-smooth);position:relative}
.knowledge-card:hover{border-color:var(--border-glow);box-shadow:var(--shadow-sm)}
.knowledge-card.open{border-color:var(--border-glow)}
.knowledge-card.expanded{grid-column:1/-1;border-color:var(--accent-green);box-shadow:var(--shadow-md)}
.card-header{padding:14px 18px;cursor:pointer;display:flex;align-items:center;gap:10px;flex-wrap:wrap;transition:background var(--transition-fast);user-select:none}
.card-header:hover{background:rgba(124,92,231,0.03)}
.card-icon{font-size:1.1rem;flex-shrink:0}.card-title{font-weight:700;font-size:0.85rem;flex:1}
.math-tag{padding:2px 10px;border-radius:50px;font-size:0.6rem;font-weight:700;cursor:pointer;transition:all var(--transition-fast);color:#fff}
.math-tag:hover{opacity:0.8}

.card-back{display:none;font-size:0.65rem;color:var(--text-muted);cursor:pointer;padding:2px 8px;border-radius:50px;background:var(--bg-elevated)}
.knowledge-card.expanded .card-back,.knowledge-card.open .card-back{display:inline}
.card-detail{display:none;padding:0 18px 16px;font-size:0.82rem;color:var(--text-secondary);line-height:1.7}
.knowledge-card.open .card-detail,.knowledge-card.expanded .card-detail{display:block}
.card-detail p{margin-bottom:8px}
.card-formula{background:var(--bg-elevated);border:1px solid var(--border-glow);border-radius:var(--radius-sm);padding:14px 18px;margin-bottom:12px;font-size:0.95rem;text-align:center;color:var(--accent-blue);overflow-x:auto}
.card-sum{background:rgba(251,191,36,0.06);border-left:3px solid var(--accent-orange);padding:10px 14px;margin-bottom:10px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-size:0.78rem;color:var(--accent-orange)}
.card-related{margin-top:4px;margin-bottom:8px;padding:12px 14px;background:rgba(255,255,255,0.015);border:1px dashed var(--border-subtle);border-radius:var(--radius-sm)}
.cr-title{font-size:0.72rem;font-weight:700;color:var(--text-secondary);margin-bottom:8px}
.cr-links{display:flex;flex-wrap:wrap;gap:6px}
.cr-link{font-size:0.68rem;padding:4px 10px;border-radius:50px;border:1px solid var(--border-subtle);color:var(--accent-cyan);cursor:pointer;transition:all var(--transition-fast)}
.cr-link:hover{background:rgba(38,198,218,0.1);border-color:var(--accent-cyan)}
.skill-link{cursor:pointer;border-color:rgba(79,195,247,0.3);color:var(--accent-blue)}
.skill-link:hover{background:rgba(79,195,247,0.1);transform:translateY(-1px)}
.ks-expand-all{background:transparent;border:1px solid var(--border-subtle);color:var(--accent-cyan);padding:3px 10px;border-radius:50px;font-size:0.68rem;cursor:pointer;font-weight:600;transition:all var(--transition-fast);font-family:inherit;margin-left:8px}
.ks-expand-all:hover{border-color:var(--accent-cyan);background:rgba(38,198,218,0.08)}
@media(max-width:768px){.knowledge-card.expanded{grid-column:auto}}
.deep-dive-bar{padding:0 0 8px;text-align:right;display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.deep-dive-btn{background:linear-gradient(135deg,rgba(139,92,246,0.15),rgba(99,102,241,0.1));border:1px solid rgba(139,92,246,0.3);color:var(--accent-purple);padding:6px 16px;border-radius:50px;cursor:pointer;font-size:0.78rem;font-weight:600;font-family:inherit;transition:all var(--transition-smooth)}
.deep-dive-btn:hover{border-color:rgba(139,92,246,0.6);box-shadow:0 0 16px rgba(139,92,246,0.15);transform:translateY(-1px)}
.dd-ready .deep-dive-btn{background:rgba(16,185,129,0.1);border-color:rgba(16,185,129,0.3);color:var(--accent-green)}
.dd-hint{font-size:0.65rem;color:var(--text-muted);opacity:0.7}
.deep-dive-open-btn{background:rgba(16,185,129,0.15);border:1px solid rgba(16,185,129,0.3);color:var(--accent-green);border-radius:50px;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:0.75rem;font-weight:700;font-family:inherit;transition:all var(--transition-fast)}
.deep-dive-open-btn:hover{background:rgba(16,185,129,0.25)}
.dd-toast{animation:ddToastIn 0.3s ease}
@keyframes ddToastIn{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
.phase-dd-batch{padding-top:16px;border-top:1px solid var(--border-subtle);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.batch-deep-dive-btn{background:var(--bg-elevated);border:1px dashed var(--border-glow);color:var(--text-secondary);padding:8px 20px;border-radius:50px;cursor:pointer;font-size:0.82rem;font-weight:600;font-family:inherit;transition:all var(--transition-smooth)}
.batch-deep-dive-btn:hover{border-style:solid;border-color:rgba(139,92,246,0.5);color:var(--accent-purple)}

.method-steps{display:grid;gap:16px;max-width:800px}
.method-step{display:flex;gap:16px;align-items:flex-start}
.method-step-num{width:36px;height:36px;border-radius:50%;background:var(--accent-purple);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:0.9rem;flex-shrink:0}
.method-step-text h4{font-size:0.9rem;color:var(--text-primary);margin-bottom:4px}
.method-step-text p{font-size:0.78rem;color:var(--text-secondary);line-height:1.6}

.formula-tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.formula-tab{background:var(--bg-elevated);border:1px solid var(--border-subtle);color:var(--text-secondary);padding:6px 16px;border-radius:50px;cursor:pointer;font-size:0.72rem;font-weight:600;font-family:inherit;transition:all var(--transition-fast)}
.formula-tab:hover{color:var(--accent-cyan);border-color:var(--border-glow)}
.formula-tab.active{background:rgba(56,189,248,0.12);color:var(--accent-cyan);border-color:var(--accent-cyan)}
.formula-panel{display:none}
.formula-panel.active{display:block}
.formula-table{width:100%;border-collapse:collapse;font-size:0.78rem}
.formula-table th{text-align:left;padding:10px 14px;background:var(--bg-elevated);color:var(--accent-cyan);font-weight:700;border-bottom:2px solid var(--border-glow)}
.formula-table td{padding:9px 14px;border-bottom:1px solid var(--border-subtle);color:var(--text-secondary);font-family:'JetBrains Mono',monospace}

.exercise-filters{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.exercise-filter{padding:4px 14px;border-radius:50px;font-size:0.68rem;cursor:pointer;font-weight:600;border:1px solid var(--border-subtle);color:var(--text-secondary);background:var(--bg-elevated);font-family:inherit;transition:all var(--transition-fast)}
.exercise-filter:hover{color:var(--accent-cyan);border-color:var(--border-glow)}
.exercise-filter.active{background:rgba(56,189,248,0.12);color:var(--accent-cyan);border-color:var(--accent-cyan)}
.exercise-count{font-size:0.68rem;color:var(--text-muted);margin-bottom:12px}
.exercise-list{display:flex;flex-direction:column;gap:8px}
.exercise-item{display:flex;gap:12px;align-items:center;background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:12px 16px;transition:all var(--transition-fast)}
.exercise-item:hover{border-color:var(--border-glow)}
.exercise-num{font-size:0.7rem;color:var(--text-muted);font-family:'JetBrains Mono',monospace;min-width:28px}
.ei-content{flex:1}.ei-title{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.ei-title-text{font-size:0.84rem;font-weight:600}
.diff{padding:2px 8px;border-radius:50px;font-size:0.6rem;font-weight:700}
.diff.easy{background:rgba(16,185,129,0.1);color:var(--accent-green)}
.diff.medium{background:rgba(251,191,36,0.1);color:var(--accent-orange)}
.diff.hard{background:rgba(239,68,68,0.1);color:#ef4444}
.diff.project{background:rgba(139,92,246,0.1);color:var(--accent-purple)}
.ei-check{width:28px;height:28px;border-radius:50%;border:2px solid var(--border-subtle);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:0.75rem;transition:all var(--transition-fast);flex-shrink:0}
.ei-check:hover{border-color:var(--accent-green)}
.ei-check.done{background:var(--accent-green);border-color:var(--accent-green);color:#fff}

.resource-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.resource-item{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:16px 18px;transition:all var(--transition-fast)}
.resource-item:hover{border-color:var(--border-glow)}
.resource-item .ri-type{font-size:0.6rem;font-weight:700;padding:2px 8px;border-radius:50px;display:inline-block;margin-bottom:8px}
.ri-type.book{background:rgba(96,165,250,0.1);color:var(--accent-blue)}
.ri-type.paper{background:rgba(251,191,36,0.1);color:var(--accent-orange)}
.ri-type.site{background:rgba(16,185,129,0.1);color:var(--accent-green)}

function renderFormula(fk){
  if(typeof katex==='undefined')return;
  if(fk.querySelector('.katex'))return;
  var txt=fk.textContent.replace('💰 ','');
  if(!txt)return;
  try{katex.render(txt,fk,{throwOnError:false});}
  catch(e){fk.textContent='⚠ '+txt;}
}

function renderAllFormulas(){
  if(typeof katex==='undefined'){setTimeout(renderAllFormulas,300);return;}
  var all=document.querySelectorAll('.card-formula,.ft-formula');

    if(all[i].querySelector('.katex'))continue;

    if(!txt)continue;
    try{katex.render(txt,all[i],{throwOnError:false});}
    catch(e){all[i].textContent='⚠ '+txt;}

}

function tKCT(id){
  var el=document.getElementById('kc-'+id);
  if(!el)return;
  if(el.classList.contains('expanded')){collapseCard(el);return;}
  if(el.classList.contains('open')&&!el.classList.contains('expanded')){el.classList.remove('open');return;}
  var kp=KPS.find(function(x){return x.id===id;});
  if(!kp)return;
  var g=el.parentElement;
  el.classList.add('expanded');
  el.classList.add('open');

function encodeForContext(value){
  if(typeof value!=='string')value=String(value||'');
  return value.replace(/"/g,'\\"').replace(/;/g,'\\;').replace(/\[/g,'\\[').replace(/\]/g,'\\]');
}

function buildKPDeepDivePrompt(kp,ph,plan){
  var prereqList=(kp.prerequisites||[]).join(',');
  var nextKpList=(kp.next_kps||[]).join(',');
  var phIndex=PHASES.findIndex(function(x){return x.id===ph.id;})+1;
  var contextMarker='[context_plan: '+
    'plan_id="'+encodeForContext(plan.id)+'"; '+
    'plan_name="'+encodeForContext(plan.title)+'"; '+
    'plan_file="'+encodeForContext(plan.html_file)+'"; '+
    'template_id="'+encodeForContext(plan.template_id||'indigo-night')+'"; '+
    'phase_id="'+encodeForContext(ph.id)+'"; '+
    'phase_name="'+encodeForContext(ph.title)+'"; '+
    'phase_position="'+phIndex+'/'+PHASES.length+'"; '+
    'kp_id="'+encodeForContext(kp.id)+'"; '+
    'kp_name="'+encodeForContext(kp.n||kp.name)+'"; '+
    'prerequisites="'+encodeForContext(prereqList)+'"; '+
    'next_kps="'+encodeForContext(nextKpList)+'"'+
  ']\n\n';
  return contextMarker+'请为以下知识点生成 理解×标准 的深度研读资料：\n知识点：'+(kp.n||kp.name)+'\n（已在上方提供完整上下文信息）';
}

var DD_TOAST_TIMEOUT;
function ddTrigger(kpId){
  var kp=KPS.find(function(k){return k.id===kpId;});
  if(!kp)return;
  var ph=PHASES.find(function(p){return p.id===kp.p;});
  if(!ph)ph={id:kp.p,title:'未知阶段'};
  var promptText=typeof PLAN!=='undefined'?buildKPDeepDivePrompt(kp,ph,PLAN):
    '请为"'+(kp.n||kp.name)+'"生成 理解×标准 的深度研读资料';
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(promptText).then(function(){showDDToast('✅ 提示词已复制！粘贴到对话中生成深度资料',kp);})
    .catch(function(){fallbackCopy(promptText);showDDToast('✅ 提示词已复制！',kp);});
  }else{fallbackCopy(promptText);showDDToast('✅ 提示词已复制！',kp);}
}

function fallbackCopy(text){
  var ta=document.createElement('textarea');ta.value=text;
  document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
}

function showDDToast(msg,kp){
  var toastEl=document.getElementById('ddToast');
  var toastMsgEl=document.getElementById('ddToastMsg');
  if(!toastEl||!toastMsgEl)return;
  toastMsgEl.innerHTML=msg;
  if(kp&&kp.deep_dive&&kp.deep_dive.status==='ready'&&kp.deep_dive.html_file){
    toastMsgEl.innerHTML+='<br>📄 已有深度资料: <a href="#" onclick="event.preventDefault();ddOpen(\''+kp.id+'\')" style="color:var(--accent-color);text-decoration:underline;">点击打开</a>';
  }
  toastEl.style.display='block';
  if(DD_TOAST_TIMEOUT)clearTimeout(DD_TOAST_TIMEOUT);
  DD_TOAST_TIMEOUT=setTimeout(function(){toastEl.style.display='none';},4000);
}

function ddBatch(phaseId){
  var phaseKps=KPS.filter(function(k){return k.p===phaseId&&k.deep_dive;});
  if(phaseKps.length===0)return;
  var ph=PHASES.find(function(p){return p.id===phaseId;});
  if(!ph)ph={id:phaseId,title:'未知阶段'};
  var batchText='📦 批量生成深度资料 - '+(ph.title||phaseId)+'\n\n';
  phaseKps.forEach(function(kp){
    if(typeof PLAN!=='undefined'){batchText+=buildKPDeepDivePrompt(kp,ph,PLAN)+'\n\n---\n\n';}
    else{batchText+='请为"'+(kp.n||kp.name)+'"生成 理解×标准 的深度研读资料\n\n---\n\n';}
  });
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(batchText).then(function(){showDDToast('✅ '+phaseKps.length+' 个提示词已复制到剪贴板！');})
    .catch(function(){fallbackCopy(batchText);showDDToast('✅ '+phaseKps.length+' 个提示词已复制！');});
  }else{fallbackCopy(batchText);showDDToast('✅ '+phaseKps.length+' 个提示词已复制！');}
}

var _graphChart=null;
function initGraph(){
  var el=document.getElementById('graphContainer');
  if(!el||typeof GRAPH_DATA==='undefined'||typeof echarts==='undefined')return;
  if(_graphChart){_graphChart.dispose()}
  _graphChart=echarts.init(el);
  var nodes=[],links=[];
  for(var i=0;i<GRAPH_DATA.nodes.length;i++){
    var gn=GRAPH_DATA.nodes[i],kp=null;
    for(var j=0;j<KPS.length;j++){if(KPS[j].id===gn.id){kp=KPS[j];break}}
    if(!kp)continue;
    var pi=0;for(var k=0;k<PHASES.length;k++){if(PHASES[k].id===kp.p){pi=k;break}}
    var isReady=kp.deep_dive&&kp.deep_dive.status==='ready';
    nodes.push({name:gn.id,value:gn.label,x:pi*200+100+Math.random()*60,y:gn.y*120+80,
      symbolSize:14,itemStyle:{color:PHASES[pi].color,opacity:isReady?1:0.4},
      label:{show:true,formatter:gn.label,fontSize:10,color:'#b8ad98',position:'bottom'},
      tooltip:{formatter:gn.label+(kp.s?'<br/>'+kp.s:'')}});
  }
  for(var i=0;i<GRAPH_DATA.edges.length;i++){
    var e=GRAPH_DATA.edges[i];
    var ls={};
    if(e.type==='prerequisite'){ls={width:1.5,type:'solid',color:'rgba(99,102,241,0.6)'}}
    else if(e.type==='related'){ls={width:1,type:'dashed',color:'rgba(99,102,241,0.25)'}}
    else{ls={width:0.8,type:'dashed',color:'rgba(99,102,241,0.15)'}}
    links.push({source:e.from,target:e.to,lineStyle:ls});
  }
  _graphChart.setOption({tooltip:{},animation:true,
    series:[{type:'graph',layout:'none',roam:true,draggable:true,
      edgeSymbol:['none','none'],nodes:nodes,links:links,
      emphasis:{focus:'adjacency',lineStyle:{width:3}}}]});
  _graphChart.on('click',function(p){
    if(p.dataType==='node'&&p.name){tKC_go(p.name)}
  });
  window.addEventListener('resize',function(){if(_graphChart)_graphChart.resize()});
}
function graphRefresh(){
  if(!_graphChart||typeof GRAPH_DATA==='undefined')return;
  for(var i=0;i<GRAPH_DATA.nodes.length;i++){
    var gn=GRAPH_DATA.nodes[i];
    for(var j=0;j<KPS.length;j++){
      if(KPS[j].id===gn.id){
        var isReady=KPS[j].deep_dive&&KPS[j].deep_dive.status==='ready';
        var pi=0;for(var k=0;k<PHASES.length;k++){if(PHASES[k].id===KPS[j].p){pi=k;break}}
        _graphChart.setOption({series:[{data:_graphChart.getOption().series[0].data.map(function(d){
          if(d.name===gn.id){d.itemStyle={color:PHASES[pi].color,opacity:isReady?1:0.4}}
          return d})}]});
        break;
      }
    }
  }
}

function hMS(){

    h+='<div class="method-step'+(isDone?' done':'')+'" onclick="tMS('+i+')">';
    h+='<div class="method-step-num">'+s.num+'</div>';

    h+='</div></div>';

function hRS(){
  var h='';
  for(var i=0;i<RESOURCES.length;i++){var r=RESOURCES[i];
    h+='<div class="resource-item"><span class="ri-type '+r.t+'">'+r.t+'</span><h4>'+r.n+'</h4><p>'+r.d+'</p></div>';
  }
  document.getElementById('resourceGrid').innerHTML=h;
}

function hTR(){
  var h='';var d=LS_PREFIX+'_tracker';var dr=JSON.parse(safeGetLS(d,'[]'));
  for(var i=0;i<TRACKER_ITEMS.length;i++){var t=TRACKER_ITEMS[i];var done=dr.indexOf(t.id)>=0;
    h+='<div class="tracker-item'+(done?' done':'')+'" onclick="tTR(\''+t.id+'\',this)">'+
      '<div class="tracker-check"></div><span class="tracker-label">'+t.n+'</span></div>';
  }
  document.getElementById('trackerGrid').innerHTML=h;
  uPB();
}

function tTR(id,el){
  var d=LS_PREFIX+'_tracker';var dr=JSON.parse(safeGetLS(d,'[]'));
  var idx=dr.indexOf(id);
  if(idx>=0){dr.splice(idx,1);el.classList.remove('done');}
  else{dr.push(id);el.classList.add('done');}
  safeSetLS(d,JSON.stringify(dr));
  uPB();
}

function uPB(){
  var d=LS_PREFIX+'_tracker';var dr=JSON.parse(safeGetLS(d,'[]'));
  var pct=TRACKER_ITEMS.length>0?Math.round(dr.length/TRACKER_ITEMS.length*100):0;
  document.getElementById('progressBar').style.width=pct+'%';
}

function hFs(){
  var tabsEl=document.getElementById('formulaTabs');if(!tabsEl)return;
  var th='';
  for(var i=0;i<FORMULA_TABS.length;i++){
    th+='<span class="formula-tab'+(i===0?' active':'')+'" onclick="sFT(\'ft'+(i+1)+'\',this)">'+FORMULA_TABS[i].n+'</span>';
  }
  tabsEl.innerHTML=th;
  var panelsEl=document.getElementById('formulaPanels');if(!panelsEl)return;
  var ph='';
  for(var i=0;i<FORMULAS.length;i++){
    var f=FORMULAS[i];var fr='';
    for(var j=0;j<f.r.length;j++){fr+='<tr><td>'+f.r[j][0]+'</td><td class="ft-formula">'+f.r[j][1]+'</td></tr>';}
    ph+='<div class="formula-panel'+(i===0?' active':'')+'" id="fp-ft'+(i+1)+'">'+
      '<table class="formula-table"><thead><tr><th>名称</th><th>公式</th></tr></thead><tbody>'+fr+'</tbody></table></div>';
  }
  panelsEl.innerHTML=ph;
}

function renderGallery(filterType){
  var grid=document.getElementById('drawingGrid');
  if(!grid)return;
  var toolbar=document.getElementById('galleryToolbar');
  var allDrawings=[];
  for(var i=0;i<PHASES.length;i++){
    var dr=PHASES[i].drawings;
    if(!dr||dr.length===0)continue;
    if(typeof dr[0]==='string'){
      for(var j=0;j<dr.length;j++){allDrawings.push({name:dr[j],type:'',phase_id:PHASES[i].id,svg:'',related_kp:'',desc:''})}
    }else{
      for(var j=0;j<dr.length;j++){allDrawings.push(dr[j])}
    }
  }
  var types=['all'];
  for(var i=0;i<allDrawings.length;i++){if(allDrawings[i].type&&types.indexOf(allDrawings[i].type)<0)types.push(allDrawings[i].type)}
  if(toolbar){
    var th='';
    var typeLabels={all:'全部',spectrum:'🌈 光谱',matrix:'📊 矩阵',flow:'🔀 流程',relation:'🕸️ 关系',timeline:'📅 时间线'};
    for(var i=0;i<types.length;i++){
      var lbl=typeLabels[types[i]]||types[i];
      th+='<button class="gallery-filter'+(types[i]===filterType?' active':'')+'" onclick="renderGallery(\''+types[i]+'\')">'+lbl+'</button>';
    }
    toolbar.innerHTML=th;
  }
  var h='';
  for(var i=0;i<allDrawings.length;i++){
    var d=allDrawings[i];
    if(filterType&&filterType!=='all'&&d.type!==filterType)continue;
    var phase=null;for(var j=0;j<PHASES.length;j++){if(PHASES[j].id===d.phase_id){phase=PHASES[j];break}}
    h+='<div class="drawing-card" onclick="openLightbox('+i+')">';
    if(d.type){h+='<span class="drawing-type" style="background:rgba(94,168,122,.12);color:var(--accent-cyan)">'+d.type+'</span>'}
    if(d.svg){h+='<div class="drawing-preview">'+d.svg+'</div>'}
    h+='<div class="drawing-name">'+d.name+'</div>';
    if(phase){h+='<div class="drawing-phase" style="font-size:.65rem;color:var(--text-muted);margin-top:4px">'+phase.title+'</div>'}
    if(d.related_kp){
      var kp=null;for(var j=0;j<KPS.length;j++){if(KPS[j].id===d.related_kp){kp=KPS[j];break}}
      if(kp&&kp.deep_dive&&kp.deep_dive.status==='ready'){h+='<span class="drawing-detail-link" onclick="event.stopPropagation();ddOpen(\''+d.related_kp+'\')">📖 查看深度研读</span>'}
    }
    h+='</div>';
  }
  grid.innerHTML=h;
}
function openLightbox(idx){
  var allDrawings=[];
  for(var i=0;i<PHASES.length;i++){
    var dr=PHASES[i].drawings;if(!dr)continue;
    if(typeof dr[0]==='string'){for(var j=0;j<dr.length;j++){allDrawings.push({name:dr[j],svg:'',desc:''})}}
    else{for(var j=0;j<dr.length;j++){allDrawings.push(dr[j])}}
  }
  if(idx<0||idx>=allDrawings.length)return;
  var d=allDrawings[idx];
  var img=document.getElementById('lightboxImage');
  var info=document.getElementById('lightboxInfo');
  if(img){img.innerHTML=d.svg||'<p style="color:var(--text-muted);text-align:center;padding:40px">暂无预览图</p>'}
  if(info){info.textContent=d.name+(d.desc?' — '+d.desc:'')}
  var lb=document.getElementById('galleryLightbox');
  if(lb)lb.classList.add('open');
}
function closeLightbox(){
  var lb=document.getElementById('galleryLightbox');
  if(lb)lb.classList.remove('open');
}

function searchOpen(){document.getElementById('searchOverlay').classList.add('show');document.getElementById('searchInput').focus();}
function searchClose(){document.getElementById('searchOverlay').classList.remove('show');}
function searchKPs(){
  var q=document.getElementById('searchInput').value.toLowerCase();
  var res=KPS.filter(function(k){return k.n.toLowerCase().indexOf(q)>=0||(k.d||'').toLowerCase().indexOf(q)>=0;});
  var h='';
  for(var i=0;i<Math.min(res.length,10);i++){
    h+='<div class="search-result" onclick="searchClose();tKC_go(\''+res[i].id+'\')">'+
      '<div class="sr-title">'+res[i].n+'</div><div class="sr-detail">'+(res[i].d||'').substring(0,60)+'</div></div>';
  }
  document.getElementById('searchResults').innerHTML=h||'<div style="color:var(--text-muted);padding:10px">无结果</div>';
}

function loadTheme(){var t=safeGetLS(STORAGE_KEY+'_theme','dark');
  if(t==='light'){document.body.classList.add('light');document.body.classList.remove('dark');}
  else{document.body.classList.add('dark');document.body.classList.remove('light');}}
function toggleTheme(){var t=safeGetLS(STORAGE_KEY+'_theme','dark');t=t==='dark'?'light':'dark';
  safeSetLS(STORAGE_KEY+'_theme',t);loadTheme();}

function syncKPsFromManifest(){
  try{
    fetch('manifest.json').then(function(r){
      if(!r.ok)return;
      return r.json();
    }).then(function(manifest){
      if(!manifest||!manifest.materials||!manifest.plans)return;
      var currentPlan=null;
      for(var i=0;i<manifest.plans.length;i++){
        if(manifest.plans[i].html_file===STORAGE_KEY+'_learning.html'){
          currentPlan=manifest.plans[i];break;
        }
      }
      if(!currentPlan)return;
      for(var i=0;i<manifest.materials.length;i++){
        var mat=manifest.materials[i];
        if(mat.belongs_to_plan!==currentPlan.id)continue;
        if(!mat.html_file)continue;
        var kpIndex=-1;
        for(var j=0;j<KPS.length;j++){
          if(KPS[j].id===mat.belongs_to_kp){kpIndex=j;break;}
        }
        if(kpIndex<0)continue;
        var dd=KPS[kpIndex].deep_dive;
        if(!dd){KPS[kpIndex].deep_dive={status:'ready',html_file:mat.html_file};}
        else{dd.status='ready';dd.html_file=dd.html_file||mat.html_file;}
        var kcEl=document.getElementById('kc-'+mat.belongs_to_kp);
        if(!kcEl)continue;
        var ddBtn=kcEl.querySelector('.deep-dive-btn');
        if(ddBtn)ddBtn.textContent='✅ 查看深度研读';
        var ddHint=kcEl.querySelector('.dd-hint');
        if(ddHint)ddHint.textContent='点击 ↗ 打开资料';
        var ddOpenBtn=kcEl.querySelector('.deep-dive-open-btn');
        if(!ddOpenBtn){
          var ddBar=kcEl.querySelector('.deep-dive-bar');
          if(ddBar){
            var btn=document.createElement('button');
            btn.className='deep-dive-open-btn';
            btn.title='打开深度研读资料';
            btn.textContent='↗';
            btn.onclick=function(kpId){return function(e){e.stopPropagation();ddOpen(kpId);};}(mat.belongs_to_kp);
            ddBar.insertBefore(btn,ddBar.firstChild);
          }
        }
      }
    }).catch(function(){});
  }catch(e){}
  if(typeof graphRefresh==='function')graphRefresh();
}

function init(){
  loadTheme();
  var pl=document.getElementById('phaseList');
  for(var i=0;i<PHASES.length;i++){var ph=PHASES[i];
    var c=document.createElement('div');c.className='phase-card';c.id='phase-'+ph.id;
    c.innerHTML='<div class="phase-header" onclick="event.stopPropagation();this.parentElement.classList.toggle(\'open\')">'+
      '<div class="phase-icon" style="background:'+ph.color+'22;color:'+ph.color+'">'+ph.icon+'</div>'+
      '<div class="phase-info"><h3>'+ph.title+'</h3><div class="phase-week">'+ph.week+'</div></div>'+
      '<span class="phase-sub" style="background:'+ph.color+'22;color:'+ph.color+'">'+ph.sub+'</span>'+
      '<span class="phase-arrow">▶</span>'+
      '</div><div class="phase-body"><div class="phase-body-inner"></div></div>';
    pl.appendChild(c);
    AHDS(ph);
  }
  var fd=document.getElementById('knowledgeFilters');
  fd.innerHTML='<button class="knowledge-filter active" data-kp="all" onclick="kf(\'all\')">全部</button>';
  for(var i=0;i<PHASES.length;i++){fd.innerHTML+='<button class="knowledge-filter" data-kp="'+PHASES[i].id+'" onclick="kf(\''+PHASES[i].id+'\')">阶段'+(i+1)+'</button>';}
  kf('all');
  hES();
  hRS();
  hTR();
  renderGallery('all');
  hMS();
  if(document.getElementById('graphContainer')){initGraph();}
  document.body.classList.remove('loading');document.body.classList.add('loaded');
  syncKPsFromManifest();
  setTimeout(renderAllFormulas,100);
}

init();

document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();searchOpen();}});

(function(){var hash=location.hash;if(hash&&hash.indexOf('#kc-')===0){
  var kid=hash.replace('#kc-','');setTimeout(function(){tKC_go(kid);},300);}})();

(function() {
  var CH_KEY = '_ml_llm_nav';

  function processNav() {
    var raw = localStorage.getItem(CH_KEY);
    if (!raw) return;
    try {
      var data = JSON.parse(raw);
      if (Date.now() - data.ts > 10000) {
        localStorage.removeItem(CH_KEY);
        return;
      }
      if (data.kpId) {
        localStorage.removeItem(CH_KEY);
        if (typeof kf === 'function') kf('all');
        setTimeout(function() {
          if (typeof tKC_go === 'function') tKC_go(data.kpId);
        }, 200);
      }
    } catch(e) {
      localStorage.removeItem(CH_KEY);
    }
  }

  window.addEventListener('storage', function(e) {
    if (e.key === CH_KEY) processNav();
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(processNav, 300);
    });
  } else {
    setTimeout(processNav, 300);
  }
})();
</script>
